      - name: Ensure scripts exist (v3 extractor)
        shell: bash
        run: |
          if [ ! -f scripts/Carol-Extract-Shopping-v3.ps1 ]; then
            echo "::error::Missing scripts/Carol-Extract-Shopping-v3.ps1. Please upload the 'carol-v3-scripts-pack' I provided."
            exit 1
          fi
      - name: Extract shopping (v3)
        shell: pwsh
        run: pwsh -File scripts/Carol-Extract-Shopping-v3.ps1 -PlansDir "pages/apps/carol/plans" -OutFile "pages/apps/carol/plans/shopping-extracted.json"
      - name: Aggregate packages (2 persons, US)
        shell: pwsh
        run: pwsh -File scripts/Carol-Aggregate-Packages-v2.ps1 -PlansDir "pages/apps/carol/plans" -PackageMap "pages/apps/carol/packages/us.json" -OutFile "pages/apps/carol/plans/shopping-quantized.json" -Persons 2
      - name: Build pointer
        shell: pwsh
        run: pwsh -File scripts/Carol-Build-Pointer.ps1 -PlansDir "pages/apps/carol/plans" -OutFile "pages/apps/carol/index.json"
      - name: Commit seeded plan and outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/carol/plans/plan-14d-seeded.json                   pages/apps/carol/plans/shopping-extracted.json                   pages/apps/carol/plans/shopping-quantized.json                   pages/apps/carol/index.json || true
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "feat(carol): seed 14d plan + refresh (2p)" && git push; fi
