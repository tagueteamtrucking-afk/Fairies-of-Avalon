name: Jem — Reindex Programs
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild programs index
        shell: bash
        run: |
          set -e
          mkdir -p pages/apps/jem/programs
          echo '{ "updated": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'", "files": [' > pages/apps/jem/programs/index.json
          first=1
          for f in $(ls pages/apps/jem/programs/*.json 2>/dev/null | sed 's#^pages/apps/jem/##'); do
            if [ $first -eq 1 ]; then first=0; echo '"'$f'"' >> pages/apps/jem/programs/index.json; else echo ', "'$f'"' >> pages/apps/jem/programs/index.json; fi
          done
          echo '] }' >> pages/apps/jem/programs/index.json
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/jem/programs/index.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(jem): reindex programs" && git push; fi
