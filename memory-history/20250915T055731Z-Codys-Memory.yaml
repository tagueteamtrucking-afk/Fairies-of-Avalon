overseers_capabilities:
  inherits_all_functions: true
  hub_app:
    path: "pages/apps/overseers/hub"      # aggregator UI that can launch/impersonate any assistant microapp
    features: ["launch", "impersonate", "status", "manifests", "permissions"]
  tools_router:
    llm_bridge:
      providers: ["openai"]               # extendable; provider chosen by env (LLM_PROVIDER/LLM_MODEL)
      env_keys: ["OPENAI_API_KEY"]
      default_mode: "live_if_secret_else_dry"
  connectors:                             # declared; gated by secrets/approvals (no plaintext secrets here)
    gmail:       { status: "declared", mode: "disabled", unlock: "vault://palace/tokens#gmail + overseers approval" }
    google_cal:  { status: "declared", mode: "disabled", unlock: "vault://palace/tokens#gcal + overseers approval" }
    google_contacts: { status: "declared", mode: "disabled", unlock: "vault://palace/tokens#gcontacts + overseers approval" }
    quickbooks:  { status: "declared", mode: "disabled", unlock: "vault://palace/tokens#qbo + overseers approval" }
    youtube:     { status: "declared", mode: "disabled", unlock: "vault://palace/tokens#youtube + overseers approval" }
    ai_art_tools:{ status: "declared", mode: "disabled", unlock: "vault://palace/tokens#aiart + overseers approval" }
    health_apps: { status: "declared", mode: "disabled", unlock: "vault://palace/tokens#health + overseers approval" }

runtime:
  paths:
    queue_requests: "requests"
    queue_processed: "processed"
    progress_file: "pages/apps/overseers/progress.json"
    permissions_state: "pages/apps/overseers/permissions/state.json"
    scaffolds_dir: "pages/apps/overseers/scaffolds"
  workflows:
    queue_full_roster: ".github/workflows/queue-full-roster.yml"
    queue_scaffold_live: ".github/workflows/queue-scaffold-live.yml"
    queue_phase_1_seed: ".github/workflows/queue-phase-1.yml"         # seeds A1–A3 requests (see plans)
    runner_process_queue: ".github/workflows/run-overseers-queue.yml"
    overseers_ai_core: ".github/workflows/overseers-ai-core.yml"
    deploy_pages: ".github/workflows/deploy-pages.yml"
    llm_bridge: ".github/workflows/llm-bridge.yml"
    overseers_asset_audit: ".github/workflows/overseers-asset-audit.yml"
    overseers_memory_snapshot: ".github/workflows/overseers-memory-snapshot.yml"
    overseers_importmap_check: ".github/workflows/overseers-importmap-check.yml"
    overseers_permissions: ".github/workflows/overseers-permissions.yml" # NEW: processes permissions/grants/*
    overseers_manifests: ".github/workflows/overseers-manifests.yml"     # NEW: builds models.json, wings manifest, and WPI
  quick_paths:
    actions_order: ["Queue — Full Roster", "Runner — Process Overseers Queue", "Overseers — AI Core", "Deploy — GitHub Pages"]
  tools:
    - "Overseers Hub"
    - "Overseers Queue Runner"
    - "LLM Bridge"
    - "Permissions Processor"
    - "Local Web (Pages)"
    - "Wings Lab"
    - "Client-side Wings Importer"
    - "Asset Counter"
    - "Import-Map Validator"
    - "Memory Snapshotter"
  chain_reaction:
    description: >
      Overseers (omnicapable) drive builds and can impersonate any Fairy function.
      Overseers → build Clarice → (Overseers + Clarice) build Charlotte → (team) builds Nina → remaining Fairies.
    status: "omnicapable"
    safety: "No secrets until Overseers approve; vault refs only."

telemetry:
  last_scaffold_mode: "LIVE"
  last_scaffold_runs: 8
  wallpaper_power_index:
    current: 0
    expected_behavior: "WPI > 0 when wallpapers present; badge visible in console"
    produced_by: "overseers_manifests + overseers_asset_audit"
    notes: "Emit to progress.json and show in Overseers Hub."

