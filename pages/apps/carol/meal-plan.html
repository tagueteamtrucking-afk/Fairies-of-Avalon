<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carol – Two‑Week Meal Planner</title>
  <!-- Use the common stylesheet so Carol's pages share the same theme as the rest of Avalon -->
  <link rel="stylesheet" href="../common/style.css" />
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 0.5rem;
      border: 1px solid #ccc;
      text-align: left;
    }
    th {
      background: rgba(255,255,255,0.1);
    }
    select, input[type="text"] {
      width: 100%;
    }
    details summary {
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<!--
  This page displays the full two‑week meal plan with detailed events pulled from
  `data/twoperson-2wk-unique-20251015T022300Z.json`. Each event appears in its own
  row with the day, meal name, type and dietary details. Users can record a
  rating (1–5) and optional notes describing substitutions, additions or other
  adjustments. Ratings and notes are stored in localStorage keyed by the day and
  event index, so feedback persists without modifying the underlying JSON.
-->
<body class="carol-inside">
  <div class="wrap">
    <h1 class="heading">Carol – Two‑Week Meal Plan</h1>
    <p class="lead">Review each meal below, view the ingredients and cooking
    instructions, then record your feedback. Your ratings and notes will help
    Carol adapt future plans to your tastes and dietary restrictions.</p>
    <div id="plan-container"></div>
    <p><a href="index.html">← back to Carol</a></p>
  </div>
  <script type="module">
    async function loadPlan() {
      try {
        const resp = await fetch('data/twoperson-2wk-unique-20251015T022300Z.json');
        const data = await resp.json();
        const container = document.getElementById('plan-container');
        let html = '<table><thead><tr><th>Day</th><th>Meal</th><th>Type</th><th>For</th><th>Nutrition (kcal)</th><th>Ingredients</th><th>Instructions</th><th>Your Rating</th><th>Your Notes</th></tr></thead><tbody>';
        data.days.forEach(day => {
          day.events.forEach((event, idx) => {
            const ratingKey = `meal-rating-${day.index}-${idx}`;
            const notesKey = `meal-notes-${day.index}-${idx}`;
            const savedRating = localStorage.getItem(ratingKey) || '';
            const savedNotes = localStorage.getItem(notesKey) || '';
            // Build ingredient list
            const ingList = event.items.map(it => `${it.quantity} ${it.unit} ${it.ingredient}`).join(', ');
            // Build instructions list as a <details> for readability
            const instr = `<details><summary>Show</summary><ul>` + event.instructions.map(step => `<li>${step}</li>`).join('') + '</ul></details>';
            html += `<tr>
              <td>Day ${day.index} (${day.day_label})</td>
              <td>${event.name}</td>
              <td>${event.type}</td>
              <td>${event.for}</td>
              <td>${event.kcal}</td>
              <td>${ingList}</td>
              <td>${instr}</td>
              <td><select data-key="${ratingKey}">
                <option value="">—</option>
                <option value="1" ${savedRating === '1' ? 'selected' : ''}>1</option>
                <option value="2" ${savedRating === '2' ? 'selected' : ''}>2</option>
                <option value="3" ${savedRating === '3' ? 'selected' : ''}>3</option>
                <option value="4" ${savedRating === '4' ? 'selected' : ''}>4</option>
                <option value="5" ${savedRating === '5' ? 'selected' : ''}>5</option>
              </select></td>
              <td><input type="text" data-key="${notesKey}" value="${savedNotes}" placeholder="Substitutions/notes"></td>
            </tr>`;
          });
        });
        html += '</tbody></table>';
        container.innerHTML = html;
        // Attach listeners to save ratings and notes
        container.querySelectorAll('select[data-key]').forEach(sel => {
          sel.addEventListener('change', (e) => {
            localStorage.setItem(e.target.dataset.key, e.target.value);
          });
        });
        container.querySelectorAll('input[data-key]').forEach(input => {
          input.addEventListener('input', (e) => {
            localStorage.setItem(e.target.dataset.key, e.target.value);
          });
        });
      } catch (err) {
        document.getElementById('plan-container').textContent = 'Failed to load meal plan.';
        console.error(err);
      }
    }
    loadPlan();
  </script>
</body>
</html>
