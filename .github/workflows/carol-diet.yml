name: Carol — Diet (LLM)
on: { workflow_dispatch: {} }
jobs:
  carol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Carol plan (EU-first, truck-friendly)
        env: { OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}, OPENAI_MODEL: ${{ vars.OPENAI_MODEL }} }
        shell: pwsh
        run: pwsh -File scripts/Carol-Diet-LLM.ps1 -Pattern DASH -Kcal 2200 -Region EU -Context truck_driver
      - name: Validate Carol plan
        shell: pwsh
        run: pwsh -File scripts/Carol-Validate.ps1
      - name: Commit plans
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/carol/plans/
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "feat(carol): EU-first truck plan" && git push; fi
