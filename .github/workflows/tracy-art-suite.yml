name: Tracy — Art Suite
on:
  workflow_dispatch:
    inputs:
      world: { description: "World (auto-pick latest if empty)", required: false, type: string }
      boards: { description: "Number of art briefs", required: false, default: 8, type: number }
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Build Artboards
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & "scripts/overseers/tracy-artboard.ps1" -RepoRoot "$PWD" -World "${{ inputs.world }}" -Boards ${{ inputs.boards }}
      - name: Commit artifacts
        shell: bash
        run: |
          set -e
          git config user.name "actions-bot"
          git config user.email "actions@github.com"
          git add -A pages/apps/alexandria/worlds/artboards
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Tracy Artboards"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
