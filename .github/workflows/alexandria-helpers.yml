name: Alexandria — Helpers Suite

on:
  workflow_dispatch:
    inputs:
      world:          { description: "World (auto-pick latest if empty)", required: false, type: string }
      per_town:       { description: "Notable figures per settlement",    required: false, default: 3, type: number }
      force_fallback: { description: "Force offline (no LLM Bridge)",     required: false, default: true, type: boolean }

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Run Helpers (explicit params; no backticks/splat)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [int]$perTown = if("${{ inputs.per_town }}"){ "${{ inputs.per_town }}" } else { 3 }
          $fallback = [System.Convert]::ToBoolean("${{ inputs.force_fallback }}")
          & "scripts/overseers/alexandria-suite.ps1" -RepoRoot "$PWD" -World "${{ inputs.world }}" -PerTown $perTown -ForceFallback:$fallback

      - name: Commit artifacts
        shell: bash
        run: |
          set -e
          git config user.name  "actions-bot"
          git config user.email "actions@github.com"
          git add -A pages/apps/alexandria/worlds || true
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Alexandria Helpers artifacts"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
