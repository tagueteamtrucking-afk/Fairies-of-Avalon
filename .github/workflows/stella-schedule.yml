name: Stella — Daily Sound Schedule
on:
  workflow_dispatch:
    inputs:
      persona_a:
        description: "First persona name"
        required: false
        default: "Ray"
        type: string
      persona_b:
        description: "Second persona name"
        required: false
        default: "Blanca"
        type: string
      timezone:
        description: "IANA timezone"
        required: false
        default: "America/Chicago"
        type: string
jobs:
  stella:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate schedule
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        shell: pwsh
        run: pwsh -File scripts/Stella-Schedule-LLM.ps1 -PersonaA "${{ inputs.persona_a }}" -PersonaB "${{ inputs.persona_b }}" -Timezone "${{ inputs.timezone }}"
      - name: Validate schedule
        shell: pwsh
        run: pwsh -File scripts/Stella-Validate.ps1
      - name: Commit schedule
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/stella/schedule.json
          if git diff --cached --quiet; then echo "No changes";
          else git commit -m "feat(stella): daily schedule" && git push; fi
