<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charlotte's Expirations Registry</title>
  <link rel="stylesheet" href="../common/style.css">
  <style>
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #444; padding: 0.5rem; }
    th { background-color: rgba(255,255,255,0.1); }
  </style>
</head>
<!-- This page displays a list of perishable items with their expiry dates. It loads data
     from `data/expirations.json`. Charlotte's role is to monitor and prompt for action
     when items are nearing their expiry. -->
<body>
  <header>
    <h1>Expirations Registry</h1>
  </header>
  <main>
    <table id="expirations-table">
      <thead>
        <tr><th>Item</th><th>Category</th><th>Expiry Date</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
  <script>
    async function loadExpirations() {
      try {
        const res = await fetch('data/expirations.json');
        const items = await res.json();
        const tbody = document.querySelector('#expirations-table tbody');
        items.forEach(item => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${item.name}</td><td>${item.category}</td><td>${item.expiry}</td>`;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error('Error loading expirations', err);
      }
    }
    loadExpirations();
  </script>
</body>
</html>
