<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billie's Social Posts</title>
  <link rel="stylesheet" href="../common/style.css">
  <style>
    .post {
      border: 1px solid #444;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 0.25rem;
      background-color: rgba(255, 255, 255, 0.05);
    }
    .post h2 {
      margin-top: 0;
    }
  </style>
</head>
<!-- This page represents the social feed for Billie. It loads posts from
     `data/social-posts.json` and displays them chronologically. Each post includes
     a title, timestamp and body. Billie can later author new posts by updating
     the JSON file or hooking up to a backend service. -->
<body>
  <header>
    <h1>Billie's Social Feed</h1>
  </header>
  <main id="posts-container"></main>
  <script>
    async function loadPosts() {
      try {
        const res = await fetch('data/social-posts.json');
        const posts = await res.json();
        const container = document.getElementById('posts-container');
        posts.forEach(post => {
          const div = document.createElement('div');
          div.className = 'post';
          div.innerHTML = `<h2>${post.title}</h2><small>${post.date}</small><p>${post.body}</p>`;
          container.appendChild(div);
        });
      } catch (err) {
        console.error('Error loading posts', err);
      }
    }
    loadPosts();
  </script>
</body>
</html>
