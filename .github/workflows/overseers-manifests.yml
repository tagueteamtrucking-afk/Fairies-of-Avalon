name: Overseers — Manifests (models + wings + WPI)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Write helper script (repo-sweep.mjs)
        run: |
          $b64 = @'

'@
          New-Item -ItemType Directory -Force -Path scripts/overseers | Out-Null
          [IO.File]::WriteAllBytes('scripts/overseers/repo-sweep.mjs',[Convert]::FromBase64String($b64))
      - name: Build manifests (via sweep)
        run: |
          node scripts/overseers/repo-sweep.mjs
      - name: Commit updates
        run: |
          git config user.name "Overseers Bot"
          git config user.email "actions@users.noreply.github.com"
          git add asset/models/models.json asset/wings/manifest.json pages/apps/overseers/progress.json || true
          git commit -m "Manifests: models + wings + WPI" || echo "Nothing to commit"
          git push || echo "Nothing to push"
