name: Repo — Workflows Sweeper (keep-list)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sweep workflows
        shell: pwsh
        run: pwsh -File scripts/Workflows-Sweeper.ps1 -KeepList "config/keep-lists/workflows-keep.json"
      - name: Commit deletions
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows || true
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(workflows): sweep unused workflows" && git push; fi
