    }

    const shoppingListDiv = document.getElementById('shoppingList');
    // Populate day options for all 14 days
    MEAL_PLAN.forEach((_, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = 'Day ' + (i + 1);
      daySelect.appendChild(opt);
    });
    /**
     * Render the selected day's meals.  Shows all seven mini‑meals (breakfast, morning snack, lunch, afternoon snack, dinner, evening snack and dessert).
     */
    function renderDay() {
      const idx = parseInt(daySelect.value, 10);
      const day = MEAL_PLAN[idx];
      const order = ['breakfast','morningSnack','lunch','afternoonSnack','dinner','eveningSnack','dessert'];
      const labels = {
        breakfast: 'Breakfast',
        morningSnack: 'Morning snack',
        lunch: 'Lunch',
        afternoonSnack: 'Afternoon snack',
        dinner: 'Dinner',
        eveningSnack: 'Evening snack',
        dessert: 'Dessert'
      };
      const html = [];
      order.forEach(key => {
        const meal = day[key];
        html.push(`<h3>${labels[key]}: ${meal.name}</h3>`);
        html.push('<ul>');
        meal.ingredients.forEach(item => {
          html.push(`<li>${item.name}: ${item.qty}</li>`);
        });
        html.push('</ul>');
      });
      mealsDiv.innerHTML = html.join('');
      shoppingListDiv.innerHTML = '';
    }
    daySelect.addEventListener('change', renderDay);
    peopleInput.addEventListener('change', () => {
      if (shoppingListDiv.innerHTML) {
        generateShoppingList();
      }
    });
    shoppingBtn.addEventListener('click', generateShoppingList);
    /**
     * Generate a shopping list for the entire two‑week plan, multiplied by the selected number of people.
     */
    function generateShoppingList() {
      const people = Math.max(1, parseInt(peopleInput.value, 10) || 1);
      const totals = {};
      MEAL_PLAN.forEach(day => {
        Object.values(day).forEach(meal => {
          meal.ingredients.forEach(item => {
            const key = item.name;
            const qty = item.qty * people;
            totals[key] = (totals[key] || 0) + qty;
          });
        });
      });
      const list = Object.keys(totals).sort().map(name => `<li>${name}: ${totals[name]}</li>`).join('');
      shoppingListDiv.innerHTML = '<h3>Shopping List</h3><ul>' + list + '</ul>';
    }
    // Initialise
    daySelect.value = '0';
    renderDay();
