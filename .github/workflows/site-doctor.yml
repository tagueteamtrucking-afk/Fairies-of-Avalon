
on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Custom domain to test (example.com). Leave blank to use CNAME or repo default.'
        required: false
        default: 'www.fairiesofavalon.com'
        type: string
      apply_fixes:
        description: 'Apply safe fixes (.nojekyll, CNAME, kill-sw.html) and commit'
        required: false
        default: true
        type: boolean
permissions:
  contents: write
  pages: write
jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Site Doctor (robust)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
