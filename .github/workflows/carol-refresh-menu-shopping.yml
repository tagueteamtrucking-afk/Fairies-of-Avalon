
name: Carol — Refresh Menu + Shopping

on:
  workflow_dispatch:
    inputs:
      plan_path:
        description: 'Path to the 14-day plan JSON to use'
        required: true
        default: pages/apps/carol/plans/twoperson-2wk-unique-20251015T022300Z.json

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure merged plan exists (copy from chosen plan)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = "${{ github.event.inputs.plan_path }}"
          $dst = "pages/apps/carol/plans/twoperson-2wk-merged.json"
          if (!(Test-Path $src)) { throw "Plan source not found: $src" }
          New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
          Copy-Item -Force $src $dst
          Write-Host "Merged plan ready: $dst"

      - name: Extract shopping (v3 script)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/Carol-Extract-Shopping-v3.ps1
          if (!(Test-Path "pages/apps/carol/plans/shopping-quantized.json")) {
            Write-Error "Expected shopping-quantized.json was not created."
          }

      - name: Commit changes (if any)
        shell: bash
        run: |
          set -e
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Carol: refresh menu pointers and shopping list"
          else
            echo "No changes to commit"
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Carol: refresh 14‑day menu & shopping list"
          branch: "carol/refresh-${{ github.run_id }}"
          commit-message: "Carol: refresh 14‑day menu & shopping list"
          delete-branch: true
