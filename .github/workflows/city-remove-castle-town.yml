name: City — Remove Castle Town
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove files if present
        shell: bash
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          removed=0
          for f in pages/apps/_city/castle-town.html pages/apps/_city/castle-town.css; do
            if [ -f "$f" ]; then git rm -f "$f"; removed=1; fi
          done
          if [ "$removed" = "1" ]; then git commit -m "Remove Castle Town UI" && git push; else echo "Nothing to remove"; fi
