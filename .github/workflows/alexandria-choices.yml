name: "Alexandria — Update Choices Library"

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Relative path to choices.json (leave default)"
        required: false
        default: "pages/apps/alexandria/knowledge/choices.json"

permissions:
  contents: write

jobs:
  choices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Prepare Choices (validate + derive taxonomies)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & "scripts/overseers/alexandria-choices-prepare.ps1" `
            -RepoRoot "${{ github.workspace }}" `
            -ChoicesPath "${{ github.event.inputs.path }}"

      - name: Commit (if changed)
        shell: pwsh
        run: |
          git add -A "pages/apps/alexandria/knowledge"
          $changes = git status --porcelain -- "pages/apps/alexandria/knowledge"
          if ([string]::IsNullOrWhiteSpace($changes)) {
            Write-Host "Nothing to commit."
          } else {
            git config user.email "actions@github.com"
            git config user.name  "GitHub Actions"
            git fetch origin ${{ github.ref_name }} --prune
            git pull --rebase origin ${{ github.ref_name }} || echo "Nothing to rebase"
            git commit -m "Alexandria: update choices library and derived taxonomies"
          }

      - name: Push
        uses: ad-m/github-push-action@77c5b412c50b723d2a4fbc6d71fb5723bcd439aa
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          force_with_lease: true
