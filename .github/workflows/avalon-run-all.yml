name: Avalon Run All

on:
  workflow_dispatch:
    inputs:
      title:          { description: "World Title", required: false, type: string }
      prompt:         { description: "Starter hook / prompt", required: false, type: string }
      events:         { description: "Timeline events", required: false, default: 7,  type: number }
      npcs:           { description: "NPC count",     required: false, default: 12, type: number }
      regions:        { description: "Region count",  required: false, default: 5,  type: number }
      per_town:       { description: "Figures per settlement", required: false, default: 3, type: number }
      boards:         { description: "Art briefs", required: false, default: 8, type: number }
      combos:         { description: "VRM×Wing combos", required: false, default: 12, type: number }
      target_langs:   { description: "Translations (comma)", required: false, default: "es", type: string }
      meal_days:      { description: "Carol: days", required: false, default: 7, type: number }
      kcal:           { description: "Carol: kcal target", required: false, default: 2200, type: number }
      diet_style:     { description: "Carol: style", required: false, default: "balanced", type: choice, options: ["balanced","mediterranean","keto","vegetarian"] }
      weeks:          { description: "Jem: weeks", required: false, default: 8, type: number }
      days_per_week:  { description: "Jem: days/week", required: false, default: 4, type: number }
      goal:           { description: "Jem: goal", required: false, default: "recomp", type: choice, options: ["recomp","hypertrophy","strength","fatloss"] }
      equipment:      { description: "Jem: equipment", required: false, default: "minimal", type: choice, options: ["minimal","gym"] }

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Alexandria — Build World
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo = (Get-Location).Path
          $events  = "${{ inputs.events }}";  if([string]::IsNullOrWhiteSpace($events))  { $events='7' }
          $npcs    = "${{ inputs.npcs }}";    if([string]::IsNullOrWhiteSpace($npcs))    { $npcs='12' }
          $regions = "${{ inputs.regions }}"; if([string]::IsNullOrWhiteSpace($regions)) { $regions='5' }
          pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File ./scripts/overseers/alexandria-build-all.ps1 -RepoRoot $repo -Title "${{ inputs.title }}" -Prompt "${{ inputs.prompt }}" -Events $events -NPCs $npcs -Regions $regions

      - name: Capture WORLD_ID
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root = Join-Path (Get-Location).Path 'pages/apps/alexandria/worlds'
          $latestTxt = Join-Path $root 'latest.txt'
          if(!(Test-Path $latestTxt)){ throw "No world latest.txt found. Build step failed?" }
          $wid = Get-Content -LiteralPath $latestTxt -TotalCount 1
          "WORLD_ID=$wid" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "WORLD_ID: $wid"

      - name: Alexandria — Helpers
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo = (Get-Location).Path
          $perTown = "${{ inputs.per_town }}"; if([string]::IsNullOrWhiteSpace($perTown)) { $perTown='3' }
          pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File ./scripts/overseers/alexandria-suite.ps1 -RepoRoot $repo -World "${{ env.WORLD_ID }}" -PerTown $perTown

      - name: Tracy — Artboards
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo = (Get-Location).Path
          $boards = "${{ inputs.boards }}"; if([string]::IsNullOrWhiteSpace($boards)) { $boards='8' }
          pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File ./scripts/overseers/tracy-artboard.ps1 -RepoRoot $repo -World "${{ env.WORLD_ID }}" -Boards $boards

      - name: Nina — 3D Index
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo = (Get-Location).Path
          $combos = "${{ inputs.combos }}"; if([string]::IsNullOrWhiteSpace($combos)) { $combos='12' }
          pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File ./scripts/overseers/nina-3d-index.ps1 -RepoRoot $repo -MaxCombos $combos -World "${{ env.WORLD_ID }}"

      - name: Charlotte — Pipelines (SSML + i18n plan)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo = (Get-Location).Path
          pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File ./scripts/overseers/charlotte-pipeline-plan.ps1 -RepoRoot $repo -World "${{ env.WORLD_ID }}" -TargetLangs "${{ inputs.target_langs }}"

      - name: Carol — Meal Plan
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo = (Get-Location).Path
          $days="${{ inputs.meal_days }}"; if([string]::IsNullOrWhiteSpace($days)){ $days='7' }
          $kcal="${{ inputs.kcal }}"; if([string]::IsNullOrWhiteSpace($kcal)){ $kcal='2200' }
          pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File ./scripts/overseers/carol-meal-plan.ps1 -RepoRoot $repo -Days $days -KcalTarget $kcal -DietStyle "${{ inputs.diet_style }}"

      - name: Jem — Program Plan
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo = (Get-Location).Path
          $weeks="${{ inputs.weeks }}"; if([string]::IsNullOrWhiteSpace($weeks)){ $weeks='8' }
          $dpw="${{ inputs.days_per_week }}"; if([string]::IsNullOrWhiteSpace($dpw)){ $dpw='4' }
          pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File ./scripts/overseers/jem-program-plan.ps1 -RepoRoot $repo -Weeks $weeks -DaysPerWeek $dpw -Goal "${{ inputs.goal }}" -Equipment "${{ inputs.equipment }}"

      - name: Commit generated content
        shell: bash
        run: |
          set -e
          git config user.name  "actions-bot"
          git config user.email "actions@github.com"
          git add -A pages/apps || true
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Avalon Run All: world + helpers + art + 3D + pipelines + meal + program (pages/apps)"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
            git push origin HEAD:"${GITHUB_REF_NAME:-main}"
          fi
