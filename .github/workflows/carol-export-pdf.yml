name: Carol — Export Plan to PDF
on:
  workflow_dispatch:
    inputs:
      plan_file: { description: "Optional: path to a specific JSON plan", required: false, default: "" }
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install wkhtmltopdf (best-effort)
        run: sudo apt-get update && sudo apt-get install -y wkhtmltopdf || true
      - name: Export
        shell: pwsh
        run: pwsh -File scripts/Carol-Export-PDF.ps1 -PlanFile "${{ inputs.plan_file }}"
      - name: Commit exports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/carol/exports/
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(carol): export to PDF" && git push; fi
