name: Failure Feed (on workflow_run)
on:
  workflow_run:
    workflows: ['*']
    types: [completed]
jobs:
  feed:
    if: ${{ github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner, repo = context.repo.repo;
            const title = 'Build Failures Feed';
            const line = `- ${run.name} → *${run.status}/${run.conclusion}* (${run.html_url}) at ${run.updated_at}`;
            const { data: issues } = await github.rest.issues.listForRepo({owner, repo, state: 'open', labels: 'overseer'});
            const existing = issues.find(i => i.title === title);
            if (existing) {
              const body = (existing.body || '') + '\n' + line;
              await github.rest.issues.update({owner, repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({owner, repo, title, body: line, labels: ['overseer']});
            }
