<title>Clarice — Diagnostics</title><style>body{background:#0b1220;color:#e6e9ff;font-family:system-ui,Segoe UI,Roboto;margin:0;padding:16px} a{color:#a5d6ff}</style></head>
<body><h1>Diagnostics</h1>
<p><button onclick="dl()">Download</button></p>
<script>
function dl(){
  const info={ua:navigator.userAgent, lang:navigator.language, time:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(info,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='diagnostics.json'; a.click();
}
</script>

</body></html>
