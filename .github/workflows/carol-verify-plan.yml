name: Carol - Verify Plan Pointer
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify index.json has a valid plan path
        shell: bash
        run: |
          set -euo pipefail
          test -f pages/apps/carol/index.json
          PLAN=$(jq -r '.plan // ""' pages/apps/carol/index.json)
          if [ -z "$PLAN" ]; then
            echo "index.json missing .plan"; exit 1
          fi
          if [ ! -f "$PLAN" ]; then
            echo "Plan not found at: $PLAN"; exit 1
          fi
          echo "OK: $PLAN exists"
