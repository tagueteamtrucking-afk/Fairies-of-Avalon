<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carol — 14‑Day Timeline (2 people)</title>
  <style>
    :root{--bg:#0b0c10;--card:#141b22;--ink:#e8e8e8;--muted:#9db0c3;--accent:#8bd3dd}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
    header{padding:1rem 1.25rem;border-bottom:1px solid #223241}
    h1{margin:.2rem 0 .4rem;font-size:1.15rem}
    .meta{color:var(--muted);font-size:.95rem}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;padding:12px}
    .card{background:var(--card);border:1px solid #223241;border-radius:12px;padding:12px}
    .row{display:flex;gap:.5rem;align-items:flex-start;padding:.35rem .4rem;border-radius:8px}
    .row + .row{border-top:1px dashed #244}
    .tag{font-size:.7rem;color:var(--bg);background:var(--accent);border-radius:6px;padding:.1rem .35rem;margin-right:.4rem}
    .time{font-variant:all-small-caps;color:var(--muted);min-width:84px}
    .name{font-weight:600}
    .nut{color:var(--muted);font-size:.85rem}
    .list{margin:.25rem 0 .5rem .25rem;padding-left:1rem;color:var(--muted)}
  </style>
  <script type="module">
    const ptr = await fetch('./index.json',{cache:'no-store'}).then(r=>r.json());
    const planPath = ptr.plan;
    const plan = await fetch(planPath,{cache:'no-store'}).then(r=>r.json());
    const people = (plan.persons && plan.persons.length) || 2;
    document.querySelector('.meta').textContent = `${plan.weeks*7||plan.days?.length||''} days · ${people} people · pattern ${plan.pattern||''}`.trim();

    const grid = document.querySelector('.grid');
    for (const d of plan.days||[]){
      const card = document.createElement('div');
      card.className='card';
      card.innerHTML = `<h3>${d.day_label||('Day '+(d.index||''))}</h3>`;
      const evts = (d.events||[]);
      for(const e of evts){
        const row = document.createElement('div');
        row.className='row';
        const servings = (e.for && /both/i.test(e.for)) ? people : 1; // A/B would be 1
        row.innerHTML = `
          <span class="tag">${e.type||'meal'}</span>
          <span class="time">${e.time_hint||''}</span>
          <div style="flex:1">
            <div class="name">${e.name}</div>
            <div class="nut">~${e.kcal||'?'} kcal · Na ${e.sodium_mg||'?'} mg · sugar ${e.added_sugars_g||'?'} g · fiber ${e.fiber_g||'?'} g</div>
            <ul class="list">${
              (e.items||[]).map(it=>`<li>${(servings>1?servings+'× ':'')}${it.quantity} ${it.unit} ${it.ingredient}${it.notes?` <em>(${it.notes})</em>`:''}</li>`).join('')
            }</ul>
          </div>`;
        card.appendChild(row);
      }
      grid.appendChild(card);
    }
  </script>
</head>
<body>
  <header>
    <h1>Carol — 14‑Day Timeline (2 people)</h1>
    <div class="meta">Loading…</div>
  </header>
  <main class="grid"></main>
</body>
</html>
