name: Nina — LLM
on: { workflow_dispatch: {} }
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Nina
        env: { OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}, OPENAI_MODEL: ${{ vars.OPENAI_MODEL }} }
        shell: pwsh
        run: pwsh -File scripts/Agents-LLM.ps1 -Agent "Nina" -Count 3 -Task "curate VRM/3D scene notes and index entries"
      - name: Commit output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/nina/
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "feat(nina): updates" && git push; fi
