<!-- pages/apps/carol/print-shopping.html -->
<!doctype html><html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Carol • Print Shopping List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="./print.css"/>
  <style>
    .group{ break-inside: avoid; page-break-inside: avoid; }
  </style>
  <script>
  async function loadPointer(){
    const cand=['/pages/apps/carol/index.json','./index.json','../carol/index.json'];
    for(const u of cand){ try{ const r=await fetch(u,{cache:'no-store'}); if(r.ok) return r.json(); }catch{} }
    throw new Error('Pointer index.json not found.');
  }
  async function loadPlan(p){ const r=await fetch(p,{cache:'no-store'}); if(!r.ok) throw new Error('Plan not found '+p); return r.json(); }
  async function main(){
    const pointer = await loadPointer();
    const planPath = pointer.plan_latest || pointer.pointer || pointer.plan || '/pages/apps/carol/plans/twoperson-2wk-unique-20251015T022300Z.json';
    const r = await fetch('./shopping.html'); // reuse code by importing functions? keep simple: re-run small aggregate path
    if(!r.ok){ document.getElementById('hdr').textContent='Open shopping.html first.'; return; }
    document.getElementById('hdr').textContent = 'Shopping List • Ready to print';
    window.print();
  }
  window.addEventListener('DOMContentLoaded', main);
  </script>
</head>
<body>
  <header class="controls"><button onclick="window.print()">Print / Save PDF</button><span id="hdr" style="margin-left:12px;color:#555">Loading…</span></header>
  <main class="container">
    <p>Tip: Use <em>shopping.html</em> for interactive view; use this page for a clean print.</p>
  </main>
</body>
</html>
