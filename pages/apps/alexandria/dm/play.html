<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alexandria — DM (Audio-Fixed)</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial;background:#0b0f17;color:#e5e7eb}
header{padding:12px 16px;border-bottom:1px solid #172033}h1{margin:0 0 4px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
main{padding:16px;display:grid;gap:12px}.controls button{margin-right:6px}
.chat{border:1px solid #172033;border-radius:8px;padding:12px;background:#0f172a}
#log{height:48vh;overflow:auto;padding:8px;background:#0b1220;border:1px solid #172033;margin-bottom:8px}
.msg{padding:6px 8px;margin:6px 0;border-radius:6px;max-width:82%}.msg.you{background:#1f2a44;margin-left:auto}.msg.dm{background:#192235}
.composer{display:flex;gap:8px}.composer input{flex:1;padding:8px;border:1px solid #334155;border-radius:6px;background:#0b1220;color:#e5e7eb}
.badge{border:1px solid #334155;border-radius:6px;padding:2px 6px;font-size:12px}
</style>
</head><body>
<header><h1>Alexandria — DM</h1><small>Enable Audio, choose TTS engine, Connect Worker (persisted), then Grant Mic if you want push‑to‑talk.</small></header>
<main>
  <section class="controls">
    <div class="row">
      <span class="badge">TTS Engine:</span>
      <label><input type="radio" name="tts_engine" value="worker" checked> Worker</label>
      <label><input type="radio" name="tts_engine" value="browser"> Browser</label>
      <button id="test-voice">Test Voice</button>
      <button id="enable-audio">Enable Audio</button>
      <button id="connect">Connect Worker</button>
      <button id="check">Check Worker</button>
      <label><input type="checkbox" id="tts" checked> Speak replies</label>
      <button id="grant-mic">Grant Mic</button>
      <button id="ptt">🎙 Hold to Talk</button>
    </div>
  </section>
  <section class="chat">
    <div id="log"></div>
    <div class="composer">
      <input id="msg" placeholder="Say something to the DM...">
      <button id="send">Send</button>
    </div>
  </section>
</main>
<script>
(function(){
  const cfgUrl = '../config.json';
  const radios = [...document.querySelectorAll('input[name="tts_engine"]')];
  const ttsEl = document.getElementById('tts');
  const logEl = document.getElementById('log');
  const input = document.getElementById('msg');
  let api = null, recorder=null, chunks=[], mime='', mediaStream=null;
  let engine = localStorage.getItem('ALEX_TTS_ENGINE') || 'worker';

  function setEngine(val){ engine = val; localStorage.setItem('ALEX_TTS_ENGINE', engine); }
  radios.forEach(r=>{ r.checked = (r.value===engine); r.addEventListener('change', ()=>setEngine(r.value)); });

  function line(text, who){ const el = document.createElement('div'); el.className='msg ' + (who||'dm'); el.textContent = text; logEl.appendChild(el); logEl.scrollTop = logEl.scrollHeight; }

  function playAudioDataUrl(u){
    try{ const a=new Audio(); a.src=u; a.play().catch(()=>{}); }catch(e){}
  }
  function speakBrowser(text){
    try{
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.0; u.pitch = 1.0;
      window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
    }catch(e){}
  }
  document.getElementById('test-voice').addEventListener('click', ()=>{
    if(engine==='worker'){ playAudioDataUrl('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA='); }
    else { speakBrowser('Voice check, this is Alexandria.'); }
  });
  document.getElementById('enable-audio').addEventListener('click', ()=>{
    // iOS unlock
    playAudioDataUrl('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=');
    line('Audio enabled.', 'dm');
  });

  async function loadConfig(){
    try{
      const j = await fetch(cfgUrl).then(r=>r.ok?r.json():null);
      if(j && j.worker_url){ api = j.worker_url; localStorage.setItem('ALEXANDRIA_API_URL', api); }
      if(j && typeof j.tts_default==='boolean'){ ttsEl.checked = j.tts_default; }
    }catch(e){}
    const ls = localStorage.getItem('ALEXANDRIA_API_URL');
    if(ls) api = ls;
  }

  document.getElementById('connect').addEventListener('click', ()=>{
    const u = prompt('Paste Worker URL (or leave to keep current):', api||''); if(!u) return;
    api = u.trim(); localStorage.setItem('ALEXANDRIA_API_URL', api); line('Saved Worker URL.','dm');
  });
  document.getElementById('check').addEventListener('click', async ()=>{
    if (!api) { line('No Worker URL set.','dm'); return; }
    try{ const r = await fetch(api); line(r.ok?'Worker reachable ✔︎':'Worker error ❌','dm'); }catch(e){ line('Worker not reachable ❌','dm'); }
  });

  async function sendText(text){
    const doTTS = !!ttsEl.checked;
    if (!api && engine==='worker') { line('No Worker set. Switch TTS to Browser or tap Connect.', 'dm'); return; }
    try{
      const payload = engine==='worker' ? { text, tts: doTTS, voice: 'alloy' } : { text, tts:false };
      const res = engine==='worker' ? await fetch(api, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(payload) }) : null;
      let j = engine==='worker' ? await res.json() : { reply: text };
      const reply = j.reply || '(no reply)';
      line(reply,'dm');
      if (doTTS){
        if(engine==='worker' && j.audio){ playAudioDataUrl(j.audio); }
        else { speakBrowser(reply); }
      }
    }catch(e){ line('Chat failed. Try Browser TTS or Check Worker.', 'dm'); }
  }

  document.getElementById('send').addEventListener('click', ()=>{
    const t=input.value.trim(); if(!t) return; input.value=''; line(t,'you'); sendText(t);
  });
  document.getElementById('msg').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ const t=input.value.trim(); if(!t) return; input.value=''; line(t,'you'); sendText(t);} });

  document.getElementById('grant-mic').addEventListener('click', async ()=>{
    try{
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const types = ['audio/webm;codecs=opus','audio/webm','audio/mp4'];
      mime = types.find(t=>MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
      recorder = new MediaRecorder(mediaStream, mime?{mimeType:mime}:{ });
      recorder.ondataavailable = e=>{ if(e.data && e.data.size>0) chunks.push(e.data); };
      recorder.onstop = async ()=>{
        const blob = new Blob(chunks, { type: mime || 'audio/webm' }); chunks=[];
        const b64 = await blobToBase64(blob);
        if (engine==='worker'){
          if(!api){ line('No Worker set for STT.','dm'); return; }
          line('Transcribing…','dm');
          try{
            const res = await fetch(api, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ audio_b64: b64, do_chat: true, tts: !!ttsEl.checked, voice: 'alloy' }) });
            const j = await res.json();
            if (j.transcript){ line('You (voice): '+j.transcript, 'you'); }
            if (j.reply){ line(j.reply,'dm'); if (ttsEl.checked && j.audio) playAudioDataUrl(j.audio); else if (ttsEl.checked) speakBrowser(j.reply); }
          }catch(e){ line('Voice pipeline failed. Try Browser TTS typing.', 'dm'); }
        } else {
          line('Voice capture complete. Switch to Worker TTS for STT.', 'dm');
        }
      };
      line('Mic ready. Hold-to-talk is active.','dm');
    }catch(e){ line('Mic permission denied.','dm'); }
  });
  const ptt = document.getElementById('ptt');
  const startRec = ()=>{ if(!recorder){ line('Grant Mic first.','dm'); return; } if(recorder.state==='recording') return; chunks=[]; recorder.start(); ptt.textContent='🔴 Recording…'; };
  const stopRec  = ()=>{ if(recorder && recorder.state==='recording'){ recorder.stop(); ptt.textContent='🎙 Hold to Talk'; } };
  ptt.addEventListener('mousedown', startRec); ptt.addEventListener('touchstart', startRec);
  ptt.addEventListener('mouseup', stopRec);   ptt.addEventListener('mouseleave', stopRec); ptt.addEventListener('touchend', stopRec);

  function blobToBase64(blob){ return new Promise(res=>{ const fr=new FileReader(); fr.onloadend=()=>res((fr.result||'').toString()); fr.readAsDataURL(blob); }); }
  loadConfig().then(()=> line('Welcome to the Library. TTS engine: '+engine+'. Worker '+(api?'set.':'not set.'), 'dm'));
})();</script>
</body></html>
