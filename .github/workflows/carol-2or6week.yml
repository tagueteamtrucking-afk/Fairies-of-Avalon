name: Carol — 2 or 6 Week Plan for Two
on:
  workflow_dispatch:
    inputs:
      weeks:            { description: "2 or 6", default: 2, type: number }
      kcal_person_a:    { description: "Daily kcal (Ray)", default: 1800, type: number }
      kcal_person_b:    { description: "Daily kcal (Blanca)", default: 1600, type: number }
      pattern:          { description: "DASH / Low-Sodium / Low-Sugar", default: "DASH", type: string }
      region:           { description: "EU or US", default: "EU", type: string }
permissions: { contents: write }
jobs:
  carol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plan (with retries)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_PROXY_URL: ${{ vars.OPENAI_PROXY_URL }}
        shell: pwsh
        run: >
          pwsh -File scripts/Carol-Meal-Plan-2or6wk.ps1
          -Weeks ${{ inputs.weeks }}
          -KcalA ${{ inputs.kcal_person_a }}
          -KcalB ${{ inputs.kcal_person_b }}
          -Pattern "${{ inputs.pattern }}"
          -Region "${{ inputs.region }}"
      - name: Index plans
        shell: pwsh
        run: |
          $dir = "pages/apps/carol/plans"
          if(-not (Test-Path $dir)){ exit 0 }
          $files = Get-ChildItem -Path $dir -Filter *.json | Sort-Object LastWriteTime -Descending | ForEach-Object { $_.Name }
          $obj = @{ updated=(Get-Date).ToUniversalTime().ToString('s')+'Z'; files=$files }
          $json = $obj | ConvertTo-Json -Depth 4
          Set-Content -Path (Join-Path $dir 'index.json') -Value $json -Encoding UTF8
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/carol/plans/
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "feat(carol): ${{ inputs.weeks }}-week plan for two" && git push; fi
