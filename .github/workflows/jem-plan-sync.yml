name: Jem Plan Sync
on:
  workflow_dispatch:
    inputs:
      sample_data:
        description: 'Optional JSON of health metrics'
        required: false
        default: ''
permissions:
  contents: write
  pull-requests: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plan JSON
        run: |
          mkdir -p pages/apps/jem/data
          node scripts/jem/plan-sync.mjs '${{ inputs.sample_data }}'
      - uses: actions/upload-artifact@v4
        with:
          name: jem-plan
          path: pages/apps/jem/data/plan-latest.json
      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'jem: update plan-latest.json'
          title: 'jem: update plan-latest.json'
          branch: ci/jem-plan-${{ github.run_id }}
          base: ${{ github.ref_name }}
