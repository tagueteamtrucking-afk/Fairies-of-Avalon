  author: "Cody (GPT-5 Pro)"
  notes: >
    Big-picture drops only. Canonical workflow names reused; standardizer deletes/renames others.
    Always ship ZIPs (workflows flat + site root) and touch multiple assistants in every drop.
rules:
  - No placeholders without explicit permission.
  - Workflows-first; scripts are helpers.
  - Use Worker URL in client pages; never embed API keys.
  - Readouts: Repo-Inventory/Refs/Usage must exist for reasoning.
  - Standardize workflows with keep/rename config before deploy.
assistants:
  active: ["Alexandria","Tracy","Nina","Charlotte","Carol","Jem","Stella","Abbey","Themis","Billie","Sorcha","Clarice","Odessa"]
  audio:
    - Alexandria: voice-dm via Worker /alexandria-dm
    - Stella: guided via Worker /stella-guide
site:
  flow:
    - Root -> /pages/plaza.html -> /pages/apps/_city/index.html
    - Charlotte builds registry.json from pages/apps/*/index.html
