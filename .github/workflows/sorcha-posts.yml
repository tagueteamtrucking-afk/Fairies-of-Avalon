name: "Sorcha — Generate Posts"
on: { workflow_dispatch: { inputs: { count: { description: "How many?", required: true, default: "6" } } } }
permissions: { contents: write }
jobs:
  posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ github.ref }}, fetch-depth: 0 }
      - name: Generate posts
        shell: pwsh
        run: |
          & "scripts/overseers/sorcha-posts.ps1" -RepoRoot "${{ github.workspace }}" -Count [int]"${{ github.event.inputs.count }}"
      - name: Commit (if changed)
        shell: pwsh
        run: |
          git add -A "pages/apps/sorcha/posts.json"
          $changes = git status --porcelain -- "pages/apps/sorcha/posts.json"
          if ([string]::IsNullOrWhiteSpace($changes)) { Write-Host "Nothing to commit."; }
          else {
            git config user.email "actions@github.com"
            git config user.name  "GitHub Actions"
            git fetch origin ${{ github.ref_name }} --prune
            git pull --rebase origin ${{ github.ref_name }} || echo "Nothing to rebase"
            git commit -m "Sorcha: posts"
          }
      - name: Push
        uses: ad-m/github-push-action@77c5b412c50b723d2a4fbc6d71fb5723bcd439aa
        with: { github_token: ${{ secrets.GITHUB_TOKEN }}, branch: ${{ github.ref_name }}, force_with_lease: true }
