    // Map each day name to its corresponding array for the selector.  No days repeat.
    const mealPlan = {
      'Day 1': day1,
      'Day 2': day2,
      'Day 3': day3,
      'Day 4': day4,
      'Day 5': day5,
      'Day 6': day6,
      'Day 7': day7,
      'Day 8': day8,
      'Day 9': day9,
      'Day 10': day10,
      'Day 11': day11,
      'Day 12': day12,
      'Day 13': day13,
      'Day 14': day14
    };
    const selector = document.getElementById('day-selector');
    const tableDiv = document.getElementById('meal-table');
    const summary = document.getElementById('summary');

    // Load any saved ratings/notes from localStorage. They are keyed by
    // day+index (e.g. 'Day 1-0-rating') so they persist between page visits.
    function loadSaved(day, idx, type) {
      return localStorage.getItem(`meal-${day}-${idx}-${type}`) || '';
    }
    function saveValue(day, idx, type, value) {
      localStorage.setItem(`meal-${day}-${idx}-${type}`, value);
    }

    selector.addEventListener('change', () => {
      const day = selector.value;
      if (!day) {
        tableDiv.innerHTML = '';
        summary.textContent = '';
        return;
      }
      const meals = mealPlan[day];
      let total = 0;
      let html = '<table><thead><tr><th>Meal</th><th>Type</th><th>Calories</th><th>Ingredients</th><th>Instructions</th><th>Rating</th><th>Notes</th></tr></thead><tbody>';
      meals.forEach((item, idx) => {
        total += item.nutrition;
        const savedRating = loadSaved(day, idx, 'rating');
        const savedNote = loadSaved(day, idx, 'note');
        html += `<tr>
          <td>${item.name}</td>
          <td>${item.mealType}</td>
          <td>${item.nutrition}</td>
          <td>${item.ingredients.join(', ')}</td>
          <td><ul>${item.instructions.map(i => `<li>${i}</li>`).join('')}</ul></td>
          <td>
            <select data-idx="${idx}" class="rating-select">
              <option value="">–</option>
              <option value="1" ${savedRating === '1' ? 'selected' : ''}>1</option>
              <option value="2" ${savedRating === '2' ? 'selected' : ''}>2</option>
              <option value="3" ${savedRating === '3' ? 'selected' : ''}>3</option>
              <option value="4" ${savedRating === '4' ? 'selected' : ''}>4</option>
              <option value="5" ${savedRating === '5' ? 'selected' : ''}>5</option>
            </select>
          </td>
          <td>
            <textarea rows="2" data-idx="${idx}" class="note-input" placeholder="Add notes...">${savedNote}</textarea>
          </td>
        </tr>`;
      });
      html += '</tbody></table>';
      tableDiv.innerHTML = html;
      summary.textContent = `Total calories for ${day}: ${total} kcal`;
      // Attach change handlers after rendering so we can persist values.
      document.querySelectorAll('.rating-select').forEach(sel => {
        sel.addEventListener('change', (e) => {
          const idx = e.target.dataset.idx;
          saveValue(day, idx, 'rating', e.target.value);
        });
      });
      document.querySelectorAll('.note-input').forEach(textarea => {
        textarea.addEventListener('input', (e) => {
          const idx = e.target.dataset.idx;
          saveValue(day, idx, 'note', e.target.value);
        });
      });
    });
  </script>
