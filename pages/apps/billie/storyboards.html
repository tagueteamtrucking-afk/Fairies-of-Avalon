<!doctype html>
<html lang="en" data-required-role="user">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Billie — Storyboards (PG‑13)</title>
  <script src="/pages/apps/shared/auth-gate.js" defer></script>
  <style>
    body{background:#0e0e0f;color:#eee;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    main{max-width:980px;margin:22px auto;padding:0 16px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
    .card{background:#151517;border:1px solid #2a2a2d;border-radius:12px;padding:14px}
    .thumb{width:100%;aspect-ratio:16/9;background:#0c0c0e;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#777}
    .muted{opacity:.85}
    .btn{display:inline-block;margin-top:10px;padding:10px 12px;border-radius:8px;background:#2a6df4;color:#fff;text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <main>
    <h1>Billie — Storyboards</h1>
    <p class="muted">Lay out scenes, beats, and cuts. Keep it PG‑13 on-site.</p>
    <section class="grid">
      <article class="card">
        <div class="thumb">Add Image</div>
        <h3>Hook</h3>
        <p class="muted">Opening beat; 3–5 sec visual hook.</p>
        <a class="btn" href="#">Add Notes</a>
      </article>
      <article class="card">
        <div class="thumb">Add Image</div>
        <h3>Build</h3>
        <p class="muted">Main idea; A→B progression.</p>
        <a class="btn" href="#">Add Notes</a>
      </article>
      <article class="card">
        <div class="thumb">Add Image</div>
        <h3>Close</h3>
        <p class="muted">Call-to-action or tag.</p>
        <a class="btn" href="#">Add Notes</a>
      </article>
    </section>
  </main>
</body>
</html>
