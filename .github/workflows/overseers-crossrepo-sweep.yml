name: Overseers - Crossrepo Sweep
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crossrepo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout main repo"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Guard — required config present"
        shell: bash
        env:
          REPOS_READ_TOKEN: ${{ secrets.REPOS_READ_TOKEN }}
          SECOND_REPO: ${{ vars.SECOND_REPO }}
        run: |
          set -euo pipefail
          if [ -z "${REPOS_READ_TOKEN:-}" ] || [ -z "${SECOND_REPO:-}" ]; then
            echo "::warning title=Crossrepo Sweep skipped::Missing REPOS_READ_TOKEN or SECOND_REPO"
            exit 0
          fi
          echo "SECOND_REPO=${SECOND_REPO}" >> "$GITHUB_ENV"

      - name: "Clone second repo (read-only)"
        shell: bash
        run: |
          set -euo pipefail
          rm -rf external || true
          mkdir -p external
          git -c http.sslVerify=false clone --depth 1 "https://x-access-token:${{ secrets.REPOS_READ_TOKEN }}@github.com/${SECOND_REPO}.git" external/second

      - name: "Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "Build All File Memory (both repos)"
        shell: bash
        run: |
          set -euo pipefail
          node scripts/overseers/crossrepo-sweep.mjs --main . --second external/second --out pages/apps/overseers/all-files.json

      - name: "Commit to PR branch"
        shell: bash
        run: |
          set -euo pipefail
          BR="autobot/crossrepo-${GITHUB_RUN_ID}"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git checkout -b "$BR" || git checkout "$BR"
          git add pages/apps/overseers/all-files.json
          git commit -m "chore(overseers): update All File Memory index" || echo "Nothing to commit."
          git push origin "$BR" || echo "Branch exists or no changes."

      - name: "Open PR"
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const head  = `autobot/crossrepo-${process.env.GITHUB_RUN_ID}`;
            try {
              const { data: pr } = await github.rest.pulls.create({
                owner, repo, head, base: 'main',
                title: 'Overseers: Crossrepo All File Memory',
                body: `Automated update from run ${context.runId}`
              });
              core.notice(`PR created: ${pr.html_url}`);
            } catch (e) {
              core.warning(`PR create skipped or exists: ${e.message}`);
            }
