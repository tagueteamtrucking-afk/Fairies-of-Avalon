name: Queue — Full Roster
on: { workflow_dispatch: {} }
jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enqueue all Fairies (build_order_initial)
        shell: pwsh
        run: |
          $agents = @('rey_czar','white_star','clarice','charlotte','nina','alexandria','tracy','carol_li','jem_nassim','stella','sorcha','odessa','billie','themis','abbey')
          $dir = 'pages/apps/overseers/queue/pending'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $ts = (Get-Date).ToUniversalTime().ToString('yyyyMMddTHHmmssZ')
          $items = @()
          foreach($a in $agents){ $items += @{ id=$a; task="build"; priority=5 } }
          $payload = @{ queued=$ts; items=$items } | ConvertTo-Json -Depth 6
          Set-Content -Path (Join-Path $dir "$ts-full-roster.json") -Value $payload -NoNewline -Encoding utf8
      - name: Commit queue file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/overseers/queue/pending/
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(queue): full roster" && git push; fi
