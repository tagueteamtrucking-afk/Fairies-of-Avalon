name: Jem — Normalize Week1 Names (v2)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  norm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Week1 names & rebuild index
        shell: pwsh
        run: pwsh -File scripts/Jem-Normalize-Week1.ps1 -ProgramsDir "pages/apps/jem/programs" -MapFile "pages/apps/jem/programs/name-map.json"
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/jem/programs/*
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(jem): normalize week1 names (v2) + reindex" && git push; fi
