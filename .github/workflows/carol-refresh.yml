name: Carol — Refresh (Extract Shopping)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  extract-shopping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show plan pointer
        shell: pwsh
        run: |
          Get-Content pages/apps/carol/index.json | Write-Host

      - name: Extract shopping (v3)
        shell: pwsh
        run: |
          ./scripts/Carol-Extract-Shopping-v3.ps1

      - name: Commit updated shopping files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/carol/plans/shopping-*.json || echo "No shopping json to add"
          git commit -m "Carol: refresh shopping lists" || echo "No changes"
          git push

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: carol-shopping-json
          path: |
            pages/apps/carol/plans/shopping-*.json
          if-no-files-found: warn
