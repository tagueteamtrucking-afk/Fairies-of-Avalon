name: Charlotte — Curated Crawl

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Curated crawl
        run: node scripts/charlotte/curated-crawl.mjs
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/apps/charlotte/finds.json || true
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(charlotte): update finds"; git push; fi
