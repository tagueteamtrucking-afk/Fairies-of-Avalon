<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Overseers Hub · Avalon</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/app.css">
  <style>
    main{max-width:1100px;margin:24px auto;padding:0 12px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
    .card{border:1px solid #eee;border-radius:.6rem;padding:12px}
    .pill{display:inline-block;padding:.25rem .6rem;border:1px solid #999;border-radius:.6rem;font-size:.85rem;margin-right:.4rem}
    .ok{color:#2aa198;border-color:#2aa198}
    .warn{color:#cb4b16;border-color:#cb4b16}
    small{color:#666}
  </style>
</head>
<body>
  <main>
    <h1>Overseers Hub</h1>
    <div style="margin-bottom:10px">
      <a class="pill" href="/apps/overseers/console.html">Console</a>
      <span id="ai" class="pill">AI: …</span>
      <span id="wpi" class="pill">WPI: …</span>
    </div>

    <section class="card">
      <h3>Fairies</h3>
      <div id="fairies" class="grid"></div>
      <div style="margin-top:10px"><small id="last">Last run: —</small></div>
    </section>
  </main>
  <script src="./hub.js" defer></script>
</body>
</html>
