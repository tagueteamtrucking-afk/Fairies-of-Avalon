name: Abbey — Parse Transactions & Subscriptions
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse CSVs to ledger
        shell: pwsh
        run: pwsh -File scripts/Abbey-Parse-Transactions.ps1 -InDir "pages/apps/abbey/imports/transactions" -OutFile "pages/apps/abbey/ledger.json"
      - name: Build subscriptions
        shell: pwsh
        run: pwsh -File scripts/Abbey-Subscriptions-From-Ledger.ps1 -Ledger "pages/apps/abbey/ledger.json" -OutFile "pages/apps/abbey/subscriptions.json"
      - name: Commit outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/abbey/ledger.json pages/apps/abbey/subscriptions.json pages/apps/abbey/index.html
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "feat(abbey): subscriptions dashboard" && git push; fi
