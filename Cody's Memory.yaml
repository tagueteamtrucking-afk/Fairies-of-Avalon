      notes: "v1.8.0 — Overseers queue/runner + LLM Bridge. Dry-run default; live with OPENAI_API_KEY." }
  - { ts: "2025-09-13T14:00:00Z", actor: "actions", action: "runner.process", target: "overseers-queue", result: "ok",
      notes: "Live scaffold executed; 8 test runs visible; progress + processed updated." }
  - { ts: "2025-09-13T14:10:00Z", actor: "assistant", action: "mem.replace", target: "Cody's Memory.yaml", result: "ok",
      notes: "v1.9.0 — Next steps added for Building the Assistants; WPI restoration plan recorded." }

lessons_learned:
  - "Auto-install powershell-yaml; do not assume ConvertFrom-Yaml exists."
  - "Avoid LINQ static calls in PowerShell; use pure pipeline ops (portable)."
  - "Linux-safe quoting: inside single-quoted strings, double any single quotes."
  - "Paths with apostrophes need double-quoted strings in PowerShell (e.g., \"Cody's Memory.yaml\")."
  - "Import map is mandatory on module pages (three, three/addons, @pixiv/three-vrm)."
  - "Write CNAME during deploy so the custom domain sticks."
  - "Workflows-first; no wrapper shell assumptions."
  - "No plaintext secrets; use repo Secrets or vault references only."
  - "Service Worker: live JSON (progress/capabilities) must be network-first; console should fetch with cache-buster."
  - "Deploy should auto-trigger on progress changes to keep Console fresh."
