name: Carol — Refresh Shopping (direct commit)

on:
  workflow_dispatch:
    inputs:
      plan_path:
        description: "Path to the plan JSON to use"
        required: false
        default: "pages/apps/carol/plans/twoperson-2wk-unique-20251015T022300Z.json"

permissions:
  contents: write

jobs:
  build-shopping:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify plan & stage merged plan
        run: |
          $plan = "${{ github.event.inputs.plan_path }}"
          if (-not $plan) {{ $plan = "pages/apps/carol/plans/twoperson-2wk-unique-20251015T022300Z.json" }}
          if (-not (Test-Path $plan)) {{ throw "Plan not found: $plan" }}
          New-Item -ItemType Directory -Force -Path "pages/apps/carol/plans" | Out-Null
          Copy-Item $plan "pages/apps/carol/plans/twoperson-2wk-merged.json" -Force
          Write-Host "Using plan: $plan"

      - name: Extract shopping (v3)
        run: |
          ./scripts/Carol-Extract-Shopping-v3.ps1

      - name: Commit & push shopping outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/apps/carol/plans/shopping-quantized.json
          git add pages/apps/carol/plans/shopping-extracted.json
          if (git diff --staged --quiet) {{ 
            Write-Host "No shopping changes to commit."
          }} else {{
            git commit -m "Carol: refresh shopping list from ${{ github.event.inputs.plan_path }}"
            git push
          }}