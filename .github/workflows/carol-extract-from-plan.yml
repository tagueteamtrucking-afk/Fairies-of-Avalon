name: Carol — Extract Shopping (from plan)
on:
  workflow_dispatch:
    inputs:
      plan_path:
        description: "Path to plan JSON to copy and extract"
        required: true
        default: "pages/apps/carol/plans/twoperson-2wk-unique-20251015T022300Z.json"
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure pwsh and copy plan to merged alias
        shell: pwsh
        run: |
          $plan = "${{ github.event.inputs.plan_path }}"
          if(!(Test-Path $plan)){ throw "Plan not found: $plan" }
          $merged = "pages/apps/carol/plans/twoperson-2wk-merged.json"
          Copy-Item -Force $plan $merged
      - name: Run Carol-Extract-Shopping-v3.ps1
        shell: pwsh
        run: |
          ./scripts/Carol-Extract-Shopping-v3.ps1 -PlanFile "pages/apps/carol/plans/twoperson-2wk-merged.json"
      - name: Commit artifacts
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pages/apps/carol/plans/shopping-extracted.json pages/apps/carol/plans/shopping-quantized.json || $true
          git commit -m "Carol: refresh shopping list from plan" || echo "No changes"
          git push
