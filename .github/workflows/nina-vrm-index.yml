name: Nina — VRM Index
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: pwsh -File scripts/Nina-VRM-Index.ps1
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/nina/vrm-index.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(nina): vrm index" && git push; fi
