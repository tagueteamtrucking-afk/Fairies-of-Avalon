name: Actions Audit (list workflows & last runs)
on:
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: 'How many hours back to inspect'
        default: '48'
        required: true
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - id: gather
        name: Gather data via GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const hours = parseInt(core.getInput('lookback_hours') || '48', 10);
            const since = new Date(Date.now() - hours*60*60*1000).toISOString();
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const wfResp = await github.rest.actions.listRepoWorkflows({owner, repo, per_page: 200});
            const workflows = wfResp.data.workflows || [];
            const lines = [];
            for (const wf of workflows) {
              const runsResp = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id: wf.id, per_page: 10, created: `>=${since}`});
              const runs = runsResp.data.workflow_runs || [];
              const latest = runs[0];
              lines.push(`- **${wf.name}** (${wf.path}) → ` + (latest ? `*${latest.status}/${latest.conclusion}* ${latest.html_url}` : 'no runs in window') + `; runs=${runs.length}`);
            }
            const md = [`## Actions Audit (last ${hours}h)`, `Since: ${since}`, '', ...lines].join('\n');
            core.setOutput('markdown', md);
      - name: Save report
        run: |
          mkdir -p audit
          printf "%s
" "${{ steps.gather.outputs.markdown }}" > audit/actions-audit.md
      - uses: actions/upload-artifact@v4
        with:
          name: actions-audit
          path: audit/actions-audit.md
      - name: Create or update issue
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const md = `${{ toJSON(steps.gather.outputs.markdown) }}`.slice(1,-1);
            const title = 'Actions Audit Report';
            const { data: issues } = await github.rest.issues.listForRepo({owner, repo, state: 'open', labels: 'overseer'});
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({owner, repo, issue_number: existing.number, body: md});
            } else {
              await github.rest.issues.create({owner, repo, title, body: md, labels: ['overseer']});
            }
