name: Nina — Build Scene Index
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scene index
        shell: pwsh
        run: pwsh -File scripts/Nina-Scene-Index.ps1 -AssetsRoot "asset" -OutFile "pages/apps/overseers/scene-index.json"
      - name: Commit scene index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/overseers/scene-index.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(nina): scene index" && git push; fi
