name: Overseers — Repo Doctor
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  doctor:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Remove '?v=' cache-busters from HTML
        run: |
          $files = Get-ChildItem -Recurse -File -Include *.html,*.htm
          foreach($f in $files){
            $c = Get-Content $f.FullName -Raw
            $c2 = $c -replace '\?v=\d+', ''
            if($c2 -ne $c){ $c2 | Set-Content -Path $f.FullName }
          }
      - name: Ensure CNAME exists
        run: |
          if(-not (Test-Path 'CNAME')){ 'fairiesofavalon.com' | Set-Content -Path 'CNAME' }
      - name: Commit fixes
        run: |
          git config user.name "Overseers Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A || true
          git commit -m "Repo Doctor: normalize cache-busters + ensure CNAME" || echo "Nothing to commit"
          git push || echo "Nothing to push"
