name: Runner — Process Overseers Queue
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Process first pending file
        env: { OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}, OPENAI_MODEL: ${{ vars.OPENAI_MODEL }} }
        shell: pwsh
        run: |
          $base = 'pages/apps/overseers/queue'
          $pending = Join-Path $base 'pending'
          $done = Join-Path $base 'done'
          New-Item -ItemType Directory -Path $pending,$done -Force | Out-Null
          $file = Get-ChildItem -File $pending | Sort-Object Name | Select-Object -First 1
          if (-not $file) { Write-Host "No pending queue files."; exit 0 }
          $obj = Get-Content -Raw -Path $file.FullName | ConvertFrom-Json
          foreach($it in $obj.items){
            $agent = $it.id
            $slug = ($agent -replace '[^a-z0-9]+','-').Trim('-')
            $appDir = Join-Path 'pages/apps' $slug
            New-Item -ItemType Directory -Path $appDir -Force | Out-Null
            $out = Join-Path $appDir 'index.json'
            $now = (Get-Date).ToUniversalTime().ToString('s')+'Z'
            $data = @{ updated=$now; agent=$agent; items=@(@{ id="queued"; title="Queued build"; summary="Stub created by queue runner."; data=@{ status="queued" }}) }
            $json = $data | ConvertTo-Json -Depth 8
            Set-Content -Path $out -Value $json -NoNewline -Encoding utf8
          }
          Move-Item -Path $file.FullName -Destination (Join-Path $done $file.Name) -Force
      - name: Commit processed outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/**/index.json pages/apps/overseers/queue/done/
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(queue): processed one batch" && git push; fi
