name: Package - Workflows ZIP (flat root)
on: { workflow_dispatch: {} }
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage workflows
        run: |
          mkdir -p staging dist
          if [ -d ".github/workflows" ]; then
            find .github/workflows -maxdepth 1 -type f \( -name "*.yml" -o -name "*.yaml" \) -print0 | while IFS= read -r -d '' f; do cp "$f" "staging/$(basename "$f")"; done
          fi
          count=$(ls -1 staging 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" = "0" ]; then echo "No workflow files found" >&2; exit 1; fi
          (cd staging && zip -r ../dist/Avalon-Workflows.zip .)
      - uses: actions/upload-artifact@v4
        with: { name: Avalon-Workflows, path: dist/Avalon-Workflows.zip, if-no-files-found: error }
