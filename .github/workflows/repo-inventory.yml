name: Repo — Inventory
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory
        shell: pwsh
        run: pwsh -File scripts/Repo-Inventory.ps1
      - name: Refs graph
        shell: pwsh
        run: pwsh -File scripts/Repo-Refs-Graph.ps1
      - name: Commit reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add memory-history/repo-inventory.json memory-history/repo-refs.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(repo): inventory + refs graph" && git push; fi
