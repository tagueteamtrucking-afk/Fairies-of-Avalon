meta:
  project: Avalon
  file_name: "Cody's Memory.yaml"
  version: "2.2.1"
  last_updated: "2025-09-18"
  author: "Cody (GPT-5 Pro)"
  notes: >
    v4+. LLM Bridge default ON. Adds Stella components agent + LLM scripts for Carol and Jem.
    Safe Actions (no & / no splatting). As-Int numeric coercion. All writes under pages/apps/**.

rules:
  - Never repeat Object[]→Int32: declare [object] params, coerce via As-Int.
  - No call operator (&) or splatting in Actions; use `pwsh -File`.
  - Ask clarifying questions until ≥95% confident; record obstacles and fixes here.
  - Keep assets intact; write generated content to pages/apps/** only.
  - Put all secrets in Actions (server-side). No secrets in client JS.

workflows:
  - .github/workflows/00-sanity.yml
  - .github/workflows/avalon-run-all.yml
  - .github/workflows/overseers-llm-bridge.yml
  - .github/workflows/charlotte-tts-azure.yml
  - .github/workflows/carol-llm.yml
  - .github/workflows/jem-llm.yml
  - .github/workflows/stella-llm.yml

secrets_expected:
  - OPENAI_API_KEY: for all LLM bridges (Chat Completions).
  - AZURE_TTS_KEY, AZURE_TTS_REGION: Speech TTS REST for Charlotte (optional).

generated_paths:
  - pages/apps/alexandria/worlds/**
  - pages/apps/tracy/artboards/**
  - pages/apps/overseers/vrm-index.json
  - pages/apps/charlotte/pipelines/**
  - pages/apps/charlotte/voiceovers/**
  - pages/apps/carol/plans/**
  - pages/apps/jem/programs/**
  - pages/apps/stella/components/**
