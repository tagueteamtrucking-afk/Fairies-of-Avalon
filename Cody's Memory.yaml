lessons_learned:
  - "Auto-install powershell-yaml; do not assume ConvertFrom-Yaml exists."
  - "Avoid LINQ static calls in PowerShell; use pure pipeline ops (portable)."
  - "Linux-safe quoting: inside single-quoted strings, double any single quotes."
  - "Paths with apostrophes need double-quoted strings in PowerShell (e.g., \"Cody's Memory.yaml\")."
  - "Import map is mandatory on module pages (three, three/addons, @pixiv/three-vrm)."
  - "Write CNAME during deploy so the custom domain sticks."
  - "Workflows-first; no wrapper shell assumptions."
  - "No plaintext secrets; use repo Secrets or vault references only."
