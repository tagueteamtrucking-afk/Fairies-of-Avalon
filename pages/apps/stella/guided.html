<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stella — Guided Audio</title><style>body{background:#0b1220;color:#e6e9ff;font-family:system-ui,Segoe UI,Roboto;margin:0;padding:16px}a{color:#a5d6ff}select,input,button{font:inherit}</style></head>
<body><h1>Stella — Guided Audio</h1>
<p>Worker URL: <input id="w" style="width:60%"> <button onclick="save()">Save</button></p>
<p>Program: <select id="p">
<option value="success">Success & Determination</option>
<option value="focus">Focus</option>
<option value="gratitude">Gratitude</option>
<option value="gateway">Gateway</option>
<option value="relax">Relax</option>
</select>
</p>
<p><button onclick="play()">Play</button> <audio id="a" controls style="width:100%"></audio></p>
<p><a href="/pages/apps/stella/index.html" style="color:#a5d6ff">← Back</a></p>
<script type="module">
import {{getWorker,setWorker}} from '/pages/apps/shared/worker.js';
const w=document.getElementById('w'); w.value=getWorker();
window.save=()=>setWorker(w.value.trim());
window.play=async()=>{{const url=(getWorker()||'').replace(/\/$/,'')+'/speak'; const r=await fetch(url,{{method:'POST',headers:{{'content-type':'application/json'}},body:JSON.stringify({{voice:document.getElementById('p').value,text:'Start'}})}}); const blob=await r.blob(); document.getElementById('a').src=URL.createObjectURL(blob);}}
</script></body></html>
