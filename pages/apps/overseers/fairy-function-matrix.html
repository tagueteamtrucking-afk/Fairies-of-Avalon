<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fairy–Function Matrix</title>
<link rel="stylesheet" href="/pages/apps/common/style.css">
</head><body><div class="wrap">
<h2>🧭 Fairy–Function Matrix (Evolution)</h2>
<p class="sub">Live snapshot derived from memory/owners.json and evolution rules.</p>
<table style="width:100%;border-collapse:collapse">
  <thead><tr><th style="text-align:left;padding:8px">Fairy</th><th style="text-align:left;padding:8px">Merged From</th><th style="text-align:left;padding:8px">Owns</th><th style="text-align:left;padding:8px">Relations</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<p style="margin-top:12px"><a href="/index.html">⬅ Home</a></p>
<script type="module">
const rows = document.getElementById('rows');
const data = await fetch('/memory/fairy_function_matrix.json').then(r=>r.json());
for(const [name, s] of Object.entries(data.fairies)){
  const tr = document.createElement('tr');
  const owns = (s.owns||[]).join(', ');
  const merged = (s.merged_from||[]).join(', ');
  const rel = [s.twin_with?`twin:${s.twin_with}`:'', s.paired_with?`pair:${s.paired_with}`:''].filter(Boolean).join(' | ');
  tr.innerHTML = `<td style=\"padding:8px\"><strong>${name}</strong></td><td style=\"padding:8px\">${merged||'-'}</td><td style=\"padding:8px\">${owns||'-'}</td><td style=\"padding:8px\">${rel||'-'}</td>`;
  rows.appendChild(tr);
}
</script>
</div></body></html>
