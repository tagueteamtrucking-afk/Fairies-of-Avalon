    <rect class="bldg" x="200" y="480" width="160" height="100" rx="8"/>
    <circle class="pin" cx="280" cy="530" r="5"/>
    <text class="label" x="190" y="475">🎨 Cathedral Studio (Tracy)</text>
  </a>
  <!-- Relay Tower (Charlotte) -->
  <a xlink:href="/pages/apps/charlotte/index.html">
    <rect class="bldg" x="820" y="480" width="160" height="100" rx="8"/>
    <circle class="pin" cx="900" cy="530" r="5"/>
    <text class="label" x="820" y="475">📡 Relay Tower (Charlotte)</text>
  </a>
  <!-- Grand Vault (Abbey) placeholder -->
  <a xlink:href="/pages/apps/abbey/index.html">
    <rect class="bldg" x="520" y="480" width="160" height="100" rx="8"/>
    <circle class="pin" cx="600" cy="530" r="5"/>
