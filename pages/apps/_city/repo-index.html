<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Repository Index — Viewer</title>
  <style>
    :root{ color-scheme: dark; --bg:#0b1220; --panel:#111a2a; --text:#e6ebff; --muted:#8aa2d3; --accent:#a5d6ff; }
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;}
    header{padding:20px 24px;font-size:20px;font-weight:700;}
    main{padding:0 24px 40px;}
    .box{background:var(--panel);border-radius:12px;padding:16px;margin:12px 0;}
    input[type="text"]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #20304f;background:#0e1727;color:var(--text)}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{padding:8px;border-bottom:1px solid #1c2842}
    th{text-align:left;color:var(--muted)}
    a{color:var(--accent);text-decoration:none}
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}
    .muted{color:var(--muted)}
  </style>
</head>
<body>
  <header>📦 Repository Index — Viewer</header>
  <main>
    <div class="box">
      <div id="meta" class="muted">Loading repo-index.json…</div>
    </div>

    <div class="box">
      <input id="q" type="text" placeholder="Filter by path (e.g., pages/apps/carol)…"/>
    </div>

    <div class="box">
      <table id="summary"></table>
    </div>

    <div class="box">
      <table id="files"></table>
    </div>
  </main>

<script>
async function loadJSON(path){
  const res = await fetch(path, {cache:'no-store'});
  if(!res.ok) throw new Error('Fetch failed: '+res.status);
  return res.json();
}
function fmtBytes(n){ if(n==null) return '—'; const units=['B','KB','MB','GB']; let i=0; let v=n; while(v>1024 && i<3){v/=1024;i++} return v.toFixed(v<10?2:1)+' '+units[i]; }
function esc(s){ return s.replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])) }

async function init(){
  const data = await loadJSON('/pages/apps/_city/repo-index.json').catch(()=>null);
  const meta = document.getElementById('meta');
  if(!data){ meta.textContent = 'repo-index.json not found yet. Run the “Repo — Read Index” Action.'; return; }
  meta.innerHTML = `<div><span class="muted">Repo:</span> ${esc(data.repo)} — <span class="muted">Files:</span> ${data.count} — <span class="muted">SHA:</span> <span class="mono">${esc(data.sha)}</span> — <span class="muted">Generated:</span> ${esc(data.generated)}</div>`;

  // Summary
  const summary = await fetch('/memory-history/repo-usage-report.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);
  const t1 = document.getElementById('summary');
  if(summary && summary.summary){
    t1.innerHTML = '<tr><th>Folder</th><th>Files</th><th>Bytes</th></tr>' +
      summary.summary.map(s=>`<tr><td class="mono">${esc(s.folder)}</td><td>${s.files}</td><td>${fmtBytes(s.bytes||0)}</td></tr>`).join('');
  } else {
    t1.innerHTML = '<tr><td class="muted">Folder summary unavailable. It will appear after the Action commits.</td></tr>';
  }

  // Files table
  const q = document.getElementById('q');
  const filesT = document.getElementById('files');
  function render(filter=''){
    const rows = (data.files||[]).filter(f=>f.path.includes(filter)).slice(0,5000)
      .map(f=>`<tr><td class="mono">${esc(f.path)}</td><td>${fmtBytes(f.bytes)}</td><td class="muted">${esc(f.mtime||'')}</td></tr>`).join('');
    filesT.innerHTML = '<tr><th>Path</th><th>Size</th><th>Modified (UTC)</th></tr>'+ rows;
  }
  q.addEventListener('input', ()=>render(q.value.trim()));
  render('');
}
init();
</script>
</body>
</html>
