name: Avalon: Run-All
on:
  workflow_dispatch:
    inputs:
      worlds: { description: 'Worlds', default: 3, type: number }
      run_llm_bridge: { description: 'Alexandria LLM', default: true, type: boolean }
      run_carol_llm: { description: 'Carol', default: true, type: boolean }
      run_jem_llm: { description: 'Jem', default: true, type: boolean }
      run_stella_llm: { description: 'Stella', default: true, type: boolean }
      run_tts: { description: 'Charlotte TTS', default: false, type: boolean }
jobs:
  run-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run-All (local scaffolds)
        shell: pwsh
        run: pwsh -File scripts/Run-All.ps1 -WorldCount ${{ inputs.worlds }} -NonInteractive true
      - name: Alexandria LLM Bridge
        if: ${{ inputs.run_llm_bridge == true }}
        env: { OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}, OPENAI_MODEL: ${{ vars.OPENAI_MODEL }} }
        shell: pwsh
        run: pwsh -File scripts/LLM-Bridge.ps1 -WorldsToGenerate ${{ inputs.worlds }}
      - name: Carol LLM Plans
        if: ${{ inputs.run_carol_llm == true }}
        env: { OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}, OPENAI_MODEL: ${{ vars.OPENAI_MODEL }} }
        shell: pwsh
        run: pwsh -File scripts/Carol-LLM-Plans.ps1 -PlansToGenerate 3 -ProjectTitle "Avalon Site v1"
      - name: Jem LLM Programs
        if: ${{ inputs.run_jem_llm == true }}
        env: { OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}, OPENAI_MODEL: ${{ vars.OPENAI_MODEL }} }
        shell: pwsh
        run: pwsh -File scripts/Jem-LLM-Programs.ps1 -ProgramsToGenerate 2 -Target "site-automation"
      - name: Stella LLM Components
        if: ${{ inputs.run_stella_llm == true }}
        env: { OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}, OPENAI_MODEL: ${{ vars.OPENAI_MODEL }} }
        shell: pwsh
        run: pwsh -File scripts/Stella-LLM-Components.ps1 -ComponentsToGenerate 5 -Theme "treasure-map"
      - name: Charlotte TTS (optional)
        if: ${{ inputs.run_tts == true }}
        env: { AZURE_TTS_KEY: ${{ secrets.AZURE_TTS_KEY }}, AZURE_TTS_REGION: ${{ secrets.AZURE_TTS_REGION }} }
        shell: pwsh
        run: pwsh -File scripts/Charlotte-TTS.ps1
      - name: Commit generated content
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/
          if git diff --cached --quiet; then echo "No changes";
          else git commit -m "chore(run-all): update generated content (all AI)"; git push; fi
