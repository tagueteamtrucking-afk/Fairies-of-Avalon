<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overseers Hub</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif;margin:0;background:#0b0c10;color:#e8e8e8;padding:1rem}
    .badge{background:#1f2833;border:1px solid #3d4b5a;border-radius:8px;padding:.35rem .6rem;font-weight:600;display:inline-block;margin-right:.5rem}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.75rem;margin-top:1rem}
    a.tile{display:block;background:#162029;border:1px solid #2b3a47;border-radius:10px;padding:1rem;text-decoration:none;color:#e8e8e8}
    a.tile:hover{border-color:#5dade2}
    .sub{opacity:.8}
  </style>
  <script type="module">
    async function fetchJSON(u){ const r = await fetch(u,{cache:'no-store'}); if(!r.ok) throw new Error(r.status); return r.json(); }
    async function load(){
      let prog = null, idx = null;
      try { prog = await fetchJSON('/pages/apps/overseers/progress.json'); } catch {}
      try { idx  = await fetchJSON('/memory/file-index.json'); } catch {}
      document.getElementById('wpi').textContent = 'WPI: ' + (prog?.wallpaper_power_index ?? '…');
      document.getElementById('count').textContent = 'Files: ' + (idx?.summary?.count ?? '…');
    }
    load();
  </script>
</head>
<body>
  <h1>Overseers Hub</h1>
  <span id="wpi" class="badge">WPI: …</span>
  <span id="count" class="badge">Files: …</span>
  <div class="grid">
    <a class="tile" href="/pages/apps/carol/menu.html">Carol — Menu</a>
    <a class="tile" href="/pages/apps/carol/shopping.html">Carol — Shopping</a>
    <a class="tile" href="/pages/apps/charlotte/">Charlotte — Crawler</a>
  </div>
  <p class="sub">Run workflows from GitHub Actions. Use kill-sw.html if pages cache.</p>
</body>
</html>
