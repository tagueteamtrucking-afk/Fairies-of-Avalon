<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Library</title><link rel="stylesheet" href="/pages/app.css"/></head>
<body><main class="shell"><h1>Alexandria · Library</h1>
<p>View and edit lists. Download choices.json and commit.</p>
<select id="lists"></select><br/><textarea id="items" style="width:100%;min-height:200px"></textarea><br/>
<input id="new" placeholder="New item"/> <button id="add">Add</button> <button id="rm">Remove</button> <button id="dl">Download choices.json</button>
<script type="module">
const URL='/apps/alexandria/knowledge/choices.json'; let CH={};
async function load(){ try{const r=await fetch(URL+'?t='+Date.now());if(r.ok)CH=await r.json();}catch{} const keys=Object.keys(CH).sort(); const s=document.getElementById('lists'); s.innerHTML=keys.map(k=>`<option>${k}</option>`).join(''); s.onchange=()=>show(s.value); if(keys.length){s.value=keys[0];show(keys[0]);}}
function show(k){ document.getElementById('items').value=(CH[k]||[]).join('\n'); }
document.getElementById('add').onclick=()=>{const k=lists.value,v=new.value.trim(); if(!k||!v)return; CH[k]=[...new Set([...(CH[k]||[]),v])]; show(k); new.value='';};
document.getElementById('rm').onclick=()=>{const k=lists.value,v=new.value.trim(); if(!k||!v)return; CH[k]=(CH[k]||[]).filter(x=>x!==v); show(k); new.value='';};
document.getElementById('dl').onclick=()=>{const k=lists.value; CH[k]=items.value.split('\n').map(s=>s.trim()).filter(Boolean); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(CH,null,2)],{type:'application/json'})); a.download='choices.json'; a.click(); URL.revokeObjectURL(a.href);};
load();
</script>
</main></body></html>
