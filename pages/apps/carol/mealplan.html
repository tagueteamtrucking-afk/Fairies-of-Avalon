<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carol Meal Plan</title>
    <link rel="stylesheet" href="../../../assets/css/avalon.css" />
  </head>
  <body>
    <!-- A container for applying building skins. Adjust data attributes to change character or side. -->
    <div class="building-skin" data-character="carol" data-side="inside"></div>

    <main class="mealplan-container">
      <header class="mealplan-header">
        <h1>Carol Meal Plan</h1>
        <label for="day-select">Day:</label>
        <select id="day-select" class="day-select"></select>
      </header>
      <section id="meals-grid" class="meals-grid"></section>
    </main>

    <div id="meal-modal" class="modal hidden">
      <div class="modal-content">
        <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
        <h2 id="modal-title"></h2>
        <div id="modal-body"></div>
      </div>
    </div>

    <script src="../../js/avalon-skins.js"></script>
    <script src="../../js/mealplan.js"></script>
  </body>
</html>
