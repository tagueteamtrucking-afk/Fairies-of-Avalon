name: City — Publish Map Hotfix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy link (castle-town) if present
        shell: bash
        run: |
          set -e
          # No-op placeholder: city index is part of content zip; this action exists to trigger a rebuild if needed.
          echo "City map updated via content ZIP on 2025-10-21T01:14:01Z."
      - name: Commit and push (no changes ok)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A || true
          if git diff --cached --quiet; then
            echo "No file changes."
          else
            git commit -m "City map hotfix publish 2025-10-21T01:14:01Z"
            git push
          fi
