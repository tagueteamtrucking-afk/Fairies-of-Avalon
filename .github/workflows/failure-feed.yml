name: Failure Feed (on workflow_run)

on:
  workflow_run:
    workflows:
      - "Deploy GitHub Pages"
      - "Repo Vision (index + site map)"
      - "Repo Sweeper (propose deletions)"
      - "Nina Guard (YAML + importmap sanity)"
      - "Response Check (URLs & API endpoints)"
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: failure-feed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  post:
    if: >
      github.event.workflow_run.conclusion != 'success' &&
      !contains(github.event.workflow_run.name, 'Failure Feed') &&
      !contains(github.event.workflow_run.name, 'Pages Preflight')
    runs-on: ubuntu-latest
    steps:
      - name: Post summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const wr = context.payload.workflow_run;
            const body = [
              "### ❌ Workflow failed",
              `**${wr.name}** #${wr.run_number}`,
              `Branch: \`${wr.head_branch}\``,
              `[View logs](${wr.html_url})`
            ].join("\n");
            const {owner, repo} = context.repo;
            await github.rest.issues.create({owner, repo, title:`Fail: ${wr.name} #${wr.run_number}`, body});
