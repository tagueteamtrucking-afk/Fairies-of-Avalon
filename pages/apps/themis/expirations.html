<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Themis — Expirations</title><style>body{background:#0b1220;color:#e6e9ff;font-family:system-ui,Segoe UI,Roboto;margin:0;padding:16px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #1b2436;padding:8px 6px;text-align:left}th{background:#111a2b}</style></head>
<body><h1>Expirations & Reminders</h1>
<p>Add items and save to your browser; download JSON to commit later.</p>
<p><input id="name" placeholder="Item"> <input id="date" type="date"> <button onclick="add()">Add</button> <button onclick="dl()">Download JSON</button></p>
<table id="t"><thead><tr><th>Item</th><th>Due</th></tr></thead><tbody></tbody></table>
<script>
const key='themis_expirations'; const tbody=document.querySelector('#t tbody');
function load(){const a=JSON.parse(localStorage.getItem(key)||'[]'); tbody.innerHTML=''; a.forEach(x=>{const tr=document.createElement('tr'); tr.innerHTML='<td>'+x.name+'</td><td>'+x.date+'</td>'; tbody.appendChild(tr)})}
function add(){const name=document.getElementById('name').value.trim(), date=document.getElementById('date').value; if(!name||!date) return; const a=JSON.parse(localStorage.getItem(key)||'[]'); a.push({name,date}); localStorage.setItem(key,JSON.stringify(a)); load();}
function dl(){const a=localStorage.getItem(key)||'[]'; const blob=new Blob([a],{type:'application/json'}); const el=document.createElement('a'); el.href=URL.createObjectURL(blob); el.download='themis-expirations.json'; el.click();}
load();
</script>
<p><a href="/pages/apps/themis/index.html" style="color:#a5d6ff">← Back</a></p>
</body></html>
