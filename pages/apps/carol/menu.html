<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Carol — 14‑Day Menu</title>
  <link rel="stylesheet" href="./print.css">
  <style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:16px}.day{border:1px solid #e5e7eb;border-radius:10px;margin:10px 0;padding:10px}.head{display:flex;justify-content:space-between;align-items:center}.title{font-size:1.1rem;font-weight:600}.e{display:flex;gap:.5rem;align-items:center;padding:3px 0}.k{color:#666;font-size:.85rem;margin-left:auto}</style>
</head>
<body>
  <header class="head"><div class="title">14‑Day Menu (DASH)</div><a href="./shopping.html">Shopping List</a></header>
  <div id="err" style="display:none;background:#fee;border:1px solid #fbb;padding:10px;border-radius:8px"></div>
  <div id="days"></div>
  <script>
  (async function(){
    const $err = document.getElementById('err');
    const $days = document.getElementById('days');
    async function load(p){ const r=await fetch(p,{cache:'no-store'}); if(!r.ok) throw new Error(p+': '+r.status); return r.json(); }
    let idx=null;
    try{ idx = await load('./index.json'); }catch(e){ try{ idx=await load('index.json'); }catch{} }
    if(!idx){ $err.style.display='block'; $err.textContent='index.json missing'; return; }
    let rel = idx.plan_latest || idx.plan || '';
    if(!rel){ $err.style.display='block'; $err.textContent='Plan not found (pointer missing)'; return; }
    rel = rel.replace(/^\/+/, '');
    let plan=null;
    try{ plan = await load('/'+rel); }catch(e){ plan = await load(rel); }
    if(!plan){ $err.style.display='block'; $err.textContent='Plan not found at '+rel; return; }
    for(const d of plan.days||[]){
      const wrap=document.createElement('div'); wrap.className='day';
      const h=document.createElement('div'); h.className='head'; h.innerHTML = `<div>${d.day_label||('Day '+d.index)}</div>`; wrap.appendChild(h);
      for(const ev of d.events||[]){
        const row=document.createElement('div'); row.className='e';
        row.innerHTML = `<div>${ev.name}</div><div class="k">${ev.kcal||''} kcal</div>`;
        wrap.appendChild(row);
      }
      $days.appendChild(wrap);
    }
  })();
  </script>
</body>
</html>
