<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Abbey — Subscriptions</title><style>body{font-family:system-ui,Segoe UI,Roboto;margin:0;background:#0b0f17;color:#e5e7eb}main{max-width:960px;margin:0 auto;padding:14px}.card{background:#0f172a;border:1px solid #172033;border-radius:12px;padding:12px;margin:10px 0}</style></head><body><main><h1>Abbey — Subscriptions Dashboard</h1><div class='card'><p>Upload CSV statements to <code>pages/apps/abbey/imports/transactions/</code> then run <b>Abbey — Parse Transactions</b>. This dashboard will render <code>subscriptions.json</code>.</p></div><div class='card' id='out'>Loading…</div><script>fetch('/pages/apps/abbey/subscriptions.json?cb='+(Date.now())).then(r=>r.json()).then(j=>{const div=document.getElementById('out'); if(!j||!j.subscriptions){ div.textContent='No subscriptions.json yet.'; return;} const rows=j.subscriptions.map(s=>`<tr><td>${s.vendor}</td><td>$${s.amount.toFixed(2)}</td><td>${s.periodicity}</td><td>${s.count}</td></tr>`).join(''); div.innerHTML=`<table><thead><tr><th>Vendor</th><th>Amount</th><th>Period</th><th>Hits</th></tr></thead><tbody>${rows}</tbody></table>`; }).catch(()=>{ document.getElementById('out').textContent='No subscriptions.json yet.'; });</script></main></body></html>
