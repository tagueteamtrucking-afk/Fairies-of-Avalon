name: Package - Content ZIP (no workflows)
on: { workflow_dispatch: {} }
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip repo (exclude workflows)
        run: |
          mkdir -p dist
          echo ".github/workflows/*" > exclude.txt
          zip -r dist/Avalon-Content.zip . -x@exclude.txt
      - uses: actions/upload-artifact@v4
        with: { name: Avalon-Content, path: dist/Avalon-Content.zip, if-no-files-found: error }
