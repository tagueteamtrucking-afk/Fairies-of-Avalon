<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nina — VRM Viewer</title>
<style>body{margin:0;background:#0b0f17;color:#e5e7eb;font-family:system-ui}header{padding:12px;border-bottom:1px solid #172033}main{height:calc(100vh - 60px)}#c{width:100%;height:100%;display:block}</style>
<header><h1>Nina — VRM Viewer</h1><small>Add ?src=/asset/winged-models/Your.vrm</small></header>
<main><canvas id="c"></canvas></main>
<script type="importmap">{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.4/lib/three-vrm.module.js"
  }
}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { VRM, VRMUtils } from '@pixiv/three-vrm';
const qs=new URLSearchParams(location.search); const src=qs.get('src'); const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true}); renderer.setSize(innerWidth,innerHeight-60); const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0b0f17);
const camera=new THREE.PerspectiveCamera(35, innerWidth/(innerHeight-60), 0.1, 1000); camera.position.set(0,1.4,2.5);
const controls=new OrbitControls(camera, renderer.domElement); controls.target.set(0,1.4,0); controls.update();
const light=new THREE.DirectionalLight(0xffffff, 1.2); light.position.set(1,1,1); scene.add(light); scene.add(new THREE.AmbientLight(0xffffff,0.4));
const grid=new THREE.GridHelper(10,10,0x223,0x123); grid.position.y=-1; scene.add(grid);
async function loadVRM(url){
  const buffer = await fetch(url).then(r=>r.arrayBuffer());
  const { VRMLoaderPlugin } = await import('https://unpkg.com/@pixiv/three-vrm@2.0.4/examples/three-vrm.module.js');
  const loader = new (await import('three/addons/loaders/GLTFLoader.js')).GLTFLoader();
  loader.register((parser)=>new VRMLoaderPlugin(parser));
  const gltf = await new Promise((res,rej)=>loader.parse(buffer,'',res,rej));
  const vrm = gltf.userData.vrm; VRMUtils.rotateVRM0(vrm); scene.add(vrm.scene);
}
if(src){ loadVRM(src); } else { const t=document.createElement('div'); t.style.padding='8px'; t.textContent='No VRM src specified.'; document.body.appendChild(t); }
addEventListener('resize',()=>{ renderer.setSize(innerWidth,innerHeight-60); camera.aspect=innerWidth/(innerHeight-60); camera.updateProjectionMatrix(); });
renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script>
