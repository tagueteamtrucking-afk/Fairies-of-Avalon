name: PR Policy (Conventional)

on:
  pull_request_target:
    types: [opened, synchronize, edited, reopened, ready_for_review]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: false
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            perf
            test
            build
            ci
