name: Carol — Extract from Plan (safe alias)
on:
  workflow_dispatch:
    inputs:
      plan_path:
        description: 'Plan JSON to use'
        default: 'pages/apps/carol/plans/twoperson-2wk-unique-20251015T022300Z.json'
        required: true
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare alias expected by extractor
        shell: bash
        run: |
          set -e
          SRC="${{ github.event.inputs.plan_path }}"
          ALIAS="pages/apps/carol/plans/twoperson-2wk-merged.json"
          if [ ! -f "$SRC" ]; then
            echo "Plan file not found: $SRC"
            exit 1
          fi
          cp "$SRC" "$ALIAS"
      - name: Run extractor
        shell: pwsh
        run: |
          ./scripts/Carol-Extract-Shopping-v3.ps1
      - name: Cleanup alias
        if: always()
        shell: bash
        run: rm -f pages/apps/carol/plans/twoperson-2wk-merged.json || true
      - name: Commit shopping lists
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/apps/carol/plans/shopping-*.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Carol: extract shopping from plan"
            git push
          else
            echo "No shopping changes to commit."
          fi
      - name: Upload lists as artifact
        uses: actions/upload-artifact@v4
        with:
          name: carol-shopping
          path: |
            pages/apps/carol/plans/shopping-*.json
          if-no-files-found: warn
