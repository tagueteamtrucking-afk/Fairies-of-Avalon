<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carol — Menu Picker</title>
<style>
body{font-family:system-ui;background:#0b0f17;color:#e5e7eb;margin:0}header,footer{padding:12px 16px;border-bottom:1px solid #172033}
main{padding:16px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input,button{background:#111827;border:1px solid #334155;border-radius:8px;color:#e5e7eb;padding:8px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{border:1px solid #172033;border-radius:10px;padding:10px;background:#0f172a}
table{width:100%;border-collapse:collapse}th,td{border:1px solid #172033;padding:6px}
.badge{display:inline-block;padding:2px 6px;border:1px solid #334155;border-radius:6px;font-size:12px;margin-right:4px}
</style>
<header><h1>Carol — Menu Picker (Grazing)</h1><div class="row"><label>Plan: <select id="plan"></select></label><button id="load">Load</button><button id="clear">Clear Picks</button><button id="export">Export Picks</button></div></header>
<main>
  <section>
    <div id="summary"></div>
  </section>
  <section>
    <div id="days" class="grid"></div>
  </section>
  <section class="card">
    <h2>Shopping List (from your picks)</h2>
    <div id="list"></div>
    <div class="row" style="margin-top:8px">
      <button id="copy">Copy to Clipboard</button>
      <button id="download">Download .txt</button>
    </div>
  </section>
</main>
<footer><small>Tips: Tap items to select/deselect. Your picks are saved in this device. Export to save or share.</small></footer>
<script>
const planSel = document.getElementById('plan'), daysEl = document.getElementById('days'), listEl = document.getElementById('list'), sumEl=document.getElementById('summary');
let planData=null, picks={};
const storeKey = (name)=>'carol_picks_'+name;

async function fetchJSON(p){ const r=await fetch(p); if(!r.ok) throw new Error('fetch '+p); return r.json(); }
async function loadPlansIndex(){ try{ const j=await fetchJSON('./plans/index.json'); return j.files||[]; }catch(e){ return []; } }
function fmtEvent(ev){ return `${ev.name} — ${ev.type} for ${ev.for} @ ${ev.time_hint} (${ev.kcal} kcal)`; }
function pickId(dayIdx, evIdx){ return `d${dayIdx}_e${evIdx}`; }

function renderSummary(){
  if(!planData) return;
  const a=planData.persons?.find(p=>p.id==='A')||{kcal:0}, b=planData.persons?.find(p=>p.id==='B')||{kcal:0};
  const pickedIds = Object.keys(picks).filter(k=>picks[k]);
  const picked = [];
  planData.days?.forEach((d,di)=>d.events?.forEach((e,ei)=>{ const id=pickId(di,ei); if(picks[id]) picked.push(e); }));
  const kcal = picked.reduce((s,e)=>s+(+e.kcal||0),0);
  sumEl.innerHTML = `<div class="card"><div class="row"><span class="badge">Weeks: ${planData.weeks}</span><span class="badge">A kcal: ${a.kcal}</span><span class="badge">B kcal: ${b.kcal}</span><span class="badge">Picked: ${pickedIds.length}</span><span class="badge">Picked kcal total: ${Math.round(kcal)}</span></div></div>`;
}

function renderDays(){
  daysEl.innerHTML='';
  planData.days?.forEach((d,di)=>{
    const card = document.createElement('div'); card.className='card';
    const h = document.createElement('h3'); h.textContent = `Day ${d.index} — ${d.day_label}`; card.appendChild(h);
    (d.events||[]).forEach((ev,ei)=>{
      const id = pickId(di,ei);
      const row = document.createElement('div'); row.style.margin='8px 0'; row.style.cursor='pointer';
      row.textContent = fmtEvent(ev);
      row.addEventListener('click', ()=>{ picks[id] = !picks[id]; row.style.border = picks[id]?'1px solid #60a5fa':'1px solid transparent'; row.style.padding='6px'; renderSummary(); renderList(); savePicks(); });
      if(picks[id]){ row.style.border='1px solid #60a5fa'; row.style.padding='6px'; }
      const items = document.createElement('div'); items.style.fontSize='12px'; items.style.opacity='0.9';
      items.innerHTML = (ev.items||[]).map(it=>`${it.quantity||''} ${it.unit||''} ${it.ingredient}${it.notes?(' — '+it.notes):''}`).join('<br>');
      card.appendChild(row); card.appendChild(items);
    });
    daysEl.appendChild(card);
  });
}

function aggregate(){
  const acc = {};
  planData.days?.forEach((d,di)=>d.events?.forEach((ev,ei)=>{ const id=pickId(di,ei); if(!picks[id]) return;
    (ev.items||[]).forEach(it=>{
      const key = (it.ingredient||'').trim().toLowerCase() + '|' + (it.unit||'').trim().toLowerCase();
      const q = parseFloat(it.quantity); const v = isNaN(q)?0:q;
      acc[key] = (acc[key]||0) + v;
    });
  }));
  return acc;
}

function renderList(){
  const acc = aggregate();
  const lines = Object.entries(acc).map(([k,v])=>{
    const [ing, unit] = k.split('|'); const qty = (Math.round(v*100)/100).toString();
    return `- ${ing}${unit?' ('+unit+')':''}: ${qty}`;
  }).sort();
  listEl.innerHTML = `<pre>${lines.join('\n')||'(no picks yet)'}</pre>`;
}

function savePicks(){ if(!planSel.value) return; localStorage.setItem(storeKey(planSel.value), JSON.stringify(picks)); }
function loadPicks(){ const raw=localStorage.getItem(storeKey(planSel.value)); picks = raw? JSON.parse(raw):{}; }

document.getElementById('clear').addEventListener('click', ()=>{picks={}; savePicks(); renderSummary(); renderDays(); renderList();});
document.getElementById('export').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify({plan: planSel.value, picks}, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download='carol-picks.json'; a.click();
});
document.getElementById('copy').addEventListener('click', ()=>{
  const txt = listEl.innerText; navigator.clipboard.writeText(txt).then(()=>alert('Copied shopping list'));
});
document.getElementById('download').addEventListener('click', ()=>{
  const a = document.createElement('a'); a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(listEl.innerText); a.download='shopping-list.txt'; a.click();
});

document.getElementById('load').addEventListener('click', async ()=>{
  if(!planSel.value) return;
  planData = await fetchJSON('./plans/'+planSel.value);
  loadPicks();
  renderSummary(); renderDays(); renderList();
});

(async()=>{
  const files = await loadPlansIndex();
  planSel.innerHTML = files.map(f=>`<option value="${f}">${f}</option>`).join('');
})();
</script>
