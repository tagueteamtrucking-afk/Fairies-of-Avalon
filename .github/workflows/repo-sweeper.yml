name: Repo Sweeper — Find version param redirects
on:
  workflow_dispatch:
    inputs:
      apply_fixes: { description: 'Comment out forced ?v= redirects in index.html', default: true, type: boolean }
      index_file:  { description: 'Index file to scan', default: 'index.html', type: string }
permissions: { contents: write }
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run sweeper
        shell: pwsh
        run: pwsh -File scripts/VersionParam-Sweeper.ps1 -ApplyFixes "${{ inputs.apply_fixes }}" -IndexFile "${{ inputs.index_file }}"
      - name: Commit changes (if any)
        if: ${{ inputs.apply_fixes == true }}
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html pages/diagnostics/version-scan.json || true
          if git diff --cached --quiet; then echo "No changes";
          else git commit -m "fix: neutralize forced ?v= redirects; add scan report" && git push; fi
      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with: { name: version-scan, path: pages/diagnostics/version-scan.json }
