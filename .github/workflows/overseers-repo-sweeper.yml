name: Overseers — Sweeper (propose-deletions PR)
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Sweeper (creates changes)
        shell: pwsh
        run: ./scripts/Repo-Sweeper-Used-Files.ps1 -CreateChanges
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Repo Sweeper: propose deletions"
          commit-message: "Repo Sweeper proposed deletions"
          branch: "sweeper/${{ github.run_id }}"
          body: "Auto-generated PR proposing safe deletions based on usage. Review before merge."
