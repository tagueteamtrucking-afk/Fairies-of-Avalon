name: Charlotte — AI Projects Crawler (GitHub sources)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1'   # weekly, Monday 11:00 UTC
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Write crawler script
        run: |
          $b64 = @'

'@
          New-Item -ItemType Directory -Force -Path scripts/charlotte | Out-Null
          [IO.File]::WriteAllBytes('scripts/charlotte/crawler.mjs',[Convert]::FromBase64String($b64))
      - name: Run crawler (GitHub API)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/charlotte/crawler.mjs
      - name: Commit results
        run: |
          git config user.name "Charlotte Bot"
          git config user.email "actions@users.noreply.github.com"
          git add pages/apps/charlotte/crawler/index.json || true
          git commit -m "Charlotte crawler: AI repos snapshot" || echo "Nothing to commit"
          git push || echo "Nothing to push"
