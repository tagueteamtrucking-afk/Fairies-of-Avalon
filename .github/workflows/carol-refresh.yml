name: Carol Refresh (shopping & report)
on: { workflow_dispatch: {} }
permissions:
  contents: write
  pull-requests: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build shopping data
        run: |
          node scripts/carol/build-shopping.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: carol-shopping
          path: |
            pages/apps/carol/shopping-quantized.json
            pages/apps/carol/plan-report.json
      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'carol: refresh shopping & report'
          title: 'carol: refresh shopping & report'
          branch: ci/carol-refresh-${{ github.run_id }}
          base: ${{ github.ref_name }}
