<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Billie · Revenue</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/app.css">
<style>body{margin:0}main{max-width:1000px;margin:28px auto;padding:0 12px}.pill{display:inline-block;padding:.35rem .7rem;border:1px solid #999;border-radius:.6rem;font-size:.9rem;text-decoration:none;color:inherit;background:#fff;margin-right:.4rem}.card{border:1px solid #eee;border-radius:.6rem;padding:14px;background:rgba(255,255,255,.85);margin-bottom:12px}</style></head>
<body><main>
<h1>Billie · Revenue</h1>
<p><a class="pill" href="/.github/workflows/billie-ledger.yml" target="_blank">Run: Aggregate Revenue</a></p>
<section class="card"><div id="out">Loading…</div></section>
</main>
<script type="module">
async function j(p){try{const r=await fetch(p+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return null; return await r.json();}catch{return null}}
const data=await j('/apps/billie/revenue.json');
const el=document.getElementById('out');
if(!data){ el.innerHTML='<small>No revenue file yet.</small>'; }
else{
  el.innerHTML = `<p><b>Total:</b> $${(data.total||0).toFixed(2)}</p>` + 
    (data.sources||[]).map(s=>`<div><b>${s.name}</b>: $${s.amount.toFixed(2)}</div>`).join('');
}
</script></body></html>
