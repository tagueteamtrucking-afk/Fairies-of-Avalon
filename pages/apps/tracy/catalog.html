<!doctype html><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Tracy — Assets Catalog</title><link rel='stylesheet' href='../../assets/css/avalon-bright.css'><header><div class='wrap'><h1>Tracy — Assets Catalog</h1><a class='pill' href='/index.html'>Home</a></div></header><main class='wrap'><div id='sum' class='muted'>Loading catalog.json…</div><table id='grid' class='table'></table></main><script type='module'>async function j(p){try{const r=await fetch(p+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return null;return await r.json()}catch{return null} } const data=await j('./catalog.json'); const sum=document.getElementById('sum'); const grid=document.getElementById('grid'); if(!data){ sum.textContent='No catalog yet. Run Tracy — Build Assets Catalog.';} else{ const rows=(data.models||[]).concat(data.wings||[]).concat(data.wallpapers||[]); sum.textContent=`models:${(data.models||[]).length} wings:${(data.wings||[]).length} wallpapers:${(data.wallpapers||[]).length}`; grid.innerHTML='<tr><th>type</th><th>path</th><th>bytes</th></tr>'+rows.slice(0,500).map(f=>`<tr><td>${f.type}</td><td>${f.path}</td><td>${f.bytes||''}</td></tr>`).join(''); }</script>
