name: Deploy Worker - tracy llm skin

on:
  workflow_dispatch: {}
  # push:
  #   branches: [ main ]
  #   paths:
  #     - "cloudflare/worker-tracy.js"
  #     - ".github/workflows/tracy-llm-skin.yml"

permissions:
  contents: read

concurrency:
  group: tracy-llm-skin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wrangler deploy
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WORKER_NAME: tracy-llm-skin
        run: |
          npm i -g wrangler
          wrangler deploy cloudflare/worker-tracy.js --name $WORKER_NAME
