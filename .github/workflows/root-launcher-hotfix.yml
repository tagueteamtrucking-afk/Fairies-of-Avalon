name: Root - Launcher Hotfix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write root launcher & kill-sw-boost
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages pages/apps
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Avalon — Launching…</title>
            <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
            <meta http-equiv="Pragma" content="no-cache">
            <meta http-equiv="Expires" content="0">
            <style>
              html,body{margin:0;height:100%;background:#0b1220;color:#e5e7eb;font-family:system-ui,Segoe UI,Roboto}
              main{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:12px}
              .btn{color:#e5e7eb;border:1px solid #334155;border-radius:10px;padding:8px 12px;text-decoration:none}
              .muted{opacity:.75;font-size:12px}
            </style>
          </head>
          <body>
          <main>
            <h1>🏰 Avalon</h1>
            <p class="muted">Launching City Plaza…</p>
            <p><a class="btn" id="fallback" href="/pages/plaza.html">Open City Plaza</a></p>
          </main>
          <script>
          (async function(){
            try{
              if('serviceWorker' in navigator){
                const regs = await navigator.serviceWorker.getRegistrations();
                for(const r of regs){ await r.unregister(); }
                if(window.caches){
                  const keys = await caches.keys();
                  for(const k of keys){ await caches.delete(k); }
                }
              }
            }catch(e){}
            const target = "/pages/plaza.html";
            const url = new URL(target, location.origin);
            url.searchParams.set("cb", Date.now().toString(36));
            location.replace(url.toString());
          })();
          </script>
          <noscript>
            <meta http-equiv="refresh" content="0; url=/pages/plaza.html">
          </noscript>
          </body>
          </html>
          HTML
          cp index.html pages/index.html
          cp index.html pages/apps/index.html
          cat > kill-sw-boost.html <<'HTML'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Kill SW — Boost</title>
            <style>
              body{background:#0b1220;color:#e5e7eb;font-family:system-ui,Segoe UI,Roboto;margin:0;padding:16px}
              pre{white-space:pre-wrap;word-break:break-word}
            </style>
          </head>
          <body>
            <h1>Service Worker & Cache Reset</h1>
            <pre id="log">Running…</pre>
            <script>
            (async()=>{
              const lines=[]; const log=(m)=>{lines.push(m); document.getElementById('log').textContent = lines.join("\n");};
              try{
                if('serviceWorker' in navigator){
                  const regs = await navigator.serviceWorker.getRegistrations();
                  for(const r of regs){ await r.unregister(); log("Unregistered SW: "+(r.scope||"(scope)")); }
                } else { log("No serviceWorker API"); }
                if(window.caches){
                  const keys = await caches.keys();
                  for(const k of keys){ await caches.delete(k); log("Cache deleted: "+k); }
                } else { log("No caches API"); }
              }catch(e){ log("Error: "+e); }
              log("Done. Reloading root…");
              setTimeout(()=>location.href="/?cb="+Date.now().toString(36), 800);
            })();
            </script>
          </body>
          </html>
          HTML
      - name: Commit launcher files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html pages/index.html pages/apps/index.html kill-sw-boost.html
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "fix(root): launcher + kill-sw-boost" && git push; fi
