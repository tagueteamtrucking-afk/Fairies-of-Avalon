<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alexandria — DM Voice</title><style>body{background:#0b0f17;color:#e5e7eb;font-family:system-ui,-apple-system,Segoe UI,Roboto;margin:0}main{max-width:900px;margin:0 auto;padding:14px}.card{background:#0f172a;border:1px solid #172033;border-radius:12px;padding:12px;margin-bottom:12px}.btn{padding:8px 10px;border:1px solid #334155;border-radius:10px;background:#0b1220;color:#e5e7eb;cursor:pointer}</style></head>
<body><main>
<h1>Alexandria — Voice DM</h1>
<div class="card"><h3>Speak</h3><div><textarea id="prompt" rows="3" placeholder="Describe the scene, ask to roll, set rules of magic, etc."></textarea></div><button class="btn" id="sendBtn">Send</button><audio id="ttsAudio" controls></audio></div>
<div class="card"><h3>Mic</h3><button class="btn" id="recBtn">Hold to record</button><input id="sttOut" placeholder="Transcript"/></div>
<div class="card"><h3>Log</h3><pre id="log"></pre></div>
</main>
<script>
const WORKER_BASE = localStorage.getItem('stella:worker') || 'https://YOUR-WORKER.SUBDOMAIN.workers.dev';
async function speak(text){ const r=await fetch(WORKER_BASE+'/tts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,voice:'alloy',model:'tts-1'})}); const b=await r.blob(); const u=URL.createObjectURL(b); const a=document.getElementById('ttsAudio'); a.src=u; a.play(); }
async function send(txt){ const sys='You are Alexandria, a patient Dungeon Master and worldbuilder. Keep strict notes, avoid railroading, respect safety tools. Ask clarifying questions. Format any dice outcomes like: [d20=14 → success].'; const r=await fetch(WORKER_BASE+'/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({model:'gpt-4o-mini',messages:[{role:'system',content:sys},{role:'user',content:txt}]})}); const j=await r.json(); const content=j.choices?.[0]?.message?.content||JSON.stringify(j); document.getElementById('log').textContent += '\nDM: '+content; speak(content); }
document.getElementById('sendBtn').onclick=()=>{ const t=document.getElementById('prompt').value.trim(); if(t){ document.getElementById('log').textContent += '\nYou: '+t; send(t);} };
let mediaStream, mediaRecorder, chunks=[]; const recBtn=document.getElementById('recBtn');
recBtn.onmousedown=recBtn.ontouchstart=async()=>{ try{ mediaStream=await navigator.mediaDevices.getUserMedia({audio:true}); chunks=[]; mediaRecorder=new MediaRecorder(mediaStream,{mimeType:'audio/webm'}); mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); }; mediaRecorder.onstop=async()=>{ const blob=new Blob(chunks,{type:'audio/webm'}); const fd=new FormData(); fd.append('file',blob,'audio.webm'); const r=await fetch(WORKER_BASE+'/stt',{method:'POST',body:fd}); const j=await r.json(); const text=j.text||''; document.getElementById('sttOut').value=text; document.getElementById('prompt').value=text; mediaStream.getTracks().forEach(tr=>tr.stop()); }; mediaRecorder.start(); recBtn.textContent='Recording…'; }catch(e){ alert('Mic error: '+e.message); } };
recBtn.onmouseup=recBtn.ontouchend=()=>{ if(mediaRecorder&&mediaRecorder.state==='recording'){ mediaRecorder.stop(); recBtn.textContent='Hold to record'; } };
</script></body></html>
