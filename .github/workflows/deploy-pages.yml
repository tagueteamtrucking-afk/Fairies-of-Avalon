name: "Deploy — GitHub Pages"

on:
  workflow_dispatch:
  push:
    paths:
      - 'pages/**'
      - 'processed/**'
      - 'memory-history/**'
      - 'CNAME'
      - '.nojekyll'
  workflow_run:
    workflows: ["Runner — Process Overseers Queue"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp -R pages/* site/
          # include root control files
          [ -f CNAME ] && cp CNAME site/CNAME || true
          [ -f .nojekyll ] && cp .nojekyll site/.nojekyll || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
