name: Actions Audit (list workflows & last runs)
on:
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: 'Hours back to inspect'
        required: true
        default: '48'
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Gather data via GitHub API
        id: gather
        uses: actions/github-script@v7
        with:
          script: |
            const hours = parseInt(core.getInput('lookback_hours') || '48', 10);
            const since = new Date(Date.now() - hours*60*60*1000).toISOString();
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const wfResp = await github.rest.actions.listRepoWorkflows({owner, repo, per_page: 200});
            const workflows = wfResp.data.workflows || [];
            const lines = [];
            for (const wf of workflows) {
              const runsResp = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id: wf.id, per_page: 10, created: `>=${since}`});
              const runs = runsResp.data.workflow_runs || [];
              const latest = runs[0];
              lines.push(`- **${wf.name}** (${wf.path}) → ` +
                (latest ? `*${latest.status}/${latest.conclusion}* ${latest.html_url}` : 'no runs in window') +
                `; runs=${runs.length}`);
            }
            const md = [
              `## Actions Audit (last ${hours}h)`,
              `Since: ${since}`,
              '',
              ...lines
            ].join('\n');
            core.setOutput('markdown', md);
      - name: Save report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          cat > audit/actions-audit.md << 'EOF'
          ${{ steps.gather.outputs.markdown }}
          EOF
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: actions-audit
          path: audit/actions-audit.md
          if-no-files-found: error
      - name: Create/Update issue with results
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const md = `${{ toJSON(steps.gather.outputs.markdown) }}`.slice(1,-1);
            const title = 'Actions Audit Report';
            const { data } = await github.rest.issues.listForRepo({owner, repo, state: 'open', labels: 'overseer'});
            const existing = data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({owner, repo, issue_number: existing.number, body: md});
            } else {
              await github.rest.issues.create({owner, repo, title, body: md, labels: ['overseer']});
            }
