<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Alexandria · NPC Codex</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/app.css" />
  <style>
    body{margin:0} main{max-width:1100px;margin:28px auto;padding:0 12px}
    .card{border:1px solid #eee;border-radius:.6rem;padding:14px;background:#fff;margin-bottom:12px}
    .pill{display:inline-block;padding:.35rem .7rem;border:1px solid #999;border-radius:.6rem;background:#fff;cursor:pointer}
    table{width:100%;border-collapse:collapse} th,td{border-bottom:1px solid #eee;padding:6px;text-align:left}
  </style>
</head>
<body>
<main>
  <h1>Alexandria · NPC Codex</h1>
  <div class="card">
    <a class="pill" href="/apps/alexandria/knowledge/choices.html">Choices Library</a>
    <a class="pill" href="/.github/workflows/alexandria-npc-codex.yml" target="_blank">Run: Build NPC Codex</a>
  </div>

  <div class="card">
    <label>NPCs:</label> <input id="count" type="number" min="1" max="40" value="12" style="width:90px"/>
    <button id="apply" class="pill">Apply</button>
    <table id="tab"><thead><tr><th>#</th><th>Name</th><th>Role</th><th>Faction</th><th>Traits (3)</th><th>🎲</th></tr></thead><tbody></tbody></table>
  </div>

  <div class="card">
    <button id="download" class="pill">Download npcs.json</button>
  </div>
</main>

<script type="module">
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
let roles=[], traits=[]; let rows=[];
async function j(u){ const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw 0; return r.json(); }
async function loadTax(){ try{ const t=await j('/apps/alexandria/knowledge/npc-taxonomy.json'); roles=t.roles||[]; traits=t.traits||[]; }catch{ roles=['Guide','Archivist']; traits=['pragmatic','curious','wry']; } }
function ensure(n){ while(rows.length<n) rows.push({ name:'', role:'', faction:'', traits:[] }); while(rows.length>n) rows.pop(); render(); }
function render(){
  const body=$("#tab tbody"); body.innerHTML = rows.map((r,i)=>`<tr>
    <td>${i+1}</td>
    <td><input data-i="${i}" data-f="name" placeholder="Name" value="${r.name||''}"/></td>
    <td><select data-i="${i}" data-f="role"><option value=""></option>${roles.map(x=>`<option ${r.role===x?'selected':''}>${x}</option>`).join('')}</select></td>
    <td><input data-i="${i}" data-f="faction" placeholder="Faction"/></td>
    <td><input data-i="${i}" data-f="traits" placeholder="comma-separated traits" value="${(r.traits||[]).join(', ')}"/></td>
    <td><button class="pill roll" data-i="${i}">🎲</button></td>
  </tr>`).join('');
  $$("#tab input, #tab select").forEach(el=> el.onchange = e => { const i=+e.target.dataset.i; const f=e.target.dataset.f; if(f==='traits'){ rows[i][f] = e.target.value.split(',').map(s=>s.trim()).filter(Boolean); } else { rows[i][f]=e.target.value; } });
  $$("#tab .roll").forEach(btn=> btn.onclick = ()=>{ const i=+btn.dataset.i; rows[i].role = roles[Math.floor(Math.random()*Math.max(1,roles.length))]||''; rows[i].traits = Array.from({length:3},()=> traits[Math.floor(Math.random()*Math.max(1,traits.length))]).filter(Boolean); render(); });
}
document.getElementById('apply').onclick=()=> ensure(Math.max(1, Math.min(40, +$("#count").value||12)));
document.getElementById('download').onclick=()=>{ const out={ id:'npcs-'+Date.now().toString(36), format_version:'1.0.0', npcs: rows }; const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'})); a.download='npcs.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href); };
await loadTax();
ensure(12);
</script>
</body>
</html>
