name: Overseers — Crossrepo Sweep
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout primary"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Guard: required config present"
        env:
          SECOND_REPO: ${{ vars.SECOND_REPO }}
          REPOS_READ_TOKEN: ${{ secrets.REPOS_READ_TOKEN }}
        run: |
          if [ -z "${REPOS_READ_TOKEN:-}" ] || [ -z "${SECOND_REPO:-}" ]; then
            echo "::error title=Missing configuration::Set repository secret REPOS_READ_TOKEN and repository variable SECOND_REPO (owner/repo)."
            exit 1
          fi

      - name: "Checkout secondary"
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SECOND_REPO }}
          token: ${{ secrets.REPOS_READ_TOKEN }}
          path: __second__
          fetch-depth: 1

      - name: "Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "Crossrepo sweep"
        run: node scripts/overseers/crossrepo-sweep.mjs
        env:
          SECOND_REPO_PATH: __second__
          OUTPUT_FILE: runtime/memory/crossrepo.json

      - name: "Commit memory index"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/memory/crossrepo.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Overseers: update crossrepo memory index"
            git push
          fi
