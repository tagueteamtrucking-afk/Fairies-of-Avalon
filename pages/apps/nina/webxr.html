<!doctype html>
<meta charset="utf-8">
<title>Nina — WebXR Room</title>
<link rel="stylesheet" href="../_shared/ui-lite.css">
<style>body{margin:0;background:#000;color:#eee;font-family:system-ui}#ui{position:fixed;top:12px;left:12px;z-index:10}.btn{padding:8px 12px;border:1px solid #444;border-radius:10px;background:#111;color:#eee}</style>
<div id="ui"><button id="enter" class="btn">Enter XR</button></div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/VRButton.js';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true}); renderer.setSize(innerWidth, innerHeight); renderer.xr.enabled = true;
document.body.appendChild(VRButton.createButton(renderer));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x101018);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, .1, 100); camera.position.set(0,1.6,3);
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1.2));
const floor = new THREE.Mesh(new THREE.PlaneGeometry(10,10), new THREE.MeshStandardMaterial({color:0x222233})); floor.rotation.x=-Math.PI/2; scene.add(floor);
const box = new THREE.Mesh(new THREE.BoxGeometry(.5,.5,.5), new THREE.MeshStandardMaterial({color:0x88ccff})); box.position.set(0,1.25,-1.2); scene.add(box);
addEventListener('resize', ()=>{ renderer.setSize(innerWidth, innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); });
renderer.setAnimationLoop(()=>{ box.rotation.y += .01; renderer.render(scene, camera); });
</script>
