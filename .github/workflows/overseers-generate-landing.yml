name: "Overseers — Generate Landing"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Generation mode"
        required: true
        default: "auto"
        type: choice
        options: [auto, fallback-only]

permissions:
  contents: write

jobs:
  generate-landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup PowerShell + YAML
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module powershell-yaml -Scope CurrentUser -Force -AllowClobber
          Import-Module powershell-yaml

      - name: Generate landing (LLM or deterministic)
        shell: pwsh
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          $ErrorActionPreference='Stop'
          $force = ("${{ github.event.inputs.mode }}" -eq "fallback-only")
          if ($force) {
            & "scripts/overseers/generate-landing.ps1" -RepoRoot "${{ github.workspace }}" -ForceFallback
          } else {
            & "scripts/overseers/generate-landing.ps1" -RepoRoot "${{ github.workspace }}"
          }

      - name: Commit landing artifacts
        shell: pwsh
        run: |
          git add "pages/themes/landing.generated.html" || echo "no html changes"
          git add "pages/themes/landing.generated.css"  || echo "no css changes"
          git add "pages/index.html"                    || echo "no index redirect changes"
          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"
          git fetch origin ${{ github.ref_name }} --prune
          git pull --rebase origin ${{ github.ref_name }} || echo "Nothing to rebase"
          git commit -m "Overseers: landing (mode=${{ github.event.inputs.mode }})" || echo "Nothing to commit"

      - name: Push
        uses: ad-m/github-push-action@77c5b412c50b723d2a4fbc6d71fb5723bcd439aa
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          force_with_lease: true
