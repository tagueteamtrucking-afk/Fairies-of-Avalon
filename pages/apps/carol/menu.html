<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carol — 14‑Day Menu</title>
<style>
  :root{--pad:16px;--max:960px}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;margin:0;padding:var(--pad);max-width:var(--max);margin-inline:auto;background:#f8f9fb}
  header{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
  h1{font-size:1.25rem;margin:0}
  .btn{display:inline-block;padding:8px 12px;border:1px solid #ddd;border-radius:8px;text-decoration:none;color:#111;background:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
  .card{background:#fff;border:1px solid #eee;border-radius:12px;padding:12px}
  .day{font-weight:600;margin:0 0 6px 0}
  .event{margin:8px 0}
  .name{font-weight:600}
  @media print{
    header,.btn{display:none !important}
    body{background:#fff}
    .grid{display:block}
    .card{page-break-after:always;break-after:page;margin:0;border:none}
  }
</style>
<header>
  <h1>Carol — 14‑Day Menu</h1>
  <div>
    <a class="btn" href="/pages/apps/carol/shopping.html">Shopping List</a>
    <button class="btn" onclick="window.print()">Print Menu</button>
  </div>
</header>
<section id="days" class="grid" aria-live="polite"></section>
<script type="module">
const state = { plan:null };
async function loadPlan(){
  const ptr = await fetch('/pages/apps/carol/index.json').then(r=>r.json());
  if(!ptr || !ptr.plan_latest) throw new Error('Pointer missing "plan_latest"');
  state.plan = await fetch('/'+ptr.plan_latest).then(r=>r.json());
  render();
}
function render(){
  const root = document.getElementById('days');
  root.innerHTML = '';
  for(const d of state.plan.days){
    const card = document.createElement('article');
    card.className='card';
    card.innerHTML = `<h2 class="day">${d.day_label}</h2>`;
    for(const e of d.events){
      const div = document.createElement('div');
      div.className='event';
      div.innerHTML = `<div class="name">${e.name}</div><div class="meta">${e.time_hint||''} • ${e.type}</div>`;
      card.appendChild(div);
    }
    root.appendChild(card);
  }
}
loadPlan().catch(err=>{
  document.getElementById('days').innerHTML = `<div class="card">Plan not found. Check <code>pages/apps/carol/index.json</code>.</div>`;
  console.error(err);
});
</script>
</html>
