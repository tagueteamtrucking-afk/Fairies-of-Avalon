name: Tracy — Wallpaper Index
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  idx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build wallpaper index
        shell: pwsh
        run: pwsh -File scripts/Tracy-Wallpaper-Index.ps1
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/tracy/wallpaper-index.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(tracy): wallpaper index" && git push; fi
