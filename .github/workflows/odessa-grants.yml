name: "Odessa — Build Grants List"
on: { workflow_dispatch: { inputs: { topic: { description: "Topic", required: true, default: "creative tech" }, mode: { description: "Mode", required: true, default: "auto", type: choice, options: ["auto","fallback-only"] } } } }
permissions: { contents: write }
jobs:
  grants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ github.ref }}, fetch-depth: 0 }
      - name: Build list
        shell: pwsh
        env: { OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} }
        run: |
          $force = ("${{ github.event.inputs.mode }}" -eq "fallback-only")
          & "scripts/overseers/odessa-grants.ps1" -RepoRoot "${{ github.workspace }}" -Topic "${{ github.event.inputs.topic }}" -ForceFallback:$force
      - name: Commit (if changed)
        shell: pwsh
        run: |
          git add -A "pages/apps/odessa/grants.json"
          $changes = git status --porcelain -- "pages/apps/odessa/grants.json"
          if ([string]::IsNullOrWhiteSpace($changes)) { Write-Host "Nothing to commit."; }
          else {
            git config user.email "actions@github.com"
            git config user.name  "GitHub Actions"
            git fetch origin ${{ github.ref_name }} --prune
            git pull --rebase origin ${{ github.ref_name }} || echo "Nothing to rebase"
            git commit -m "Odessa: grants list"
          }
      - name: Push
        uses: ad-m/github-push-action@77c5b412c50b723d2a4fbc6d71fb5723bcd439aa
        with: { github_token: ${{ secrets.GITHUB_TOKEN }}, branch: ${{ github.ref_name }}, force_with_lease: true }
