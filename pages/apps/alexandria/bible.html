<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Alexandria · Lore Bible Builder</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/app.css" />
  <style>
    body{margin:0} main{max-width:1100px;margin:28px auto;padding:0 12px}
    .card{border:1px solid #eee;border-radius:.6rem;padding:14px;background:#fff;margin-bottom:12px}
    .pill{display:inline-block;padding:.35rem .7rem;border:1px solid #999;border-radius:.6rem;background:#fff;cursor:pointer}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    textarea{min-height:100px;width:100%}
    select,input{width:100%}
    .fine{font-size:.9rem;color:#555}
  </style>
</head>
<body>
<main>
  <h1>Alexandria · Lore Bible Builder</h1>
  <div class="card">
    <a class="pill" href="/apps/alexandria/knowledge/choices.html">Choices Library</a>
    <a class="pill" href="/.github/workflows/alexandria-lore-bible.yml" target="_blank">Run: Build Lore Bible</a>
  </div>

  <div class="card">
    <div class="two">
      <div><label>Seed URL</label><input id="seedUrl" placeholder="/apps/alexandria/worlds/seed-....json"/></div>
      <div><button id="loadSeed" class="pill">Load</button></div>
    </div>
    <p id="seedInfo" class="fine">No seed loaded.</p>
  </div>

  <div class="card">
    <h3>Culture & Society</h3>
    <div class="two">
      <div><label>Cultures</label><select id="cultures" multiple size="6"></select></div>
      <div><label>Governments</label><select id="governments" multiple size="6"></select></div>
    </div>
    <div class="two">
      <div><label>Religions</label><select id="religions" multiple size="6"></select></div>
      <div><label>Languages</label><select id="languages" multiple size="6"></select></div>
    </div>
  </div>

  <div class="card">
    <h3>Magic & Economy</h3>
    <div class="two">
      <div><label>Magic Schools</label><select id="schools" multiple size="6"></select></div>
      <div><label>Magic Costs</label><select id="costs" multiple size="6"></select></div>
    </div>
    <div class="two">
      <div><label>Currencies</label><select id="currencies" multiple size="6"></select></div>
      <div><label>Materials</label><select id="materials" multiple size="6"></select></div>
    </div>
  </div>

  <div class="card">
    <h3>Palettes & Creatures</h3>
    <div class="two">
      <div><label>Color Palettes</label><select id="palettes" multiple size="6"></select></div>
      <div><label>Creatures</label><select id="creatures" multiple size="6"></select></div>
    </div>
  </div>

  <div class="card">
    <button id="roll" class="pill">🎲 Roll Selections</button>
    <button id="download" class="pill">Download bible.json</button>
  </div>
</main>

<script type="module">
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
let tax=null, seed=null;
async function j(u){ const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw 0; return r.json(); }
async function loadTax(){ tax = await j('/apps/alexandria/knowledge/bible-taxonomy.json'); ['cultures','governments','religions','languages','magic_schools','magic_costs','currencies','materials','color_palettes','creatures'].forEach(k=>{ const el = document.getElementById(k==='magic_schools'?'schools':k==='magic_costs'?'costs':k); if(!el) return; const arr = tax[k]||[]; el.innerHTML = arr.map(x=>`<option>${x}</option>`).join(''); }); }
function pick(arr,n){ const a=[...arr]; const out=[]; for(let i=0;i<Math.min(n,a.length);i++){ out.push(a.splice(Math.floor(Math.random()*a.length),1)[0]); } return out; }
function rollAll(){ const map={cultures:3,governments:2,religions:2,languages:3,schools:2,costs:2,currencies:2,materials:3,palettes:2,creatures:3}; Object.entries(map).forEach(([id,n])=>{ const el=document.getElementById(id); const arr=[...el.options].map(o=>o.value); const picks=pick(arr,n); [...el.options].forEach(o=>o.selected = picks.includes(o.value)); }); }
function current(sel){ return [...sel.selectedOptions].map(o=>o.value); }
function build(){
  return {
    id:'bible-'+Date.now().toString(36),
    seed_id: seed?.id||null,
    title: seed?.title||'World',
    format_version:'1.0.0',
    cultures: current($('#cultures')),
    governments: current($('#governments')),
    religions: current($('#religions')),
    languages: current($('#languages')),
    magic: { schools: current($('#schools')), costs: current($('#costs')) },
    economy: { currencies: current($('#currencies')), materials: current($('#materials')) },
    color_palettes: current($('#palettes')),
    creatures: current($('#creatures'))
  };
}
document.getElementById('roll').onclick = rollAll;
document.getElementById('download').onclick=()=>{ const b=build(); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(b,null,2)],{type:'application/json'})); a.download='bible.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href); };
document.getElementById('loadSeed').onclick=async()=>{ try{ seed = await j(document.getElementById('seedUrl').value.trim()); document.getElementById('seedInfo').textContent = `Loaded: ${seed.title} (${seed.id})`; }catch{ alert('Could not load seed'); } };
await loadTax();
</script>
</body>
</html>
