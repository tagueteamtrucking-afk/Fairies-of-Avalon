name: LLM Bootstrap Bundle (One-Click)
on:
  workflow_dispatch:
    inputs:
      crawl_url:
        description: 'Root URL to snapshot (e.g., https://fairiesofavalon.com)'
        required: true
        default: 'https://fairiesofavalon.com'
      crawl_depth:
        description: 'Crawl depth (1-3 is typical)'
        required: true
        default: '2'
permissions:
  contents: read
  actions: read
jobs:
  gather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq wget zip
      - name: Repo file list (sizes)
        run: |
          git ls-files -z | xargs -0 -I{} bash -lc 'printf "%s\t%s\n" "$(stat -c %s "{}")" "{}"' | sort -n > _repo_files_sizes.tsv
          jq -Rn '[inputs|split("\t")|{bytes:(.[0]|tonumber),path:.[1]}]|{generated:now,files:.}' < _repo_files_sizes.tsv > _repo_files_sizes.json
      - name: Workflows list + latest runs
        id: wf
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const wfs = await github.rest.actions.listRepoWorkflows({owner, repo, per_page: 200});
            const workflows = wfs.data.workflows || [];
            const out = [];
            for (const wf of workflows) {
              const runs = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id: wf.id, per_page: 1});
              const latest = runs.data.workflow_runs && runs.data.workflow_runs[0];
              out.push({
                id: wf.id, name: wf.name, path: wf.path, state: wf.state,
                latest: latest ? {status: latest.status, conclusion: latest.conclusion, url: latest.html_url, updated_at: latest.updated_at} : null
              });
            }
            require('fs').writeFileSync('_workflows.json', JSON.stringify({generated:(new Date()).toISOString(), workflows: out}, null, 2));
      - name: Cloudflare inventory
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p _cf
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo '{"warning":"CLOUDFLARE_API_TOKEN missing"}' > _cf/warning.json
          else
            curl -fsSL -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts" > _cf/workers.json || echo '{"error":"workers list failed"}' > _cf/workers.json
            curl -fsSL -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/filters" > _cf/filters.json || echo '{"error":"filters list failed"}' > _cf/filters.json
            curl -fsSL -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" > _cf/pages.json || echo '{"error":"pages list failed"}' > _cf/pages.json
          fi
      - name: Site crawl snapshot
        run: |
          root="${{ inputs.crawl_url }}"
          depth="${{ inputs.crawl_depth }}"
          mkdir -p _crawl
          wget --quiet --mirror --convert-links --adjust-extension --page-requisites --no-parent --level=$depth --directory-prefix=_crawl "$root" || true
      - name: Memory snapshot
        run: |
          if [ -f "Cody's Memory.yaml" ]; then cp "Cody's Memory.yaml" _memory.yaml; fi
      - name: Package
        run: |
          mkdir -p bundle
          mv _repo_files_sizes.tsv bundle/repo_files_sizes.tsv || true
          mv _repo_files_sizes.json bundle/repo_files_sizes.json || true
          mv _workflows.json bundle/workflows.json || true
          if [ -d _cf ]; then mv _cf bundle/cloudflare; fi
          if [ -d _crawl ]; then mv _crawl bundle/site; fi
          if [ -f _memory.yaml ]; then mv _memory.yaml bundle/Codys-Memory.yaml; fi
          (cd bundle && zip -r ../LLM-Bootstrap.zip .)
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LLM-Bootstrap
          path: LLM-Bootstrap.zip
