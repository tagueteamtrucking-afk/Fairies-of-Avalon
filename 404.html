<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting…</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;padding:24px;line-height:1.4}</style>
</head><body>
<h1>One moment…</h1>
<p>Fixing the link you followed.</p>
<script>
(function(){
  const p = location.pathname;
  let target = null;
  if(p.startsWith('/apps/')) target = '/pages' + p;
  if(p.startsWith('/rooms/')) target = '/pages' + p;
  if(!target){
    // Some pages live under /pages/apps/_city/ now
    if(p.endsWith('/plaza.html')) target = '/pages/apps/_city/index.html';
  }
  if(!target){ target = '/pages/apps/_city/index.html'; }
  location.replace(target + (location.search || '') + (location.hash || ''));
})();
</script>
<noscript><a href="/pages/apps/_city/index.html">Go to Avalon City</a></noscript>
</body></html>
