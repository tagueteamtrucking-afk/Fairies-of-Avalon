name: Jem: LLM Programs
on:
  workflow_dispatch:
    inputs:
      programs: { description: 'Programs', default: 2, type: number }
      target: { description: 'Automation target', default: 'site-automation', type: string }
jobs:
  jem-llm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate programs (Jem)
        env: { OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}, OPENAI_MODEL: ${{ vars.OPENAI_MODEL }} }
        shell: pwsh
        run: pwsh -File scripts/Jem-LLM-Programs.ps1 -ProgramsToGenerate ${{ inputs.programs }} -Target '${{ inputs.target }}'
      - name: Commit programs
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/jem/programs/
          if git diff --cached --quiet; then echo "No changes";
          else git commit -m "feat(jem): update programs"; git push; fi
