name: City — Link Prefix Patch
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rewrite /apps/ → /pages/apps/ in .html/.js
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Include *.html,*.js -Path .
          $changed = 0
          foreach($f in $files){
            $t = Get-Content $f.FullName -Raw
            $n = $t -replace '(?<!/pages)/apps/', '/pages/apps/'
            if($n -ne $t){
              Set-Content -NoNewline -Path $f.FullName -Value $n
              $changed++
            }
          }
          "Changed files: $changed"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "fix(city): rewrite /apps/* → /pages/apps/* to avoid 404 on GH Pages"
          branch: "city/prefix-patch-${{ github.run_id }}"
          title: "City: Prefix patch for app links"
          body: |
            Rewrites `/apps/` → `/pages/apps/` in HTML/JS so links resolve on GH Pages host.
