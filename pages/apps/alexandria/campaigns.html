<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Alexandria · Campaigns</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/app.css" />
  <style>
    body{margin:0} main{max-width:980px;margin:24px auto;padding:0 12px}
    .card{border:1px solid #eee;border-radius:.6rem;padding:14px;background:#fff;margin-bottom:12px}
    .pill{display:inline-block;padding:.35rem .7rem;border:1px solid #999;border-radius:.6rem;background:#fff;cursor:pointer}
    textarea{min-height:120px;width:100%}
    input,select{width:100%}
    table{width:100%;border-collapse:collapse} th,td{border-bottom:1px solid #eee;padding:6px;text-align:left}
  </style>
</head>
<body>
<main>
  <h1>Alexandria · Campaigns</h1>
  <div class="card">
    <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px">
      <input id="title" placeholder="Campaign title" />
      <select id="mode"><option>Single Player</option><option>Two Players (pass)</option></select>
      <input id="players" placeholder="Players (comma‑sep)" />
      <button id="add" class="pill">Add Campaign</button>
    </div>
  </div>
  <div class="card">
    <table id="tab"><thead><tr><th>Title</th><th>Mode</th><th>Players</th><th>Episodes</th></tr></thead><tbody></tbody></table>
  </div>
  <div class="card">
    <h3>Episode Editor</h3>
    <input id="epTitle" placeholder="Episode title" />
    <textarea id="epBeats" placeholder="Beat 1\nBeat 2\nBeat 3"></textarea>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
      <button id="addEp" class="pill">Add Episode</button>
      <button id="download" class="pill">Download Campaign.md</button>
    </div>
  </div>
</main>
<script type="module">
const $=s=>document.querySelector(s);
let DB = JSON.parse(localStorage.getItem('alex.campaigns')||'[]');
let idx=-1;

function render(){
  const body = document.querySelector('#tab tbody');
  body.innerHTML = DB.map((c,i)=>`<tr>
    <td><a href="#" data-i="${i}" class="open">${c.title}</a></td>
    <td>${c.mode}</td>
    <td>${(c.players||[]).join(', ')}</td>
    <td>${(c.episodes||[]).length}</td>
  </tr>`).join('');
  document.querySelectorAll('a.open').forEach(a=> a.onclick = (e)=>{ e.preventDefault(); idx=parseInt(a.dataset.i,10); alert('Opened '+DB[idx].title); });
}
render();

document.getElementById('add').onclick = ()=>{
  const c = { title: $('#title').value.trim()||'Campaign', mode: $('#mode').value, players: ($('#players').value||'').split(',').map(s=>s.trim()).filter(Boolean), episodes: [] };
  DB.push(c); localStorage.setItem('alex.campaigns', JSON.stringify(DB)); render();
};
document.getElementById('addEp').onclick = ()=>{
  if(idx<0){ alert('Open a campaign by clicking its title.'); return; }
  const ep = { title: $('#epTitle').value.trim()||'Episode', beats: ($('#epBeats').value||'').split('\n').map(s=>s.trim()).filter(Boolean) };
  DB[idx].episodes.push(ep); localStorage.setItem('alex.campaigns', JSON.stringify(DB)); render(); alert('Episode added.');
};
document.getElementById('download').onclick = ()=>{
  if(idx<0){ alert('Open a campaign first.'); return; }
  const c = DB[idx];
  let md = `# ${c.title}\n\nMode: ${c.mode}\nPlayers: ${(c.players||[]).join(', ')}\n\n---\n`;
  c.episodes.forEach((e,i)=>{ md += `\n## Episode ${i+1}: ${e.title}\n`; e.beats.forEach(b=> md += `- ${b}\n`); });
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'})); a.download=(c.title||'campaign')+'.md'; a.click(); URL.revokeObjectURL(a.href);
};
</script>
</body>
</html>
