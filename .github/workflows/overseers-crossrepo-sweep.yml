name: Overseers - Crossrepo Sweep
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sweep:
    if: ${{ (secrets.REPOS_READ_TOKEN != '') && (vars.SECOND_REPO != '') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout primary
        uses: actions/checkout@v4
      - name: Checkout second repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SECOND_REPO }}
          token: ${{ secrets.REPOS_READ_TOKEN }}
          path: second_repo
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan second repo and write index
        env:
          SECOND_REPO: ${{ vars.SECOND_REPO }}
        run: node scripts/overseers/crossrepo-scan.mjs
      - name: Commit index
        run: |
          git config user.name "Overseers Bot"
          git config user.email "actions@users.noreply.github.com"
          git add pages/apps/overseers/crossrepo/second_repo_index.json || true
          git commit -m "Overseers: crossrepo index from ${{ vars.SECOND_REPO }}" || echo "Nothing to commit"
          git push || echo "Nothing to push"
