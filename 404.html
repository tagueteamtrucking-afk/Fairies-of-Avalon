<!doctype html>
<meta charset="utf-8">
<title>Redirecting…</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto; background:#0b0f1a; color:#e6ecff; display:grid; place-items:center; height:100dvh; margin:0} .box{max-width:720px; padding:24px; border:1px solid rgba(255,255,255,.08); border-radius:12px; background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01))}</style>
<div class="box">
  <h1>Finding your way to Avalon…</h1>
  <p>If a link forgot its <code>/pages</code> prefix, we’ll fix it for you.</p>
  <p><a id="link" href="/pages/apps/_city/index.html">Go to the City</a></p>
</div>
<script>
(function() {
  try {
    var p = location.pathname;
    if (p.startsWith('/apps/')) { location.replace('/pages' + p + location.search + location.hash); return; }
    if (p.startsWith('/rooms/')) { location.replace('/pages' + p + location.search + location.hash); return; }
    if (p === '/pages/apps/_city' || p === '/pages/apps/_city/') { location.replace('/pages/apps/_city/index.html'); return; }
  } catch(e) {}
  location.replace('/pages/apps/_city/index.html');
})();
</script>
