name: Overseers — Memory Snapshot
on: { workflow_dispatch: {} }
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot Cody's Memory
        shell: pwsh
        run: |
          $src1 = "Cody's Memory.yaml"
          $src2 = "Cody's Memory.yml"
          if (Test-Path $src1) { $src = $src1 }
          elseif (Test-Path $src2) { $src = $src2 }
          else { Write-Error "No Cody's Memory file found"; exit 1 }
          $ts = (Get-Date).ToUniversalTime().ToString("yyyyMMddTHHmmssZ")
          $destDir = 'memory-history'
          New-Item -ItemType Directory -Path $destDir -Force | Out-Null
          Copy-Item -Path $src -Destination (Join-Path $destDir "$ts-Codys-Memory.yaml") -Force
      - name: Commit snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add memory-history/
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(memory): snapshot" && git push; fi
