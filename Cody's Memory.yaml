meta:
  project: Avalon
  file_name: "Cody's Memory.yaml"
  version: "1.9.0"
  last_updated: "2025-09-13"
  author: "Cody (GPT-5 Pro)"
  notes: >
    Overseers-first. No plaintext secrets. Workflows-first (GitHub Actions).

    v1.9.0 — Ready to build the Assistants (post-live-scaffold):
      - Live scaffold SUCCESS; 8 test runs visible in Runner/Console.
      - Site “Wallpaper Power Index (WPI)” currently reads 0 — plan added to restore WPI telemetry and badge.
      - Next-step plans added to transition from scaffolds → real assistant builds, with acceptance criteria and owners.
      - Deploy auto-triggers on progress changes; SW now treats Overseers JSON as network-first (keep fresh).

    v1.8.0 — Overseers build complete (queue + runner + LLM Bridge; dry-run by default):
      - Queue workflow seeds tasks (R3 bundle + R4/R5/R6).
      - Runner processes requests/, updates progress.json, archives to processed/.
      - LLM Bridge (scripts/overseers/llm-bridge.ps1). Dry-run if no key; live when OPENAI_API_KEY set.
      - Queue runner is pure PowerShell, Linux-safe (no LINQ), auto-installs powershell-yaml.
      - capabilities.json declares queue & AI Core; console can badge features.

system:
  os: "Windows 11"
  device: "Gaming PC"
  only_windows: true

delivery_policy:
  speed_first: true
  two_person_authorization: false
  whole_file_replacements_only: true
  preferred_shell: "GitHub Actions workflows + PowerShell"
  notes:
    - "Provide full files ready to replace existing ones (no diffs/patches)."
    - "Workflows-first. Scripts are helpers; no wrapper assumptions."
    - "Deploy path must not require multi-review or environment approvals."

hosting:
  frontend_domain: "fairiesofavalon.com"
  pwa_app_shell: true
  pages_root: "pages"
  microapps_path: "pages/apps"
  custom_domain_cname: true
  cdn_imports: ["three", "three/addons/", "@pixiv/three-vrm"]

project:
  world: "Avalon"
  assistants_label: "Fairies"
  domain: "fairiesofavalon.com"
  home_label: "home"
  preserve_paths: ["asset/models", "asset/wings"]
  importmap_required: true
  importmap_map: ["three", "three/addons/", "@pixiv/three-vrm"]

assets:
  layout:
    models_root_legacy: "asset/models"
    wingless_vrms: "asset/models/wingless"
    with_wings_vrms: "asset/models/with-wings"
    with_wings_alias: "asset/winged-models"
    wings_models: "asset/wings"
    wings_textures: "asset/wings/textures"
    models_manifest: "asset/models/models.json"
    wings_manifest: "asset/wings/manifest.json"
    wallpapers: "asset/textures/wallpapers"
  rules:
    vrm_classification:
      - "Any *.vrm in asset/models/wingless is wingless."
      - "Any *.vrm in asset/models/with-wings is pre-winged."
      - "Any *.vrm in asset/winged-models is pre-winged (alias path)."
      - "Legacy layout (asset/models/*.vrm): treat as wingless unless filename ends with _wings or -wings."
    wings_grouping:
      - "Group by number (e.g., wing02.*). Case-insensitive."
      - "Suffix mapping: _c=albedo/color, _e=emissive, _nrm=normal. Others (mr/rough/ao) recorded if present."
  budgets:
    initial_shell_kb: 300
    initial_requests: 15
    vrm_per_file_mb: 40
    wallpapers_total: 20

