name: Carol — Extract from Plan (safe alias)

on:
  workflow_dispatch:
    inputs:
      plan_path:
        description: 'Path to the canonical 14‑day plan JSON'
        required: true
        default: 'pages/apps/carol/plans/twoperson-2wk-unique-20251015T022300Z.json'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check plan exists
        shell: bash
        run: |
          set -e
          test -f "${{ github.event.inputs.plan_path }}" || { echo "Plan not found at ${{ github.event.inputs.plan_path }}"; exit 1; }

      - name: Create temporary alias expected by script
        shell: bash
        run: |
          set -e
          mkdir -p pages/apps/carol/plans
          cp "${{ github.event.inputs.plan_path }}" "pages/apps/carol/plans/twoperson-2wk-merged.json"

      - name: Run extractor (v3)
        shell: pwsh
        run: ./scripts/Carol-Extract-Shopping-v3.ps1

      - name: Remove alias
        shell: bash
        run: rm -f pages/apps/carol/plans/twoperson-2wk-merged.json

      - name: Commit shopping files
        shell: bash
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pages/apps/carol/plans/shopping-*.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Carol: extract shopping list from plan"
            git push
          else
            echo "No shopping changes to commit."
          fi

      - name: Upload shopping artifact
        uses: actions/upload-artifact@v4
        with:
          name: carol-shopping-json
          path: |
            pages/apps/carol/plans/shopping-*.json
          if-no-files-found: ignore
