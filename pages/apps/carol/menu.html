<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carol — 14‑Day Menu</title>
<style>
  :root{ --bg:#0b0f17; --ink:#e8ecf1; --stroke:rgba(255,255,255,0.12); --glass:rgba(255,255,255,0.04); --accent:#9cc1ff;}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  header{padding:16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--stroke);position:sticky;top:0;background:#0b0f17f2;backdrop-filter: blur(6px);}
  a.btn{color:var(--ink);text-decoration:none;border:1px solid var(--stroke);padding:8px 10px;border-radius:10px;font-weight:600}
  a.btn:hover{border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;padding:16px}
  .card{border:1px solid var(--stroke);background:var(--glass);border-radius:12px;padding:12px}
  .meta{opacity:.8;font-size:.95rem}
  h3{margin:4px 0 8px 0}
  ul{margin:0 0 8px 18px}
  .note{padding:10px;border:1px dashed var(--stroke);border-radius:10px;margin:12px}
</style>
</head>
<body>
<header>
  <a class="btn" href="/pages/apps/_city/index.html">🏰 City</a>
  <a class="btn" href="/pages/apps/carol/shopping.html">🛒 Shopping</a>
  <span class="meta" id="planMeta"></span>
</header>
<div id="status" class="note">Loading plan…</div>
<section id="days" class="grid" hidden></section>

<script>
const statusEl = document.getElementById('status');
const daysEl = document.getElementById('days');
const planMeta = document.getElementById('planMeta');

async function loadJSON(url){
  const r = await fetch(url + '?v=' + Date.now());
  if(!r.ok) throw new Error('HTTP ' + r.status + ' for ' + url);
  return r.json();
}

// Attempts to discover meals in a variety of shapes
function extractDays(plan){
  // Common shapes we might see:
  // plan.days = [{date, meals:[{name, items[]}]}] OR
  // plan.weeks = [{days:[...] }] OR
  // plan[0..13] = day objects
  let days = [];
  if(Array.isArray(plan.days)) days = plan.days;
  else if(Array.isArray(plan.weeks)) {
    for(const w of plan.weeks) if(Array.isArray(w.days)) days.push(...w.days);
  } else if(Array.isArray(plan)) { days = plan; }

  // Normalize each day -> { title, meals:[{label, text}] }
  const norm = [];
  let dnum = 1;
  for(const d of days){
    const entry = { title: d.title || d.date || ('Day ' + dnum++), meals: [] };
    if(Array.isArray(d.meals)){
      for(const m of d.meals){
        const label = m.label || m.name || m.type || 'Meal';
        const text = m.text || m.description || m.entry || m.item || m.recipe || m.title || JSON.stringify(m);
        entry.meals.push({label, text});
      }
    } else {
      // Look for common meal keys
      const keys = Object.keys(d);
      const guessKeys = ['breakfast','brunch','snack','lunch','dinner','supper','evening','dessert'];
      for(const k of guessKeys){
        if(d[k]) entry.meals.push({label: k[0].toUpperCase()+k.slice(1), text: (typeof d[k]==='string'?d[k]:JSON.stringify(d[k]))});
      }
      // Fallback: if there is a 'menu' array
      if(Array.isArray(d.menu)){
        for(const t of d.menu){ entry.meals.push({label:'Meal', text: (typeof t==='string'?t:JSON.stringify(t))}); }
      }
    }
    norm.push(entry);
  }
  return norm;
}

(async () => {
  try{
    let idx;
    try { idx = await loadJSON('./index.json'); } catch(e){ idx = {}; }
    const defaultPlan = 'plans/twoperson-2wk-unique-20251015T022300Z.json';
    const planPath = idx.current_plan || idx.plan || defaultPlan;
    planMeta.textContent = 'Plan: ' + planPath;
    const plan = await loadJSON(planPath);
    const normDays = extractDays(plan);
    if(!normDays.length) throw new Error('Could not find days/meals in the plan data.');
    statusEl.remove();
    daysEl.hidden = false;
    // render
    for(const d of normDays){
      const card = document.createElement('article'); card.className='card';
      const h = document.createElement('h3'); h.textContent = d.title; card.appendChild(h);
      const ul = document.createElement('ul');
      for(const m of d.meals){
        const li = document.createElement('li');
        li.innerHTML = '<strong>' + m.label + ':</strong> ' + m.text;
        ul.appendChild(li);
      }
      card.appendChild(ul);
      daysEl.appendChild(card);
    }
  }catch(err){
    statusEl.innerHTML = '⚠️ ' + err.message + '<br>Check that the plan JSON exists and is valid.';
  }
})();
</script>
</body>
</html>
