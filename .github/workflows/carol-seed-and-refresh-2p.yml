name: Carol - Seed 14d Plan & Refresh (2-person)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seed_refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure plan dir
        shell: bash
        run: mkdir -p pages/apps/carol/plans
      - name: Seed 14-day plan with shopping
        shell: pwsh
        run: |
          $plan = @{
            menu = @{
              days = @()
              shopping = @(
                @{ name="peanut butter"; qty=14; unit="tbsp" },
                @{ name="hummus"; qty=24; unit="tbsp" },
                @{ name="white rice"; qty=6; unit="cups" },
                @{ name="rolled oats"; qty=10; unit="cups" },
                @{ name="eggs"; qty=24; unit="ct" },
                @{ name="chicken breast"; qty=80; unit="oz" },
                @{ name="frozen mixed vegetables"; qty=64; unit="oz" },
                @{ name="frozen berries"; qty=32; unit="oz" },
                @{ name="olive oil"; qty=8; unit="tbsp" },
                @{ name="rice cakes"; qty=28; unit="ct" },
                @{ name="whole wheat bread"; qty=28; unit="ct" },
                @{ name="tortillas"; qty=12; unit="ct" },
                @{ name="low sodium broth"; qty=64; unit="fl oz" },
                @{ name="panko breadcrumbs"; qty=8; unit="oz" },
                @{ name="canned black beans"; qty=2; unit="ct" },
                @{ name="canned chickpeas"; qty=2; unit="ct" },
                @{ name="lactose free milk"; qty=128; unit="fl oz" },
                @{ name="lf yogurt"; qty=32; unit="oz" },
                @{ name="spinach"; qty=20; unit="oz" },
                @{ name="spring mix"; qty=16; unit="oz" },
                @{ name="romaine"; qty=3; unit="ct" }
              )
            }
          }
          for($i=1; $i -le 14; $i++){ $plan.menu.days += @{ day=$i; note="seeded" } }
          $out = "pages/apps/carol/plans/plan-14d-seeded.json"
          $dir = Split-Path -Parent $out; if(-not (Test-Path $dir)){ New-Item -ItemType Directory -Force -Path $dir | Out-Null }
          $json = $plan | ConvertTo-Json -Depth 8
          [IO.File]::WriteAllText($out, $json, [Text.Encoding]::UTF8)
          Write-Host "Seeded plan at $out"
      - name: Extract shopping list v3
        shell: pwsh
        run: pwsh -File scripts/Carol-Extract-Shopping-v3.ps1 -PlansDir "pages/apps/carol/plans" -OutFile "pages/apps/carol/plans/shopping-extracted.json"
      - name: Aggregate into US packages (2 persons)
        shell: pwsh
        run: pwsh -File scripts/Carol-Aggregate-Packages-v2.ps1 -PlansDir "pages/apps/carol/plans" -PackageMap "pages/apps/carol/packages/us.json" -OutFile "pages/apps/carol/plans/shopping-quantized.json" -Persons 2
      - name: Build Carol pointer
        shell: pwsh
        run: pwsh -File scripts/Carol-Build-Pointer.ps1 -PlansDir "pages/apps/carol/plans" -OutFile "pages/apps/carol/index.json"
      - name: Commit Carol outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/carol/index.json                  pages/apps/carol/plans/plan-14d-seeded.json                  pages/apps/carol/plans/shopping-extracted.json                  pages/apps/carol/plans/shopping-quantized.json || true
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(carol): seed + refresh (2p)" && git push; fi
