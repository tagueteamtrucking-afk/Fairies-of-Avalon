<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fairies of Avalon</title>
<style>
  :root{--bg:#0b0f1a;--fg:#e6ecff;--accent:#8fb8ff;--tile:#141b2d;--tile2:#101624;--muted:#9fb3d1}
  *{box-sizing:border-box} html,body{margin:0;height:100%} body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial; background:radial-gradient(1200px 800px at 70% -10%,#1a2440 0%,#0b0f1a 60%,#060913 100%); color:var(--fg)}
  .wrap{min-height:100dvh; display:grid; place-items:center; padding:40px}
  .card{max-width:820px; width:100%; background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01)); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:32px; box-shadow:0 10px 30px rgba(0,0,0,.4)}
  h1{font-weight:700; letter-spacing:.3px; margin:0 0 8px; font-size:clamp(28px,5vw,40px)}
  p{margin:0 0 16px; color:var(--muted); line-height:1.5}
  .cta{margin-top:18px; display:flex; gap:12px; flex-wrap:wrap}
  .btn{appearance:none; border:none; background:var(--tile); color:var(--fg); padding:14px 18px; border-radius:12px; font-weight:600; text-decoration:none; display:inline-flex; align-items:center; gap:10px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  .btn:hover{background:var(--tile2)}
  .note{font-size:13px; color:#9bb1d4}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Fairies of Avalon</h1>
      <p>Enter the city. Each building is a room with living tools: Bistro (Carol), Dojo (Jem), Observatory (Stella), Library (Alexandria), Cathedral Studio (Tracy), and more.</p>
      <div class="cta">
        <a class="btn" href="/pages/apps/_city/index.html">🏙️ Enter Avalon City</a>
        <a class="btn" href="/kill-sw.html">🧹 Reset App Cache</a>
      </div>
      <p class="note">Hint: if you ever hit a 404, this site auto-redirects to the city.</p>
    </div>
  </div>
</body>
</html>
