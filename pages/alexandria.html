<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alexandria – Stories & Spells</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="alexandria-inside">
  <div class="wrap">
    <h1 class="heading">Alexandria</h1>
    <p class="lead">Storyteller &amp; multiverse builder. Alexandria curates tales from across Avalon and beyond.</p>
    <p>This tool allows you to generate whimsical stories from your own conversation prompts. Enter a short description of a chat or an idea and Alexandria will spin it into a tale.</p>
    <label for="prompt"><strong>Conversation / prompt:</strong>
      <textarea id="prompt" rows="4" placeholder="Describe your conversation or idea..."></textarea>
    </label>
    <button id="generate-story">Generate Story</button>
    <div id="story-output" style="margin-top:1rem;"></div>
    <p><a href="../index.html">← back to home</a></p>
  </div>
  <script>
    // Story generation based on a simple template. Without external AI services
    // we create a fun narrative by weaving the user prompt into a generic
    // Avalon adventure. Further enhancements could randomise characters or settings.
    document.getElementById('generate-story').addEventListener('click', () => {
      const prompt = document.getElementById('prompt').value.trim();
      const output = document.getElementById('story-output');
      if (!prompt) {
        output.textContent = 'Please describe a conversation or idea to inspire a story.';
        return;
      }
      // Basic story template: wrap the prompt in a fairy tale.
      const opening = 'Once upon a time in the realms of Avalon, ';
      const challenge = 'faced a curious challenge: ' + prompt + '. ';
      const journey = 'With the help of wise fairies and a sprinkle of magic, our heroes navigated forests, halls and hidden kitchens. ';
      const resolution = 'In the end they discovered that understanding and kindness solved the problem better than spells. ';
      const closing = 'And so, another story was added to Alexandria’s ever‑growing chronicle of adventures.';
      output.textContent = opening + challenge + journey + resolution + closing;
    });
  </script>
</body>
</html>
