name: "Overseers — YAML Gate"

on:
  push:
    paths:
      - "**/*.yml"
      - "**/*.yaml"
      - "Cody's Memory.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  yaml-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup PowerShell + YAML
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module powershell-yaml -Scope CurrentUser -Force -AllowClobber
          Import-Module powershell-yaml

      - name: Validate all YAML (never hard-fail)
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          & "scripts/overseers/validate-yaml.ps1" -RepoRoot "${{ github.workspace }}" -WriteReport
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning:: YAML issues detected, attempting auto-restore for Memory" }

      - name: Auto-restore Memory if broken
        shell: pwsh
        run: |
          $root="${{ github.workspace }}"
          $reportPath = Join-Path $root "pages/apps/overseers/yaml-report.json"
          if (Test-Path $reportPath) {
            $rep = Get-Content -Raw -Path $reportPath | ConvertFrom-Json
            if ($rep.memory_status -eq "restored") {
              git add "Cody's Memory.yaml" "memory-history" "pages/apps/overseers/yaml-report.json" || echo "no changes"
              git config user.email "actions@github.com"
              git config user.name  "GitHub Actions"
              git fetch origin ${{ github.ref_name }} --depth=0
              git pull --rebase origin ${{ github.ref_name }} || echo "Nothing to rebase"
              git commit -m "YAML Gate: auto-restored Memory from snapshot" || echo "Nothing to commit"
            }
          }

      - name: Push (if restored)
        uses: ad-m/github-push-action@77c5b412c50b723d2a4fbc6d71fb5723bcd439aa
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          force_with_lease: true
