name: Carol — Extract Shopping (from chosen plan)

on:
  workflow_dispatch:
    inputs:
      plan_path:
        description: 'Path to the plan to copy to twoperson-2wk-merged.json'
        required: true
        default: 'pages/apps/carol/plans/twoperson-2wk-unique-20251015T022300Z.json'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy plan to alias expected by script
        shell: bash
        run: |
          set -e
          PLAN="${{ github.event.inputs.plan_path }}"
          if [ ! -f "$PLAN" ]; then
            echo "Plan not found: $PLAN"; exit 1
          fi
          cp "$PLAN" pages/apps/carol/plans/twoperson-2wk-merged.json

      - name: Run extractor (PowerShell)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Carol-Extract-Shopping-v3.ps1

      - name: Commit results
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/apps/carol/plans/twoperson-2wk-merged.json pages/apps/carol/plans/shopping-extracted.json pages/apps/carol/plans/shopping-quantized.json
          git commit -m "Carol: extract shopping from selected plan" || echo "No changes to commit"
          git push

      - name: Upload shopping artifact
        uses: actions/upload-artifact@v4
        with:
          name: carol-shopping
          path: |
            pages/apps/carol/plans/shopping-extracted.json
            pages/apps/carol/plans/shopping-quantized.json
