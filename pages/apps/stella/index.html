<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Stella · Sound & Sessions</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/app.css">
<style>body{margin:0}main{max-width:1000px;margin:28px auto;padding:0 12px}.pill{display:inline-block;padding:.35rem .7rem;border:1px solid #999;border-radius:.6rem;font-size:.9rem;text-decoration:none;color:inherit;background:#fff;margin-right:.4rem}.card{border:1px solid #eee;border-radius:.6rem;padding:14px;background:rgba(255,255,255,.85);margin-bottom:12px}</style></head>
<body><main>
<h1>Stella · Sound & Sessions</h1>
<p><a class="pill" href="/.github/workflows/stella-sessions.yml" target="_blank">Run: Build Sessions</a></p>
<section class="card"><h2>Ambient</h2>
<p><button id="play" class="pill">Play Space Ambience</button> <button id="stop" class="pill">Stop</button></p></section>
<section class="card"><h2>Guided Sessions</h2><div id="list">Loading…</div></section>
</main>
<script type="module">
let ctx, osc, noise, gain;
document.getElementById('play').onclick=()=>{
  if (!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)();
  gain = ctx.createGain(); gain.gain.value=0.05; gain.connect(ctx.destination);
  // Space ambience: pink-ish noise + slow oscillator
  const buffer = ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i=0;i<data.length;i++){ data[i] = (Math.random()*2-1) * (1/(1+i/data.length)); }
  noise = ctx.createBufferSource(); noise.buffer = buffer; noise.loop = true; noise.connect(gain); noise.start();
  osc = ctx.createOscillator(); osc.type='sine'; osc.frequency.value=40; const lfo = ctx.createOscillator(); lfo.frequency.value=0.1;
  const lfoGain = ctx.createGain(); lfoGain.gain.value=30; lfo.connect(lfoGain).connect(osc.frequency); osc.connect(gain); osc.start(); lfo.start();
};
document.getElementById('stop').onclick=()=>{ try{noise.stop();osc.stop();}catch{} };
async function j(p){try{const r=await fetch(p+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return null; return await r.json();}catch{return null}}
const sess=await j('/apps/stella/sessions.json');
const el=document.getElementById('list');
if(!sess){ el.innerHTML='<small>No sessions yet.</small>'; }
else{ el.innerHTML = sess.map(s=>`<div class="card"><b>${s.title}</b><p>${s.script}</p></div>`).join(''); }
</script>
</body></html>
