name: Jem — Generate Week 1 Plans
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate plans
        shell: pwsh
        run: pwsh -File scripts/Jem-Week1-Plan.ps1 -InputDir "pages/apps/jem/intake" -OutputDir "pages/apps/jem/programs"
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/jem/programs/*
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "feat(jem): week1 plans + nutrition handoff" && git push; fi
