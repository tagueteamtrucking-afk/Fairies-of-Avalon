<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carol — Shopping List</title>
  <link rel="stylesheet" href="./print.css" />
</head>
<body>
  <header class="app">
    <h1>Shopping List</h1>
    <div class="small" id="assumptions"></div>
    <div class="actions">
      <button id="btnPrint">Print / Save PDF</button>
      <a class="button" href="./print-shopping.html" target="_blank">Open Print Page</a>
      <button id="btnToggleUnits" title="Toggle produce units between lbs and original">Toggle Produce Units</button>
    </div>
  </header>
  <main id="out"></main>
<script>
document.getElementById('btnPrint').onclick = ()=>window.print();
let PRODUCE_IN_LBS = true;

(async function(){
  const OATS_G_PER_CUP = 81;   // approximation used for shopping conversion
  const TBSP_PER_CUP   = 16;
  const OZ_PER_LB      = 16;

  const TBSP_TO_OZ = {
    'Cream cheese, lactose‑free': 0.5, // ~2 tbsp per oz
    'Hummus (no cumin)': 0.5          // ~2 tbsp per oz
  };

  // Conservative shopping approximations for produce
  const PRODUCE_APPROX = {
    piece_lb: 0.33,  // 1 medium fruit ≈ 0.33 lb
    cup_lb:   0.40   // 1 cup chopped ≈ 0.40 lb
  };

  function el(tag, attrs={}, children=[]){
    const n=document.createElement(tag);
    for(const [k,v] of Object.entries(attrs)){ if(k==='class') n.className=v; else n.setAttribute(k,v); }
    for(const c of [].concat(children)){ n.appendChild(typeof c==='string'? document.createTextNode(c) : c); }
    return n;
  }

  async function getPlanPath(){
    const idxRes = await fetch('./index.json', { cache:'no-store' });
    if(!idxRes.ok) throw new Error('index.json not found');
    const idx = await idxRes.json();
    if(!idx.plan) throw new Error('index.json missing "plan"');
    return idx.plan.startsWith('/') ? idx.plan.replace(/^\//,'') : idx.plan;
  }

  function canonicalize(name){
    const rules = [
      [/^mixed vegetables.*frozen|^frozen mixed vegetables/i, ['Mixed vegetables, frozen','Frozen']],
      [/^frozen veg medley/i, ['Mixed vegetables, frozen','Frozen']],
      [/^lactose[-\s]?free greek yogurt|^LF greek yogurt/i, ['Greek yogurt, lactose‑free','Dairy']],
      [/^lactose[-\s]?free cottage cheese/i, ['Cottage cheese, lactose‑free','Dairy']],
      [/^lactose[-\s]?free milk/i, ['Milk, lactose‑free','Dairy']],
      [/^lactose[-\s]?free mozzarella\b/i, ['Mozzarella, lactose‑free','Dairy']],
      [/^lactose[-\s]?free cheese stick/i, ['Mozzarella, lactose‑free','Dairy']],
      [/^lf cream cheese|^lactose[-\s]?free cream cheese/i, ['Cream cheese, lactose‑free','Dairy']],
      [/^soft whole[-\s]?grain bread|^whole[-\s]?grain bread/i, ['Whole‑grain bread (soft)','Grains & Bakery']],
      [/^soft whole[-\s]?wheat tortilla|^soft whole[-\s]?wheat/i, ['Whole‑wheat tortillas (soft)','Grains & Bakery']],
      [/^rice cakes/i, ['Rice cakes','Grains & Bakery']],
      [/^brown rice \(microwave pouch\)/i, ['Brown rice (cooked, pouch)','Grains & Bakery']],
      [/^rolled oats/i, ['Rolled oats','Grains & Bakery']],
      [/^panko \(light\)/i, ['Panko breadcrumbs (light)','Pantry']],
      [/^hummus \(no cumin\)/i, ['Hummus (no cumin)','Deli']],
      [/^olive oil spray/i, ['Olive oil (spray)','Pantry & Condiments']],
      [/^olive oil\b/i, ['Olive oil','Pantry & Condiments']],
      [/^garlic powder/i, ['Garlic powder','Pantry & Condiments']],
      [/^vanilla extract/i, ['Vanilla extract','Pantry & Condiments']],
      [/^lemon juice$/i, ['Lemon juice','Pantry & Condiments']],
      [/^cinnamon/i, ['Cinnamon','Pantry & Condiments']],
      [/^ground flaxseed/i, ['Ground flaxseed','Pantry & Condiments']],
      [/^low-sodium tomato soup/i, ['Tomato soup (low‑sodium)','Canned']],
      [/^diced tomatoes \(no salt added\)/i, ['Diced tomatoes (no salt)','Canned']],
      [/^low-sodium beans \(canned\)/i, ['Beans (canned, low‑sodium)','Canned']],
      [/^canned tuna/i, ['Tuna (canned, in water)','Canned']],
      [/^canned chicken/i, ['Chicken (canned)','Canned']],
      [/^butter lettuce/i, ['Butter lettuce','Produce']],
      [/^spinach/i, ['Spinach','Produce']],
      [/^cucumber/i, ['Cucumber','Produce']],
      [/^steamed carrots|^carrots/i, ['Carrots','Produce']],
      [/^tomato\b/i, ['Tomatoes','Produce']],
      [/^grapes/i, ['Grapes','Produce']],
      [/^banana/i, ['Bananas','Produce']],
      [/^pear/i, ['Pears','Produce']],
      [/^peach/i, ['Peaches (canned in juice)','Canned']],
      [/^pineapple \(canned in juice, drained\)|^pineapple \(frozen\)/i, ['Pineapple (frozen/juice, drained)','Frozen/Canned']],
      [/^mango \(frozen\)/i, ['Mango (frozen)','Frozen']],
      [/^kiwi/i, ['Kiwis','Produce']],
      [/^avocado/i, ['Avocados','Produce']],
      [/^egg whites/i, ['Egg whites (carton)','Dairy']],
      [/^egg\b/i, ['Eggs','Dairy']],
      [/^relish \(low-sugar\)/i, ['Relish (low‑sugar)','Pantry & Condiments']],
      [/^soft pita/i, ['Pita (soft)','Grains & Bakery']],
      [/^baby potatoes|^potatoes/i, ['Baby potatoes','Produce']],
      [/^lemon$/i, ['Lemons','Produce']],
      [/^chicken breast/i, ['Chicken breast','Protein']],
      [/^cooked chicken breast/i, ['Chicken breast (cooked/diced)','Protein']],
      [/^lean ground turkey|^turkey meatballs/i, ['Ground turkey, lean','Protein']],
      [/^turkey breast \(low-sodium\)/i, ['Turkey breast, sliced (low‑Na)','Deli']],
      [/^salmon fillet/i, ['Salmon fillet','Protein']],
      [/^cod fillet/i, ['Cod fillet','Protein']],
      [/^low-sodium crackers/i, ['Crackers (low‑sodium)','Grains & Bakery']],
    ];
    for(const [re,[canon,aisle]] of rules){ if(re.test(name)) return { name:canon, aisle }; }
    return { name, aisle:'Other' };
  }

  function asCups(qty, unit){ if(unit==='cup') return qty; if(unit==='tbsp') return qty/16; return null; }

  function convertForShopping(name, aisle, entry){
    const meats = new Set(['Chicken breast','Chicken breast (cooked/diced)','Salmon fillet','Cod fillet','Ground turkey, lean','Turkey breast, sliced (low‑Na)','Mozzarella, lactose‑free']);
    const dairyLiquids = new Set(['Milk, lactose‑free','Greek yogurt, lactose‑free','Cottage cheese, lactose‑free']);
    const tbspToOz = TBSP_TO_OZ[name];

    // 1) Special conversions
    if(name==='Rolled oats'){
      let cups = (asCups(entry.qty, entry.unit) || 0) + entry.details.reduce((s,d)=>s+(asCups(d.amount,d.unit)||0),0);
      const grams = cups * OATS_G_PER_CUP;
      const oz = grams / 28.35;
      if(oz >= OZ_PER_LB) return { qty:+(oz/OZ_PER_LB).toFixed(2), unit:'lb', note:`≈ ${grams.toFixed(0)} g (${oz.toFixed(1)} oz)` };
      return { qty:+oz.toFixed(1), unit:'oz', note:`≈ ${grams.toFixed(0)} g` };
    }

    if(tbspToOz){
      // Cream cheese & Hummus in ounces
      let oz = 0;
      if(entry.unit==='tbsp') oz += entry.qty * tbspToOz;
      for(const d of entry.details){ if(d.unit==='tbsp') oz += d.amount * tbspToOz; }
      if(entry.unit==='oz') oz += entry.qty;
      for(const d of entry.details){ if(d.unit==='oz') oz += d.amount; }
      if(oz) return { qty:+oz.toFixed(1), unit:'oz', note:'' };
    }

    if(dairyLiquids.has(name)){
      let cups = (asCups(entry.qty, entry.unit) || 0) + entry.details.reduce((s,d)=>s+(asCups(d.amount,d.unit)||0),0);
      if(cups >= 16) return { qty:+(cups/16).toFixed(2), unit:'gal', note:`(~${cups.toFixed(1)} cups)` };
      if(cups >= 4)  return { qty:+(cups/4).toFixed(2), unit:'qt',  note:`(~${cups.toFixed(1)} cups)` };
      return { qty:+cups.toFixed(1), unit:'cup', note:'' };
    }

    if(meats.has(name)){
      let oz = (entry.unit==='oz'? entry.qty : 0) + entry.details.reduce((s,d)=>s+(d.unit==='oz'? d.amount:0),0);
      if(oz){ return oz >= OZ_PER_LB ? { qty:+(oz/OZ_PER_LB).toFixed(2), unit:'lb', note:`(${oz.toFixed(0)} oz)` } : { qty:+oz.toFixed(1), unit:'oz', note:'' }; }
    }

    // 2) Produce in lbs (estimate), with toggle
    if(aisle==='Produce'){
      // Sum base unit first
      let lb = 0, descs=[];
      if(entry.unit==='piece'){ lb += entry.qty * PRODUCE_APPROX.piece_lb; descs.push(`${entry.qty} piece(s)`); }
      if(entry.unit==='cup'){   lb += entry.qty * PRODUCE_APPROX.cup_lb;   descs.push(`${entry.qty} cup(s)`); }
      for(const d of entry.details){
        if(d.unit==='piece'){ lb += d.amount * PRODUCE_APPROX.piece_lb; descs.push(`${d.amount} piece(s)`); }
        if(d.unit==='cup'){   lb += d.amount * PRODUCE_APPROX.cup_lb;   descs.push(`${d.amount} cup(s)`); }
      }
      if(PRODUCE_IN_LBS){
        return { qty:+lb.toFixed(2), unit:'lb (est)', note: descs.length? `from ${descs.join(' + ')}` : 'estimate' };
      } else {
        // show original unit merged best-effort
        return { qty:+entry.qty.toFixed(2), unit:(entry.unit||'').trim()||'piece', note: entry.details.length? 'contains mixed units' : '' };
      }
    }

    // 3) Default: keep primary unit and mention mixed
    return { qty:+entry.qty.toFixed(2), unit:(entry.unit||'').trim(), note: entry.details.length? 'contains mixed units' : '' };
  }

  const out = document.getElementById('out');
  const assumptions = document.getElementById('assumptions');
  assumptions.textContent = 'Produces totals scaled for plan persons. Produce shown in lb (estimated): 1 piece ≈ 0.33 lb; 1 cup chopped ≈ 0.40 lb. Cream cheese & hummus shown in oz.';

  try{
    const planPath = await getPlanPath();
    const planRes  = await fetch('../..' + '/' + planPath.replace(/^pages\//,''), { cache:'no-store' });
    if(!planRes.ok){ out.innerHTML = '<p>Plan not found. <a href="#">Add File</a></p>'; return; }
    const plan = await planRes.json();
    const personsCount = Array.isArray(plan.persons) ? plan.persons.length : 2;

    const map = new Map(); // key -> { name, aisle, qty, unit, details:[] }
    for(const day of (plan.days||[])){
      for(const evt of (day.events||[])){
        const who = (evt.for||'').toLowerCase().trim();
        let mult = personsCount;
        if(who==='a' || who.includes('ray')) mult = 1;
        else if(who==='b' || who.includes('blanca')) mult = 1;
        else if(who==='both' || who==='all' || who==='a+b' || who==='a & b') mult = personsCount;
        else if(!who) mult = personsCount;

        for(const it of (evt.items||[])){
          const srcName = (it.ingredient||'').trim();
          if(!srcName) continue;
          const { name, aisle } = canonicalize(srcName);
          const key = name.toLowerCase();
          const q = Number(it.quantity)||0;
          const unit = (it.unit||'').trim();

          const entry = map.get(key) || { name, aisle, qty:0, unit: unit || '', details:[] };
          if(entry.unit === unit || !entry.unit){ entry.unit = unit || entry.unit; entry.qty += q*mult; }
          else { entry.details.push({ amount: q*mult, unit }); }
          map.set(key, entry);
        }
      }
    }

    // Build aisles
    const aisles = {};
    for(const [,entry] of map){
      const conv = convertForShopping(entry.name, entry.aisle, entry);
      const a = entry.aisle || 'Other';
      (aisles[a]||(aisles[a]=[])).push({ name:entry.name, qty:conv.qty, unit:conv.unit, note:conv.note });
    }

    // Sort aisles and items
    const aisleOrder=['Produce','Dairy','Deli','Protein','Frozen','Frozen/Canned','Canned','Grains & Bakery','Pantry','Pantry & Condiments','Other'];
    const sortedAisles=Object.keys(aisles).sort((a,b)=>{
      const ia=aisleOrder.indexOf(a), ib=aisleOrder.indexOf(b);
      return (ia<0?999:ia)-(ib<0?999:ib) || a.localeCompare(b);
    });
    sortedAisles.forEach(a=>aisles[a].sort((x,y)=>x.name.localeCompare(y.name)));

    function render(){
      out.innerHTML = '';
      for(const a of sortedAisles){
        const sec=el('section',{class:'aisle'});
        sec.appendChild(el('h2',{},[a]));
        const grid=el('div',{class:'grid'});
        for(const it of aisles[a]){
          // If produce and toggle changed, recompute on the fly
          let row = it;
          if(a==='Produce'){
            const key = it.name.toLowerCase();
            // Recompute using cached entry map
            const entry = map.get(key);
            if(entry){ const conv = convertForShopping(entry.name, entry.aisle, entry); row = { name: entry.name, qty: conv.qty, unit: conv.unit, note: conv.note }; }
          }
          grid.appendChild(el('div',{},[row.name]));
          grid.appendChild(el('div',{},[String(row.qty),' ',row.unit,' ', row.note?('— '+row.note):'']));
        }
        sec.appendChild(grid);
        out.appendChild(sec);
      }
    }

    render();
    document.getElementById('btnToggleUnits').onclick = ()=>{ PRODUCE_IN_LBS = !PRODUCE_IN_LBS; render(); };

  }catch(e){
    console.error(e);
    out.innerHTML = '<p class="small">Missing or unreadable plan pointer. <a href="#">Add File</a></p>';
  }
})();
</script>
</body>
</html>
