name: Jem — Build Week‑2 from Progress
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Progression Engine
        shell: pwsh
        run: pwsh -File scripts/Jem-Progression-Engine.ps1 -ProgramsDir "pages/apps/jem/programs" -OutDir "pages/apps/jem/programs"
      - name: Commit Week‑2 and index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/jem/programs/week2-*.json pages/apps/jem/programs/index.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "feat(jem): week2 suggestions from progress" && git push; fi
