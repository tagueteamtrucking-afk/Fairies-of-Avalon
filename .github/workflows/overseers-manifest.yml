name: "Overseers — Manifests & WPI"

on:
  workflow_dispatch:
  push:
    paths:
      - "asset/models/**"
      - "asset/winged-models/**"
      - "asset/wings/**"
      - "asset/textures/wallpapers/**"
      - "Cody's Memory.yaml"

permissions:
  contents: write

jobs:
  build-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup PowerShell + YAML
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module powershell-yaml -Scope CurrentUser -Force -AllowClobber
          Import-Module powershell-yaml

      - name: Build manifests + WPI + assistants.json + wallpapers.json
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "scripts/overseers/build-manifests.ps1" -RepoRoot "${{ github.workspace }}" -Verbose

      - name: Prepare commit
        shell: pwsh
        run: |
          git add "asset/models/models.json" || echo "no models manifest changes"
          git add "asset/wings/manifest.json" || echo "no wings manifest changes"
          git add "pages/apps/overseers/assistants.json" || echo "no assistants changes"
          git add "pages/apps/overseers/wallpapers.json" || echo "no wallpapers changes"
          git add "pages/apps/overseers/progress.json" || echo "no progress changes"
          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"
          git fetch origin ${{ github.ref_name }} --depth=0
          git pull --rebase origin ${{ github.ref_name }} || echo "Nothing to rebase"
          git commit -m "Overseers: manifests + wallpapers + WPI" || echo "Nothing to commit"

      - name: Push
        uses: ad-m/github-push-action@77c5b412c50b723d2a4fbc6d71fb5723bcd439aa
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          force_with_lease: true
