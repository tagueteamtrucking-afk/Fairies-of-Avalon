<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carol — Shopping (2p)</title><style>body{background:#0b1220;color:#e6e9ff;font-family:system-ui,Segoe UI,Roboto;margin:0;padding:16px}a{color:#a5d6ff}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #1b2436;padding:8px 6px;text-align:left}th{background:#111a2b}</style></head>
<body><h1>Carol — Shopping (2 people)</h1><div id="root"></div>
<p><a href="/pages/apps/carol/index.html">← Back</a></p>
<script>
async function load(){const ptr=await (await fetch('/pages/apps/carol/index.json?cb='+Date.now())).json(); let d=null; if(ptr.shopping_quantized){const r=await fetch(ptr.shopping_quantized+'?cb='+Date.now()); if(r.ok) d=await r.json();}
  if(!d){const plan=await (await fetch(ptr.plan+'?cb='+Date.now())).json(); const acc={}; (plan.days||[]).forEach(x=>(x.items||[]).forEach(it=>(it.ingredients||[]).forEach(g=>{const k=(g.item||'').toLowerCase(); if(!k) return; acc[k]=acc[k]||{item:g.item,need:[]}; acc[k].need.push(g.qty||''); }))); d={items:Object.values(acc).map(x=>({item:x.item,need:x.need.join(' + ')}))};}
  const t=document.createElement('table'); t.innerHTML='<thead><tr><th>Item</th><th>Qty (2p)</th><th>Package</th></tr></thead>'; const tb=document.createElement('tbody'); (d.items||[]).forEach(x=>{const tr=document.createElement('tr'); tr.innerHTML='<td>'+x.item+'</td><td>'+(x.need||x.qty||'')+'</td><td>'+(x.package||'')+'</td>'; tb.appendChild(tr)}); t.appendChild(tb); document.getElementById('root').appendChild(t); }
load();
</script></body></html>
