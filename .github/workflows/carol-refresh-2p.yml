name: Carol — Refresh (2‑person)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract (v2)
        shell: pwsh
        run: pwsh -File scripts/Carol-Extract-Shopping-v2.ps1 -PlansDir "pages/apps/carol/plans" -OutFile "pages/apps/carol/plans/shopping-extracted.json"
      - name: Aggregate Packages (2 persons)
        shell: pwsh
        run: pwsh -File scripts/Carol-Aggregate-Packages-v2.ps1 -PlansDir "pages/apps/carol/plans" -PackageMap "pages/apps/carol/packages/us.json" -OutFile "pages/apps/carol/plans/shopping-quantized.json" -Persons 2
      - name: Build Pointer
        shell: pwsh
        run: pwsh -File scripts/Carol-Build-Pointer.ps1 -PlansDir "pages/apps/carol/plans" -OutFile "pages/apps/carol/index.json"
      - name: Commit Carol outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/carol/index.json pages/apps/carol/plans/shopping-extracted.json pages/apps/carol/plans/shopping-quantized.json || true
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(carol): refresh (2p)" && git push; fi
