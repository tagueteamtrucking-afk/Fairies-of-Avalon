<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Jem – Progress Tracker</title>
  <link rel="stylesheet" href="/pages/apps/common/style.css" />
  <style>
    .day {
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #eee;
    }
    .day h3 {
      margin: 0 0 0.5rem 0;
    }
  </style>
</head>
<body class="jem-inside">
  <div class="wrap">
    <h1 class="heading">📊 Jem – Progress Tracker</h1>
    <p class="lead">Track your progress by checking off activities as you complete them. Your progress resets when you leave the page.</p>
    <div id="tracker"></div>
    <p id="progress-summary"><em>Loading...</em></p>
    <p><a href="index.html">← back to Jem</a></p>
  </div>
  <script type="module">
    async function loadTracker() {
      try {
        const resp = await fetch('data/training-plan.json');
        const plan = await resp.json();
        const container = document.getElementById('tracker');
        let totalTasks = 0;
        let completed = 0;
        plan.plans.forEach(item => {
          const div = document.createElement('div');
          div.className = 'day';
          const h3 = document.createElement('h3');
          h3.textContent = `Day ${item.day}`;
          div.appendChild(h3);
          item.activities.forEach((act, idx) => {
            const label = document.createElement('label');
            label.style.display = 'block';
            const input = document.createElement('input');
            input.type = 'checkbox';
            input.dataset.day = item.day;
            input.dataset.name = act.name;
            input.addEventListener('change', () => {
              if (input.checked) {
                completed++;
              } else {
                completed--;
              }
              updateSummary();
            });
            label.appendChild(input);
            label.insertAdjacentHTML('beforeend', ` <strong>${act.name}</strong> – ${act.description}`);
            div.appendChild(label);
            totalTasks++;
          });
          container.appendChild(div);
        });
        function updateSummary() {
          document.getElementById('progress-summary').textContent = `Completed ${completed} of ${totalTasks} activities.`;
        }
        updateSummary();
      } catch (err) {
        document.getElementById('tracker').textContent = 'Failed to load progress tracker.';
        document.getElementById('progress-summary').textContent = '';
      }
    }
    loadTracker();
  </script>
</body>
</html>
