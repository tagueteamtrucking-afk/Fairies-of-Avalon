name: Nina — Generate Rooms (VRM in Rooms)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  rooms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Rooms
        shell: pwsh
        run: pwsh -File scripts/Nina-Generate-Rooms.ps1
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/rooms/
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "feat(nina): rooms with VRM viewers" && git push; fi
