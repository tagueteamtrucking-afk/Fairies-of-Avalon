<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Avalon · City</title>
  <style>
    :root{--ink:#f7f3e8;--glass:rgba(0,0,0,.5);--border:rgba(255,255,255,.15)}
    html,body{height:100%;margin:0;background:#06070b;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    header{padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:linear-gradient(180deg,rgba(0,0,0,.8),transparent);backdrop-filter:blur(6px)}
    h1{margin:0;font-size:22px}
    .wrap{max-width:1150px;margin:0 auto;padding:16px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
    .tile{background:var(--glass);border:1px solid var(--border);border-radius:14px;overflow:hidden}
    .tile img{width:100%;height:130px;object-fit:cover;display:block}
    .tile a{display:block;padding:10px 12px;color:var(--ink);text-decoration:none}
    .tile a:hover{background:rgba(255,255,255,.06)}
    .muted{opacity:.8;font-size:12px}
  </style>
</head>
<body>
  <header class="wrap">
    <h1>Avalon · City</h1>
    <div class="muted">One building per character. “Castle Town” legacy map removed.</div>
  </header>
  <main class="wrap">
    <div class="grid">
      <div class="tile">
        <img src="/asset/textures/buildings/phoenix-pagoda.jpg" alt="Carol’s Bistro">
        <a href="/pages/rooms/carol.html">Carol · Bistro</a>
      </div>
      <div class="tile">
        <img src="/asset/textures/wallpapers/castle village 01.jpg" alt="Tracy Studio">
        <a href="/pages/rooms/tracy.html">Tracy · Stained‑Glass Cathedral (Studio)</a>
      </div>
      <div class="tile">
        <img src="/asset/textures/wallpapers/castle village 02.jpg" alt="Jem Dojo">
        <a href="/pages/rooms/jem.html">Jem · Dojo</a>
      </div>
      <div class="tile">
        <img src="/asset/textures/wallpapers/castle village 03.jpg" alt="Stella Observatory">
        <a href="/pages/rooms/stella.html">Stella · Observatory</a>
      </div>
      <div class="tile">
        <img src="/asset/textures/wallpapers/castle village 04.jpg" alt="Alexandria Library">
        <a href="/pages/rooms/alexandria.html">Alexandria · Gothic Library</a>
      </div>
    </div>
  </main>
</body>
</html>
