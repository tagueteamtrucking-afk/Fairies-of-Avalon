<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <style>
    .bg { fill: #f8fafc }
    .road { stroke: #94a3b8; stroke-width: 4; fill: none }
    .bldg { fill: #4b2bb5; opacity:.12 }
    .pin  { fill: #4b2bb5 }
    .label{ font: 14px ui-sans-serif, system-ui; fill: #111827 }
    a text { text-decoration: underline; }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="700"/>
  <!-- Roads -->
  <path class="road" d="M50,350 L1150,350"/>
  <path class="road" d="M600,50 L600,650"/>
  <!-- Buildings -->
  <!-- Palace (Overseers) -->
  <a xlink:href="/index.html">
