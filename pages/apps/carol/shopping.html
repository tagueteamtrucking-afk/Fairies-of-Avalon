<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Carol • Shopping List</title>
<link rel="stylesheet" href="print.css" media="print"/>
<style>
  :root{--bg:#0b0b10;--card:#12121a;--ink:#f2f4f8;--mut:#aab2c0;--chip:#232332;--line:#1b1b26}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif}
  header{padding:16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(11,11,16,.9);backdrop-filter:blur(6px);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  header h1{margin:0;font-size:18px}
  button{background:#2a2a3b;color:white;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
  main{padding:16px;display:grid;gap:16px}
  .group{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .group h2{margin:0;padding:10px 12px;border-bottom:1px solid var(--line);font-size:15px}
  .group ul{list-style:none;margin:0;padding:10px 12px;display:grid;gap:6px}
  .mut{color:var(--mut);font-size:12px}
  @media print{
    header{display:none}
    body{background:white;color:black}
  }
</style>
</head>
<body>
<header>
  <h1>Shopping List</h1>
  <button onclick="window.print()">Print</button>
  <button id="build">Build in Browser</button>
  <span class="mut" id="status"></span>
</header>
<main id="root"></main>
<script src="shopping.js"></script>
</body>
</html>
