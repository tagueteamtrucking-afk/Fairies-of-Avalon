name: LLM Bridge
on:
  workflow_dispatch:
    inputs:
      worlds: { description: 'Worlds', default: 3, type: number }
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Alexandria LLM Bridge
        env: { OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}, OPENAI_MODEL: ${{ vars.OPENAI_MODEL }} }
        shell: pwsh
        run: pwsh -File scripts/LLM-Bridge.ps1 -WorldsToGenerate ${{ inputs.worlds }}
      - name: Commit generated worlds
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/alexandria/worlds/
          if git diff --cached --quiet; then echo "No changes";
          else git commit -m "feat(llm-bridge): regenerate worlds"; git push; fi
