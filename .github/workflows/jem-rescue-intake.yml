name: Jem — Rescue Intake (move from imports)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  rescue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move intake files to correct folder
        shell: pwsh
        run: pwsh -File scripts/Jem-Rescue-Intake.ps1 -ImportsDir "pages/apps/jem/imports" -IntakeDir "pages/apps/jem/intake"
      - name: Commit moves
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/jem/intake/*
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(jem): rescue intake files to correct folder" && git push; fi
