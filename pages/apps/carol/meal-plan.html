<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carol – Two‑Week Meal Plan</title>
    <!-- Load the common styles first so the building background classes apply, then Avalon theme styles -->
    <link rel="stylesheet" href="../common/style.css" />
    <link rel="stylesheet" href="../../../assets/css/avalon.css" />
  </head>
  <body>
    <!-- Building skin placeholder: adjust data-character and data-side to change skin -->
    <div class="building-skin" data-character="carol" data-side="inside"></div>

    <main class="mealplan-container">
      <header class="mealplan-header">
        <h1>Carol – Two‑Week Meal Plan</h1>
        <label for="day-select">Day:</label>
        <select id="day-select" class="day-select"></select>
      </header>
      <section id="meals-grid" class="meals-grid"></section>
    </main>

    <!-- Modal for meal details -->
    <div id="meal-modal" class="modal hidden">
      <div class="modal-content">
        <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
        <h2 id="modal-title"></h2>
        <div id="modal-body"></div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="../../js/avalon-skins.js"></script>
    <script src="../../js/meal-plan.js"></script>
  </body>
</html>
