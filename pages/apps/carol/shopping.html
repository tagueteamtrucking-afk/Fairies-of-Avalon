<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carol — Shopping List (2 people)</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif;margin:0;background:#0b0c10;color:#e8e8e8;padding:1rem}
    table{border-collapse:collapse;width:100%}
    th,td{border:1px solid #2b3a47;padding:.5rem;text-align:left}
    .sub{opacity:.8}
    .warn{background:#3a1f1f;border:1px solid #6b2e2e;padding:.75rem;border-radius:8px;margin:.5rem 0}
    a{color:#8ec6ff}
  </style>
  <script type="module">
    async function load(){
      const ptr = await fetch('./index.json',{cache:'no-store'}).then(r=>r.json());
      const res = await fetch(ptr.shopping,{cache:'no-store'});
      const root = document.getElementById('root');
      if(!res.ok){ root.innerHTML='<p class="warn"><b>No shopping list yet.</b> Run the "Carol — Build Shopping" workflow.</p>'; return; }
      const data = await res.json();
      if(data.status && data.status !== 'ok' && !data.items){
        root.innerHTML = `<div class="warn"><b>Shopping not ready:</b> ${data.message || data.status}. ${data.hint || ''} ${data.how_to || ''}</div>`;
        return;
      }
      document.getElementById('meta').textContent = `For ${data.meta?.people || 2} people`;
      const tbody = document.getElementById('tbody');
      (data.items||[]).forEach(it=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${it.item}</td><td>${it.qty}</td><td>${it.unit||''}</td>`;
        tbody.appendChild(tr);
      });
    }
    load();
  </script>
</head>
<body>
  <h1>Carol — Shopping List</h1>
  <p id="meta" class="sub">Loading…</p>
  <div id="root">
    <table>
      <thead><tr><th>Item</th><th>Qty</th><th>Unit</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</body>
</html>
