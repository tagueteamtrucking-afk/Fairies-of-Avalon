meta:
  project: Avalon
  file_name: "Cody's Memory.yaml"
  version: "2.3.1"
  last_updated: "2025-10-18"
  author: "Cody (GPT-5 Pro)"
  notes: >
    City-building UX is canonical. Overseers are AVATARS (Ray = Rey Czar, Blanca = White Star),
    not AIs. "Read — Full Repo Index" workflow produces JSON summaries I (the LLM) can read to
    stay fully in sync without guessing. Carol pointer & two-person aggregator are the stable
    way to show menu + shopping. Alexandria DM uses TTS by default; Stella voice is distinct,
    not scheduled—plays as needed.

governance:
  overseers:
    - id: rey_czar
      name: "Rey Czar"
      role: "Overseer Avatar (Ray)"
      status: "Root of Trust"
    - id: white_star
      name: "White Star"
      role: "Overseer Avatar (Blanca)"
      status: "Root of Trust"

delivery_policy:
  whole_file_replacements_only: true
  workflows_first: true
  no_plaintext_secrets: true

hosting:
  domain: "fairiesofavalon.com"
  pages_root: "pages"
  microapps_path: "pages/apps"
  custom_domain_cname: true
  pwa_app_shell: true

audio_io:
  worker_url_storage_keys:
    - "stella:worker"
    - "alex:worker"
  defaults:
    stella:
      tts_model: "tts-1-hd"
      voice: "shimmer"
      schedule: "on-demand (mood-driven), NOT time-based"
      focus: ["NLP", "hypnosis", "meditation", "ASMR", "Gateway Program topics"]
    alexandria:
      tts_model: "tts-1"
      voice: "amber"
      mode: "DM (dialogue + turn logs)"
  setup:
    - "Set the Worker URL once via localStorage.setItem('stella:worker', 'https://...workers.dev')"
    - "Set Alexandria similarly via localStorage.setItem('alex:worker', 'https://...workers.dev')"

city_building:
  rule: "One building per assistant; one room per building; the room hosts multiple miniapps."
  plaza_page: "/pages/apps/_city/index.html"
  anchors_by_assistant:
    tracy:
      building: "Atelier"
      anchors:
        - {{ icon: "🎨", label: "Easel (2D Art)", href: "/pages/apps/tracy/artboards/index.html" }}
        - {{ icon: "🗿", label: "Clay Bust (3D)", href: "/pages/apps/tracy/3d/index.html" }}
        - {{ icon: "🖼️", label: "Skins", href: "/pages/apps/tracy/room-preview.html" }}
    alexandria:
      building: "Library"
      anchors:
        - {{ icon: "🌐", label: "Globe (Worlds)", href: "/pages/apps/alexandria/worlds/index.html" }}
        - {{ icon: "🗺️", label: "Corkboard (Maps)", href: "/pages/apps/alexandria/maps/index.html" }}
        - {{ icon: "🎲", label: "Voice DM", href: "/pages/apps/alexandria/voice-dm.html" }}
    nina:
      building: "Lab"
      anchors: []
    charlotte:
      building: "Relay"
      anchors: []
    stella:
      building: "Observatory"
      anchors:
        - {{ icon: "🌌", label: "Voice I/O", href: "/pages/apps/stella/voice.html" }}
    jem:
      building: "Dojo"
      anchors: []
    carol:
      building: "Bistro"
      anchors:
        - {{ icon: "🍽️", label: "Menu (latest)", href: "/pages/apps/carol/menu.html" }}
        - {{ icon: "🛒", label: "Shopping", href: "/pages/apps/carol/shopping.html" }}
    abbey:
      building: "Vault"
      anchors: []
    clarice:
      building: "Court"
      anchors: []
    sorcha:
      building: "Mansion"
      anchors: []
    odessa:
      building: "Museum"
      anchors: []
    themis:
      building: "Records"
      anchors: []
    whitestar:
      building: "Palace"
      anchors: []
    reyczar:
      building: "Palace"
      anchors: []

carol:
  preferences:
    eat_style: "grazers — 6–8 small snacks/day"
    schedules: "often opposite"
    dislikes: ["cilantro"]
    easy_on: ["onions", "bell peppers"]
    avoid_spices: ["cumin"]
    allergy: ["shellfish"]
    texture_limits:
      crunchy: "limit — panko-light ok"
      peanuts: "powdered or peanut butter only"
    lactose: "light dairy restriction"
    safety_standards: "EU first; US as fallback"
    packaging_region: "US sizes (oz, cups, tbsp, tsp)"
    equipment: ["single-burner cooktop","Galanz MW/AirFryer/Conv","small food processor","immersion blender","KitchenAid","crock-pot"]
    storage_limits:
      fridge: "smaller than US standard"
      freezer: "slightly bigger than standard"
  two_person_aggregation: true
  pointer_file: "/pages/apps/carol/index.json"
  stable_viewers:
    menu: "/pages/apps/carol/menu.html"
    shopping: "/pages/apps/carol/shopping.html"
  workflows:
    - "carol-extract-v2-and-report.yml"
    - "carol-aggregate-fromfile-2p.yml"
    - "carol-build-pointer.yml"
  package_map: "/pages/apps/carol/packages/us.json"
  package_map_notes:
    - "Contains dry rice in 2lb/5lb/10lb; add new items via ingredient_map"
  measurement_rules:
    - "Prefer standard cooking measures: cups, tbsp, tsp, fl oz, oz"
    - "Shopping list must reflect TWO people for the full plan period"

jem:
  week1_evaluation:
    inputs: ["intake JSONs in pages/apps/jem/intake", "Samsung Health zips in pages/apps/jem/imports"]
    goals: ["knees/back/core strengthening","pain reduction","increase max safely"]
    output: "programs/week1-<Name>-<timestamp>.json"
    name_normalization: "Map device/export names to 'Ray' and 'Blanca'"
  coaching_loop:
    - "Track biometrics & steps (Samsung Health)"
    - "Log workouts: planned vs. completed"
    - "Adjust plan based on progress + goals"
    - "Send nutritional needs to Carol for menu updates"
  space_constraints: "Truck cab — no gym, small space, no door anchors"
  equipment_suggestions: ["compact resistance bands (loop type)", "folding mat"]

stella:
  principle: "Always-on, mood‑driven sound; not a schedule"
  focuses: ["Success","Drive/Determination","Luck/Fortune","Happiness/Gratitude","Gateway mental development"]
  output: "guided sessions + ambient loops via Worker TTS"

alexandria:
  dm_rules:
    - "Voice DM default; distinct voice from Stella"
    - "Logs each session; can export future serial novels"
    - "Treasure‑map visual motif for World Creation"
  worldbuilder_scope: ["rules of magic","societies","factions","economies","maps"]

repo_reading_for_llm:
  why: "GitHub directory pages are JS-rendered and unreliable for scraping."
  solution: "Run 'Read — Full Repo Index' Action after pushes."
  artifacts_committed:
    - "memory-history/repo-inventory.json"
    - "memory-history/repo-refs.json"
    - "memory-history/repo-usage-report.json"
    - "memory-history/repo-read-index.json"
  how_i_use_them:
    - "I fetch and summarize these JSONs to stay up-to-date on what files exist and which scripts/workflows are live."
    - "I propose improvements based on actual usage (used vs orphans)."

site_routing:
  version_param_cleanup: "use VersionParam-Sweeper and avoid '?v=' forcing redirects"
  service_worker_reset: "open /kill-sw.html after deploy, then hard reload with cache-buster"

keep_lists:
  workflows: "/config/keep-lists/workflows-keep.json"

safety:
  medical_disclaimer: "Fitness and nutrition guidance is educational and should not replace professional medical advice."
