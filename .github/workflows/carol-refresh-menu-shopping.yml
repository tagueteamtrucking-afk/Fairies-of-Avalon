name: Carol — Refresh Menu & Shopping
on:
  workflow_dispatch:
    inputs:
      plan_path:
        description: "Path to the 14‑day plan JSON"
        required: true
        default: "pages/apps/carol/plans/twoperson-2wk-unique-20251015T022300Z.json"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy plan to merged filename for extractor
        shell: pwsh
        run: |
          $plan = "${{ github.event.inputs.plan_path }}"
          if (-not (Test-Path $plan)) { throw "Plan not found: $plan" }
          New-Item -ItemType Directory -Force -Path "pages/apps/carol/plans" | Out-Null
          Copy-Item -Force $plan "pages/apps/carol/plans/twoperson-2wk-merged.json"

      - name: Extract shopping (v3)
        shell: pwsh
        run: |
          ./scripts/Carol-Extract-Shopping-v3.ps1

      - name: Update Carol pointer
        shell: pwsh
        run: |
          $pointer = @{ 
            plan = "${{ github.event.inputs.plan_path }}"
            merged_plan = "pages/apps/carol/plans/twoperson-2wk-merged.json"
            shopping = "pages/apps/carol/plans/shopping-quantized.json"
            updated = (Get-Date).ToString("s")
          } | ConvertTo-Json -Depth 5
          Set-Content -NoNewline -Path "pages/apps/carol/index.json" -Value $pointer

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(carol): refresh menu & shopping"
          branch: "carol/refresh-${{ github.run_id }}"
          title: "Carol: Refresh menu & shopping"
          body: |
            - Copied plan to extractor filename
            - Ran shopping extractor v3
            - Updated /pages/apps/carol/index.json pointer
