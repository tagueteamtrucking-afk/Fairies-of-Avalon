meta:
  project: Avalon
  file_name: "Cody's Memory.yaml"
  version: "1.16.0"
  last_updated: "2025-09-17"
  author: "Cody (GPT-5 Pro)"
  notes: >
    Cooperative Helpers packaged (AI-only, no UI changes).
    - Alexandria build & helper suites stabilized (offline-first).
    - Tracy Artboards, Nina VRM Index + SceneKit, Charlotte Pipelines (SSML + translations).
    - Preserve assets (models/wings/textures) and generated worlds.
    - WPI (Work Progress Index) is data-only at pages/apps/overseers/progress.json, written by
      "Overseers — Manifests & WPI" workflow (existing).
    - Engineering rules enforced: clarify → plan → tools; Linux-safe PowerShell; booleans as switches;
      ConvertTo-Json Depth ≤ 100; "Nothing to commit" is success; no UI edits without explicit ask.

system:
  os: "Windows 11"
  device: "Gaming PC"
  only_windows: true

delivery_policy:
  speed_first: true
  two_person_authorization: false
  whole_file_replacements_only: true
  preferred_shell: "GitHub Actions workflows + PowerShell"
  notes:
    - Provide full files ready to replace existing ones (no diffs).
    - Workflows-first; scripts are helpers; no wrapper assumptions.
    - Deploy path must not require multi-review or environment approvals.

hosting:
  frontend_domain: "fairiesofavalon.com"
  pwa_app_shell: true
  pages_root: "pages"
  microapps_path: "pages/apps"
  custom_domain_cname: true
  cdn_imports: ["three", "three/addons/", "@pixiv/three-vrm"]

project:
  world: "Avalon"
  assistants_label: "Fairies"
  domain: "fairiesofavalon.com"
  home_label: "home"
  preserve_paths: ["asset/models", "asset/wings", "asset/textures", "pages/apps/alexandria/worlds"]
  importmap_required: true
  importmap_map: ["three", "three/addons/", "@pixiv/three-vrm"]

assets:
  layout:
    models_root_legacy: "asset/models"
    wingless_vrms: "asset/models/wingless"
    with_wings_vrms: "asset/models/with-wings"
    with_wings_alias: "asset/winged-models"
    wings_models: "asset/wings"
    wings_textures: "asset/wings/textures"
    models_manifest: "asset/models/models.json"
    wings_manifest: "asset/wings/manifest.json"
    wallpapers: "asset/textures/wallpapers"
  rules:
    vrm_classification:
      - "Any *.vrm in asset/models/wingless is wingless."
      - "Any *.vrm in asset/models/with-wings is pre-winged."
      - "Any *.vrm in asset/winged-models is pre-winged (alias path)."
      - "If using legacy layout (asset/models/*.vrm), treat as wingless unless filename ends with _wings or -wings."
    wings_grouping:
      - "Wing meshes/textures group by number: wing02.* ↔ wing02_c/_e/_nrm."
      - "Matching is case-insensitive; textures may use uppercase W."
      - "Suffix mapping: _c=albedo/color, _e=emissive, _nrm=normal; record others if present."
  budgets:
    initial_shell_kb: 300
    initial_requests: 15
    vrm_per_file_mb: 40
    wallpapers_total: 20

wings_pack: "Fantasy Wings Collection Fbx.rar"

avatars_present: ["Abbey","Alexandria","Billie","Carol","Charlotte","Clarice","Jem","Nina","Odessa","Reyczar","Sorcha","Themis","WhiteStar","Tracy","Stella"]

