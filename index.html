<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fairies of Avalon</title>
<style>
  :root{--bg:#0b0d12;--fg:#e5e7eb;--line:#1f2937;--rad:16px}
  html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:#0b0d12;color:#e5e7eb;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif;
       background-image:url('/asset/textures/wallpapers/castle\ village\ 04.jpg');background-size:cover;background-position:center}
  .shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.7))}
  .card{position:relative;padding:2rem;border:1px solid var(--line);border-radius:var(--rad);backdrop-filter:blur(4px) saturate(120%);background:rgba(0,0,0,.45);text-align:center;max-width:640px}
  h1{margin:.2rem 0 1rem 0;letter-spacing:.12em;text-transform:uppercase}
  .cta{display:inline-block;margin-top:1rem;padding:.8rem 1.1rem;border-radius:12px;border:1px solid var(--line);color:#e5e7eb;text-decoration:none}
</style>
<div class="shade" aria-hidden="true"></div>
<div class="card">
  <h1>Fairies of Avalon</h1>
  <p>Enter the city to visit each assistant’s building.</p>
  <a class="cta" href="/pages/apps/_city/index.html">Enter Avalon</a>
</div>
</html>
