name: Merge Queue (batch)

on:
  workflow_dispatch:
    inputs:
      max_prs:
        description: 'Maximum number of PRs to merge'
        required: false
        default: '10'

permissions:
  contents: write
  pull-requests: write
  statuses: read

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const max = parseInt(core.getInput('max_prs', { required: false })) || 10;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // fetch open PRs
            const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 50 });
            let mergedCount = 0;
            for (const pr of prs) {
              if (mergedCount >= max) break;
              const labels = pr.labels.map(l => l.name);
              const isEligible = labels.includes('automerge') || /clarity[- ]core/i.test(pr.title);
              if (!isEligible) continue;
              // Check status checks
              const { data: combined } = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: pr.head.sha });
              if (combined.state !== 'success') continue;
              // Merge PR
              try {
                await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, merge_method: 'squash' });
                mergedCount++;
                core.info(`Merged PR #${pr.number}`);
              } catch (err) {
                core.warning(`Failed to merge PR #${pr.number}: ${err.message}`);
              }
            }
            core.info(`Merged ${mergedCount} PRs`);