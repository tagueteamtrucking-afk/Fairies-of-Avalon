name: Carol — Extract Shopping & Map Coverage Report
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract shopping from latest plan
        shell: pwsh
        run: pwsh -File scripts/Carol-Extract-Shopping.ps1 -PlansDir "pages/apps/carol/plans" -OutFile "pages/apps/carol/plans/shopping-extracted.json"
      - name: Build package-map coverage report
        shell: pwsh
        run: pwsh -File scripts/Carol-Package-Map-Report.ps1 -PlansDir "pages/apps/carol/plans" -PackageMap "pages/apps/carol/packages/us.json" -OutFile "pages/apps/carol/plans/packages-missing.json" -ShoppingFile "pages/apps/carol/plans/shopping-extracted.json"
      - name: Commit outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/carol/plans/shopping-extracted.json pages/apps/carol/plans/packages-missing.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(carol): extracted shopping + coverage report" && git push; fi
