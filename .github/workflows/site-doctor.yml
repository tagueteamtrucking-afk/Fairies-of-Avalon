name: Site Doctor
on:
  workflow_dispatch:
    inputs:
      domain: { description: 'Custom domain', default: 'www.fairiesofavalon.com', type: string }
      apply_fixes: { description: 'Apply .nojekyll/CNAME/kill-sw', default: true, type: boolean }
permissions: { contents: write, pages: write }
jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Site Doctor
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
        shell: pwsh
        run: pwsh -File scripts/Site-Doctor.ps1 -Domain "${{ inputs.domain }}" -ApplyFixes ${{ inputs.apply_fixes }}
      - name: Commit applied fixes (if any)
        if: ${{ inputs.apply_fixes == true }}
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CNAME .nojekyll kill-sw.html pages/diagnostics/
          if git diff --cached --quiet; then echo "No changes";
          else git commit -m "chore(doctor): apply safe site fixes"; git push; fi
      - name: Upload doctor report
        uses: actions/upload-artifact@v4
        with: { name: site-doctor-report, path: pages/diagnostics/site-report.* }
