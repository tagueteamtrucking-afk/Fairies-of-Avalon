name: Memory Rescue (move Cody's Memory)
on: { workflow_dispatch: {} }
permissions:
  contents: write
  pull-requests: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Relocate memory if under .github/workflows/
        run: |
          set -euo pipefail
          if [ -f ".github/workflows/Cody's Memory.yaml" ]; then
            mkdir -p _memfix
            cp ".github/workflows/Cody's Memory.yaml" "_memfix/Cody's Memory.yaml"
          fi
      - name: Create PR
        if: ${{ hashFiles('_memfix/**') != '' }}
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "fix: move Cody's Memory.yaml to repo root"
          title: "fix: move Cody's Memory.yaml to repo root"
          branch: ci/memory-rescue-${{ github.run_id }}
          base: ${{ github.ref_name }}
          add-paths: |
            _memfix/Cody's Memory.yaml
