<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carol — Shopping List (2 people)</title>
<style>
  :root{--pad:16px;--max:900px}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;margin:0;padding:var(--pad);max-width:var(--max);margin-inline:auto;background:#f8f9fb}
  header{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
  h1{font-size:1.25rem;margin:0}
  .btn{display:inline-block;padding:8px 12px;border:1px solid #ddd;border-radius:8px;text-decoration:none;color:#111;background:#fff}
  .group{background:#fff;border:1px solid #eee;border-radius:12px;margin:10px 0;padding:12px}
  .group h2{margin:0 0 8px 0;font-size:1rem}
  ul{margin:0;padding-left:18px}
  @media print{header{display:none} body{background:#fff} .group{page-break-inside:avoid}}
</style>
<header>
  <h1>Carol — Shopping List</h1>
  <div>
    <button class="btn" onclick="window.print()">Print List</button>
    <button class="btn" id="build">Build in Browser</button>
  </div>
</header>
<div id="list"></div>
<script type="module">
const CAT = {
  produce:['apple','banana','pear','kiwi','peach','grapes','mango','pineapple','tomato','cucumber','spinach','lettuce','lemon','potatoes','sweet potato','avocado'],
  protein:['chicken','turkey','salmon','cod','tuna','egg','eggs','ground turkey','lean turkey'],
  dairy:['yogurt','cottage','mozzarella','cheese','milk','cream cheese'],
  grains:['oats','rice','tortilla','bread','crackers','panko','granola','rice cakes'],
  frozen:['frozen','mixed vegetables'],
  pantry:['olive oil','hummus','peanut butter','flax','chia','cocoa','tomato soup','diced tomatoes','beans']
};
function catOf(name){
  const n=name.toLowerCase();
  if(n.includes('frozen')) return 'Frozen';
  if(n.includes('vegetables')) return 'Frozen';
  if(CAT.produce.some(w=>n.includes(w))) return 'Produce';
  if(CAT.protein.some(w=>n.includes(w))) return 'Protein';
  if(CAT.dairy.some(w=>n.includes(w))) return 'Dairy';
  if(CAT.grains.some(w=>n.includes(w))) return 'Grains';
  if(CAT.frozen.some(w=>n.includes(w))) return 'Frozen';
  return 'Pantry';
}
function normName(n){
  n = String(n||'').trim().toLowerCase();
  n = n.replace(/\s+\(canned in juice.*\)/g,'').replace(/\s+\(in water\)/g,'');
  n = n.replace(/lactose[-\s]?free/g,'lactose-free');
  n = n.replace(/mixed vegetables.*|frozen mixed vegetables/g,'mixed vegetables, frozen');
  n = n.replace(/lf /g,'lactose-free ');
  n = n.replace(/yogurt.*greek.*/g,'yogurt, greek (lactose-free)');
  n = n.replace(/cottage cheese.*/g,'cottage cheese (lactose-free)');
  n = n.replace(/^egg$/,'eggs');
  return n;
}
function asNumber(v){const n=Number(v);return isFinite(n)?n:0}
function add(map,key,qty,unit){
  const k = normName(key);
  const entry = map.get(k) || {name:k, qty:0, unit:unit||''};
  // if units differ, prefer first seen unit; we only sum like-units here
  if(entry.unit === (unit||'') || !entry.unit) entry.qty += asNumber(qty);
  map.set(k, entry);
}
async function loadPlan(){
  const ptr = await fetch('/pages/apps/carol/index.json').then(r=>r.json());
  const rel = ptr && ptr.plan_latest;
  if(!rel) throw new Error('index.json missing "plan_latest"');
  const plan = await fetch('/'+rel).then(r=>r.json());
  return plan;
}
function multiplyFor(forWhom){
  if(!forWhom) return 1;
  const f = String(forWhom).toLowerCase();
  if(f.includes('both')) return 2;
  return 1;
}
function toDisplay(item){
  let qty = item.qty;
  let unit = item.unit || '';
  // normalize some shopping units
  if(unit==='tbsp' && /hummus|peanut butter|cream cheese/.test(item.name)) { qty = qty * 0.5; unit = 'oz'; } // 1 tbsp ~ 0.5 oz approx
  if(unit==='cup' && /rolled oats/.test(item.name)) { qty = qty * 2.82; unit = 'oz'; } // 1 cup oats ~ 2.82 oz (~80g)
  if(unit==='piece' && /banana|apple|pear|kiwi|lemon|avocado|eggs?/.test(item.name)) { unit='count'; }
  if(unit==='leaf' || unit==='slice' || unit==='spray') { unit='count'; }
  if(unit==='tsp' && /garlic powder|cinnamon|cocoa|vanilla/.test(item.name)) { unit='tsp'; }
  return { ...item, qty, unit };
}
async function buildInBrowser(){
  const plan = await loadPlan();
  const map = new Map();
  for(const day of plan.days){
    for(const ev of day.events){
      const mult = multiplyFor(ev.for);
      for(const it of (ev.items||[])){
        add(map, it.ingredient, (asNumber(it.quantity)||0)*mult, (it.unit||'').toLowerCase());
      }
    }
  }
  const items = Array.from(map.values()).map(toDisplay).sort((a,b)=>a.name.localeCompare(b.name));
  // group and render
  const groups = new Map();
  for(const it of items){
    const g = catOf(it.name);
    if(!groups.has(g)) groups.set(g, []);
    groups.get(g).push(it);
  }
  const list = document.getElementById('list');
  list.innerHTML='';
  for(const [g, arr] of groups){
    const div = document.createElement('section'); div.className='group';
    div.innerHTML = `<h2>${g}</h2>`;
    const ul = document.createElement('ul');
    for(const it of arr){
      const qty = (Math.round(it.qty*100)/100).toString().replace(/\.0+$/,'');
      ul.innerHTML += `<li>${it.name} — <strong>${qty} ${it.unit||''}</strong></li>`;
    }
    div.appendChild(ul); list.appendChild(div);
  }
}
document.getElementById('build').addEventListener('click', buildInBrowser);
</script>
</html>
