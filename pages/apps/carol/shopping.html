<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Carol • Shopping List</title>
  <link rel="stylesheet" href="/pages/apps/carol/print.css">
  <style>
    .group { border: 1px solid #eee; border-radius: 8px; padding: 8px 10px; margin: 10px 0; }
    .group h2 { margin: 0 0 6px; }
    .empty { padding: 10px; background: #fff7d6; border: 1px solid #ffe58f; border-radius: 8px; }
  </style>
</head>
<body>
  <header class="controls">
    <button class="print" onclick="window.print()">Print / Save PDF</button>
  </header>
  <h1>Shopping List</h1>
  <small class="meta">Built from the current two‑week menu</small>
  <div id="root">Loading…</div>
  <script>
  function aisleOf(name){
    const s = name.toLowerCase();
    const has = t => s.includes(t);
    if (has('yogurt') || has('milk') || has('cottage') || has('mozzarella') || has('cheese')) return 'Dairy & Alternatives';
    if (has('banana') || has('apple') || has('pear') || has('peach') || has('kiwi') || has('grape') || has('mango') || has('avocado') || has('lemon') || has('lime') || has('tomato') || has('cucumber') || has('spinach') || has('potato')) return 'Produce';
    if (has('oats') || has('rice cake') || has('tortilla') || has('bread') || has('brown rice') || has('panko')) return 'Grains & Bakery';
    if (has('chicken') || has('turkey') || has('cod') || has('salmon') || has('egg') || has('tuna')) return 'Protein';
    if (has('frozen') || has('veg medley') || has('mixed vegetables')) return 'Frozen';
    if (has('canned') || has('can ') || has('(can')) return 'Canned & Shelf';
    if (has('soup') || has('beans') || has('diced tomatoes') || has('relish')) return 'Canned & Shelf';
    if (has('olive oil') || has('peanut butter') || has('hummus') || has('flax') || has('chia') || has('cocoa') || has('cinnamon') || has('vanilla') || has('garlic powder') || has('honey')) return 'Pantry & Condiments';
    return 'Other';
  }
  function key(item){ return (item.ingredient||item.item||'').trim().toLowerCase(); }
  function normUnit(u){ return (u||'').trim().toLowerCase(); }
  (async () => {
    const mount = document.getElementById('root');
    try{
      const ptr = await fetch('/pages/apps/carol/index.json').then(r=>r.json());
      if (!ptr || !ptr.plan){
        mount.innerHTML = '<div class="empty"><strong>Plan not set.</strong> <a href="/pages/apps/carol/index.json">Add File</a></div>';
        return;
      }
      const plan = await fetch('/' + ptr.plan.replace(/^\//,'')).then(r=>r.json());
      const tally = new Map(); // key: ingredient|unit -> {item, qty, unit, aisle}
      for (const day of (plan.days||[])){
        for (const ev of (day.events||[])){
          for (const it of (ev.items||[])){
            const k = key(it) + '|' + normUnit(it.unit);
            const aisle = aisleOf(it.ingredient||it.item||'');
            const cur = tally.get(k) || { item: (it.ingredient||it.item||'').trim(), qty: 0, unit: normUnit(it.unit), aisle };
            cur.qty += Number(it.quantity||0);
            tally.set(k, cur);
          }
        }
      }
      // bucket by aisle
      const buckets = {};
      for (const v of tally.values()){
        const a = v.aisle || 'Other';
        (buckets[a] = buckets[a] || []).push(v);
      }
      const aisles = Object.keys(buckets).sort();
      mount.innerHTML = '';
      for (const a of aisles){
        const wrap = document.createElement('div'); wrap.className = 'group';
        const h2 = document.createElement('h2'); h2.textContent = a; wrap.appendChild(h2);
        const ul = document.createElement('ul');
        for (const it of buckets[a].sort((x,y)=>x.item.localeCompare(y.item))){
          const unit = it.unit ? ' ' + it.unit : '';
          const li = document.createElement('li');
          li.textContent = `${it.item} — ${Math.round((it.qty + Number.EPSILON)*100)/100}${unit}`;
          ul.appendChild(li);
        }
        wrap.appendChild(ul);
        mount.appendChild(wrap);
      }
      if (!aisles.length){
        mount.innerHTML = '<div class="empty">No items found in plan.</div>';
      }
    }catch(e){
      mount.textContent = 'Error building shopping list.';
    }
  })();
  </script>
</body>
</html>
