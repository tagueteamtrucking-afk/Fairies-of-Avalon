<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracy – Character Designer</title>
  <link rel="stylesheet" href="../../../style.css">
  <style>
    /* Inline styles specific to this page to augment the common stylesheet. */
    #output {
      margin-top: 1rem;
      padding: 1rem;
      border: 1px dashed var(--muted);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="heading">Character Designer</h1>
    <p class="lead">Create a new character by describing their appearance and personality.</p>
    <form id="char-form">
      <label>Name
        <input type="text" name="name" placeholder="e.g. Aria" />
      </label>
      <label>Appearance description
        <textarea name="appearance" rows="3" placeholder="Hair colour, clothing, accessories..."></textarea>
      </label>
      <label>Personality traits
        <textarea name="traits" rows="3" placeholder="Brave, curious, etc."></textarea>
      </label>
      <button type="submit">Create Character</button>
    </form>
    <div id="output"><em>Your character description will appear here.</em></div>
    <p><a href="index.html">← back to Tracy</a></p>
  </div>
  <script>
    document.getElementById('char-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const form = e.target;
      const name = form.name.value.trim() || 'Unnamed';
      const appearance = form.appearance.value.trim() || 'no appearance description provided';
      const traits = form.traits.value.trim() || 'no personality traits listed';
      const output = document.getElementById('output');
      output.innerHTML = `<strong>${name}</strong> – ${appearance}. Personality: ${traits}.`;
    });
  </script>
</body>
</html>
