name: Carol: LLM Plans
on:
  workflow_dispatch:
    inputs:
      plans: { description: 'Plans', default: 3, type: number }
      project_title: { description: 'Project title', default: 'Avalon Site v1', type: string }
jobs:
  carol-llm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate plans (Carol)
        env: { OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}, OPENAI_MODEL: ${{ vars.OPENAI_MODEL }} }
        shell: pwsh
        run: pwsh -File scripts/Carol-LLM-Plans.ps1 -PlansToGenerate ${{ inputs.plans }} -ProjectTitle '${{ inputs.project_title }}'
      - name: Commit plans
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/carol/plans/
          if git diff --cached --quiet; then echo "No changes";
          else git commit -m "feat(carol): update plans"; git push; fi
