<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Billie • Storyboards</title>
  <link rel="stylesheet" href="../theme/tokens.css">
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:var(--bg);color:var(--fg)}
    header{padding:18px 20px;border-bottom:1px solid var(--border);background:var(--panel-bg)}
    h1{margin:0;font-size:20px}
    main{padding:16px 20px;max-width:900px;margin:0 auto}
    .card{background:var(--panel-bg);border:1px solid var(--border);border-radius:14px;padding:14px;margin:12px 0}
    h2{margin:0 0 8px 0;font-size:16px}
    .muted{opacity:.85}
    .note{background:var(--panel-bg); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin:12px 0}
  </style>
</head>
<body>
<header><h1>Billie — Storyboards</h1></header>
<main>
  <div id="pinInfo" class="note muted">PG‑13 only. For private items, keep them off‑site.</div>
  <div id="slot" class="card">
    <h2>Latest Storyboard (from Sorcha)</h2>
    <div id="story"></div>
  </div>
  <script>
    (async function(){
      try{
        const res = await fetch('/pages/apps/sorcha/storyboards/storyboard-20251019T033626Z.json',{cache:'no-store'});
        if(!res.ok) throw 0;
        const data = await res.json();
        const el = document.getElementById('story');
        el.textContent = JSON.stringify(data, null, 2);
      }catch(_){
        document.getElementById('story').innerHTML = '<div class="muted">No storyboard JSON found yet. Add one under <code>pages/apps/billie/storyboards/</code> or use Sorcha’s storyboard as a seed.</div>';
      }
    })();
  </script>
  <div class="card">
    <h2>Actions</h2>
    <ul>
      <li>Create a new JSON in <code>pages/apps/billie/storyboards/</code> (e.g., <code>storyboard-YYYYMMDDThhmmssZ.json</code>).</li>
      <li>Reference it here or in Sorcha’s storyboard viewer.</li>
    </ul>
  </div>
</main>
</body>
</html>
