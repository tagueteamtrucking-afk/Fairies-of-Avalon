<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All File Memory — Overseers</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <h1>All File Memory</h1>
    <p class="sub">Live index of every file in the repo (including workflows). Updated by CI.</p>
  </header>

  <section id="summary" class="card"></section>

  <section class="controls card">
    <input id="q" type="search" placeholder="Filter by path, type, purpose…" aria-label="Filter">
    <label class="cc">
      <input id="showIgnored" type="checkbox">
      Show ignored (if any)
    </label>
  </section>

  <section id="list" class="card"></section>

  <footer>
    <small>Generated at <span id="genAt">—</span>. If data looks old, refresh and verify the CI run “Overseers — Memory Index”.</small>
  </footer>

  <script src="./viewer.js" defer></script>
</body>
</html>
