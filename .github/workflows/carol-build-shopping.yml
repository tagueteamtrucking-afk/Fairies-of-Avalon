name: "Carol — Refresh Menu + Shopping"

on:
  workflow_dispatch:
    inputs:
      plan_path:
        description: "Path to the active 14-day plan JSON"
        required: true
        default: "pages/apps/carol/plans/twoperson-2wk-unique-20251015T022300Z.json"

permissions:
  contents: write
  pull-requests: write

jobs:
  build-shopping:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity
        run: |
          $ErrorActionPreference = "Stop"
          "Plan input: ${{ github.event.inputs.plan_path }}"

      - name: Prepare merged plan name expected by extractor
        run: |
          $ErrorActionPreference = "Stop"
          $src = "${{ github.event.inputs.plan_path }}"
          if(!(Test-Path $src)){ throw "Plan not found: $src" }
          Copy-Item -Force $src "pages/apps/carol/plans/twoperson-2wk-merged.json"

      - name: Extract shopping (PowerShell script)
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/Carol-Extract-Shopping-v3.ps1

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/apps/carol/plans/shopping-quantized.json pages/apps/carol/plans/twoperson-2wk-merged.json -A
          if ((git diff --cached --name-only).Count -eq 0) {
            "No shopping changes to commit."
          } else {
            git commit -m "Carol: refresh shopping list from ${{ github.event.inputs.plan_path }}"
          }

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Carol: refresh shopping list"
          title: "Carol: refresh 14-day menu & shopping list"
          body: "Auto-generated by workflow."
          branch: "carol/shopping-refresh-20251021T073126Z"
          delete-branch: true
