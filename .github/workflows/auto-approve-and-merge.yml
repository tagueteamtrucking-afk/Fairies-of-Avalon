name: Auto-approve & Automerge (smart)
on:
  pull_request_target:
    types: [opened, labeled, synchronize, reopened, ready_for_review]
permissions:
  contents: write
  pull-requests: write
  statuses: read
  checks: read
concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  approve-and-merge:
    if: >
      (
        contains(github.event.pull_request.labels.*.name, 'automerge')
        || (
          (startsWith(github.event.pull_request.head.ref, 'ci/clarity-core') || contains(github.event.pull_request.title, 'clarity core'))
          && endsWith(github.event.pull_request.user.login, '[bot]')
        )
      ) && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Wait for checks
        uses: actions-ecosystem/action-wait-for-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          intervalSeconds: 10
          timeoutSeconds: 5400
      - name: Auto-approve (safe scopes)
        if: |
          contains(github.event.pull_request.labels.*.name, 'bot') ||
          contains(github.event.pull_request.labels.*.name, 'docs') ||
          contains(github.event.pull_request.labels.*.name, 'workflows') ||
          contains(github.event.pull_request.labels.*.name, 'site')
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge (squash) when eligible
        uses: pascalgn/automerge-action@v0.16.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_LABELS: automerge
          MERGE_METHOD: squash
          MERGE_DELETE_BRANCH: "true"
          MERGE_BLOCK_LABELS: hold
