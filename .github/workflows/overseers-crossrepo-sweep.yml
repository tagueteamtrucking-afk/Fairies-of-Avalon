name: Overseers — Crossrepo Sweep

on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 2"  # weekly, Tue 05:37 UTC

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Guard: required config present
        if: ${{ !secrets.REPOS_READ_TOKEN || !vars.SECOND_REPO }}
        run: |
          echo "::error title=Missing configuration::Set repository secret REPOS_READ_TOKEN and repo variable SECOND_REPO (owner/repo)."
          exit 1

      - name: Checkout (primary)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout (second repo)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SECOND_REPO }}
          token: ${{ secrets.REPOS_READ_TOKEN }}
          path: _external

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Crossrepo sweep (generate report)
        run: node scripts/overseers/crossrepo-sweep.mjs
        env:
          SECOND_REPO_PATH: _external

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/apps/overseers/crossrepo.json || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(overseers): update crossrepo sweep"
            git push
          fi
