name: Repo - Read Full Index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build readouts
        shell: pwsh
        run: |
          pwsh -File scripts/Repo-Inventory.ps1
          pwsh -File scripts/Repo-Refs-Graph.ps1
          pwsh -File scripts/Repo-Usage-Report.ps1
          pwsh -File scripts/Repo-Read-All.ps1
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repo-readout
          path: |
            memory-history/repo-inventory.json
            memory-history/repo-refs.json
            memory-history/repo-usage-report.json
            memory-history/repo-read-index.json
      - name: Commit readouts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add memory-history/repo-*.json || true
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(read): repo readouts" && git push; fi
