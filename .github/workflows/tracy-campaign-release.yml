name: Tracy Campaign Release
on: { workflow_dispatch: {} }
permissions:
  contents: write
  pull-requests: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build campaign kit
        run: |
          mkdir -p artifacts/campaign
          echo "Campaign kit 2025-10-31 06:38:21" > artifacts/campaign/README.txt
      - uses: actions/upload-artifact@v4
        with: { name: tracy-campaign, path: artifacts/campaign }
      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'tracy: campaign kit'
          title: 'tracy: campaign kit'
          branch: ci/tracy-campaign-${{ github.run_id }}
          base: ${{ github.ref_name }}
