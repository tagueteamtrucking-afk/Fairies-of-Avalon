name: Nina — 3D Suite

on:
  workflow_dispatch:
    inputs:
      world:  { description: "World (optional; only for scene stubs)", required: false, type: string }
      combos: { description: "Max VRM×Wing combos to plan",             required: false, default: 12, type: number }

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Build VRM Index + Scene Stubs (parse ints safely)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $combosIn = "${{ inputs.combos }}"
          if ([string]::IsNullOrWhiteSpace($combosIn)) { $combosIn = '12' }
          [int]$combos = $combosIn

          $args = @{
            RepoRoot  = "$PWD"
            MaxCombos = $combos
          }

          $world = "${{ inputs.world }}"
          if (-not [string]::IsNullOrWhiteSpace($world)) {
            $args['World'] = $world
          }

          & "scripts/overseers/nina-3d-index.ps1" @args

      - name: Commit artifacts
        shell: bash
        run: |
          set -e
          git config user.name  "actions-bot"
          git config user.email "actions@github.com"
          git add -A pages/apps/overseers/vrm-index.json || true
          git add -A pages/apps/alexandria/worlds/3d 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Nina 3D: vrm-index + scene stubs"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
