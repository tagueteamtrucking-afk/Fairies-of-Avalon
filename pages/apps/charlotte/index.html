<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Charlotte — Finds</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px}li{margin:.25rem 0}</style></head>
<body>
  <h1>Charlotte — Useful Apps & Codes</h1>
  <div id="out" class="card">No data yet. Run the workflow “Charlotte — Curated Crawl”.</div>
  <script>
    fetch('./finds.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{
      if(!d) return;
      const out=document.getElementById('out');
      out.innerHTML='';
      d.items.forEach(g=>{
        const sec=document.createElement('section'); sec.className='card';
        const h=document.createElement('h3'); h.textContent=g.group; sec.appendChild(h);
        const ul=document.createElement('ul');
        g.links.forEach(x=>{
          const li=document.createElement('li');
          li.innerHTML = `<a href="${x.url}" target="_blank" rel="noopener">${x.title}</a> — ${x.note||''}`;
          ul.appendChild(li);
        });
        sec.appendChild(ul); out.appendChild(sec);
      });
    });
  </script>
</body>
</html>
