<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carol — Shopping List</title>
<style>
  :root{ --bg:#0b0f17; --ink:#e8ecf1; --stroke:rgba(255,255,255,0.12); --glass:rgba(255,255,255,0.04); --accent:#9cc1ff;}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  header{padding:16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--stroke);position:sticky;top:0;background:#0b0f17f2;backdrop-filter: blur(6px);}
  a.btn{color:var(--ink);text-decoration:none;border:1px solid var(--stroke);padding:8px 10px;border-radius:10px;font-weight:600}
  a.btn:hover{border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;padding:16px}
  .card{border:1px solid var(--stroke);background:var(--glass);border-radius:12px;padding:12px}
  .meta{opacity:.8;font-size:.95rem}
  .note{padding:10px;border:1px dashed var(--stroke);border-radius:10px;margin:12px}
  ul{margin:0 0 8px 18px}
</style>
</head>
<body>
<header>
  <a class="btn" href="/pages/apps/_city/index.html">🏰 City</a>
  <a class="btn" href="/pages/apps/carol/menu.html">🍽️ Menu</a>
  <span class="meta" id="srcMeta"></span>
</header>
<div id="status" class="note">Looking for shopping list…</div>
<section id="lists" class="grid" hidden></section>

<script>
const statusEl = document.getElementById('status');
const listsEl = document.getElementById('lists');
const srcMeta = document.getElementById('srcMeta');

async function loadJSON(url){
  const r = await fetch(url + '?v=' + Date.now());
  if(!r.ok) throw new Error('HTTP ' + r.status + ' for ' + url);
  return r.json();
}

function groupItems(items){
  // items: [{name, qty, unit, section?}]
  const map = new Map();
  for(const it of items){
    const key = (it.section||'Other') + '||' + (it.name||it.item||'item').toLowerCase();
    const prev = map.get(key) || {name: (it.name||it.item||'item'), qty:0, unit: it.unit||'', section: it.section||'Other'};
    const q = Number(it.qty||it.quantity||0);
    if(!isNaN(q)) prev.qty += q;
    map.set(key, prev);
  }
  // group by section
  const bySec = {};
  for(const v of map.values()){
    const sec = v.section||'Other';
    bySec[sec] = bySec[sec] || [];
    bySec[sec].push(v);
  }
  return bySec;
}

function renderGrouped(grouped){
  listsEl.innerHTML = '';
  const secs = Object.keys(grouped).sort();
  for(const s of secs){
    const card = document.createElement('article'); card.className='card';
    const h = document.createElement('h3'); h.textContent = s; card.appendChild(h);
    const ul = document.createElement('ul');
    for(const it of grouped[s]){
      const qty = it.qty ? String(Math.round((it.qty + Number.EPSILON)*100)/100) : '';
      const unit = it.unit ? (' ' + it.unit) : '';
      const li = document.createElement('li');
      li.textContent = (it.name||'item') + (qty? (': ' + qty + unit) : '');
      ul.appendChild(li);
    }
    card.appendChild(ul);
    listsEl.appendChild(card);
  }
  listsEl.hidden = false;
}

function tryInferFromPlan(plan){
  // look through days/meals for ingredient arrays
  let items = [];
  const scanNode = (node) => {
    if(!node) return;
    if(Array.isArray(node)){
      for(const x of node){ scanNode(x); }
      return;
    }
    if(typeof node === 'object'){
      // common keys
      for(const k in node){
        if(k.toLowerCase().includes('ingredient') || k.toLowerCase()==='shopping'){
          const v = node[k];
          if(Array.isArray(v)){
            for(const it of v){
              if(typeof it === 'string'){
                items.push({name: it});
              } else if(typeof it === 'object') {
                items.push({
                  name: it.name || it.item || it.ingredient || 'item',
                  qty:  it.qty || it.quantity || it.amount || 0,
                  unit: it.unit || it.units || ''
                });
              }
            }
          }
        }
      }
      for(const k in node){ scanNode(node[k]); }
    }
  };
  scanNode(plan);
  return items;
}

(async () => {
  try{
    let idx;
    try{ idx = await loadJSON('./index.json'); } catch(e){ idx = {}; }
    const qPath = idx.shopping_quantized || 'plans/shopping-quantized.json';
    const ePath = idx.shopping_extracted || 'plans/shopping-extracted.json';
    // Prefer quantized → extracted → infer from plan
    try {
      const q = await loadJSON(qPath);
      srcMeta.textContent = 'Source: ' + qPath;
      const grouped = groupItems(q.items || q || []);
      statusEl.remove(); renderGrouped(grouped); return;
    } catch(_){}
    try {
      const q = await loadJSON(ePath);
      srcMeta.textContent = 'Source: ' + ePath;
      const grouped = groupItems(q.items || q || []);
      statusEl.remove(); renderGrouped(grouped); return;
    } catch(_){}
    // Fallback: infer from plan
    const planPath = idx.current_plan || 'plans/twoperson-2wk-unique-20251015T022300Z.json';
    const plan = await loadJSON(planPath);
    const items = tryInferFromPlan(plan);
    if(items.length){
      srcMeta.textContent = 'Source: inferred from plan (' + planPath + ')';
      statusEl.remove(); renderGrouped(grouped = groupItems(items)); return;
    }
    throw new Error('No shopping files found and could not infer ingredients from plan. Run the "Carol — Extract Shopping" workflow.');
  }catch(err){
    statusEl.innerHTML = '⚠️ ' + err.message + '<br><br>' +
      '→ In Actions, run: <strong>Carol — Set Plan Pointer</strong> then <strong>Carol — Extract Shopping</strong>.';
  }
})();
</script>
</body>
</html>
