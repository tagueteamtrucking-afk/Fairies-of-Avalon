<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Clarice · Security & Snapshots</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/app.css">
  <style>
    body{margin:0} main{max-width:1100px;margin:28px auto;padding:0 12px}
    .pill{display:inline-block;padding:.35rem .7rem;border:1px solid #999;border-radius:.6rem;font-size:.9rem;text-decoration:none;color:inherit;background:#fff;margin-right:.4rem}
    .card{border:1px solid #eee;border-radius:.6rem;padding:14px;background:rgba(255,255,255,.85);margin-bottom:12px}
    pre{white-space:pre-wrap}
  </style>
</head>
<body>
  <main>
    <h1>Clarice · Security & Snapshots</h1>
    <p>
      <a class="pill" href="/.github/workflows/overseers-memory-snapshot.yml" target="_blank">Run: Memory Snapshot</a>
      <a class="pill" href="/.github/workflows/clarice-integrity.yml" target="_blank">Run: Integrity Report</a>
    </p>
    <section class="card">
      <h2>Latest Security Report</h2>
      <div id="out">Loading…</div>
    </section>
  </main>
<script type="module">
async function j(p){try{const r=await fetch(p+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return null; return await r.json();}catch{return null}}
const view=document.getElementById('out');
const data=await j('/apps/clarice/security-report.json');
if(!data){ view.innerHTML='<p><small>No report yet. Run the Integrity workflow.</small></p>'; }
else{
  view.innerHTML = `
    <p><b>Generated:</b> ${data.generated}</p>
    <p><b>Files scanned:</b> ${data.files.length}, <b>Suspicious:</b> ${data.suspicious.length}</p>
    <details><summary>Suspicious items</summary><pre>${JSON.stringify(data.suspicious,null,2)}</pre></details>
    <details open><summary>Scopes</summary><pre>${JSON.stringify(data.scopes,null,2)}</pre></details>
  `;
}
</script>
</body>
</html>
