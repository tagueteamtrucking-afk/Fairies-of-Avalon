name: Overseers — Repo Doctor
on:
  workflow_dispatch:
    inputs:
      apply_fixes:
        description: "Apply fixes (otherwise dry-run only)"
        required: false
        default: "false"
permissions: { contents: write }
jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Repo Doctor
        shell: pwsh
        run: |
          $apply = '${{ github.event.inputs.apply_fixes }}'
          if($apply -eq 'true'){ pwsh -File scripts/Repo-Doctor.ps1 -ApplyFixes }
          else { pwsh -File scripts/Repo-Doctor.ps1 }
      - name: Commit fixes (if any)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(repo): repo doctor applied fixes" && git push; fi
