name: 00-sanity
on: { workflow_dispatch: {} }
jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate starter content (Run-All)
        shell: pwsh
        run: pwsh -File scripts/Run-All.ps1 -WorldCount 3 -NonInteractive true
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with: { name: site, path: "pages/" }
