name: "Charlotte — Translate"
on:
  workflow_dispatch:
    inputs:
      text:
        description: "Source text (markdown supported)"
        required: true
      lang:
        description: "Target language (e.g., es, fr, ja)"
        required: true
        default: "es"
      title:
        description: "Title (for file name)"
        required: true
        default: "Sample"
      mode:
        description: "Mode"
        required: true
        default: "auto"
        type: choice
        options: ["auto","fallback-only"]
permissions:
  contents: write
jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup PowerShell + YAML
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module powershell-yaml -Scope CurrentUser -Force -AllowClobber
      - name: Translate
        shell: pwsh
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          $force = ("${{ github.event.inputs.mode }}" -eq "fallback-only")
          & "scripts/overseers/charlotte-translate.ps1" `
            -RepoRoot "${{ github.workspace }}" `
            -Text     @'
${{ github.event.inputs.text }}
'@ `
            -Lang     "${{ github.event.inputs.lang }}" `
            -Title    "${{ github.event.inputs.title }}" `
            -ForceFallback:$force
      - name: Commit (if changed)
        shell: pwsh
        run: |
          git add -A "pages/apps/charlotte/translations"
          $changes = git status --porcelain -- "pages/apps/charlotte/translations"
          if ([string]::IsNullOrWhiteSpace($changes)) { Write-Host "Nothing to commit."; }
          else {
            git config user.email "actions@github.com"
            git config user.name  "GitHub Actions"
            git fetch origin ${{ github.ref_name }} --prune
            git pull --rebase origin ${{ github.ref_name }} || echo "Nothing to rebase"
            git commit -m "Charlotte: add translation"
          }
      - name: Push
        uses: ad-m/github-push-action@77c5b412c50b723d2a4fbc6d71fb5723bcd439aa
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          force_with_lease: true
