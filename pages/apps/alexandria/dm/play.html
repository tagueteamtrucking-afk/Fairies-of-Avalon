<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alexandria — DM</title>
<link rel="stylesheet" href="dm.css"></head><body>
<header><h1>Alexandria — DM</h1><small>Connect Worker. Enable Mic & Audio. TTS on by default.</small></header>
<main>
  <section class="controls">
    <button id="roll-d20">d20</button><button id="roll-d12">d12</button><button id="roll-d10">d10</button><button id="roll-d8">d8</button><button id="roll-d6">d6</button><button id="roll-d4">d4</button>
    <span id="roll-out"></span>
  </section>
  <section class="chat">
    <div class="row">
      <button id="connect">Connect Worker</button>
      <button id="check">Check Worker</button>
      <label><input type="checkbox" id="tts" checked> TTS</label>
      <button id="enable-audio">Enable Audio</button>
      <button id="grant-mic">Grant Mic</button>
      <button id="ptt">🎙 Hold to Talk</button>
    </div>
    <div id="log"></div>
    <div class="composer">
      <input id="msg" placeholder="Say something to the DM...">
      <button id="send">Send</button>
    </div>
    <div class="actions">
      <button id="export">Export Session JSON</button>
      <button id="clear">Clear</button>
    </div>
  </section>
</main>
<footer><small>v2.0.0 — Voice & text via Cloudflare Worker (STT+TTS).</small></footer>
<script src="dm.js"></script>
</body></html>
