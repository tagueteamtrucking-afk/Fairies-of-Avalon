name: Jem Plan Sync
on:
  workflow_dispatch:
  push:
    paths:
      - 'pages/apps/jem/imports/**'
      - 'scripts/overseers/jem-program-plan.mjs'

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure unzip is available
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract Samsung Health exports
        shell: bash
        run: |
          set -euo pipefail
          BASE="pages/apps/jem/imports"
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/extracted"
          shopt -s nullglob
          for z in "$BASE"/*.zip; do
            echo "Extracting $z"
            unzip -q "$z" -d "$TMP/extracted"
          done
          echo "EXTRACTED_DIR=$TMP/extracted" >> $GITHUB_ENV
          echo "WHO=Ray,Blanca" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run parser
        run: node scripts/overseers/jem-program-plan.mjs

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Jem: update programs (parser)"
          title: "Jem: update programs (parser)"
          body: "Automated plan/index refresh from Samsung Health exports."
          add-paths: |
            pages/apps/jem/programs/*
