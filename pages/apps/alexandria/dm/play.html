<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Alexandria — DM</title><style>body{margin:0;font-family:system-ui;background:#0b0f17;color:#e5e7eb}header{padding:12px 16px;border-bottom:1px solid #172033}main{padding:16px}.chat{border:1px solid #172033;border-radius:8px;padding:12px;background:#0f172a}#log{height:48vh;overflow:auto;padding:8px;background:#0b1220;border:1px solid #172033;margin-bottom:8px}.msg{padding:6px 8px;margin:6px 0;border-radius:6px;max-width:82%}.msg.you{background:#1f2a44;margin-left:auto}.msg.dm{background:#192235}.composer{display:flex;gap:8px}.composer input{flex:1;padding:8px;border:1px solid #334155;border-radius:6px;background:#0b1220;color:#e5e7eb}.actions{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}.actions button{background:#111827;border:1px solid #334155;border-radius:8px;color:#e5e7eb;padding:8px 12px;cursor:pointer}</style></head><body>
<header><h1>Alexandria DM</h1><p>Use <b>Connect Worker</b> (no code edits).</p></header>
<main>
  <section class="chat">
    <div id="log"></div>
    <div class="composer"><input id="msg" placeholder="Say something..."><button id="send">Send</button></div>
    <div class="actions"><button id="connect">Connect Worker</button><button id="check">Check Worker</button><button id="export">Export</button><button id="clear">Clear</button></div>
  </section>
</main>
<script>
(async function(){
  let api = localStorage.getItem('ALEXANDRIA_API_URL') || '';
  const logEl = document.getElementById('log'); const input = document.getElementById('msg');
  function line(t,who){ const d=document.createElement('div'); d.className='msg '+(who||'dm'); d.textContent=t; logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight; }
  function play(s){ try{ new Audio(s).play().catch(()=>{});}catch(e){} }
  async function send(){ const text=input.value.trim(); if(!text) return; input.value=''; line(text,'you'); if(!api){ line('Offline: tap Connect Worker.','dm'); return; } try{ const r=await fetch(api,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,sessionId:Date.now().toString(36),tts:true,voice:'alloy'})}); const j=await r.json(); line(j.reply||'(no reply)','dm'); if(j.audio) play(j.audio);}catch(e){ line('LLM link failed.','dm'); } }
  document.getElementById('send').addEventListener('click', send);
  document.getElementById('msg').addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
  document.getElementById('connect').addEventListener('click', ()=>{ const u=prompt('Worker URL (e.g., https://alexandria-dm.tagueteamtrucking.workers.dev):', api||''); if(!u) return; api=u.trim(); localStorage.setItem('ALEXANDRIA_API_URL', api); line('Saved Worker URL.','dm'); });
  document.getElementById('check').addEventListener('click', async ()=>{ if(!api){ line('No Worker URL set.','dm'); return; } try{ const r=await fetch(api); line(r.ok?'Worker reachable ✔︎':'Worker error ❌','dm'); }catch(e){ line('Worker not reachable ❌','dm'); } });
  document.getElementById('export').addEventListener('click', ()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([logEl.innerText],{type:'text/plain'})); a.download='session.txt'; a.click(); });
  document.getElementById('clear').addEventListener('click', ()=>{ logEl.innerHTML=''; });
  line('Welcome. Paste Worker URL via Connect Worker.','dm');
})();</script></body></html>
