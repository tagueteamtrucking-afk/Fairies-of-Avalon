name: Nina — VRM Sanity
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: VRM sanity
        shell: pwsh
        run: pwsh -File scripts/Nina-VRM-Sanity.ps1
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/nina/vrm-sanity.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(nina): vrm sanity report" && git push; fi
