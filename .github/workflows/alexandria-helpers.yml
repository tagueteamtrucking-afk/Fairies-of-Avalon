name: Alexandria — Helpers Suite

on:
  workflow_dispatch:
    inputs:
      world:        { description: "World (auto-pick latest if empty)", required: false, type: string }
      per_town:     { description: "Notable figures per settlement", required: false, default: 3, type: number }
      force_fallback: { description: "Force offline (no LLM Bridge)", required: false, default: true, type: boolean }

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Install PowerShell YAML
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Install-Module powershell-yaml -Force -Scope CurrentUser -AllowClobber

      - name: Run Helpers Suite
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ff = [System.Convert]::ToBoolean("${{ inputs.force_fallback }}")
          & "scripts/overseers/alexandria-suite.ps1" `
            -RepoRoot "$PWD" `
            -World "${{ inputs.world }}" `
            -PerTown ${{ inputs.per_town }} `
            -ForceFallback:$ff

      - name: Commit artifacts
        shell: bash
        run: |
          set -e
          git config user.name "actions-bot"
          git config user.email "actions@github.com"
          git add -A pages/apps/alexandria/worlds
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Alexandria Helpers artifacts"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
