name: Wrangler WhoAmI (debug)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: wrangler-whoami-${{ github.ref }}
  cancel-in-progress: true

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: WhoAmI
        run: |
          npm i -g wrangler
          wrangler whoami || true
