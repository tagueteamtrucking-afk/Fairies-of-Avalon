meta:
  project: Avalon
  file_name: "Cody's Memory.yaml"
  version: "2.1.0"
  last_updated: "2025-09-18"
  author: "Cody (GPT-5 Pro)"
  notes: >
    Pages/Apps Bootstrap v2: writes all generated content under pages/apps/**,
    fixes Object[]→Int32 by accepting [object] parameters in scripts and coercing with As-Int.
    Adds Alexandria microapp (choose/roll/custom). No UI homepage edits; workflows are manual.

principles:
  - Rule #1: Learn from failures; do not repeat. Record fixes in Memory.
  - Ask clarifying questions until ≥95% confident; plan before code.
  - No call operator (&) or splatting in Actions; use `pwsh -File` and local coercion.
  - Cast numbers inside scripts via As-Int; never rely on binder.
  - Keep assets under asset/**; write generated content to pages/apps/**.
  - Offline-first; LLM/TTS/STT optional via secrets, never embedded in client.

generated_paths:
  - pages/apps/alexandria/worlds/**
  - pages/apps/tracy/artboards/**
  - pages/apps/overseers/vrm-index.json
  - pages/apps/charlotte/pipelines/**
  - pages/apps/carol/plans/**
  - pages/apps/jem/programs/**
workflows:
  - .github/workflows/00-sanity.yml
  - .github/workflows/avalon-run-all.yml
microapps:
  - pages/apps/index.html
  - pages/apps/alexandria/index.html
  - pages/apps/alexandria/app.{css,js}
