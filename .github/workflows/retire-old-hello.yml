name: Retire old hello workflow (PR)
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: If legacy hello workflow exists, delete it and open PR
        run: |
          set -e
          if [ -f ".github/workflows/deploy-hello.yml" ]; then
            git rm -f ".github/workflows/deploy-hello.yml"
            echo "Retiring old debug hello workflow" > retire.txt
          else
            echo "No legacy hello workflow found" > retire.txt
          fi
      - name: PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: retire old hello workflow"
          title: "chore: retire old hello workflow"
          branch: "ci/retire-hello-${{ github.run_id }}"
          base: "${{ github.ref_name }}"
          body: |
            Removing legacy 'Deploy Worker - hello (debug)' workflow in favor of the v4 deploy.
