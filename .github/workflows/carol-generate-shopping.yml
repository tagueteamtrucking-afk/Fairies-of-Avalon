name: Carol - Generate Shopping List (from current plan)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build shopping list JSON (2 people)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ptrPath = 'pages/apps/carol/index.json'
          if (!(Test-Path $ptrPath)) { throw "Pointer not found at $ptrPath" }
          $ptr = Get-Content $ptrPath -Raw | ConvertFrom-Json
          $plan = [string]$ptr.plan
          if ($plan.StartsWith('/')) { $plan = $plan.Substring(1) }
          if (!(Test-Path $plan)) { throw "Plan not found at $plan" }
          node scripts/carol/build-shopping.mjs --plan "$plan" --people 2
      - name: Commit shopping list
        run: |
          git config user.name "Carol Bot"
          git config user.email "actions@users.noreply.github.com"
          git add pages/apps/carol/plans/shopping-quantized.json || true
          git commit -m "Carol: refresh shopping list from plan" || echo "Nothing to commit"
          git push || echo "Nothing to push"
