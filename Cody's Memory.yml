governance:
  overseers:
    - id: rey_czar
      name: "Rey Czar"
      all_permissions: true
    - id: white_star
      name: "White Star"
      all_permissions: true

assistants:
  twins:
    - id: jem_nassim
      name: "Jem Nassim"
      constraints:
        environment: "truck_driver"
        space_m2_max: 2.5
        equipment: ["bodyweight","resistance_bands","door_anchor","truck_step","(optional) kettlebell <=16kg"]
        session_max_min: 20
        micro_blocks: true
        evidence_required: true
        pain_gate_max: 3
      handoff_to: "carol_li"
    - id: carol_li
      name: "Carol Li"
      rules:
        eu_first: true
        sodium_mg: 2000
        sodium_dash_low_mg: 1500
        added_sugars_pct_kcal: 10
        fiber_g_min: 25
        sat_fat_pct_kcal_max: 10
        evidence_required: true

runtime:
  defaults:
    openai_tts: true
    openai_model: "gpt-4.1"
