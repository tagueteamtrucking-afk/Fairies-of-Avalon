name: Overseers - Cross-Repo Sweep (second repo)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Clone second repo (requires vars.SECOND_REPO and secrets.REPOS_READ_TOKEN)
        if: ${{ secrets.REPOS_READ_TOKEN != '' && vars.SECOND_REPO != '' }}
        run: |
          git clone https://x-access-token:${{ secrets.REPOS_READ_TOKEN }}@github.com/${{ vars.SECOND_REPO }} _second
      - name: Run sweep on second repo
        if: ${{ hashFiles('_second/**') != '' }}
        env:
          INPUT_DIR: _second
          OUT_FILE_INDEX: memory/second-repo-index.json
        run: node scripts/overseers/repo-sweep.mjs
      - name: Commit changes (if any)
        run: |
          git config user.name "Overseers Bot"
          git config user.email "actions@users.noreply.github.com"
          git add memory/second-repo-index.json pages/apps/overseers/progress.json || true
          git commit -m "Cross-Repo Sweep: second repo files index" || echo "Nothing to commit"
          git push || echo "Nothing to push"
