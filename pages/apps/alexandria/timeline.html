<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Alexandria · Timeline Builder</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/app.css" />
  <style>
    body{margin:0} main{max-width:1100px;margin:28px auto;padding:0 12px}
    .card{border:1px solid #eee;border-radius:.6rem;padding:14px;background:#fff;margin-bottom:12px}
    .pill{display:inline-block;padding:.35rem .7rem;border:1px solid #999;border-radius:.6rem;background:#fff;cursor:pointer}
    table{width:100%;border-collapse:collapse} th,td{border-bottom:1px solid #eee;padding:6px;text-align:left}
  </style>
</head>
<body>
<main>
  <h1>Alexandria · Timeline Builder</h1>
  <div class="card">
    <div>
      <a class="pill" href="/apps/alexandria/knowledge/choices.html">Choices Library</a>
      <a class="pill" href="/.github/workflows/alexandria-timeline.yml" target="_blank">Run: Build Timeline</a>
    </div>
    <p>Load a seed, then set event count, acts, and tags. Use 🎲 to roll from Choices.</p>
    <div>
      <input id="seedUrl" style="width:60%" placeholder="/apps/alexandria/worlds/seed-....json"/>
      <button id="loadSeed" class="pill">Load</button>
    </div>
  </div>

  <div class="card">
    <label>Events:</label> <input id="count" type="number" min="3" max="12" value="7" style="width:90px"/>
    <button id="apply" class="pill">Apply</button>
    <table id="tab"><thead><tr><th>#</th><th>Act</th><th>Name</th><th>Tag</th><th>🎲</th></tr></thead><tbody></tbody></table>
  </div>

  <div class="card">
    <button id="download" class="pill">Download timeline.json</button>
  </div>
</main>

<script type="module">
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
let seed=null, tags=[]; let rows=[];
async function j(u){ const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw 0; return r.json(); }
async function loadTags(){ try{ const t=await j('/apps/alexandria/knowledge/timeline-taxonomy.json'); tags=t.event_tags||[]; }catch{ tags=['hook','contact','threshold','rival','revelation','climax','resolution']; } }
function ensure(n){ while(rows.length<n) rows.push({ act:'I', name:'', tag:'' }); while(rows.length>n) rows.pop(); render(); }
function render(){
  const body=$("#tab tbody");
  body.innerHTML = rows.map((r,i)=>`<tr>
    <td>${i+1}</td>
    <td><select data-i="${i}" data-f="act"><option ${r.act==='I'?'selected':''}>I</option><option ${r.act==='II'?'selected':''}>II</option><option ${r.act==='III'?'selected':''}>III</option></select></td>
    <td><input data-i="${i}" data-f="name" placeholder="Event name" value="${r.name||''}"/></td>
    <td><select data-i="${i}" data-f="tag"><option value=""></option>${tags.map(t=>`<option ${r.tag===t?'selected':''}>${t}</option>`).join('')}</select></td>
    <td><button class="pill roll" data-i="${i}">🎲</button></td>
  </tr>`).join('');
  $$("#tab input, #tab select").forEach(el => el.onchange = e => { const i=+e.target.dataset.i; rows[i][e.target.dataset.f]=e.target.value; });
  $$("#tab .roll").forEach(btn => btn.onclick = ()=>{ const i=+btn.dataset.i; rows[i].tag = tags[Math.floor(Math.random()*Math.max(1,tags.length))]||''; render(); });
}
$("#apply").onclick = ()=> ensure(Math.max(3, Math.min(12, +$("#count").value||7)));
document.getElementById('download').onclick=()=>{
  const out = { id:'timeline-'+Date.now().toString(36), seed_id: seed?.id||null, title: seed?.title||'World', format_version:'1.0.0', events: rows };
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'})); a.download='timeline.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
};
document.getElementById('loadSeed').onclick=async()=>{ try{ seed=await j($("#seedUrl").value.trim()); }catch{ alert('Could not load seed'); } };
await loadTags();
ensure(7);
</script>
</body>
</html>
