name: Alexandria DM Setup
on: { workflow_dispatch: {} }
jobs:
  dm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure DM folder
        run: |
          mkdir -p pages/apps/alexandria/logs
          if [ ! -f pages/apps/alexandria/index.html ]; then
            echo '<!doctype html><meta charset=utf-8><title>Alexandria DM</title><h2>Alexandria — World Builder</h2>' > pages/apps/alexandria/index.html
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alexandria-dm
          path: pages/apps/alexandria
      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'alexandria: ensure DM scaffold'
          title: 'alexandria: ensure DM scaffold'
          branch: ci/alexandria-dm-${{ github.run_id }}
          base: ${{ github.ref_name }}
