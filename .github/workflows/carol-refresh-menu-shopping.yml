name: Carol — Refresh Menu & Shopping

on:
  workflow_dispatch:
    inputs:
      plan_path:
        description: 'Optional: override plan JSON path. Leave blank to use pointer index.json.'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve plan path (from input or pointer)
        id: resolve
        run: |
          $override = '${{ github.event.inputs.plan_path }}'
          if ([string]::IsNullOrWhiteSpace($override)) {
            $ptr = Get-Content 'pages/apps/carol/index.json' -Raw | ConvertFrom-Json
            $plan = $ptr.plan_latest
          } else {
            $plan = $override
          }
          if (-not (Test-Path $plan)) { throw "Plan file not found: $plan" }
          "plan=$plan" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          # Back-compat: v3 extractor expects this filename
          Copy-Item -Force $plan 'pages/apps/carol/plans/twoperson-2wk-merged.json'

      - name: Extract shopping (v3 script)
        run: ./scripts/Carol-Extract-Shopping-v3.ps1

      - name: Create PR with refreshed shopping
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: |
            Carol: refresh shopping from ${{ steps.resolve.outputs.plan }}
          title: "Carol: refresh shopping"
          body: |
            - Source plan: `${{ steps.resolve.outputs.plan }}`
            - Back-compat copy created at `pages/apps/carol/plans/twoperson-2wk-merged.json` for v3 extractor
          branch: carol/refresh-shopping
          add-paths: |
            pages/apps/carol/plans/shopping-*.json
            pages/apps/carol/plans/twoperson-2wk-merged.json
