<!doctype html><link id=avalon-skin rel=stylesheet href=./avalon-default.css><link rel=stylesheet href=../_shared/ui.css><h1>Tracy — Skin Switcher</h1><button class=btn data-skin=avalon-default.css>Default</button><script type=module>const l=document.getElementById('avalon-skin');document.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{l.href='./'+b.dataset.skin;localStorage.setItem('avalon-skin',l.href)});const s=localStorage.getItem('avalon-skin');if(s)l.href=s;</script>
