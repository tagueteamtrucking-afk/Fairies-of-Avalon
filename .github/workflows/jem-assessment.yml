name: Jem Assessment Import
on: { workflow_dispatch: {} }
permissions: { contents: write, pull-requests: write }
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build/update plan-latest.json
        run: |
          mkdir -p pages/apps/jem/data
          echo '{"generated":"${{ github.run_id }}"}' > pages/apps/jem/data/plan-latest.json
      - uses: actions/upload-artifact@v4
        with: { name: jem-plan, path: pages/apps/jem/data/plan-latest.json }
      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'jem: assessment → plan-latest.json'
          title: 'jem: assessment → plan-latest.json'
          branch: ci/jem-assessment-${{ github.run_id }}
          base: ${{ github.ref_name }}
