name: Tracy - Wallpaper Theme
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  wallpaper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick hero wallpaper and write CSS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages/apps/_city
          hero="$(ls -1 asset/textures/wallpapers/* 2>/dev/null | head -n 1 || true)"
          if [ -z "$hero" ]; then echo "No wallpapers in asset/textures/wallpapers"; exit 0; fi
          cat > pages/apps/_city/theme.css <<CSS
          :root{ --hero:url(/${hero}); }
          .wrap{ background-image: var(--hero); background-size: cover; background-position:center; }
          CSS
      - name: Commit theme
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/_city/theme.css || true
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "feat(tracy): wallpaper theme" && git push; fi
