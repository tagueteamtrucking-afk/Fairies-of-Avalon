<!doctype html><meta charset="utf-8"><title>Kill SW</title><pre id=p>Stopping service workers…</pre><script>
(async()=>{const regs=await navigator.serviceWorker?.getRegistrations?.()||[];for(const r of regs){try{await r.unregister()}catch{}}
document.getElementById('p').textContent='All service workers unregistered. Hard-refresh this page.';})();
</script>
