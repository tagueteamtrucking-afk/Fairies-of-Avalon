<!doctype html>
<html lang="en" data-required-role="user">

          border:1px solid #282828;border-radius:12px;min-height:120px;text-decoration:none;box-shadow:0 6px 16px rgba(0,0,0,.25)}
    .tile img{width:56px;height:56px;object-fit:cover;border-radius:8px;margin-bottom:8px}
    .tile span{font-weight:600}
    .note{padding:8px 16px;color:#aaa;font-size:0.9rem}
  </style>
</head>
