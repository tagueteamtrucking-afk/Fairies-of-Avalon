<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carol – Shopping List</title>
  <link rel="stylesheet" href="../../../style.css">
</head>
<body class="carol-inside">
  <div class="wrap">
    <h1 class="heading">Shopping List</h1>
    <p class="lead">This list aggregates all ingredients from the weekly meal plan. Check items off as you shop.</p>
    <div id="list"></div>
    <button id="reset">Reset purchased items</button>
    <p><a href="index.html">← back to Carol</a></p>
  </div>
  <script>
    // Reuse the same mealPlan definition from meal-plan.html by reconstructing it here.
    const day1 = [
      {ingredients: ['0.5 cup rolled oats','1 tbsp chia seeds','0.75 cup lactose‑free milk','0.5 cup frozen mixed berries']},
      {ingredients: ['1 apple','2 tbsp peanut butter']},
      {ingredients: ['4 oz cooked chicken breast','0.5 avocado','6 butter lettuce leaves','1 tsp olive oil','1 tsp lemon juice']},
      {ingredients: ['3 tbsp hummus (no cumin)','0.5 cup cucumber','0.5 cup steamed carrots']},
      {ingredients: ['0.75 cup lactose‑free Greek yogurt','0.5 cup pineapple (drained)']},
      {ingredients: ['5 oz salmon fillet','2 tsp olive oil','2 cup mixed vegetables (frozen)','0.25 lemon','0.5 tsp garlic powder']},
      {ingredients: ['1 banana','1 cup spinach','0.75 cup lactose‑free milk','1 tbsp ground flaxseed']}
    ];
    const day2 = [
      {ingredients: ['0.75 cup lactose‑free cottage cheese','0.5 cup peach (drained)','2 tbsp rolled oats']},
      {ingredients: ['2 rice cakes','1.5 tbsp peanut butter','0.5 banana']},
      {ingredients: ['1 soft whole‑wheat tortilla','3 oz turkey breast (low sodium)','1 cup spinach','1 tbsp lactose‑free cream cheese']},
      {ingredients: ['1 ripe pear','1 oz slivered almonds']},
      {ingredients: ['1.25 cup low‑sodium tomato soup','1 tsp olive oil']},
      {ingredients: ['5 oz chicken breast','0.25 cup light panko','Olive oil spray']},
      {ingredients: ['0.75 cup frozen berries','0.75 cup lactose‑free milk','1 tsp unsweetened cocoa']}
    ];
    // Build a 14-day meal plan and aggregate ingredients for two people.  Odd
    // numbered days use day1 and even days use day2.  Each ingredient is
    // multiplied by the number of occurrences times the number of persons.
    const mealPlan = {
      'Day 1': day1,
      'Day 2': day2,
      'Day 3': day1,
      'Day 4': day2,
      'Day 5': day1,
      'Day 6': day2,
      'Day 7': day1,
      'Day 8': day2,
      'Day 9': day1,
      'Day 10': day2,
      'Day 11': day1,
      'Day 12': day2,
      'Day 13': day1,
      'Day 14': day2
    };
    const persons = 2;
    // Aggregate quantities by parsing numeric values where possible.
    const aggregate = {};
    Object.values(mealPlan).forEach(day => {
      day.forEach(item => {
        item.ingredients.forEach(ing => {
          const key = ing.trim();
          // Try to parse a quantity and unit
          const m = key.match(/^([0-9]*\.?[0-9]+)\s*([a-zA-Z\u00C0-\u024F\.]+)\s+(.*)$/);
          if (m) {
            const qty = parseFloat(m[1]);
            const unit = m[2];
            const name = m[3];
            const id = name.toLowerCase() + '_' + unit.toLowerCase();
            if (!aggregate[id]) {
              aggregate[id] = { name, unit, quantity: 0 };
            }
            aggregate[id].quantity += qty;
          } else {
            // No quantity found; treat the whole string as an item count
            const id = key.toLowerCase();
            if (!aggregate[id]) {
              aggregate[id] = { name: key, unit: null, quantity: 0, count: 0 };
            }
            aggregate[id].count = (aggregate[id].count || 0) + 1;
          }
        });
      });
    });
    // Multiply quantities by the number of persons
    Object.values(aggregate).forEach(item => {
      if (item.quantity) {
        item.quantity *= persons;
      } else if (item.count) {
        item.count *= persons;
      }
    });
    // Special conversion: convert spinach cups to 8 oz bags.  One 8 oz bag (~227g) of spinach is roughly 7.5 cups raw.
    function convertSpinach(item) {
      const cupsPerBag = 7.5;
      const bags = Math.ceil(item.quantity / cupsPerBag);
      return bags;
    }
    const listDiv = document.getElementById('list');
    const PURCHASED_KEY = 'shoppingPurchased';
    const purchased = JSON.parse(localStorage.getItem(PURCHASED_KEY) || '{}');
    function render() {
      const entries = Object.values(aggregate);
      const html = entries.sort((a,b) => a.name.localeCompare(b.name)).map(item => {
        let label;
        if (item.unit && item.quantity) {
          const quantity = Math.round(item.quantity * 100) / 100;
          // For spinach convert to bag count
          if (item.name.toLowerCase().includes('spinach') && item.unit.toLowerCase() === 'cup') {
            const bags = convertSpinach(item);
            label = `${bags} bag(s) (8 oz) spinach`;
          } else {
            label = `${quantity} ${item.unit} ${item.name}`;
          }
        } else if (item.count) {
          label = `${item.count} x ${item.name}`;
        } else {
          label = item.name;
        }
        const checked = purchased[label] ? 'checked' : '';
        return `<div class="shopping-item"><input type="checkbox" data-label="${label}" ${checked}> <span${purchased[label] ? ' style="text-decoration: line-through; color: var(--muted);"' : ''}>${label}</span></div>`;
      }).join('');
      listDiv.innerHTML = html;
    }
    render();
    listDiv.addEventListener('change', e => {
      if (e.target.type === 'checkbox') {
        const label = e.target.dataset.label;
        purchased[label] = e.target.checked;
        localStorage.setItem(PURCHASED_KEY, JSON.stringify(purchased));
        render();
      }
    });
    document.getElementById('reset').addEventListener('click', () => {
      localStorage.removeItem(PURCHASED_KEY);
      Object.keys(purchased).forEach(key => { delete purchased[key]; });
      render();
    });
  </script>
</body>
</html>
