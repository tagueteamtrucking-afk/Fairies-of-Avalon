name: Overseers - Repo Sweep (files index + WPI + manifests)
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '.github/workflows/**'
permissions:
  contents: write
concurrency:
  group: 'repo-sweep'
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run sweep
        run: node scripts/overseers/repo-sweep.mjs
      - name: Commit changes (if any)
        run: |
          git config user.name "Overseers Bot"
          git config user.email "actions@users.noreply.github.com"
          git add memory/file-index.json memory/deadends.json asset/models/models.json asset/wings/manifest.json pages/apps/overseers/progress.json || true
          git commit -m "Repo Sweep: files index + WPI + manifests + deadends" || echo "Nothing to commit"
          git push || echo "Nothing to push"
