name: Jem — Merge Progress Logs
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge progress
        shell: pwsh
        run: pwsh -File scripts/Jem-Merge-Progress.ps1 -LogsDir "pages/apps/jem/logs" -Output "pages/apps/jem/programs/progress.json"
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/jem/programs/progress.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(jem): merge progress logs" && git push; fi
