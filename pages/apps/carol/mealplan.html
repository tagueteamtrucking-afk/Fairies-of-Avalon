<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Carol • 2‑Week Meal Plan</title>
  <link rel="stylesheet" href="/assets/css/avalon.css">
</head>
<body>
  <div class="container">
    <div class="building-skin" id="phoenixSkin" data-character="carol" data-side="inside">
      <div class="overlay"></div>
      <div class="badge">Phoenix Kitchen</div>
    </div>

    <div class="header">
      <h1>2‑Week Meal Plan</h1>
      <div class="controls">
        <label for="daySelect">Day</label>
        <select id="daySelect" class="select"></select>
        <button id="toggleSide" class="button" title="Toggle inside/outside skin">Toggle Skin</button>
      </div>
    </div>

    <div id="summary" class="meta"></div>
    <div id="cards" class="grid" aria-live="polite"></div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal">
      <button class="close button" id="modalClose" aria-label="Close">Close</button>
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="/pages/js/avalon-skins.js"></script>
  <script src="/pages/js/mealplan.js"></script>
  <script>
    // Apply Carol's building skin
    window.AvalonSkins.apply(document.getElementById('phoenixSkin'));
    // Initialize meal plan
    window.CarolMealPlan.init();
  </script>
</body>
</html>
