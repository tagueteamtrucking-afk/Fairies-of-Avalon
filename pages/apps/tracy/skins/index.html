<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tracy • Skins & Variables</title>
<link rel="stylesheet" href="/pages/apps/tracy/skins/variables.css">
<link rel="stylesheet" href="/pages/apps/tracy/skins/base.css">
</head>
<body>
<div class="wrap">
  <h2>🎨 Tracy • Skins & Variables</h2>
  <p>Select a theme; all cards adopt symbols/variables instantly.</p>
  <p>
    <button class="btn" onclick="setTheme('')">Default</button>
    <button class="btn" onclick="setTheme('theme-autumn')">Autumn</button>
    <button class="btn" onclick="setTheme('theme-noir')">Noir</button>
  </p>
  <div class="grid">
    <div class="card"><strong>Poster</strong><br><span class="badge">Art 2D</span></div>
    <div class="card"><strong>T‑shirt</strong><br><span class="badge">Art 2D</span></div>
    <div class="card"><strong>3D Asset</strong><br><span class="badge">Art 3D</span></div>
    <div class="card"><strong>Web Skin</strong><br><span class="badge">Skin</span></div>
  </div>
  <p style="margin-top:12px"><a href="/index.html">⬅ Home</a></p>
</div>
<script>
function setTheme(name){
  document.documentElement.className = name||'';
  localStorage.setItem('TRACY_THEME', name||'');
}
document.documentElement.className = localStorage.getItem('TRACY_THEME')||'';
</script>
</body>
</html>
