name: "Queue — Phase 1 (A1–A3)"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed-phase-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup PowerShell + YAML
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module powershell-yaml -Scope CurrentUser -Force -AllowClobber
          Import-Module powershell-yaml

      - name: Enqueue A1–A3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "${{ github.workspace }}"
          $req  = Join-Path $root "requests"
          New-Item -ItemType Directory -Force -Path $req | Out-Null

          function Write-Req($obj, $name) {
            $ts   = Get-Date -AsUTC
            $obj.ts = $ts.ToString("o")
            $yaml = ConvertTo-Yaml $obj
            $fn   = "{0}-{1}.request.yml" -f $ts.ToString("yyyyMMddTHHmmssZ"), $name
            Set-Content -Path (Join-Path $req $fn) -Value $yaml -Encoding utf8NoBOM
            Write-Host "Queued: $fn"
          }

          $memPath = Join-Path $root "Cody's Memory.yaml"
          $mem     = (Get-Content -Raw -Path $memPath) | ConvertFrom-Yaml
          $avatars = @($mem.avatars_present)

          # A1 — Create microapps for all Fairies (no modules yet)
          Write-Req @{
            id="A1"; action="create_microapps"; params=@{ avatars=$avatars }
            actor="rey_czar"; routing="overseers"
          } "create-microapps"

          # A3 — Build manifests + WPI
          Write-Req @{
            id="A3"; action="build_manifests"; actor="clarice"; routing="overseers"
          } "build-manifests"

          git add requests
          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"
          git fetch origin ${{ github.ref_name }} --depth=0
          git pull --rebase origin ${{ github.ref_name }} || echo "Nothing to rebase"
          git commit -m "Queue: Phase-1 (A1 create_microapps, A3 build_manifests)" || echo "Nothing to commit"

      - name: Push
        uses: ad-m/github-push-action@77c5b412c50b723d2a4fbc6d71fb5723bcd439aa
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          force_with_lease: true
