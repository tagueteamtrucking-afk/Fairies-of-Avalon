name: Charlotte Crawl
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: echo ok
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: create-pull-request/Charlotte Crawl
          commit-message: "Charlotte Crawl: automated update"
          title: "Charlotte Crawl: automated update"
          body: "Automated update by workflow."
          add-paths: |
            pages/**
