<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VRM Viewer</title>
<style>html,body{margin:0;height:100%;background:#0b0f17;color:#e5e7eb}#c{width:100%;height:100%}#ui{position:fixed;top:8px;left:8px;display:flex;gap:6px;z-index:5}</style>
<script type="importmap">{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.0.2/lib/three-vrm.module.js"
  }
}</script>
</head><body>
<div id="ui">
  <input id="src" placeholder="/asset/winged-models/Your.vrm" size="38">
  <button id="load">Load</button>
</div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
renderer.setSize(window.innerWidth, window.innerHeight);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0f17);
const camera = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1.3, 3.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,1.2,0); controls.update();

const light = new THREE.DirectionalLight(0xffffff, 1.0);
light.position.set(1,1,1);
scene.add(light); scene.add(new THREE.AmbientLight(0xffffff, 0.35));

let currentVRM = null;
function disposeVRM(){ if(currentVRM){ scene.remove(currentVRM.scene); VRMUtils.deepDispose(currentVRM.scene); currentVRM=null; } }
async function loadVRM(url){
  try{
    disposeVRM();
    const loader = new GLTFLoader();
    loader.register((parser)=>new VRMLoaderPlugin(parser));
    const gltf = await loader.loadAsync(url);
    const vrm = gltf.userData.vrm;
    VRMUtils.rotateVRM0(vrm);
    scene.add(vrm.scene);
    currentVRM = vrm;
  }catch(e){ console.error(e); alert('Failed to load VRM: '+e.message); }
}
function animate(){ requestAnimationFrame(animate); renderer.render(scene,camera); } animate();
window.addEventListener('resize', ()=>{ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); });
const q = new URLSearchParams(location.search);
const initial = q.get('src') || '/asset/winged-models/Reyczar.vrm';
document.getElementById('src').value = initial;
document.getElementById('load').addEventListener('click', ()=>loadVRM(document.getElementById('src').value.trim()));
loadVRM(initial);
</script>
</body></html>
