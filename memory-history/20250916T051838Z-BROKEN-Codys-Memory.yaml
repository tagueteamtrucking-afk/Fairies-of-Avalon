lessons_learned:
  - "Memory file must be valid YAML; validate pre-commit to avoid Get-YamlDocuments parse errors."
  - "PowerShell on Actions may not include ConvertFrom-Yaml — always auto-install powershell-yaml."
  - "Avoid LINQ static calls in cross-OS PS; use pure pipeline/set ops."
  - "JSON depth on ConvertTo-Json is capped at 100 in PS7 — never exceed."
  - "Linux-safe quoting: use single-quoted strings; double any internal single quotes. Avoid backtick `u sequences in here-strings."
  - "Do not include type casts like [int]"7" in YAML inputs; pass native numbers."
  - "Guard missing properties (e.g., cfg.telemetry) — check property existence before access."
  - "Create directories (worlds/*) with .gitkeep so jobs never fail on 'No seeds directory found'."
  - "Treat 'Nothing to commit' as success in workflows (do not fail the job)."
  - "Rate limits (OpenAI): LLM optional; workflows must succeed offline (fallback)."
  - "Site regression noted: landing wallpaper lost; VRM viewer dropdowns unhooked — fix queued under site_theme_fix."
