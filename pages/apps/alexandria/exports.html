<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Alexandria · World Exports</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/app.css" />
  <style>
    body{margin:0} main{max-width:860px;margin:28px auto;padding:0 12px}
    .card{border:1px solid #eee;border-radius:.6rem;padding:14px;background:#fff;margin-bottom:12px}
    .pill{display:inline-block;padding:.35rem .7rem;border:1px solid #999;border-radius:.6rem;background:#fff;cursor:pointer}
    table{width:100%;border-collapse:collapse} th,td{border-bottom:1px solid #eee;padding:6px;text-align:left}
  </style>
</head>
<body>
<main>
  <h1>Alexandria · World Exports</h1>
  <div class="card">
    <a class="pill" href="/.github/workflows/alexandria-export.yml" target="_blank">Run: Export WorldBundle</a>
  </div>
  <div class="card">
    <table id="tab"><thead><tr><th>Bundle</th><th>Size (KB)</th><th>Time</th></tr></thead><tbody></tbody></table>
  </div>
</main>
<script type="module">
const $=s=>document.querySelector(s);
async function j(u){ const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw 0; return r.json(); }
async function main(){
  try{
    const idx = await j('/apps/alexandria/worlds/exports/index.json');
    const body = document.querySelector('#tab tbody');
    body.innerHTML = idx.slice().reverse().map(e=>`<tr>
      <td><a href="${e.path}">${e.path.split('/').pop()}</a></td>
      <td>${Math.round((e.size||0)/1024)}</td>
      <td>${e.ts}</td>
    </tr>`).join('');
  }catch{
    document.querySelector('#tab tbody').innerHTML = '<tr><td colspan="3">No exports yet.</td></tr>';
  }
}
main();
</script>
</body>
</html>
