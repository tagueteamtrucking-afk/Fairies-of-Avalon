name: Alexandria — DM World Packs
on: { workflow_dispatch: { inputs: { worlds: { description: 'How many?', default: 1, type: number } } } }
jobs:
  dm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate DM packs
        env: { OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}, OPENAI_MODEL: ${{ vars.OPENAI_MODEL }} }
        shell: pwsh
        run: pwsh -File scripts/Alexandria-DM-LLM.ps1 -Worlds ${{ inputs.worlds }}
      - name: Validate packs
        shell: pwsh
        run: pwsh -File scripts/Alexandria-Validate.ps1
      - name: Commit packs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/alexandria/dm/
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "feat(alexandria): DM packs" && git push; fi
