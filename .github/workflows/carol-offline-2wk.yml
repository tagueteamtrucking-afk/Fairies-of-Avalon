name: Carol — Offline 2 Week Fallback (no API)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate offline plan
        shell: pwsh
        run: pwsh -File scripts/Carol-Offline-2wk.ps1 -KcalA 1800 -KcalB 1600 -Region "EU" -Pattern "DASH"
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/carol/plans/
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "feat(carol): offline 2-week fallback" && git push; fi
