name: Carol — Refresh Menu & Shopping
on:
  workflow_dispatch:
    inputs:
      plan_path:
        description: "Path to the 14-day plan JSON to use as the source"
        default: "pages/apps/carol/plans/twoperson-2wk-unique-20251015T022300Z.json"
        required: false
permissions:
  contents: write
  pull-requests: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare merged plan & pointers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $plan = "${ github.event.inputs.plan_path }"
          if ([string]::IsNullOrWhiteSpace($plan)) { $plan = "pages/apps/carol/plans/twoperson-2wk-unique-20251015T022300Z.json" }
          if (!(Test-Path $plan)) {
            Write-Host "::group::Available plans in repo"
            Get-ChildItem -Path pages/apps/carol/plans -Filter *.json -Recurse | ForEach-Object { $_.FullName }
            Write-Host "::endgroup::"
            throw "Plan not found: $plan"
          }
          New-Item -ItemType Directory -Force -Path "pages/apps/carol/plans" | Out-Null
          Copy-Item -Path $plan -Destination "pages/apps/carol/plans/twoperson-2wk-merged.json" -Force

          $idx = @{ 
            plan_path      = "plans/twoperson-2wk-merged.json"
            fallback_paths = @($plan, "plans/mealplan-dash-14d-current.json")
            shopping_path  = "plans/shopping-quantized.json"
            images         = @{ 
              hero     = "/asset/textures/wallpapers/carol-interior.jpg"
              menu_bg  = "/asset/textures/wallpapers/carol-menu-bg.jpg"
              building = "/asset/textures/wallpapers/carol-pagoda.jpg"
            }
          } | ConvertTo-Json -Depth 6
          Set-Content -Path "pages/apps/carol/index.json" -Value $idx -Encoding UTF8

      - name: Extract shopping (PowerShell)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -File scripts/Carol-Extract-Shopping-v3.ps1

      - name: Commit changes (attempt direct to main)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add pages/apps/carol/index.json pages/apps/carol/plans/twoperson-2wk-merged.json pages/apps/carol/plans/shopping-quantized.json
          if ((git diff --cached --name-only).Length -eq 0) {
            Write-Host "No changes to commit"
            exit 0
          }
          git commit -m "Carol: refresh merged plan + shopping list"
          try {
            git push origin HEAD:main
            Write-Host "Pushed direct to main."
          } catch {
            Write-Host "Direct push failed, creating a PR branch..."
            $branch = "carol/refresh-20251021T064919Z"
            git checkout -b $branch
            git push origin $branch
          }

      - name: Open PR (best-effort)
        if: ${{ failure() != true }}
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Carol: refresh merged plan + shopping"
          commit-message: "Carol: refresh merged plan + shopping list"
          branch: "carol/refresh-20251021T064919Z"
          delete-branch: true
          body: |
            Auto-generated update to refresh merged plan and shopping list.
