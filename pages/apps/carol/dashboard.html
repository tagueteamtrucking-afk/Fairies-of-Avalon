<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carol — Nutrition Dashboard</title>
<link rel="stylesheet" href="../../assets/css/avalon-dashboard.css">
</head><body>
<header class="av-head"><div class="wrap">
  <h1>🍎 Carol — Nutrition Dashboard</h1>
  <p class="sub">Live view of plan & shopping. Source of truth: <code>pages/apps/carol/</code> JSON files.</p>
</div></header>
<main class="wrap grid">
  <section class="card">
    <h2>Plan Report</h2>
    <pre id="planReport" class="mono muted">Loading plan-report.json…</pre>
  </section>
  <section class="card">
    <h2>Shopping (Quantized)</h2>
    <table id="shop" class="table"><thead><tr><th>Item</th><th>Qty</th><th>Notes</th></tr></thead><tbody></tbody></table>
    <div id="shopEmpty" class="muted" hidden>shopping-quantized.json was empty.</div>
  </section>
  <section class="card">
    <h2>Preferences</h2>
    <pre id="prefs" class="mono muted">Loading preferences.json…</pre>
  </section>
</main>

<script type="module">
async function loadJSON(p){ try{ const r=await fetch(p+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error(r.status); return await r.json(); }catch(e){ return null; } }

const rep = await loadJSON('../carol/plan-report.json');
document.getElementById('planReport').textContent = rep ? JSON.stringify(rep,null,2) : 'plan-report.json not found. Run “Carol Refresh (shopping & report)”.';

const shop = await loadJSON('../carol/shopping-quantized.json');
const tbody = document.querySelector('#shop tbody');
if (shop && Array.isArray(shop.items) && shop.items.length){
  tbody.innerHTML = shop.items.slice(0,500).map(x=>`<tr><td>${(x.name||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}</td><td>${x.qty||''}</td><td>${x.notes||''}</td></tr>`).join('');
}else{
  document.getElementById('shopEmpty').hidden = false;
}

const prefs = await loadJSON('../carol/profile/preferences.json');
document.getElementById('prefs').textContent = prefs ? JSON.stringify(prefs,null,2) : 'preferences.json not found. Open Phoenix to save.';
</script>
</body></html>
