<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carol — Preferences</title>
<style>body{font-family:system-ui;background:#0b0f17;color:#e5e7eb;margin:0}header{padding:12px 16px;border-bottom:1px solid #172033}main{padding:16px}input,textarea,button{background:#111827;border:1px solid #334155;border-radius:8px;color:#e5e7eb;padding:8px;margin:4px 0;width:100%}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{cursor:pointer}</style>
<header><h1>Carol — Learning Preferences</h1></header>
<main>
  <p>Add likes/dislikes/avoidance notes. Click <b>Download feedback.json</b>, then upload it to <code>pages/apps/carol/profile/feedback.json</code> and re-run the plan workflow.</p>
  <div class="row">
    <div><label>Likes (comma-separated)<textarea id="likes" rows="6">greek yogurt, cottage cheese, fruit cups, hummus, baked salmon</textarea></label></div>
    <div><label>Dislikes (comma-separated)<textarea id="dislikes" rows="6">cilantro, cumin, raw onions</textarea></label></div>
  </div>
  <label>Extra Avoid List (comma-separated)<textarea id="avoid" rows="3">shellfish</textarea></label>
  <label>Notes<textarea id="notes" rows="3"></textarea></label>
  <button id="download">Download feedback.json</button>
</main>
<script>
document.getElementById('download').addEventListener('click', ()=>{
  const payload = {
    updated: new Date().toISOString(),
    likes: document.getElementById('likes').value.split(',').map(s=>s.trim()).filter(Boolean),
    dislikes: document.getElementById('dislikes').value.split(',').map(s=>s.trim()).filter(Boolean),
    avoid: document.getElementById('avoid').value.split(',').map(s=>s.trim()).filter(Boolean),
    notes: document.getElementById('notes').value.split('\n').map(s=>s.trim()).filter(Boolean)
  };
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(payload,null,2));
  a.download = 'feedback.json'; a.click();
});
</script>
