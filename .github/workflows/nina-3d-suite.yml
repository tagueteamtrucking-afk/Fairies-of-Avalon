name: Nina — 3D Suite
on:
  workflow_dispatch:
    inputs:
      world: { description: "World (optional; only used for scene stubs)", required: false, type: string }
      combos: { description: "Max VRM×Wing combos to plan", required: false, default: 12, type: number }
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Build VRM Index + Scene Stubs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & "scripts/overseers/nina-3d-index.ps1" -RepoRoot "$PWD" -MaxCombos ${{ inputs.combos }} -World "${{ inputs.world }}"
      - name: Commit artifacts
        shell: bash
        run: |
          set -e
          git config user.name "actions-bot"
          git config user.email "actions@github.com"
          git add -A pages/apps/overseers/vrm-index.json pages/apps/alexandria/worlds/3d
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Nina 3D: vrm-index + scene stubs"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
