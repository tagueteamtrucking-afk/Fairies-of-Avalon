<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Charlotte · Translate & File</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/app.css">
  <style>body{margin:0} main{max-width:1000px;margin:28px auto;padding:0 12px}
  .pill{display:inline-block;padding:.35rem .7rem;border:1px solid #999;border-radius:.6rem;font-size:.9rem;text-decoration:none;color:inherit;background:#fff;margin-right:.4rem}
  .card{border:1px solid #eee;border-radius:.6rem;padding:14px;background:rgba(255,255,255,.85);margin-bottom:12px}
  ul{padding-left:1.2rem}
  </style>
</head>
<body>
<main>
  <h1>Charlotte · Translate & File</h1>
  <p><a class="pill" href="/.github/workflows/charlotte-translate.yml" target="_blank">Run: Translate (workflow)</a></p>
  <section class="card">
    <h2>Recent translations</h2>
    <ul id="list"><li>Loading…</li></ul>
  </section>
</main>
<script type="module">
async function j(p){try{const r=await fetch(p+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return null; return await r.json();}catch{return null}}
const list=document.getElementById('list');
const idx=await j('/apps/charlotte/translations/index.json');
if(!idx||!Array.isArray(idx)||!idx.length){ list.innerHTML='<li><small>No translations yet. Use the workflow to create one.</small></li>'; }
else{
  list.innerHTML = idx.slice(-20).reverse().map(it=>`<li><a href="${it.path}">${it.lang} — ${it.title}</a> <small>${it.ts}</small></li>`).join('');
}
</script>
</body>
</html>
