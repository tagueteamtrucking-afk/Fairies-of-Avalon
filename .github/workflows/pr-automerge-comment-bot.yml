name: PR Automerge Comment Bot

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - edited
      - ready_for_review
      - review_requested
      - review_request_removed
      - unlocked
      - converted_to_draft
      - auto_merge_enabled
      - auto_merge_disabled

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: write
  issues: write

jobs:
  explain-non-automerge:
    if: github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    steps:
      - name: Explain why PR did not auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const HEADER = "### 🤖 Automerge Comment Bot — Status Check";

            const { data: fresh } = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });

            const reasons = [];
            const labels = new Set(fresh.labels.map(l => l.name.toLowerCase()));
            const hasAutomerge = labels.has("automerge");
            const hasHold = labels.has("hold");
            const isDraft = fresh.draft;

            if (!hasAutomerge) reasons.push("No **`automerge`** label on this PR.");
            if (hasHold) reasons.push("The **`hold`** label is present (merges are blocked until it is removed).");
            if (isDraft) reasons.push("This PR is still in **Draft** state.");

            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: pr.number });
            const approvals = reviews.filter(r => r.state === "APPROVED");
            if (approvals.length < 1) reasons.push("No **approving review** found. (Branch protection may require one.)");

            const head_sha = fresh.head.sha;
            const { data: status } = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: head_sha });
            const failingStatuses = status.statuses.filter(s => s.state !== "success");
            const checks = await github.paginate(github.rest.checks.listForRef, { owner, repo, ref: head_sha });
            const failingChecks = checks.filter(cr => cr.status !== "completed" || (cr.conclusion && !["success","neutral","skipped"].includes(cr.conclusion)));

            if (failingStatuses.length > 0 || failingChecks.length > 0) {
              const names = [
                ...failingStatuses.map(s => s.context),
                ...failingChecks.map(c => c.name + (c.status !== "completed" ? " (in progress)" : ""))
              ];
              reasons.push(`CI is not green yet for commit \`${head_sha.slice(0,7)}\`:\n- ` + names.slice(0,12).join("\n- "));
            }

            const ms = fresh.mergeable_state;
            if (ms && !["clean"].includes(ms)) {
              reasons.push(`Mergeable state is **${ms}** (not \`clean\`). This can mean conflicts, pending checks, or branch protection rules.`);
            }

            if (reasons.length === 0) {
              reasons.push("All signals look good. If this PR didn't auto-merge, a repository rule may be preventing it (e.g. required checks, codeowners review, or auto-merge disabled at the repo).");
            }

            const body = [
              HEADER,
              "",
              `**PR #${pr.number} — ${fresh.title}**`,
              "",
              "I looked for the conditions required by your automerge workflow:",
              "",
              "- Needs label **`automerge`**",
              "- Must **not** have **`hold`**",
              "- **Not a Draft**",
              "- **CI green** on the head commit",
              "- At least **one approving review** (if branch rules require)",
              "- **Mergeable** without conflicts",
              "",
              "**Why it didn't auto-merge right now:**",
              "",
              ...reasons.map(r => `- ${r}`),
              "",
              "<sub>Tip: remove `hold`, add `automerge`, wait for checks, and ensure at least one approval if required.</sub>"
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number });
            const mine = comments.filter(c => c.user?.type === "Bot" && c.body && c.body.startsWith(HEADER));
            for (const c of mine) {
              try { await github.rest.issues.deleteComment({ owner, repo, comment_id: c.id }); } catch (e) {}
            }

            await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
