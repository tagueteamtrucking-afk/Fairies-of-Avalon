<!doctype html>
<meta charset="utf-8">
<title>Jem — Training Programs</title>
<link rel="stylesheet" href="../_shared/ui-lite.css">
<style>
  body{background:#0b0b0f;color:#e8e8ee;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:24px;}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  h1{font-size:24px;margin:0;}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));}
  .card{border:1px solid #2a2a30;border-radius:14px;padding:14px;background:#101018;text-decoration:none;color:inherit;display:block}
  .card:hover{outline:2px solid #3a3af0}
  .muted{opacity:.7}
  .cta{padding:8px 12px;border:1px solid #393946;border-radius:10px;background:#12121a;color:#e8e8ee;text-decoration:none}
</style>
<header>
  <h1>Jem — Training Programs</h1>
  <nav>
    <a class="cta" href="program-viewer.html">Open Viewer</a>
    <a class="cta" href="../../overseers/overview.html">Overseers</a>
  </nav>
</header>
<section id="programs" class="grid"></section>
<script type="module">
async function loadList(){
  let list = [];
  try {
    const r = await fetch('./programs/index.json',{cache:'no-store'});
    if (r.ok) list = await r.json();
  } catch(e){}
  const root = document.getElementById('programs');
  if (!list.length){
    root.innerHTML = \`
      <div class="card">
        <h3>No programs yet</h3>
        <p class="muted">Trigger the <b>Jem Plan Sync</b> workflow in GitHub Actions to generate <code>pages/apps/jem/programs/index.json</code>.</p>
      </div>\`;
    return;
  }
  root.innerHTML = list.map(p => \`
    <a class="card" href="./viewer.html?file=\${encodeURIComponent(p.file)}">
      <h3>\${p.title}</h3>
      <p class="muted">\${p.file}</p>
    </a>\`
  ).join('');
}
loadList();
</script>
