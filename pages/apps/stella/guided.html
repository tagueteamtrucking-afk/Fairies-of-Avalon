<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stella — Guided Meditation</title>
<style>body{font-family:system-ui;background:#0b0f17;color:#e5e7eb;margin:0}header{padding:12px 16px;border-bottom:1px solid #172033}main{padding:16px}section{margin-bottom:16px;border:1px solid #172033;border-radius:8px;padding:12px;background:#0f172a}h2{margin-top:0}.row{display:flex;gap:8px;align-items:center}.btn{background:#111827;border:1px solid #334155;border-radius:8px;color:#e5e7eb;padding:8px 12px;cursor:pointer}</style>
<header><h1>Stella — Guided Meditation</h1></header>
<main>
<section><div class="row"><input id="path" placeholder="Paste path to a guided set (e.g., guided/2025...-ray-calm/)"><button class="btn" id="load">Load</button></div><p id="title"></p><audio id="aud" controls style="width:100%;margin-top:8px"></audio></section>
<section><h2>Script</h2><pre id="script" style="white-space:pre-wrap"></pre></section>
</main>
<script>
document.getElementById('load').addEventListener('click', async ()=>{
  const p = document.getElementById('path').value.trim();
  if(!p) return;
  try{
    const s = await fetch(p+'script.json').then(r=>r.json());
    document.getElementById('title').textContent = s.title + ' — ' + (s.persona||'') + ' ('+(s.theme||'')+')';
    document.getElementById('script').textContent = s.steps.map(x=>x.text).join('\n\n') + '\n\n' + (s.safety_note||'');
    const aud = document.getElementById('aud');
    const test = await fetch(p+'audio.mp3');
    if(test.ok) aud.src = p+'audio.mp3'; else aud.removeAttribute('src');
  }catch(e){ alert('Could not load. Make sure the path exists and you ran the workflow.'); }
});
</script>
