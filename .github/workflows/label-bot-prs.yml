name: Label bot PRs for automerge
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Add 'automerge' label to bot PRs (Clarity, Carol Refresh, Jem Assessment)
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner, repo = context.repo.repo;
            const isBot = (pr.user && /\[bot\]$/.test(pr.user.login));
            const goodTitle = /^(clarity\b|carol: refresh shopping & report\b|jem: (assessment|update)\b)/i.test(pr.title);
            if (isBot && goodTitle) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['automerge'] });
            }
