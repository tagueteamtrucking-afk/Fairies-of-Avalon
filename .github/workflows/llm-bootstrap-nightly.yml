name: LLM Bootstrap (nightly)
on:
  schedule:
    - cron: '8 3 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  gather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -y && sudo apt-get install -y jq wget zip
      - name: Repo map
        run: |
          git ls-files -z | xargs -0 -I{} bash -lc 'printf "%s\t%s\n" "$(stat -c %s "{}")" "{}"' | sort -n > _repo_files_sizes.tsv
          jq -Rn '[inputs|split("\t")|{bytes:(.[0]|tonumber),path:.[1]}]' < _repo_files_sizes.tsv > _repo_files_sizes.json
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LLM-Bootstrap
          path: _repo_files_sizes.json
