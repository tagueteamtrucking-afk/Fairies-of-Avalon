<!doctype html>
<html><head><meta charset="utf-8"><title>Reset Service Worker</title></head>
<body style="font-family:system-ui;padding:20px">
<h1>Reset &amp; Bypass Cache</h1>
<p>This page unregisters any Service Worker and reloads the site without cache.</p>
<script>
(async () => {
  if ('serviceWorker' in navigator) {
    const regs = await navigator.serviceWorker.getRegistrations();
    for (const r of regs) { try { await r.unregister(); } catch(e){} }
  }
  caches && caches.keys && caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
  const u = new URL(location.href);
  u.searchParams.set('cb', Date.now());
  setTimeout(()=> location.href = u.toString(), 600);
})();
</script>
</body></html>
