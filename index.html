<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Avalon</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<style>body{background:#0b1220;color:#e5e7eb;font-family:system-ui,Segoe UI,Roboto;margin:0;display:grid;place-items:center;min-height:100vh;padding:24px;text-align:center}a{color:#93c5fd}</style>
</head><body>
<h1>Launching City Plaza…</h1>
<p>If not redirected, <a href="/pages/plaza.html">enter the City</a>.</p>
<p>To fully refresh the site cache, open this once: <br><a href="https://www.fairiesofavalon.com/kill-sw-boost.html">https://www.fairiesofavalon.com/kill-sw-boost.html</a></p>
<script>(async()=>{try{if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistrations();for(const x of r){await x.unregister();}if(window.caches){const k=await caches.keys();for(const c of k){await caches.delete(c);}}}catch(e){}location.replace('/pages/plaza.html?cb='+Date.now().toString(36));})();</script>
<noscript><meta http-equiv="refresh" content="0; url=/pages/plaza.html"></noscript>
</body></html>
