<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sorcha — Uploader</title><style>body{background:#0b1220;color:#e6e9ff;font-family:system-ui,Segoe UI,Roboto;margin:0;padding:16px} a{color:#a5d6ff}</style></head>
<body>
<h1>📤 Sorcha — Upload Reference Clips</h1>
<p><label>Worker URL <input id="w" size="60" placeholder="https://your-worker.workers.dev"></label> <button onclick="save()">Save</button></p>
<input id="f" type="file" accept="video/*" multiple>
<button onclick="send()">Upload</button>
<pre id="log"></pre>
<script>
function save(){ localStorage.setItem('OPENAI_WORKER_URL', document.getElementById('w').value); alert('Saved'); }
async function send(){
  const url = localStorage.getItem('OPENAI_WORKER_URL'); if(!url){ alert('Set Worker URL first'); return; }
  const files = document.getElementById('f').files; if(!files.length){ alert('Choose files'); return; }
  const log = document.getElementById('log'); log.textContent='Uploading…';
  for(const file of files){
    const fd = new FormData(); fd.append('video', file, file.name);
    const r = await fetch(url+'/sorcha/upload', { method:'POST', body: fd });
    log.textContent += '\n' + file.name + ': ' + (r.ok?'OK':'Error');
  }
}
</script>
<p><a href="/pages/apps/sorcha/index.html">← Back</a></p>
</body></html>
