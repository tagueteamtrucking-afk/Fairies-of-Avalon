name: Repo Sweeper — Workflows (preview/delete)
on:
  workflow_dispatch:
    inputs:
      delete:
        description: "Set yes to delete unused workflows not in keep list"
        required: false
        default: "no"
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sweep (preview or delete; archive orphans)
        shell: pwsh
        run: pwsh -File scripts/Repo-Sweeper-Used-Files.ps1 -KeepListFile "config/keep-lists/workflows-keep.json" -Delete:(${{ github.event.inputs.delete == 'yes' }}) -Archive -VerboseLog
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows scripts/_archive/** memory-history/*.json || true
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(repo): workflow sweep (delete=${{ github.event.inputs.delete }})" && git push; fi
