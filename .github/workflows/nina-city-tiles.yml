name: Nina - City Tiles
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  tiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Theme registry icons (BOM-safe)
        shell: bash
        run: |
          set -euo pipefail
          file="pages/apps/_city/registry.json"
          [ -f "$file" ] || { echo "registry.json missing; run Charlotte - Link Registry"; exit 0; }
          tmp="$(mktemp)"
          node - <<'JS' "$file" "$tmp"
          const fs=require('fs'); const p=process.argv[2]; const o=process.argv[3];
          let text = fs.readFileSync(p,'utf8'); if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
          const reg=JSON.parse(text); const icons={
            alexandria:"📚", charlotte:"📡", nina:"🧪", tracy:"🎨", carol:"🍽️", jem:"🥋",
            stella:"🌌", abbey:"🏦", themis:"⚖️", billie:"💰", sorcha:"🎬", clarice:"🔐"
          };
          reg.items = (reg.items||[]).filter(it=> (it.name||'').toLowerCase()!=='odessa')
            .map(it=>({ ...it, icon: icons[(it.name||'').toLowerCase()] || it.icon || '🏛️'}));
          fs.writeFileSync(o, JSON.stringify(reg,null,2));
          JS
          mv "$tmp" "$file"
      - name: Commit tiles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/_city/registry.json || true
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "feat(nina): city icons (BOM-safe) & remove Odessa" && git push; fi
