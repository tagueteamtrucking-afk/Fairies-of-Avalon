name: Alexandria — Build World (All-in-One)
on:
  workflow_dispatch:
    inputs:
      title: { description: "World Title", required: false, type: string }
      prompt: { description: "Starter hook / prompt", required: false, type: string }
      events: { description: "Timeline events count", required: false, default: 7, type: number }
      npcs: { description: "NPC count", required: false, default: 12, type: number }
      regions: { description: "Region count", required: false, default: 5, type: number }
      force_fallback: { description: "Force offline", required: false, default: true, type: boolean }
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install PowerShell YAML
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Install-Module powershell-yaml -Force -Scope CurrentUser -AllowClobber
      - name: Build All
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ff = [System.Convert]::ToBoolean("${{ inputs.force_fallback }}")
          & "scripts/overseers/alexandria-build-all.ps1" `
            -RepoRoot "$PWD" `
            -Title "${{ inputs.title }}" `
            -Prompt "${{ inputs.prompt }}" `
            -Events ${{ inputs.events }} `
            -NPCs ${{ inputs.npcs }} `
            -Regions ${{ inputs.regions }} `
            -ForceFallback:$ff
      - name: Commit artifacts
        shell: bash
        run: |
          set -e
          git config user.name "actions-bot"
          git config user.email "actions@github.com"
          git add -A pages/apps/alexandria/worlds
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Alexandria build-all artifacts"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
