name: Charlotte — Site Manifest
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: pwsh -File scripts/Charlotte-Site-Manifest.ps1
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/charlotte/manifest.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(charlotte): site manifest" && git push; fi
