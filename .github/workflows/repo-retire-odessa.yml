name: Repo - Retire Odessa
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Odessa to memory-history/retired
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "pages/apps/odessa" ]; then
            mkdir -p memory-history/retired
            git mv pages/apps/odessa memory-history/retired/odessa || true
          else
            echo "Odessa folder not found (already retired)."
          fi
      - name: Commit move
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(repo): retire Odessa (Sorcha covers social+adult track)" && git push; fi
