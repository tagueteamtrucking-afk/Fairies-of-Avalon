name: Carol — Refresh from Pointer

on:
  workflow_dispatch:
    inputs:
      plan_path:
        description: 'Plan JSON path (leave blank to read from pages/apps/carol/index.json → plan_latest)'
        required: false
        default: ''
  push:
    paths:
      - 'pages/apps/carol/index.json'
      - 'pages/apps/carol/plans/**'
      - 'scripts/Carol-Extract-Shopping-v3.ps1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm PowerShell available
        run: pwsh -v

      - name: Resolve plan path
        id: plan
        shell: pwsh
        run: |
          param([string]$Provided = "${{ github.event.inputs.plan_path }}")
          if([string]::IsNullOrWhiteSpace($Provided)){
            if(!(Test-Path 'pages/apps/carol/index.json')){ throw 'Pointer not found: pages/apps/carol/index.json' }
            $ptr = Get-Content -Raw 'pages/apps/carol/index.json' | ConvertFrom-Json
            $p = $ptr.plan_latest
            if([string]::IsNullOrWhiteSpace($p)){ throw 'plan_latest missing in pointer' }
            "value=$p" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "value=$Provided" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Extract shopping (v3)
        shell: pwsh
        run: |
          $Plan = "${{ steps.plan.outputs.value }}"
          Write-Host "Using plan: $Plan"
          if(!(Test-Path $Plan)){ throw "Plan file not found: $Plan" }
          ./scripts/Carol-Extract-Shopping-v3.ps1 -PlanFile $Plan

      - name: Commit shopping outputs
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add pages/apps/carol/plans/shopping-*.json || true
          git commit -m "Carol: refresh shopping from pointer" || echo "No changes to commit"
          git push || echo "No push (possibly no changes)"
