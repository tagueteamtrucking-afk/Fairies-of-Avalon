<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carol — Shopping List</title>
  <link rel="stylesheet" href="../theme/tokens.css">
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: var(--bg, #0b0f18); color: var(--fg, #e7ecf3); }
    header { padding: 16px; border-bottom: 1px solid #243; }
    main { padding: 16px; }
    .card { background: #101624; border: 1px solid #1c2440; border-radius: 10px; padding: 16px; margin: 0 auto; max-width: 800px; }
    .muted { opacity: .75; }
    ul { line-height: 1.6; }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; border:1px solid #2a375a; font-size:12px; margin-left: 8px; }
    .warn { color:#ffb86b; }
    a.button { display:inline-block; padding:10px 14px; border:1px solid #2a375a; border-radius:8px; text-decoration:none; color:inherit; margin-top:12px; }
    .row { display:flex; gap:16px; flex-wrap:wrap; }
    .row > div { flex:1 1 300px; }
    .qty { opacity:.9; }
  </style>
</head>
<body>
  <header>
    <h1>Carol — Shopping List <span class="pill">2 people</span></h1>
    <p class="muted">Plan source & diet rules are configured in <code>pages/apps/carol/index.json</code>.</p>
  </header>
  <main>
    <div id="root" class="card">Loading shopping list…</div>
  </main>
<script>
(async () => {
  const root = document.getElementById('root');
  async function loadJSON(path) {
    const res = await fetch(path, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }
  try {
    // Prefer quantized; fall back to extracted
    let data;
    try {
      data = await loadJSON('plans/shopping-quantized.json');
    } catch (e) {
      data = await loadJSON('plans/shopping-extracted.json');
    }
    // Expected shapes:
    // 1) { items: [{name, qty, unit, notes, section}] }
    // 2) { by_section: { SectionName: [ {name, qty, unit, notes} ] } }
    let sections = {};
    if (data.by_section) {
      sections = data.by_section;
    } else if (Array.isArray(data.items)) {
      for (const item of data.items) {
        const sec = item.section || 'General';
        sections[sec] = sections[sec] || [];
        sections[sec].push(item);
      }
    } else {
      throw new Error('Unrecognized shopping format');
    }
    const secNames = Object.keys(sections).sort((a,b)=>a.localeCompare(b));
    const frag = document.createDocumentFragment();
    for (const s of secNames) {
      const box = document.createElement('div');
      box.style.marginBottom = '18px';
      const h = document.createElement('h2'); h.textContent = s; h.style.marginBottom='8px';
      const ul = document.createElement('ul');
      for (const it of sections[s]) {
        const li = document.createElement('li');
        const qty = (it.qty !== undefined ? it.qty : (it.quantity !== undefined ? it.quantity : ''));
        const unit = it.unit || '';
        const notes = it.notes || '';
        li.innerHTML = `<span class="qty">${qty ? qty : ''} ${unit ? unit : ''}</span> <strong>${it.name || it.item}</strong> ${notes ? `<span class="muted">— ${notes}</span>` : ''}`;
        ul.appendChild(li);
      }
      box.appendChild(h); box.appendChild(ul);
      frag.appendChild(box);
    }
    root.innerHTML = '';
    root.appendChild(frag);
  } catch (err) {
    root.innerHTML = `
      <p class="warn"><strong>Shopping data not found.</strong></p>
      <p>Run the GitHub Action: <em>“Carol — Extract from Plan (safe alias)”</em>.
      It reads your plan and writes <code>pages/apps/carol/plans/shopping-quantized.json</code>.</p>
      <p class="muted">Advanced: The extractor expects <code>twoperson-2wk-merged.json</code>. The workflow creates a temporary alias to your real plan and removes it after.</p>
      <a class="button" href="menu.html">Back to Menu</a>`;
  }
})();
</script>
</body>
</html>
