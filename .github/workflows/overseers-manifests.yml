name: Overseers - Manifests + WPI
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'asset/models/**'
      - 'asset/wings/**'
      - 'asset/textures/wallpapers/**'
      - 'scripts/overseers/repo-sweep.mjs'
permissions:
  contents: write
concurrency:
  group: overseers-manifests
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build manifests + WPI
        run: node scripts/overseers/repo-sweep.mjs
      - name: Commit changes (if any)
        run: |
          git config user.name "Overseers Bot"
          git config user.email "actions@users.noreply.github.com"
          git add asset/models/models.json asset/wings/manifest.json pages/apps/overseers/progress.json || true
          git commit -m "Overseers: manifests + WPI" || echo "Nothing to commit"
          git push || echo "Nothing to push"
