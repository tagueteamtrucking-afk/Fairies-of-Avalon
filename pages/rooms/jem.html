<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jem — Dojo</title>
  <style>
    :root{--bg:#0a0c10;--fg:#e8ecf1;--tile:#11161d;--tileb:#1b2430;--acc:#6ec1ff;--mut:#a8b3c2}
    html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    header{padding:24px 16px;text-align:center;border-bottom:1px solid #202a36}
    main{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));padding:16px}
    a.card{display:grid;gap:6px;padding:16px;background:linear-gradient(180deg,var(--tile),var(--tileb));border:1px solid #202a36;border-radius:12px;color:var(--fg);text-decoration:none}
    a.card:hover{border-color:var(--acc)}
    .emoji{font-size:28px}
    .mut{color:var(--mut);font-size:12px}
  </style>
</head>
<body>
  <header>
    <h1>🥋 Jem — Dojo</h1>
    <p class="mut">Daily movement: warm‑up, midday set, evening unwind.</p>
  </header>
  <main>
    <a class="card" href="/pages/apps/jem/evaluate.html">
      <div class="emoji">✅</div>
      <div><strong>Today — Log & Evaluate</strong><div class="mut">Style + difficulty + notes</div></div>
    </a>
    <a class="card" href="/pages/apps/jem/program-viewer.html">
      <div class="emoji">📅</div>
      <div><strong>Program Viewer</strong><div class="mut">This week & next</div></div>
    </a>
    <a class="card" href="/pages/apps/jem/dashboard.html">
      <div class="emoji">📊</div>
      <div><strong>Dashboard</strong><div class="mut">Progress snapshots</div></div>
    </a>
    <a class="card" href="/pages/apps/_city/index.html">
      <div class="emoji">🏰</div>
      <div><strong>Back to City</strong></div>
    </a>
  </main>
</body>
</html>
