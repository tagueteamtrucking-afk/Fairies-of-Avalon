<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nina · Scene Planner</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/app.css">
  <style>body{margin:0} main{max-width:1000px;margin:28px auto;padding:0 12px}
  .pill{display:inline-block;padding:.35rem .7rem;border:1px solid #999;border-radius:.6rem;font-size:.9rem;text-decoration:none;color:inherit;background:#fff;margin-right:.4rem}
  textarea,input{width:100%}
  textarea{min-height:140px}
  .card{border:1px solid #eee;border-radius:.6rem;padding:14px;background:rgba(255,255,255,.85);margin-bottom:12px}
  </style>
</head>
<body>
<main>
  <h1>Nina · 3D Scene Planner</h1>
  <p>
    <a class="pill" href="/apps/overseers/hub/vrm-demo.html">VRM Demo</a>
    <a class="pill" href="/.github/workflows/overseers-manifests.yml">Manifests & WPI</a>
  </p>
  <section class="card">
    <h2>Scene JSON</h2>
    <textarea id="json" placeholder='{"scene":"island","actors":[{"avatar":"Alexandria","wingId":"1421"}]}'></textarea>
    <p><button id="dl" class="pill">Download scene.json</button></p>
  </section>
</main>
<script type="module">
document.getElementById('dl').onclick = ()=>{
  const val = document.getElementById('json').value || '{}';
  const blob = new Blob([val], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'scene.json'; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
};
</script>
</body>
</html>
