name: Charlotte — Pipelines Suite
on:
  workflow_dispatch:
    inputs:
      world: { description: "World (auto-pick latest if empty)", required: false, type: string }
      target_langs: { description: "Comma-separated e.g. es,fr,de", required: false, default: "es", type: string }
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install PowerShell YAML
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Install-Module powershell-yaml -Force -Scope CurrentUser -AllowClobber
      - name: Run Pipelines
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & "scripts/overseers/charlotte-pipeline-plan.ps1" -RepoRoot "$PWD" -World "${{ inputs.world }}" -TargetLangs "${{ inputs.target_langs }}"
      - name: Commit artifacts
        shell: bash
        run: |
          set -e
          git config user.name "actions-bot"
          git config user.email "actions@github.com"
          git add -A pages/apps/alexandria/worlds/pipelines
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Charlotte Pipelines"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
