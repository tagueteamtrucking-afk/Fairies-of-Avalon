name: Repo Sweeper — Workflows (dry-run by default)
on:
  workflow_dispatch:
    inputs:
      delete:
        description: "Set to yes to actually delete. Default: no"
        required: false
        default: "no"
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preview
        if: ${{ github.event.inputs.delete != 'yes' }}
        shell: pwsh
        run: pwsh -File scripts/Repo-Sweeper-Workflows.ps1 -KeepListFile "config/keep-lists/workflows-keep.json"
      - name: Delete
        if: ${{ github.event.inputs.delete == 'yes' }}
        shell: pwsh
        run: pwsh -File scripts/Repo-Sweeper-Workflows.ps1 -KeepListFile "config/keep-lists/workflows-keep.json" -Delete -VerboseLog
      - name: Commit removals (if any)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(repo): workflow sweep" && git push; fi
