<!doctype html>
<meta charset="utf-8">
<title>Billie — ffmpeg.wasm Studio</title>
<link rel="stylesheet" href="../_shared/ui-lite.css">
<style>
  body{background:#0b0b0f;color:#eee;font-family:system-ui;margin:24px}
  .row{display:flex;gap:16px;flex-wrap:wrap}
  .col{flex:1;min-width:320px}
  video{width:100%;border-radius:12px;outline:1px solid #333}
  .btn{padding:8px 12px;border:1px solid #444;border-radius:10px;background:#111;color:#eee;cursor:pointer;text-decoration:none}
  input[type=file]{display:none}
</style>
<h1>Billie — ffmpeg.wasm Studio</h1>
<p>Concatenate clips, overlay captions, and export MP4 — all in-browser using ffmpeg.wasm.</p>
<div class="row">
  <div class="col">
    <label class="btn">➕ Add Video(s)<input id="files" type="file" accept="video/*" multiple></label>
    <button id="concat" class="btn">🔗 Concatenate</button>
    <button id="burn" class="btn">🖋 Burn Captions</button>
    <a id="dl" class="btn" style="display:none" download="billie-output.mp4">⬇ Download</a>
    <textarea id="captions" placeholder="One caption per line" style="width:100%;height:120px;margin-top:8px"></textarea>
  </div>
  <div class="col">
    <video id="out" controls></video>
  </div>
</div>
<script type="module">
import { createFFmpeg, fetchFile } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/ffmpeg.min.js';
const ffmpeg = createFFmpeg({ log: true });
const files = document.getElementById('files');
const concatBtn = document.getElementById('concat');
const burnBtn = document.getElementById('burn');
const out = document.getElementById('out');
const dl = document.getElementById('dl');
const captions = document.getElementById('captions');
async function loadFF(){ if (!ffmpeg.isLoaded()) await ffmpeg.load(); }
async function writeInputs(fileList){
  let list = [];
  for (let i=0;i<fileList.length;i++){
    const f = fileList[i];
    const name = `in${i}.mp4`;
    ffmpeg.FS('writeFile', name, await fetchFile(f));
    list.push(name);
  }
  return list;
}
concatBtn.onclick = async () => {
  if (!files.files.length) return alert('Add videos first.');
  await loadFF();
  const arr = await writeInputs(files.files);
  const listTxt = arr.map(n => `file '${n}'`).join('\n');
  ffmpeg.FS('writeFile', 'list.txt', new TextEncoder().encode(listTxt));
  await ffmpeg.run('-f','concat','-safe','0','-i','list.txt','-c','copy','out.mp4');
  const data = ffmpeg.FS('readFile','out.mp4');
  const url = URL.createObjectURL(new Blob([data.buffer], {type:'video/mp4'}));
  out.src = url; dl.href=url; dl.style.display='inline-block';
};
burnBtn.onclick = async () => {
  if (!files.files.length) return alert('Add a base video.');
  await loadFF();
  const [f] = files.files;
  ffmpeg.FS('writeFile','base.mp4', await fetchFile(f));
  const lines = captions.value.split('\n').filter(Boolean);
  let srt = '';
  for (let i=0;i<lines.length;i++){
    const start = i*2, end = start+2;
    const fmt = t => new Date(t*1000).toISOString().substr(11,12).replace('.',',');
    srt += `${i+1}\n${fmt(start)} --> ${fmt(end)}\n${lines[i]}\n\n`;
  }
  ffmpeg.FS('writeFile','subs.srt', new TextEncoder().encode(srt));
  await ffmpeg.run('-i','base.mp4','-vf','subtitles=subs.srt:force_style=\'Fontsize=18,PrimaryColour=&H00FFFFFF\'','-c:a','copy','out.mp4');
  const data = ffmpeg.FS('readFile','out.mp4');
  const url = URL.createObjectURL(new Blob([data.buffer], {type:'video/mp4'}));
  out.src = url; dl.href=url; dl.style.display='inline-block';
};
</script>
