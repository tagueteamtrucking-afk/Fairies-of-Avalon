name: Alexandria — WorldBundle Export

on:
  workflow_dispatch: {}

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export bundle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & "scripts/overseers/alexandria-export.ps1" -RepoRoot "$PWD"

      - name: Commit changes (if any)
        shell: bash
        run: |
          set -e
          git config user.name "actions-bot"
          git config user.email "actions@github.com"
          git add -A pages/apps/alexandria/worlds/exports
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Alexandria export: WorldBundle zip"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
