name: Alexandria — Helpers Suite

on:
  workflow_dispatch:
    inputs:
      world:          { description: "World (auto-pick latest if empty)", required: false, type: string }
      per_town:       { description: "Notable figures per settlement",    required: false, default: 3, type: number }
      force_fallback: { description: "Force offline (no LLM Bridge)",     required: false, default: true, type: boolean }

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Run Helpers (splat args; no backticks)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $perTownIn = "${{ inputs.per_town }}"
          if ([string]::IsNullOrWhiteSpace($perTownIn)) { $perTownIn = '3' }
          [int]$perTown = $perTownIn
          $fallback = [System.Convert]::ToBoolean("${{ inputs.force_fallback }}")

          $args = @{
            RepoRoot      = "$PWD"
            World         = "${{ inputs.world }}"
            PerTown       = $perTown
            ForceFallback = $fallback
          }

          & "scripts/overseers/alexandria-suite.ps1" @args

      - name: Commit artifacts
        shell: bash
        run: |
          set -e
          git config user.name  "actions-bot"
          git config user.email "actions@github.com"
          git add -A pages/apps/alexandria/worlds || true
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Alexandria Helpers artifacts"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
