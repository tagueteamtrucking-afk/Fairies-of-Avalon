name: Carol - Generate Shopping List (from current plan)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build shopping list (2 people from embedded items)
        run: node scripts/carol/build-shopping.mjs
      - name: Commit list
        run: |
          git config user.name "Carol Bot"
          git config user.email "actions@users.noreply.github.com"
          git add pages/apps/carol/plans/shopping-quantized.json || true
          git commit -m "Carol: shopping list (2p) from embedded plan items" || echo "Nothing to commit"
          git push || echo "Nothing to push"
