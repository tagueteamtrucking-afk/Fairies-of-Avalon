<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Jem – Fitness Planner</title>
  <link rel="stylesheet" href="/pages/apps/common/style.css" />
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 0.5rem;
      border: 1px solid #ccc;
      vertical-align: top;
    }
    th {
      background: #f2f2f2;
    }
  </style>
</head>
<body class="jem-inside">
  <div class="wrap">
    <h1 class="heading"> Jem – Fitness Planner</h1>
    <p class="lead">This planner outlines a one‑week workout schedule. Each day features warm‑up, cardio, strength and cooldown activities curated by Jem.</p>
    <div id="planner"></div>
    <p><a href="index.html">← back to Jem</a></p>
  </div>
  <script type="module">
    async function loadPlan() {
      try {
        const resp = await fetch('data/training-plan.json');
        const plan = await resp.json();
        const container = document.getElementById('planner');
        let html = '<table><thead><tr><th>Day</th><th>Activities</th></tr></thead><tbody>';
        plan.plans.forEach(item => {
          html += `<tr><td>Day ${item.day}</td><td><ul>`;
          item.activities.forEach(act => {
            html += `<li><strong>${act.name}:</strong> ${act.description}</li>`;
          });
          html += '</ul></td></tr>';
        });
        html += '</tbody></table>';
        container.innerHTML = html;
      } catch (err) {
        document.getElementById('planner').textContent = 'Failed to load training plan.';
      }
    }
    loadPlan();
  </script>
</body>
</html>
