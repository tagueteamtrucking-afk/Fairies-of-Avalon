<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carol — Videos</title>
<style>body{margin:0;background:#0b0f17;color:#e5e7eb;font-family:system-ui}header,main{padding:14px}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.card{border:1px solid #172033;background:#0f172a;border-radius:12px;padding:12px}.small{color:#94a3b8;font-size:12px}a.btn{display:inline-block;padding:8px 10px;border:1px solid #334155;border-radius:10px;text-decoration:none;color:#e5e7eb;background:#0b1220}</style>
<header><h1>Carol — Cooking Videos</h1><div class="small">Add links in <code>/pages/apps/carol/videos/index.json</code>.</div></header>
<main id="grid" class="grid"></main>
<script>
(async()=>{
  const grid=document.getElementById('grid');
  const j=await fetch('/pages/apps/carol/videos/index.json').then(r=>r.json()).catch(()=>({videos:[]}));
  if(!j.videos || !j.videos.length){ grid.innerHTML='<div class="card">No videos found. Edit <code>/pages/apps/carol/videos/index.json</code>.</div>'; return; }
  grid.innerHTML = j.videos.map(v=>`<div class="card"><b>${v.title||'Untitled'}</b><div class="small">${v.tags?.join(', ')||''}</div><div style="margin-top:8px"><a class="btn" href="${v.url}" target="_blank">Open Video</a></div></div>`).join('');
})();
</script>
