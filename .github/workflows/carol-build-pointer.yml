name: Carol — Build Pointer (latest plan + shopping)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pointer
        shell: pwsh
        run: pwsh -File scripts/Carol-Build-Pointer.ps1 -PlansDir "pages/apps/carol/plans" -OutFile "pages/apps/carol/index.json"
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/carol/index.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(carol): pointer to latest plan + shopping" && git push; fi
