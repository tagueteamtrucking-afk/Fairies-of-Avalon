name: "Queue — Full Roster"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enqueue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup PowerShell + YAML module
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module powershell-yaml -Scope CurrentUser -Force -AllowClobber
          Import-Module powershell-yaml

      - name: Enqueue core tasks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot   = "${{ github.workspace }}"
          $requests   = Join-Path $repoRoot "requests"
          New-Item -ItemType Directory -Force -Path $requests | Out-Null

          $memPath = Join-Path $repoRoot "Cody's Memory.yaml"
          if (!(Test-Path $memPath)) { throw "Memory file not found at $memPath" }
          $mem     = (Get-Content -Raw -Path $memPath) | ConvertFrom-Yaml
          $avatars = @($mem.avatars_present)

          function Write-Req($obj, $name) {
            $ts   = Get-Date -AsUTC
            $obj.ts = $ts.ToString("o")
            $yaml = ConvertTo-Yaml $obj
            $fn   = "{0}-{1}.request.yml" -f $ts.ToString("yyyyMMddTHHmmssZ"), $name
            $path = Join-Path $requests $fn
            Set-Content -Path $path -Value $yaml -Encoding utf8NoBOM
            Write-Host "Queued: $fn"
          }

          Write-Req @{
            id="R3"; action="scaffold_fairies_bundle"; params=@{ avatars=$avatars }
            dry_run=$true; actor="rey_czar"; routing="overseers"
          } "scaffold-fairies"

          @(
            @{ id="R4"; action="asset_audit";     dry_run=$false; actor="rey_czar"; routing="overseers" }
            @{ id="R5"; action="importmap_check"; dry_run=$false; actor="rey_czar"; routing="overseers" }
            @{ id="R6"; action="memory_snapshot"; dry_run=$false; actor="rey_czar"; routing="overseers" }
          ) | ForEach-Object { Write-Req $_ $_.action }

          git add requests
          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"
          git fetch origin ${{ github.ref_name }} --depth=0
          git pull --rebase origin ${{ github.ref_name }} || echo "Nothing to rebase"
          git commit -m "Queue: Full roster tasks" || echo "Nothing to commit"

      - name: Push
        uses: ad-m/github-push-action@77c5b412c50b723d2a4fbc6d71fb5723bcd439aa
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          force_with_lease: true
