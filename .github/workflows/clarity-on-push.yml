name: Crown of Clarity — On Push (catalog + snapshot + analysis + crawl)
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  clarity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq wget zip

      - name: Prepare folders
        run: |
          mkdir -p reports/clarity urls response-check snapshot

      - name: Build file catalog (path, sha256, bytes)
        run: |
          # TSV: path \t sha256 \t bytes
          git ls-files -z | xargs -0 -I{} bash -lc 'p="{}"; b=$(stat -c %s "{}"); h=$(sha256sum "{}" | awk "{print \$1}"); printf "%s\t%s\t%s\n" "$p" "$h" "$b"' > reports/clarity/catalog.tsv
          # Convert TSV to JSON array
          cat reports/clarity/catalog.tsv | jq -R -s '
            split("\n")
            | map(select(length>0) | split("\t"))
            | map({path: .[0], sha256: .[1], bytes: (.[2]|tonumber)})
          ' > reports/clarity/catalog.json

      - name: Repo snapshot artifact
        run: |
          git ls-files -z | xargs -0 -I{} bash -lc 'mkdir -p "snapshot/$(dirname "{}")"; cp "{}" "snapshot/{}"' || true
          (cd snapshot && zip -r ../repo-snapshot.zip .)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Analyze repo content (purpose + imports + links + refs)
        run: node scripts/clarity/analyze.mjs

      - name: Discover site URLs from index + /pages
        run: |
          BASE="https://fairiesofavalon.com"
          echo "$BASE/index.html" > urls/seed.txt
          echo "$BASE/pages/" >> urls/seed.txt
          : > urls/discovered-raw.txt
          while read -r u; do
            curl -fsSL "$u" | grep -Eoi 'href=["'"'"']([^"'"'"']+)["'"'"']' | sed -E 's/^href=["'"'"']//; s/["'"'"']$//' >> urls/discovered-raw.txt || true
          done < urls/seed.txt
          awk -v B="$BASE" '
            /^http/ {print $0; next}
            /^\// {print B $0; next}
            {print B"/"$0}
          ' urls/discovered-raw.txt | \
          sed 's#//*#/#g; s#https:/#https://#' | \
          grep -E '^https://fairiesofavalon\.com' | \
          sort -u > urls/discovered-urls.txt

      - name: Response check for discovered URLs
        run: |
          while read -r u; do
            fn=$(echo "$u" | sed 's#https\?://##; s#[^a-zA-Z0-9._-]#_#g')
            echo "=== $u ===" | tee -a response-check/summary.txt
            curl -sS -w "\nHTTP %{http_code} in %{time_total}s\n" -o "response-check/${fn}.html" "$u" | tee -a response-check/summary.txt || true
          done < urls/discovered-urls.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clarity-on-push
          path: |
            reports/clarity/catalog.json
            reports/clarity/files-index.json
            reports/clarity/workflows-map.json
            reports/clarity/pages-map.json
            reports/clarity/workers-map.json
            repo-snapshot.zip
            urls
            response-check

      - name: PR — Commit catalogs + analysis
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "clarity: update catalogs + analysis"
          title: "clarity: update catalogs + analysis"
          branch: "ci/clarity-on-push-${{ github.run_id }}"
          base: "${{ github.ref_name }}"
          add-paths: |
            reports/clarity/catalog.json
            reports/clarity/files-index.json
            reports/clarity/workflows-map.json
            reports/clarity/pages-map.json
            reports/clarity/workers-map.json
