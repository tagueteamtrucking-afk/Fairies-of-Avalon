name: City — Remove Castle Town

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove old castle-town page
        shell: bash
        run: |
          set -e
          rm -f pages/apps/_city/castle-town.html || true
          rm -f pages/apps/_city/city-index-patch.html || true

      - name: Commit removal
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "City: remove old Castle Town pages" || echo "No changes to commit"
          git push
