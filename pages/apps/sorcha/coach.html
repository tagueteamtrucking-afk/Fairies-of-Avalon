<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sorcha — Coaching</title>
<style>body{background:#0b1220;color:#e6e9ff;font-family:system-ui,Segoe UI,Roboto;margin:0;padding:16px} textarea{width:100%;min-height:160px}</style></head>
<body>
<h1>🧠 Sorcha — Coaching Notes</h1>
<p>Capture what worked, what didn’t, and next experiments. Notes stay in your browser (localStorage) unless you send them to the Worker.</p>
<p><textarea id="t" placeholder="Write feedback or paste transcripts here…"></textarea></p>
<p><button onclick="save()">Save (local)</button> <button onclick="send()">Send to Worker</button></p>
<pre id="log"></pre>
<script>
function save(){ localStorage.setItem('sorcha_notes', document.getElementById('t').value); alert('Saved locally'); }
async function send(){
  const url = localStorage.getItem('OPENAI_WORKER_URL'); if(!url){ alert('Set Worker URL first'); return; }
  const text = document.getElementById('t').value;
  const r = await fetch(url+'/sorcha/notes', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ text }) });
  document.getElementById('log').textContent = r.ok ? 'Sent.' : 'Error';
}
document.getElementById('t').value = localStorage.getItem('sorcha_notes')||'';
</script>
</body></html>
