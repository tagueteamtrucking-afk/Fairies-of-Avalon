name: Repo Sweeper — Version param
on:
  workflow_dispatch:
    inputs:
      apply_fixes:
        description: "Apply neutralization changes"
        required: false
        default: true
        type: boolean
      index_file:
        description: "Index file path"
        required: false
        default: "index.html"
        type: string
permissions:
  contents: write
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run sweeper
        shell: pwsh
        run: pwsh -File scripts/VersionParam-Sweeper.ps1 -ApplyFixes ${{ inputs.apply_fixes }} -IndexFile "${{ inputs.index_file }}"
      - name: Commit changes (if any)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes";
          else git commit -m "fix: neutralize ?v= redirects" && git push; fi
