<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carol — Shopping List (2 people)</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif;margin:0;background:#0b0c10;color:#e8e8e8;padding:1rem}
    table{border-collapse:collapse;width:100%}
    th,td{border:1px solid #2b3a47;padding:.5rem;text-align:left}
    .sub{opacity:.8}
    .ok{color:#9be99b}.warn{color:#ffec9b}.err{color:#ff9b9b}
  </style>
  <script type="module">
    async function load(){
      const pointer = await fetch('./index.json',{cache:'no-store'}).then(r=>r.json());
      const data = await fetch(pointer.shopping,{cache:'no-store'}).then(r=>r.json()).catch(()=>null);
      const coverage = await fetch('./plans/coverage.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>null);
      if(!data){ document.getElementById('meta').textContent='No shopping file yet. Run the "Carol — Generate Shopping List" workflow.'; return; }
      document.getElementById('meta').textContent = `For ${data.meta.people} people`;
      const tbody = document.getElementById('tbody');
      data.items.forEach(it=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${it.item}</td><td>${it.qty}</td><td>${it.unit}</td>`;
        tbody.appendChild(tr);
      });
      const cov = document.getElementById('coverage');
      if(coverage){
        let cls = coverage.missing?.length ? 'warn' : 'ok';
        cov.className = cls;
        cov.textContent = coverage.missing?.length ? `${coverage.missing.length} recipe(s) need defs. See pages/apps/carol/recipes/defs.json.` : 'All recipes covered.';
      }
    }
    load();
  </script>
</head>
<body>
  <h1>Carol — Shopping List</h1>
  <p id="meta" class="sub">Loading…</p>
  <p id="coverage" class="sub"></p>
  <table>
    <thead><tr><th>Item</th><th>Qty</th><th>Unit</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</body>
</html>
