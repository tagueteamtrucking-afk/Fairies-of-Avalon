<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jem — Evaluate</title>
  <link rel="stylesheet" href="../theme/tokens.css">
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#0b0f18;color:#e7ecf3}
    header{padding:16px;border-bottom:1px solid #1e2a44}
    main{padding:16px}
    .card{max-width:720px;margin:0 auto;background:#101624;border:1px solid #1c2440;border-radius:10px;padding:16px}
    label{display:block;margin:10px 0 6px}
    select,textarea,button{width:100%;padding:10px;border-radius:8px;border:1px solid #2a375a;background:#0b1220;color:#e7ecf3}
    button{cursor:pointer;margin-top:12px}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .row>div{flex:1 1 220px}
    .muted{opacity:.75}
    .ok{color:#7dfd86}
  </style>
</head>
<body>
  <header>
    <h1>Jem — Daily Evaluation</h1>
    <p class="muted">Baseline: warm‑up (morning), micro‑set (break), unwind/stretch (evening).</p>
  </header>
  <main>
    <div class="card">
      <div class="row">
        <div>
          <label for="style">Push‑up style</label>
          <select id="style">
            <option value="wall">Wall</option>
            <option value="knees">Knees</option>
            <option value="strict">Strict</option>
          </select>
        </div>
        <div>
          <label for="difficulty">Difficulty</label>
          <select id="difficulty">
            <option value="too_easy">Too easy</option>
            <option value="about_right" selected>About right</option>
            <option value="too_hard">Too hard</option>
          </select>
        </div>
      </div>
      <label for="notes">Notes (soreness, swaps, time limits)</label>
      <textarea id="notes" rows="5" placeholder="Write anything that helps Jem adapt next week…"></textarea>
      <button id="save">Save today’s log</button>
      <p id="status" class="ok" style="display:none">Saved.</p>
      <p class="muted">Data is stored locally on this device (for now). Weekly: we’ll synthesize a plan update.</p>
    </div>
  </main>
<script>
(function(){
  const LS_KEY = 'jem:eval:' + (new Date()).toISOString().slice(0,10);
  const styleEl = document.getElementById('style');
  const diffEl = document.getElementById('difficulty');
  const notesEl = document.getElementById('notes');
  const statusEl = document.getElementById('status');
  // Load prior value for today
  try{
    const prior = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if(prior){
      styleEl.value = prior.style || 'wall';
      diffEl.value = prior.difficulty || 'about_right';
      notesEl.value = prior.notes || '';
    }
  }catch{}
  document.getElementById('save').addEventListener('click', () => {
    const payload = {
      date: (new Date()).toISOString().slice(0,10),
      style: styleEl.value,
      difficulty: diffEl.value,
      notes: notesEl.value.trim()
    };
    localStorage.setItem(LS_KEY, JSON.stringify(payload));
    statusEl.style.display = 'block';
    setTimeout(()=>statusEl.style.display='none', 1500);
  });
})();
</script>
</body>
</html>
