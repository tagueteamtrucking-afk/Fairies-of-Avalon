name: Pages Preflight

on:
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.html'
      - 'importmap.json'
      - 'pages/**'
      - 'memory/site-map.json'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check import map & internal links
        run: |
          node - <<'JS'
          const fs = require('fs');
          const path = require('path');
          function exists(p){ return fs.existsSync(p) && fs.statSync(p).isFile(); }
          // Check import map
          const imp = JSON.parse(fs.readFileSync('importmap.json','utf8'));
          const needs = ['three','three/addons/','@pixiv/three-vrm'];
          let failed = false;
          needs.forEach(key => {
            if (!(imp.imports && imp.imports[key])) {
              console.log(`::error ::importmap.json missing key ${key}`);
              failed = true;
            }
          });
          // Gather HTML files
          const htmlFiles = [];
          function walk(dir) {
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) walk(p);
              else if (e.isFile() && e.name.endsWith('.html')) htmlFiles.push(p);
            }
          }
          walk('pages');
          htmlFiles.push('index.html');
          // Check internal links
          const linkRegex = /(?:href|src)=\"([^\"#]+)\"/g;
          for (const file of htmlFiles) {
            const content = fs.readFileSync(file,'utf8');
            let m;
            while ((m = linkRegex.exec(content)) !== null) {
              const u = m[1];
              if (u.startsWith('http://') || u.startsWith('https://') || u.startsWith('mailto:') || u.startsWith('tel:')) continue;
              // Normalise relative URL
              let resolved = path.posix.join(path.posix.dirname(file), u);
              resolved = resolved.replace(/^\/+/, '');
              if (!exists(resolved)) {
                console.log(`::error ::Broken link in ${file}: ${u}`);
                failed = true;
              }
            }
          }
          if (failed) process.exit(1);
          JS