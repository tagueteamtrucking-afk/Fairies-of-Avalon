name: Themis — LLM
on: { workflow_dispatch: {} }
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Themis
        env: { OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}, OPENAI_MODEL: ${{ vars.OPENAI_MODEL }} }
        shell: pwsh
        run: pwsh -File scripts/Agents-LLM.ps1 -Agent "Themis" -Count 3 -Task "list assets with expiry and draft renewal reminders"
      - name: Commit output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/themis/
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "feat(themis): updates" && git push; fi
