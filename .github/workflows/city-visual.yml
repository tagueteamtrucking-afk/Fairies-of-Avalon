name: City — Visual (Touch-up)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  touchup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure City assets present
        shell: pwsh
        run: |
          $paths = @(
            'pages/apps/_city/index.html',
            'pages/apps/_city/city.css',
            'pages/apps/theme/tokens.css'
          )
          $missing = @($paths | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            Write-Error "Missing required files: $($missing -join ', ')"
          } else {
            Write-Host "City files present."
          }

      - name: Commit cosmetic tweaks (if any)
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/_city/index.html pages/apps/_city/city.css pages/apps/theme/tokens.css || echo "No changes"
          git commit -m "City: visual polish & links fix" || echo "No changes"
          git push
