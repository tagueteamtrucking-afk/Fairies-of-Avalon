name: Generate Artwork

on:
  # Run the workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to commit generated artwork (default: main)'
        required: false
        default: 'main'

jobs:
  generate-art:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Checkout the user-specified branch so commits go to that branch
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate artwork
        env:
          ART_API_KEY: ${{ secrets.ART_API_KEY }}
        run: python scripts/generate_art.py

      - name: Commit and push images
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(artwork): update generated images"
          branch: ${{ github.event.inputs.branch }}
          file_pattern: |
            asset/designs/*.png
          push_options: '--force'
