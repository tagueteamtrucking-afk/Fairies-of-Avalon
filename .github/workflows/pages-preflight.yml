- name: Preflight checks (broken links + importmap sanity)
  run: |
    node - <<'JS'
    const fs=require('fs'),path=require('path');
    const site=JSON.parse(fs.readFileSync('memory/site-map.json','utf8'));
    const problems=[];
    let im=site.importmap||null; if(!im){ try{ im=JSON.parse(fs.readFileSync('importmap.json','utf8')); }catch{} }

    const need=['three','three/addons/']; for(const n of need){ if(!im?.imports?.[n]) problems.push(`importmap.json missing "${n}"`); }
    if(!im?.imports?.['@pixiv/three-vrm']) problems.push('importmap.json missing "@pixiv/three-vrm"');

    const files=new Set(site.pages.concat(site.entrypoints).map(s=>s.replace(/^\//,'')));
    function exists(p){ return fs.existsSync(p) && fs.statSync(p).isFile(); }
    function parseLinks(h){ const out=[]; const rx=/(?:href|src)=["']([^"']+)["']/g; let m; while((m=rx.exec(h))) out.push(m[1]); return out; }

    for(const f of files){
      if(!exists(f)){ problems.push('Missing HTML: '+f); continue; }
      const html=fs.readFileSync(f,'utf8');
      const links=parseLinks(html).filter(u=>!u.match(/^(https?:|mailto:|tel:|#)/));
      for(const u of links){
        let resolved;
        if(u.startsWith('/')) {
          // Treat as repo-rooted
          resolved = u.replace(/^\//,'');
        } else {
          // Relative to the HTML file’s folder
          resolved = path.posix.normalize(path.posix.join(path.posix.dirname(f), u));
        }
        if(!exists(resolved)) problems.push(`Broken link in ${f}: ${u}`);
      }
    }
    if(problems.length){ console.log('::group::Preflight errors'); for(const p of problems) console.log('- '+p); console.log('::endgroup::'); fs.mkdirSync('preflight',{recursive:true}); fs.writeFileSync('preflight/report.txt', problems.join('\n')); process.exitCode=1; }
    else { console.log('All good.'); }
    JS
