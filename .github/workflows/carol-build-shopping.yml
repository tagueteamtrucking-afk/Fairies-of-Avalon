name: Carol - Build Shopping (from plan)
on:
  workflow_dispatch:
    inputs:
      plan_path:
        description: 'Optional: override plan JSON path'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build shopping for 2 people
        env:
          PLAN_PATH: ${{ github.event.inputs.plan_path }}
        run: node scripts/carol/build-shopping.mjs
      - name: Commit shopping list
        run: |
          git config user.name "Carol Bot"
          git config user.email "actions@users.noreply.github.com"
          git add pages/apps/carol/plans/shopping-quantized.json || true
          git commit -m "Carol: shopping list (2 people) from plan" || echo "Nothing to commit"
          git push || echo "Nothing to push"
