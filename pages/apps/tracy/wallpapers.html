<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tracy — Wallpapers</title>
<style>body{background:#0b1220;color:#e6e9ff;font-family:system-ui,Segoe UI,Roboto;margin:0;padding:16px}a{color:#a5d6ff}input,button{font:inherit}figure{margin:0}</style></head>
<body><h1>Tracy — Wallpapers</h1>
<p>This tool helps pick or set a wallpaper URL and produces a <code>hero.css</code> you can upload to <code>/pages/apps/_city/hero.css</code>.</p>
<p>Paste image URL (e.g. <code>/asset/textures/wallpapers/hero.jpg</code>):</p>
<p><input id="u" style="width:80%" value="/asset/textures/wallpapers/hero.jpg"> <button onclick="apply()">Preview</button></p>
<figure><img id="p" alt="preview" style="max-width:100%;border:1px solid #243553;border-radius:10px;display:none"></figure>
<p><button onclick="download()">Download hero.css</button> · <a href="/pages/apps/_city/index.html" style="color:#a5d6ff">← City</a></p>
<script>
function apply(){const url=document.getElementById('u').value.trim(); const img=document.getElementById('p'); img.src=url; img.style.display='block';}
function download(){const url=document.getElementById('u').value.trim(); const css=`:root{{--hero:url('${url}')}}`; const blob=new Blob([css],{type:'text/css'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='hero.css'; a.click();}
</script></body></html>
