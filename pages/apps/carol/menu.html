<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carol — 14‑Day Menu (2 people)</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif;margin:0;background:#0b0c10;color:#e8e8e8;padding:1rem}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.75rem}
    .card{background:#162029;border:1px solid #2b3a47;border-radius:10px;padding:1rem}
    .sub{opacity:.8}
  </style>
  <script type="module">
    async function load(){
      const pointer = await fetch('./index.json',{cache:'no-store'}).then(r=>r.json());
      const plan = await fetch(pointer.plan,{cache:'no-store'}).then(r=>r.json());
      document.getElementById('meta').textContent = `For ${plan.meta.people} people · ${plan.meta.days} days · ${plan.meta.style}`;
      const grid = document.getElementById('grid');
      plan.schedule.forEach(d => {
        const div = document.createElement('div');
        div.className='card';
        div.innerHTML = `<h3>Day ${d.day}</h3>
        <div><b>Breakfast:</b> ${d.breakfast.replaceAll('_',' ')}</div>
        <div><b>Lunch:</b> ${d.lunch.replaceAll('_',' ')}</div>
        <div><b>Dinner:</b> ${d.dinner.replaceAll('_',' ')}</div>
        <div><b>Snacks:</b> ${d.snacks.map(s=>s.replaceAll('_',' ')).join(', ')}</div>`;
        grid.appendChild(div);
      });
    }
    load();
  </script>
</head>
<body>
  <h1>Carol — 14‑Day Menu (2 people)</h1>
  <p id="meta" class="sub">Loading…</p>
  <div id="grid" class="grid"></div>
  <p class="sub">Images: <a href="/pages/apps/carol/menu-hero.jpg">Add Image</a> · <a href="/pages/apps/carol/menu-bg.jpg">Add Image</a></p>
</body>
</html>
