<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Carol — 14‑Day Menu</title>
  <link rel="stylesheet" href="print.css">
  <style>
  :root { --fg:#222; --muted:#666; --bg:#fff; --chip:#eef2f7; }
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;margin:0;background:var(--bg);color:var(--fg)}
  header{position:sticky;top:0;background:#fffddc;border-bottom:1px solid #eee;padding:12px 16px;z-index:10}
  header h1{margin:0;font-size:18px}
  header .actions{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
  button{padding:8px 12px;border:1px solid #ddd;background:#fff;border-radius:8px;cursor:pointer}
  main{padding:16px;max-width:980px;margin:auto}
  .day{border:1px solid #eee;border-radius:12px;margin:14px 0;padding:12px;background:#fff}
  .day h2{margin:0 0 8px 0}
  .event{padding:10px;border:1px solid #f1f1f1;border-radius:10px;margin:8px 0;background:#fafcff}
  .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
  .kcal{background:var(--chip);padding:2px 8px;border-radius:999px}
  .items{margin:8px 0 0 0;padding-left:18px}
  .items li{margin:2px 0}
  @media print{
    header,.actions{display:none!important}
    .day{break-after:page;page-break-after:always}
    .day:last-child{break-after:auto;page-break-after:auto}
    body{background:#fff}
  }
  </style>
</head>
<body>
  <header>
    <h1>Carol — 14‑Day Menu</h1>
    <div class="actions">
      <button onclick="window.print()">Print Menu</button>
      <a href="../shopping.html"><button>Open Shopping List</button></a>
    </div>
  </header>
  <main id="app">Loading…</main>

<script>
async function loadPlanPtr(){
  const res = await fetch('./index.json', {cache:'no-store'});
  if(!res.ok) throw new Error('index.json not found');
  return res.json();
}
function kcalChip(ev){ return ev.kcal ? `<span class="kcal">≈${ev.kcal} kcal</span>` : '' }
function evMeta(ev){
  const bits = [];
  if(ev.type) bits.push(ev.type);
  if(ev.time_hint) bits.push(ev.time_hint);
  if(typeof ev.kcal === 'number') bits.push(`≈${ev.kcal} kcal`);
  return bits.join(' · ');
}
function li(i){
  const note = i.notes && i.notes.trim() ? ` — <em>${i.notes}</em>` : '';
  return `<li>${i.ingredient}: <strong>${i.quantity} ${i.unit}</strong>${note}</li>`;
}
(async () => {
  try{
    const ptr = await loadPlanPtr();
    const planURL = '../plans/' + ptr.plan_latest.split('/').pop();
    const res = await fetch(planURL, {cache:'no-store'});
    if(!res.ok){ throw new Error('Plan not found at ' + planURL); }
    const plan = await res.json();
    const app = document.getElementById('app');
    app.innerHTML = '';
    plan.days.forEach(day => {
      const div = document.createElement('div');
      div.className = 'day';
      const evs = day.events.map(ev => `
        <div class="event">
          <strong>${ev.name}</strong>
          <div class="meta">${evMeta(ev)}</div>
          ${ev.items && ev.items.length ? `<ul class="items">${ev.items.map(li).join('')}</ul>` : ''}
          ${ev.instructions && ev.instructions.length ? `<details><summary>Instructions</summary><ul class="items">${ev.instructions.map(s=>`<li>${s}</li>`).join('')}</ul></details>` : ''}
        </div>`).join('');
      div.innerHTML = `<h2>${day.day_label}</h2>${evs}`;
      app.appendChild(div);
    });
  }catch(e){
    document.getElementById('app').textContent = e.message;
  }
})();
</script>
</body>
</html>
