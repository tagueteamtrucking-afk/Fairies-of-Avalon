name: Response Check (URLs & API endpoints)
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated URLs to check"
        required: true
        default: "https://fairiesofavalon.com https://fairiesofavalon.com/pages/_city/index.html https://fairiesofavalon.com/api/hello"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Curl each URL
        run: |
          set -e
          ts=$(date -Iseconds)
          mkdir -p response-check
          for u in ${{ inputs.urls }}; do
            fn=$(echo "$u" | sed 's#https\?://##; s#[^a-zA-Z0-9._-]#_#g')
            echo "=== $u ===" | tee -a response-check/summary.txt
            curl -sS -w "\nHTTP %{http_code} in %{time_total}s\n" -o "response-check/${fn}.html" "$u" | tee -a response-check/summary.txt || true
          done
          cat response-check/summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: response-check
          path: response-check
