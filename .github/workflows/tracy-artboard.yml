name: Tracy: Artboard
on: { workflow_dispatch: {} }
jobs:
  tracy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate artboard
        shell: pwsh
        run: pwsh -File scripts/tracy-artboard.ps1
      - name: Commit artboards
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/tracy/artboards/
          if git diff --cached --quiet; then echo "No changes";
          else git commit -m "feat(tracy): update artboards"; git push; fi
