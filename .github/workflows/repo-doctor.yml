
name: Repo Doctor (read-only reports)
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Node & tools
        run: |
          node --version || sudo apt-get update -y && sudo apt-get install -y nodejs npm
          npm --version || true

      - name: Run doctor
        run: |
          node scripts/overseers/repo-doctor.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repo-doctor
          path: |
            reports/repo-doctor/summary.md
            reports/repo-doctor/duplicates.json
            reports/repo-doctor/large-files.json
            reports/repo-doctor/orphaned-pages.json
            reports/repo-doctor/dead-workflows.json
            reports/repo-doctor/bare-specifiers.json

      - name: Open/Update Repo Doctor issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner, repo = context.repo.repo;
            const md = fs.readFileSync('reports/repo-doctor/summary.md', 'utf8');
            const title = 'Repo Doctor — Cleanup Report';
            const { data: issues } = await github.rest.issues.listForRepo({owner, repo, state:'open'});
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({owner, repo, issue_number: existing.number, body: md});
            } else {
              await github.rest.issues.create({owner, repo, title, body: md, labels: ['overseer']});
            }
