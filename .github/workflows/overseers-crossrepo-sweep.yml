name: Overseers - Cross-Repo Sweep (second repo)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Clone second repo (skips if vars/secrets are missing)
        env:
          SECOND_REPO: ${{ vars.SECOND_REPO }}
          REPOS_READ_TOKEN: ${{ secrets.REPOS_READ_TOKEN }}
        run: |
          if [ -n "${SECOND_REPO}" ] && [ -n "${REPOS_READ_TOKEN}" ]; then
            git clone https://x-access-token:${REPOS_READ_TOKEN}@github.com/${SECOND_REPO} _second
          else
            echo "SECOND_REPO or REPOS_READ_TOKEN missing; skipping clone."
          fi
      - name: Run sweep on second repo (skips if no clone)
        env:
          INPUT_DIR: _second
          OUT_FILE_INDEX: memory/second-repo-index.json
        run: |
          if [ -d "_second" ]; then
            node scripts/overseers/repo-sweep.mjs
          else
            echo "No _second directory; nothing to sweep."
          fi
      - name: Commit changes (if any)
        run: |
          git config user.name "Overseers Bot"
          git config user.email "actions@users.noreply.github.com"
          git add memory/second-repo-index.json pages/apps/overseers/progress.json || true
          git commit -m "Cross-Repo Sweep: second repo files index" || echo "Nothing to commit"
          git push || echo "Nothing to push"
