name: Alexandria — LLM
on: { workflow_dispatch: {} }
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Alexandria
        env: { OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}, OPENAI_MODEL: ${{ vars.OPENAI_MODEL }} }
        shell: pwsh
        run: pwsh -File scripts/Agents-LLM.ps1 -Agent "Alexandria" -Count 3 -Task "create worldbuilding seeds and lore hooks"
      - name: Commit output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/alexandria/
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "feat(alexandria): updates" && git push; fi
