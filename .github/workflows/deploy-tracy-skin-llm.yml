name: Deploy Worker - tracy skin llm

on:
  workflow_dispatch: {}
  # push:
  #   branches: [ main ]
  #   paths:
  #     - "cloudflare/worker-tracy-llm.js"
  #     - ".github/workflows/tracy-skin-llm.yml"

permissions:
  contents: read

concurrency:
  group: tracy-skin-llm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wrangler deploy
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WORKER_NAME: tracy-skin-llm
        run: |
          npm i -g wrangler
          wrangler deploy cloudflare/worker-tracy-llm.js --name $WORKER_NAME
