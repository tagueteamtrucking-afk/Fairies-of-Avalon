lessons_learned:
  - "Do NOT cast in workflow inputs (e.g., [int]7) — pass raw values; let PowerShell parameter types coerce."
  - "JSON depth ≤ 100; Linux-safe quoting; no LINQ."
  - "Always treat 'Nothing to commit' as success."
  - "Microapps must be phone-friendly and offline-capable (PWA shell)."
  - "LLM is optional; never block workflows on rate limits."
