name: "Overseers — Create Microapps (A1)"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-microapps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup PowerShell + YAML
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module powershell-yaml -Scope CurrentUser -Force -AllowClobber
          Import-Module powershell-yaml

      - name: Seed /apps/{fairy}/ microapps with VRM preview
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & "scripts/overseers/create-microapps.ps1" -RepoRoot "${{ github.workspace }}"

      - name: Commit microapps (if changed)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git add -A "pages/apps"
          git add "pages/apps/overseers/assistants.json" 2>$null
          $changes = git status --porcelain -- "pages/apps" "pages/apps/overseers/assistants.json"
          if ([string]::IsNullOrWhiteSpace($changes)) {
            Write-Host "Nothing to commit (microapps unchanged)."
          } else {
            git config user.email "actions@github.com"
            git config user.name  "GitHub Actions"
            git fetch origin ${{ github.ref_name }} --prune
            git pull --rebase origin ${{ github.ref_name }} || echo "Nothing to rebase"
            git commit -m "Overseers: seed microapps with VRM preview (A1)"
          }

      - name: Push
        uses: ad-m/github-push-action@77c5b412c50b723d2a4fbc6d71fb5723bcd439aa
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          force_with_lease: true
