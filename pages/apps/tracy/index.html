<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tracy · Assets Catalog</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/app.css">
  <style>body{margin:0} main{max-width:1000px;margin:28px auto;padding:0 12px}
  .pill{display:inline-block;padding:.35rem .7rem;border:1px solid #999;border-radius:.6rem;font-size:.9rem;text-decoration:none;color:inherit;background:#fff;margin-right:.4rem}
  .card{border:1px solid #eee;border-radius:.6rem;padding:14px;background:rgba(255,255,255,.85);margin-bottom:12px}
  table{border-collapse:collapse;width:100%} td,th{border:1px solid #ddd;padding:6px}
  </style>
</head>
<body>
<main>
  <h1>Tracy · Assets Catalog</h1>
  <p><a class="pill" href="/.github/workflows/tracy-catalog.yml" target="_blank">Run: Build Catalog</a></p>
  <section class="card">
    <h2>Summary</h2>
    <div id="sum">Loading…</div>
  </section>
  <section class="card">
    <h2>Files</h2>
    <div id="grid">Loading…</div>
  </section>
</main>
<script type="module">
async function j(p){try{const r=await fetch(p+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return null; return await r.json();}catch{return null}}
const data=await j('/apps/tracy/catalog.json');
if(!data){ document.getElementById('sum').innerHTML='<small>No catalog yet.</small>'; document.getElementById('grid').innerHTML=''; }
else{
  document.getElementById('sum').textContent = `models:${data.models.length} wings:${data.wings.length} wallpapers:${data.wallpapers.length}`;
  const rows = data.models.concat(data.wings).concat(data.wallpapers).slice(0,200).map(f=>`<tr><td>${f.type}</td><td>${f.path}</td><td>${f.bytes||''}</td></tr>`).join('');
  document.getElementById('grid').innerHTML = `<table><tr><th>type</th><th>path</th><th>bytes</th></tr>${rows}</table>`;
}
</script>
</body>
</html>
