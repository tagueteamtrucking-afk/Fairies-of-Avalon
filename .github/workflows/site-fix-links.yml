name: Site — Fix App Links to /pages/apps
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite broken /apps paths to /pages/apps
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Recurse -Include *.html,*.css,*.js -Path pages
          foreach($f in $files){
            $c = Get-Content $f.FullName -Raw
            $new = $c -replace 'href="/apps/','href="/pages/apps/' -replace "href='/apps/","href='/pages/apps/"
            if($new -ne $c){ Set-Content $f.FullName $new -Encoding UTF8 }
          }
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add pages
          if ((git diff --cached --name-only).Length -gt 0){
            git commit -m "Site: fix /apps/* links to /pages/apps/*"
            git push origin HEAD:main
          } else {
            Write-Host "No link changes needed."
          }
