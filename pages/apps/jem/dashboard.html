<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jem — Golden Dragon Dojo</title>
<link rel="stylesheet" href="../../assets/css/avalon-dashboard.css">
</head><body>
<header class="av-head"><div class="wrap">
  <h1>🐉 Jem — Golden Dragon Dojo</h1>
  <p class="sub">Live plan snapshots for training. Source: <code>pages/apps/jem/data/plan-latest.json</code></p>
</div></header>
<main class="wrap grid">
  <section class="card">
    <h2>Current Plan</h2>
    <pre id="plan" class="mono muted">Loading plan-latest.json…</pre>
  </section>
  <section class="card">
    <h2>Exercise Log (Local)</h2>
    <div class="muted">Logs saved locally by your browser from the Dojo UI.</div>
    <table class="table"><thead><tr><th>Exercise</th><th>Sets x Reps</th><th>RPE</th><th>Time</th></tr></thead><tbody id="logBody"></tbody></table>
  </section>
</main>
<script type="module">
async function loadJSON(p){ try{ const r=await fetch(p+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error(r.status); return await r.json(); }catch(e){ return null; } }
const plan = await loadJSON('../jem/data/plan-latest.json');
document.getElementById('plan').textContent = plan ? JSON.stringify(plan,null,2) : 'plan-latest.json not found. Run “Jem Assessment Import”.';
const logs = JSON.parse(localStorage.getItem('jem_log')||'[]');
document.getElementById('logBody').innerHTML = logs.map(x=>`<tr><td>${x.ex||x.ex||''}</td><td>${x.sr||''}</td><td>${x.rpe||''}</td><td>${(x.at||'').replace('T',' ').replace('Z','')}</td></tr>`).join('');
</script>
</body></html>
