name: Repo — Sweeper Report (PR)
on:
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
jobs:
  sweeper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Sweeper
        run: |
          pwsh -File ./scripts/Repo-Sweeper-Used-Files.ps1

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Sweeper: propose removals/cleanups"
          title: "Sweeper: propose removals/cleanups"
          branch: "sweeper/20251020T225036Z"
          delete-branch: true
          labels: |
            maintenance
            sweeper
