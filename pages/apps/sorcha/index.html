<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sorcha · Social Posts</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/app.css">
<style>body{margin:0}main{max-width:1000px;margin:28px auto;padding:0 12px}.pill{display:inline-block;padding:.35rem .7rem;border:1px solid #999;border-radius:.6rem;font-size:.9rem;text-decoration:none;color:inherit;background:#fff;margin-right:.4rem}.card{border:1px solid #eee;border-radius:.6rem;padding:14px;background:rgba(255,255,255,.85);margin-bottom:12px}</style></head>
<body><main>
<h1>Sorcha · Social Posts</h1>
<p><a class="pill" href="/.github/workflows/sorcha-posts.yml" target="_blank">Run: Generate Posts</a></p>
<section class="card"><h2>Posts</h2><div id="out">Loading…</div></section>
</main>
<script type="module">
async function j(p){try{const r=await fetch(p+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return null; return await r.json();}catch{return null}}
const posts=await j('/apps/sorcha/posts.json');
const el=document.getElementById('out');
if(!posts){ el.innerHTML='<small>No posts yet.</small>'; }
else{ el.innerHTML = posts.map(p=>`<div class="card"><b>${p.title}</b><p>${p.body}</p><small>${p.platform}</small></div>`).join(''); }
</script></body></html>
