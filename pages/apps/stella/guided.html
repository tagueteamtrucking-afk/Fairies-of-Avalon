<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stella — Guided Audio</title>
<style>body{background:#0b1220;color:#e5e7eb;font-family:system-ui,Segoe UI,Roboto;margin:0;padding:16px}</style>
</head><body><main>
<h1>Stella — Guided Audio</h1>
<label>Worker URL <input id="w" size="60" placeholder="https://your-worker.workers.dev"></label>
<button onclick="save()">Save</button>
<hr>
<select id="prog">
<option value="stella-focus">Focus / Determination</option>
<option value="stella-success">Success Priming</option>
<option value="stella-gratitude">Happiness / Gratitude</option>
<option value="stella-gateway">Gateway Practice</option>
</select>
<button onclick="play()">▶️ Play</button>
<script>
function save(){ localStorage.setItem('OPENAI_WORKER_URL', document.getElementById('w').value); alert('Saved'); }
async function play(){
  const url = localStorage.getItem('OPENAI_WORKER_URL'); if(!url){ alert('Set Worker URL first'); return; }
  const id = document.getElementById('prog').value;
  const resp = await fetch(url+'/stella-guide?id='+encodeURIComponent(id));
  const buf = await resp.arrayBuffer(); const audioUrl = URL.createObjectURL(new Blob([buf]));
  new Audio(audioUrl).play();
}
</script>
</main></body></html>
