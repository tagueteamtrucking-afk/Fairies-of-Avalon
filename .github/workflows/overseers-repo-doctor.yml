name: Overseers - Repo Doctor
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove '?v=' cache-busters from HTML
        run: |
          ls -R
          python - << 'PY'
import os, re, io
for root, _, files in os.walk('.', topdown=True):
    for fn in files:
        if fn.lower().endswith(('.html', '.htm')):
            p = os.path.join(root, fn)
            with io.open(p, 'r', encoding='utf-8', errors='ignore') as f:
                c = f.read()
            c2 = re.sub(r'\?v=\d+', '', c)
            if c2 != c:
                with io.open(p, 'w', encoding='utf-8') as f:
                    f.write(c2)
PY
      - name: Ensure CNAME exists
        run: |
          if [ ! -f CNAME ]; then echo "fairiesofavalon.com" > CNAME; fi
      - name: Commit fixes
        run: |
          git config user.name "Overseers Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A || true
          git commit -m "Repo Doctor: normalize cache-busters + ensure CNAME" || echo "Nothing to commit"
          git push || echo "Nothing to push"
