name: Carol - Rebuild Shopping List
on:
  workflow_dispatch: {}
  push:
    paths:
      - 'pages/apps/carol/index.json'
      - 'pages/apps/carol/plans/**.json'
      - 'scripts/carol/build-shopping.mjs'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build aggregated shopping list (2 people)
        run: node scripts/carol/build-shopping.mjs

      - name: Commit & push shopping artifact
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add pages/apps/carol/plans/shopping-2p.json || true
          git commit -m "Carol: rebuild shopping-2p.json" || true
          git push
