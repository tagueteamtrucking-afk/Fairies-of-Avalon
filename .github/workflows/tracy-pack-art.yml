name: Tracy Pack Art
on: { workflow_dispatch: {} }
permissions:
  contents: write
  pull-requests: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle art feeds
        run: |
          mkdir -p artifacts/tracy
          echo "Generated at 2025-10-31 06:38:21" > artifacts/tracy/STORE_FEED.txt
      - uses: actions/upload-artifact@v4
        with: { name: tracy-store-feed, path: artifacts/tracy }
      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'tracy: add store feed'
          title: 'tracy: add store feed'
          branch: ci/tracy-store-feed-${{ github.run_id }}
          base: ${{ github.ref_name }}
