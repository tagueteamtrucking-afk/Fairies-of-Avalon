<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Avalon — Welcome</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="./landing.generated.css?v=7">
  <style>body{margin:0;}</style>
</head>
<body>
  <header class="hero" style="background-image:url('/asset/textures/wallpapers/castle%20village%2001.jpg')">
    <div class="overlay">
      <h1>Avalon</h1>
      <p>Welcome to Avalon. Explore the Overseers and their Fairies.</p>
      <p>
        <a class="cta" href="/apps/overseers/hub/">Overseers Hub</a>
        <a class="cta" href="/apps/overseers/console.html">Open Console</a>
      </p>
    </div>
  </header>
  <main class="wrap">
    <section>
      <h2>Fairies</h2>
      <div class="tiles">
        <a class="tile" href="/apps/abbey/"><span>Abbey</span><small>Open</small></a>
<a class="tile" href="/apps/alexandria/"><span>Alexandria</span><small>Open</small></a>
<a class="tile" href="/apps/billie/"><span>Billie</span><small>Open</small></a>
<a class="tile" href="/apps/carol/"><span>Carol</span><small>Open</small></a>
<a class="tile" href="/apps/charlotte/"><span>Charlotte</span><small>Open</small></a>
<a class="tile" href="/apps/clarice/"><span>Clarice</span><small>Open</small></a>
<a class="tile" href="/apps/jem/"><span>Jem</span><small>Open</small></a>
<a class="tile" href="/apps/nina/"><span>Nina</span><small>Open</small></a>
<a class="tile" href="/apps/odessa/"><span>Odessa</span><small>Open</small></a>
<a class="tile" href="/apps/reyczar/"><span>Reyczar</span><small>Open</small></a>
<a class="tile" href="/apps/sorcha/"><span>Sorcha</span><small>Open</small></a>
<a class="tile" href="/apps/themis/"><span>Themis</span><small>Open</small></a>
<a class="tile" href="/apps/whitestar/"><span>WhiteStar</span><small>Open</small></a>
<a class="tile" href="/apps/tracy/"><span>Tracy</span><small>Open</small></a>
<a class="tile" href="/apps/stella/"><span>Stella</span><small>Open</small></a>

      </div>
    </section>
  </main>
  <script type="module">
(async ()=>{
  const hero = document.querySelector(".hero");
  if (!hero) return;
  const bg = getComputedStyle(hero).backgroundImage || "";
  const blank = !bg || bg === "none" || /url\(""\)/.test(bg);
  async function tryApply(){
    try{
      const res = await fetch("/apps/overseers/wallpapers.json?ts=" + Date.now(), { cache: "no-store" });
      const list = await res.json();
      if (Array.isArray(list) && list.length){
        const p = "/" + String(list[0].path || "").replace(/^\/+/, "");
        const u = p.replace(/ /g,"%20").replace(/\(/g,"%28").replace(/\)/g,"%29");
        hero.style.backgroundImage = "url('" + u + "')";
      }
    }catch{}
  }
  if (blank) { await tryApply(); }
})();
</script>
</body>
</html>
