name: Charlotte - AI Projects Crawler (GitHub)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1'
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run crawler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/charlotte/crawler.mjs
      - name: Commit results
        run: |
          git config user.name "Charlotte Bot"
          git config user.email "actions@users.noreply.github.com"
          git add pages/apps/charlotte/crawler/index.json || true
          git commit -m "Charlotte crawler: AI repos snapshot" || echo "Nothing to commit"
          git push || echo "Nothing to push"
