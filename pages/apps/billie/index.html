<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Billie • Studio</title>
  <link rel="stylesheet" href="../theme/tokens.css">
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:var(--bg);color:var(--fg)}
    header{padding:18px 20px;border-bottom:1px solid var(--border);background:var(--panel-bg)}
    h1{margin:0;font-size:20px}
    main{padding:16px 20px;max-width:900px;margin:0 auto}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
    a.tile{display:block;background:var(--panel-bg);border:1px solid var(--border);border-radius:14px;padding:14px;text-decoration:none;color:inherit}
    h3{margin:8px 0 0 0;font-size:16px}
    .sub{opacity:.8;font-size:12px}
  </style>
</head>
<body>
<header><h1>Billie — Creator Studio (PG‑13)</h1></header>
<main>
  <div class="grid">
    <a class="tile" href="./overview.html">
      <h3>Overview</h3>
      <div class="sub">Goals, channels, schedule</div>
    </a>
    <a class="tile" href="./storyboards.html">
      <h3>Storyboards</h3>
      <div class="sub">Plan beats & scenes</div>
    </a>
    <a class="tile" href="../_city/index.html">
      <h3>← Back to City</h3>
      <div class="sub">Return to Avalon map</div>
    </a>
  </div>
</main>
</body>
</html>
