name: Overseers - Repo Doctor
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove ?v= cache busters
        run: |
          git grep -Il "\?v=" | xargs -r sed -i 's/\?v=[^"\'\']*//g'
      - name: Ensure CNAME
        run: |
          echo "fairiesofavalon.com" > CNAME
      - name: Commit
        run: |
          git config user.name "Repo Doctor"
          git config user.email "actions@users.noreply.github.com"
          git add -A || true
          git commit -m "Repo Doctor: cache-busters removed; CNAME ensured" || echo "Nothing to commit"
          git push || echo "Nothing to push"
