name: Carol — Set Plan Pointer
on:
  workflow_dispatch:
    inputs:
      plan_path:
        description: "Path to plan JSON"
        required: true
        default: "pages/apps/carol/plans/twoperson-2wk-unique-20251015T022300Z.json"
permissions:
  contents: write
jobs:
  set-pointer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update pointer files
        shell: pwsh
        run: |
          $plan = "${{ github.event.inputs.plan_path }}"
          $idxPath = "pages/apps/carol/index.json"
          $plansIdx = "pages/apps/carol/plans/index.json"
          $idx = @{ 
            current_plan = "plans/" + [IO.Path]::GetFileName($plan)
            shopping_extracted = "plans/shopping-extracted.json"
            shopping_quantized = "plans/shopping-quantized.json"
            preferences = @{ spreads_prefer = "sunflower seed butter"; swap_hard_foods = "use butters/smooth alternatives" }
          }
          $null = New-Item -ItemType Directory -Force -Path (Split-Path $idxPath)
          $idx | ConvertTo-Json -Depth 6 | Set-Content -Path $idxPath -Encoding UTF8
          $obj = @{ latest = [IO.Path]::GetFileName($plan) }
          $obj | ConvertTo-Json -Depth 6 | Set-Content -Path $plansIdx -Encoding UTF8

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pages/apps/carol/index.json pages/apps/carol/plans/index.json
          git commit -m "Carol: set plan pointer to $plan" || echo "No changes to commit"
          git push
