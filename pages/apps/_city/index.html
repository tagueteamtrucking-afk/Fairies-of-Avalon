<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avalon — City</title>
  <link rel="stylesheet" href="/pages/apps/carol/carol.css">
  <style>
    body{background:var(--bg);}
    .hero{
      background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.0)),
                 center/cover no-repeat url('/asset/textures/wallpapers/carol-pagoda-exterior.jpg');
      min-height:38vh;display:flex;align-items:flex-end;padding:1.25rem;border-bottom:1px solid #1f2632;
    }
    .hero h1{margin:0;text-shadow:0 2px 12px rgba(0,0,0,.6)}
    .grid{display:grid;gap:1rem;padding:1rem;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
    .tile{background:var(--card);border:1px solid #283040;border-radius:.9rem;padding:1rem;text-decoration:none;color:var(--ink)}
    .tile h3{margin:.2rem 0}
    .tile .small{color:var(--muted)}
  </style>
</head>
<body>
  <div class="hero">
    <h1>Fairies of Avalon — City</h1>
  </div>
  <section class="grid">
    <a class="tile" href="/pages/apps/carol/menu.html">
      <div>🍽️ Carol — Bistro</div>
      <h3>Menu (14‑day)</h3>
      <div class="small">Phoenix Pagoda</div>
    </a>
    <a class="tile" href="/pages/apps/carol/shopping.html">
      <div>🛒 Carol — Bistro</div>
      <h3>Shopping List</h3>
      <div class="small">For two people</div>
    </a>
  </section>
</body>
</html>
