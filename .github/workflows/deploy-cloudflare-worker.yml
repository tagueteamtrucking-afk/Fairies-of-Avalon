name: Deploy — Cloudflare Auth Worker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Wrangler
        run: npm install -g wrangler
      - name: Publish Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PIN_RAY: ${{ secrets.PIN_RAY }}
          PIN_BLANCA: ${{ secrets.PIN_BLANCA }}
        run: |
          echo "name = \"avalon-auth\"" > cloudflare/wrangler.toml
          echo "main = \"cloudflare/worker-auth.js\"" >> cloudflare/wrangler.toml
          echo "compatibility_date = \"2025-10-20\"" >> cloudflare/wrangler.toml
          # Publish with bound secrets
          wrangler secret put SESSION_SECRET --non-interactive <<< "$SESSION_SECRET"
          wrangler secret put PIN_RAY --non-interactive <<< "$PIN_RAY"
          wrangler secret put PIN_BLANCA --non-interactive <<< "$PIN_BLANCA"
          wrangler deploy cloudflare/worker-auth.js --name avalon-auth
