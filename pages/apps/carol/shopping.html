<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Carol — Shopping List</title>
  <link rel="stylesheet" href="./print.css">
  <style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:16px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}h1{font-size:1.4rem;margin:0}.err{background:#fee;border:1px solid #fbb;padding:10px;border-radius:8px}#units{color:#555;font-size:.9rem}#list{margin-top:10px}details{background:#fff;border:1px solid #e5e7eb;border-radius:10px;margin:8px 0;padding:8px}summary{font-weight:600;cursor:pointer}.row{display:flex;gap:.5rem;align-items:center;padding:4px 0;border-bottom:1px dotted #eee}.row:last-child{border-bottom:none}.qty{min-width:5.5rem;text-align:right;font-variant-numeric:tabular-nums}.name{flex:1}</style>
</head>
<body>
  <header>
    <h1>Shopping List</h1>
    <div>
      <button id="printBtn">Print</button>
      <button id="openPrint">Open Print Page</button>
    </div>
  </header>
  <div id="units">Units: produce in <strong>lb</strong> (est), milk in <strong>qt</strong>, yogurt/cottage/mozzarella in <strong>oz</strong>, hummus/cream cheese in <strong>oz</strong>. Assumptions are listed at the bottom.</div>
  <div id="err" class="err" style="display:none"></div>
  <div id="list"></div>
  <section id="assumptions" style="margin-top:12px;color:#555;font-size:.9rem"></section>
  <script src="./shopping.js" defer></script>
</body>
</html>
