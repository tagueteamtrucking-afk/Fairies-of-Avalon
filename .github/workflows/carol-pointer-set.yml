name: Carol — Set Current Plan Pointer
on:
  workflow_dispatch:
    inputs:
      plan_path:
        description: 'Path to the plan JSON under pages/apps/carol/plans'
        required: true
        default: pages/apps/carol/plans/twoperson-2wk-unique-20251015T022300Z.json
permissions:
  contents: write
jobs:
  set-pointer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write pointer files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages/apps/carol/plans
          cat > pages/apps/carol/index.json <<JSON
          {"current_plan":"${{ github.event.inputs.plan_path }}",
           "diet_rules":{"sunflower_seed_butter_preferred":true,"soft_alternatives_for_hard_foods":true}}
          JSON
          cat > pages/apps/carol/plans/index.json <<JSON
          {"latest":"${{ github.event.inputs.plan_path }}"}
          JSON
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/apps/carol/index.json pages/apps/carol/plans/index.json
          git commit -m "Carol: set pointer -> ${{ github.event.inputs.plan_path }}" || echo "No changes"
          git push
