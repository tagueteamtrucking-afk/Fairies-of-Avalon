name: Auto-approve & Automerge (label-gated)

on:
  pull_request_target:
    types: [labeled, synchronize, opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  statuses: read
  checks: read

jobs:
  approve-and-merge:
    if: >
      contains(github.event.pull_request.labels.*.name, 'automerge') &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest

    steps:
      - name: Ensure CI is green
        uses: actions-ecosystem/action-wait-for-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          intervalSeconds: 10
          timeoutSeconds: 3600

      - name: Auto-approve (for bots / safe areas)
        if: |
          contains(github.event.pull_request.labels.*.name, 'bot') ||
          contains(github.event.pull_request.labels.*.name, 'docs') ||
          contains(github.event.pull_request.labels.*.name, 'workflows') ||
          contains(github.event.pull_request.labels.*.name, 'site')
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Automerge (squash) when eligible
        uses: pascalgn/automerge-action@v0.16.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_LABELS: automerge
          MERGE_METHOD: squash
          MERGE_DELETE_BRANCH: "true"
          MERGE_BLOCK_LABELS: hold
