name: Charlotte: TTS (Azure)
on: { workflow_dispatch: {} }
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synthesize voiceovers
        env: { AZURE_TTS_KEY: ${{ secrets.AZURE_TTS_KEY }}, AZURE_TTS_REGION: ${{ secrets.AZURE_TTS_REGION }} }
        shell: pwsh
        run: pwsh -File scripts/Charlotte-TTS.ps1
      - name: Commit voiceovers
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/charlotte/voiceovers/
          if git diff --cached --quiet; then echo "No changes";
          else git commit -m "feat(tts): update voiceovers"; git push; fi
