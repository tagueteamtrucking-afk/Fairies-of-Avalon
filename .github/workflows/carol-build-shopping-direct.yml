name: "Carol — Refresh Shopping (direct commit)"
on:
  workflow_dispatch:
    inputs:
      plan_path:
        description: "Path to the plan JSON to use"
        required: false
        default: "pages/apps/carol/plans/twoperson-2wk-unique-20251015T022300Z.json"

permissions:
  contents: write

jobs:
  build-shopping:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare merged plan for extractor
        run: |
          $src = "${{ github.event.inputs.plan_path }}"
          if (-not (Test-Path $src)) {
            Write-Host "Input plan not found at $src. Trying fallbacks..."
            $candidates = @(
              "pages/apps/carol/plans/twoperson-2wk-unique-20251015T022300Z.json",
              "pages/apps/carol/plans/twoperson-2wk-20251014T234049Z.json",
              "pages/apps/carol/plans/mealplan-dash-14d-current.json",
              "pages/apps/carol/plans/plan-14d-seeded.json",
              "pages/apps/carol/plans/offline-twoperson-2wk-20251010T013559Z.json"
            )
            $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $found) { throw "No plan file found in inputs or fallbacks." }
            $src = $found
          }
          New-Item -ItemType Directory -Force -Path "pages/apps/carol/plans" | Out-Null
          Copy-Item -Force $src "pages/apps/carol/plans/twoperson-2wk-merged.json"
          Write-Host "Using plan: $src -> pages/apps/carol/plans/twoperson-2wk-merged.json"

      - name: Extract shopping (quantized)
        run: ./scripts/Carol-Extract-Shopping-v3.ps1

      - name: Commit shopping list
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Carol: refresh shopping list from ${{ github.event.inputs.plan_path }}"
          file_pattern: |
            pages/apps/carol/plans/shopping-quantized.json
            pages/apps/carol/plans/shopping-extracted.json