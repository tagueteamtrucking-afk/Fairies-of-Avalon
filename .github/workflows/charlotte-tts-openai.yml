name: Charlotte: TTS (OpenAI)
on: { workflow_dispatch: {} }
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synthesize voiceovers with OpenAI
        env: { OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}, OPENAI_MODEL: ${{ vars.OPENAI_MODEL }} }
        shell: pwsh
        run: pwsh -File scripts/Charlotte-TTS-OpenAI.ps1
      - name: Commit voiceovers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/charlotte/voiceovers/
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "feat(tts-openai): voiceovers"; git push; fi
