name: Carol - Inspect Plan
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect pointer and plan JSON
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root = $env:GITHUB_WORKSPACE
          $ptrPath = Join-Path $root "pages/apps/carol/index.json"
          if(Test-Path $ptrPath){
            $ptr = Get-Content -Raw -LiteralPath $ptrPath | ConvertFrom-Json
            Write-Host "Pointer: $($ptr | ConvertTo-Json -Depth 5)"
            if($ptr.plan){
              $planPath = (Join-Path $root ($ptr.plan.TrimStart('/')))
              if(Test-Path $planPath){
                $plan = Get-Content -Raw -LiteralPath $planPath | ConvertFrom-Json
                $days = @($plan.menu.days); if(-not $days){ $days = @($plan.days) }
                $count = ($days | Measure-Object).Count
                Write-Host "Plan exists at $planPath with $count days"
              }else{
                Write-Error "Pointer.plan file not found at $planPath"
              }
            } else {
              Write-Error "Pointer.plan is null"
            }
          } else {
            Write-Error "Pointer file missing at $ptrPath"
          }
      - name: Write debug JSON
        shell: bash
        run: |
          mkdir -p pages/apps/carol/debug
          echo '{}' > pages/apps/carol/debug/plan-inspect.json
      - name: Commit debug stub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/carol/debug/plan-inspect.json || true
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(carol): debug stub" && git push; fi
