<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jem — Dashboard</title><style>body{font-family:system-ui;background:#0b0f17;color:#e5e7eb;margin:0}header{padding:12px 16px;border-bottom:1px solid #172033}main{padding:16px}section{margin-bottom:16px;border:1px solid #172033;border-radius:8px;padding:12px;background:#0f172a}h2{margin-top:0}.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.card{border:1px solid #172033;border-radius:8px;padding:10px;background:#0b1220}</style>
<header><h1>Jem — Training & Biometrics</h1></header>
<main>
<section><h2>Programs</h2><div id="programs" class="grid"></div></section>
<section><h2>Biometrics imports</h2><div id="bio" class="grid"></div><p>Upload a Samsung Health export zip to <code>pages/apps/jem/imports/</code> and run the workflow “Jem — Import Samsung Health Export”.</p></section>
</main>
<script>
async function list(dir){ try{ const r = await fetch(dir); if(!r.ok) return []; const t = await r.text(); return [...t.matchAll(/href="([^"]+\.json)"/g)].map(m=>m[1]); }catch(e){ return []; } }
(async()=>{
 const pg = document.getElementById('programs'); for(const p of await list('./programs/')){ const a=document.createElement('a'); a.href='./programs/'+p; a.textContent=p; const d=document.createElement('div'); d.className='card'; d.appendChild(a); pg.appendChild(d);} 
 const bio = document.getElementById('bio'); for(const p of await list('./biometrics/')){ const a=document.createElement('a'); a.href='./biometrics/'+p; a.textContent=p; const d=document.createElement('div'); d.className='card'; d.appendChild(a); bio.appendChild(d);} 
})();
</script>
