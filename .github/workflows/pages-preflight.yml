name: Pages Preflight (links + importmap)

on:
  pull_request:
    branches: [ main ]
    paths:
      - "**/*.html"
      - "importmap.json"
      - "pages/**"
      - "asset/**"
      - "assets/**"
      - "memory/site-map.json"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site map fallback (if not present)
        run: |
          if [ ! -f memory/site-map.json ]; then
            mkdir -p memory
            node - <<'JS'
            const fs = require('fs'), path = require('path');
            function walk(d, acc=[]) {
              for (const e of fs.readdirSync(d, {withFileTypes:true})) {
                const p = path.join(d, e.name);
                if (e.isDirectory()) {
                  if (['.git','node_modules','.next','.vercel','.cache'].includes(e.name)) continue;
                  walk(p, acc);
                } else if (e.isFile()) {
                  acc.push(path.relative(process.cwd(), p).replace(/\\/g,'/'));
                }
              }
              return acc;
            }
            const files = walk(process.cwd());
            const pages = files.filter(f => f.startsWith('pages/') && f.endsWith('.html')).map(f => '/'+f);
            const entry = fs.existsSync('index.html') ? ['/index.html'] : [];
            const assets = files.filter(f => f.startsWith('asset/') || f.startsWith('assets/')).map(f => '/'+f);
            let importmap=null; try{ importmap = JSON.parse(fs.readFileSync('importmap.json','utf8')); }catch{}
            fs.writeFileSync('memory/site-map.json', JSON.stringify({
              generated: new Date().toISOString(),
              entrypoints: entry,
              pages,
              assets,
              importmap
            }, null, 2));
            JS
          fi

      - name: Preflight checks (broken links + importmap sanity)
        continue-on-error: true
        run: |
          node - <<'JS'
          const fs = require('fs'), path = require('path');
          const REPORT_DIR = 'preflight'; const REPORT_FILE = path.join(REPORT_DIR, 'report.txt');
          fs.mkdirSync(REPORT_DIR, { recursive: true });
          function writeReport(lines) { fs.writeFileSync(REPORT_FILE, (lines?.length?lines:['No details']).join('\n')); }
          function exists(p){ try { return fs.existsSync(p) && fs.statSync(p).isFile(); } catch { return false; } }

          // Load or rebuild site-map if corrupt
          function loadOrRebuildSiteMap() {
            try { return JSON.parse(fs.readFileSync('memory/site-map.json','utf8')); }
            catch {
              const files=(function walk(d,acc=[]){for(const e of fs.readdirSync(d,{withFileTypes:true})){
                const p=path.join(d,e.name);
                if(e.isDirectory()){ if(['.git','node_modules','.next','.vercel','.cache'].includes(e.name)) continue; walk(p,acc);}
                else if(e.isFile()){ acc.push(path.relative(process.cwd(),p).replace(/\\/g,'/')); }} return acc; })(process.cwd(),[]);
              const pages = files.filter(f=>f.startsWith('pages/')&&f.endsWith('.html')).map(f=>'/'+f);
              const entry = fs.existsSync('index.html')?['/index.html']:[];
              const assets = files.filter(f=>f.startsWith('asset/')||f.startsWith('assets/')).map(f=>'/'+f);
              let importmap=null; try{ importmap = JSON.parse(fs.readFileSync('importmap.json','utf8')); }catch{}
              const sm={generated:new Date().toISOString(), entrypoints:entry, pages, assets, importmap};
              fs.mkdirSync('memory',{recursive:true}); fs.writeFileSync('memory/site-map.json', JSON.stringify(sm,null,2));
              return sm;
            }
          }

          try {
            const site = loadOrRebuildSiteMap();
            let im = site.importmap || null; if(!im){ try{ im=JSON.parse(fs.readFileSync('importmap.json','utf8')); }catch{} }
            const problems = [];

            for (const need of ['three','three/addons/']) if (!im?.imports?.[need]) problems.push(`importmap.json missing "${need}"`);
            if (!im?.imports?.['@pixiv/three-vrm']) problems.push('importmap.json missing "@pixiv/three-vrm"');

            const htmlFiles = new Set((site.entrypoints||[]).concat(site.pages||[]).map(s=>s.replace(/^\//,'')));

            function parseLinks(h){ const out=[]; const rx=/(?:href|src)=["']([^"']+)["']/g; let m; while((m=rx.exec(h))) out.push(m[1]); return out; }

            for (const file of htmlFiles) {
              if (!exists(file)) { problems.push(`Missing HTML: ${file}`); continue; }
              const links = parseLinks(fs.readFileSync(file,'utf8')).filter(u=>!u.match(/^(https?:|mailto:|tel:|#)/));
              for (const u of links) {
                const resolved = u.startsWith('/') ? u.replace(/^\//,'')
                  : path.posix.normalize(path.posix.join(path.posix.dirname(file), u));
                if (!exists(resolved)) problems.push(`Broken link in ${file}: ${u}`);
              }
            }

            if (problems.length) { console.log('::group::Preflight errors'); problems.forEach(p=>console.log('- '+p)); console.log('::endgroup::'); writeReport(problems); }
            else { console.log('All good.'); writeReport(['OK']); }
          } catch (err) { console.error('Preflight crashed:', err.stack||String(err)); writeReport(['Preflight crashed:', String(err.stack||err)]); }
          JS

      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-preflight-report
          path: preflight
          if-no-files-found: ignore
