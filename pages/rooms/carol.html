<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carol’s Bistro</title>
<style>
  html,body{margin:0;height:100%;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial;color:#fff}
  .hero{position:relative;min-height:42vh;background:url('/asset/textures/rooms/carol-restaurant.jpg') center/cover no-repeat;display:flex;align-items:end}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,.2), rgba(0,0,0,.75));}
  .hero h1{position:relative;margin:0;padding:18px 16px 22px 16px;text-shadow:0 2px 14px rgba(0,0,0,.65)}
  main{padding:16px;background:radial-gradient(100% 100% at 50% 0%, rgba(0,0,0,.35), rgba(0,0,0,.85));min-height:58vh}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}
  a.card{display:block;min-height:140px;padding:12px;border-radius:14px;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.45);backdrop-filter:blur(2px)}
  a.card h3{margin:0 0 6px 0}
  .small{font-size:12px;color:#e8d8a6}
</style>
</head>
<body>
<section class="hero">
  <div class="shade"></div>
  <h1>Carol’s Bistro</h1>
</section>
<main>
  <div class="grid">
    <a class="card" href="/pages/apps/carol/menu.html"><h3>Menu</h3><div class="small">14‑day plan, sunflower seed butter swaps, soft‑foods notes</div></a>
    <a class="card" href="/pages/apps/carol/shopping.html"><h3>Shopping</h3><div class="small">Quantified list for two people; derives if missing</div></a>
    <a class="card" href="/pages/apps/_city/index.html"><h3>← Back to City</h3><div class="small">Phoenix Pagoda tile</div></a>
  </div>
</main>
</body>
</html>
