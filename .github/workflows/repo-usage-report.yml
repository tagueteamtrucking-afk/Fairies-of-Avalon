name: Repo — Usage Report (preview / archive orphans)
on:
  workflow_dispatch:
    inputs:
      archive:
        description: "Archive orphan scripts (yes/no)"
        required: false
        default: "no"
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory + Refs
        shell: pwsh
        run: |
          pwsh -File scripts/Repo-Inventory.ps1
          pwsh -File scripts/Repo-Refs-Graph.ps1
      - name: Usage report
        shell: pwsh
        run: pwsh -File scripts/Repo-Usage-Report.ps1 -ArchiveOrphans:(${{ github.event.inputs.archive == 'yes' }})
      - name: Commit reports (and archived files list)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add memory-history/repo-usage-report.json scripts/_archive/** || true
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(repo): usage report (archive=${{ github.event.inputs.archive }})" && git push; fi
