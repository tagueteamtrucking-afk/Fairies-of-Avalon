name: Label PRs (safe scopes + CI catalog)
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
  pull-requests: write
jobs:
  label:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels from .github/labeler.yml
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
      - name: Add 'automerge' for safe scopes and CI catalog PRs
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner, repo = context.repo.repo;
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number });
            const safe = files.length>0 && files.every(f =>
              f.filename.startsWith('pages/') ||
              f.filename.startsWith('.github/workflows/') ||
              f.filename.endsWith('.md')
            );
            const title = pr.title || "";
            const isCatalog = /^ci\/clarity-core/i.test(pr.head.ref) || /^clarity core/i.test(title) || /clarity[- ]core/i.test(title);
            const isBot = /\[bot\]$/.test(pr.user.login);
            if (safe || (isCatalog && isBot)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['automerge'] });
            }
