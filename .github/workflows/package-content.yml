name: Package - Content ZIP (no workflows)
on: { workflow_dispatch: {} }
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip repo (exclude workflows)
        run: |
          zip -r Avalon-Content.zip . -x ".github/workflows/*"
      - uses: actions/upload-artifact@v4
        with: { name: Avalon-Content, path: Avalon-Content.zip, if-no-files-found: error }
