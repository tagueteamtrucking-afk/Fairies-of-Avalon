<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Abbey · Budget</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/app.css">
<style>body{margin:0}main{max-width:1000px;margin:28px auto;padding:0 12px}.pill{display:inline-block;padding:.35rem .7rem;border:1px solid #999;border-radius:.6rem;font-size:.9rem;text-decoration:none;color:inherit;background:#fff;margin-right:.4rem}.card{border:1px solid #eee;border-radius:.6rem;padding:14px;background:rgba(255,255,255,.85);margin-bottom:12px}</style></head>
<body><main>
<h1>Abbey · Budget</h1>
<p><a class="pill" href="/.github/workflows/abbey-budget.yml" target="_blank">Run: Build Budget</a></p>
<section class="card"><div id="out">Loading…</div></section>
</main>
<script type="module">
async function j(p){try{const r=await fetch(p+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return null; return await r.json();}catch{return null}}
const data=await j('/apps/abbey/budget.json');
const el=document.getElementById('out');
if(!data){ el.innerHTML='<small>No budget yet.</small>'; }
else{
  el.innerHTML = `<p><b>Income:</b> $${data.income.toFixed(2)} — <b>Expenses:</b> $${data.expenses.toFixed(2)} — <b>Net:</b> $${(data.income-data.expenses).toFixed(2)}</p>` +
    '<h3>Breakdown</h3>' + Object.entries(data.breakdown||{}).map(([k,v])=>`<div>${k}: $${v.toFixed(2)}</div>`).join('');
}
</script></body></html>
