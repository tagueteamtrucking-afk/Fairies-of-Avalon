name: Merge Queue (batch)

on:
  workflow_dispatch:
    inputs:
      max_prs:
        description: 'Max PRs to merge this run'
        required: false
        default: '20'

permissions:
  contents: write
  pull-requests: write

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - name: Select and merge PRs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const max = parseInt(core.getInput('max_prs') || '20', 10);
            const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 100 });
            let count = 0;
            for (const pr of prs) {
              if (count >= max) break;
              const labels = pr.labels.map(l => l.name);
              const isCatalog = pr.head.ref.startsWith('ci/clarity-core') || /clarity[- ]core/i.test(pr.title);
              const isBot = pr.user.login.endsWith('[bot]');
              const eligible = labels.includes('automerge') || (isCatalog && isBot);
              if (!eligible) continue;

              // Checks must be green
              const { data: statuses } = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: pr.head.sha });
              const ok = statuses.state === 'success';
              if (!ok) continue;

              try {
                await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, merge_method: 'squash' });
                count++;
              } catch (e) {
                core.warning(`Could not merge PR #${pr.number}: ${e.message}`);
              }
            }
            core.notice(`Merged ${count} PR(s).`);
