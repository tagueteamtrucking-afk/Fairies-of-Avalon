name: Actions Audit (on push)
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const { data } = await github.rest.actions.listRepoWorkflows({owner, repo, per_page: 200});
            const lines = (data.workflows||[]).map(w => `- ${w.name} (${w.path})`).join('\n');
            const body = `## Actions Audit (push)\n\n${lines}`;
            const title = 'Actions Audit Report';
            const { data: issues } = await github.rest.issues.listForRepo({owner, repo, state: 'open'});
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({owner, repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({owner, repo, title, body});
            }
