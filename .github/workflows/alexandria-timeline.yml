name: "Alexandria — Build Timeline"

on:
  workflow_dispatch:
    inputs:
      seed_path:
        description: "Seed path (optional). Leave blank for latest in /pages/apps/alexandria/worlds"
        required: false
        default: ""
      count:
        description: "Number of events (max 7)"
        required: true
        default: "7"
      mode:
        description: "Generation mode"
        required: true
        default: "auto"
        type: choice
        options: ["auto","fallback-only"]

permissions:
  contents: write

jobs:
  timeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Build Timeline
        shell: pwsh
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          $ErrorActionPreference='Stop'
          $force = ("${{ github.event.inputs.mode }}" -eq "fallback-only")
          & "scripts/overseers/alexandria-timeline.ps1" `
            -RepoRoot "${{ github.workspace }}" `
            -SeedPath "${{ github.event.inputs.seed_path }}" `
            -Count "${{ github.event.inputs.count }}" `
            -ForceFallback:$force

      - name: Commit (if changed)
        shell: pwsh
        run: |
          git add -A "pages/apps/alexandria/worlds/timelines"
          $changes = git status --porcelain -- "pages/apps/alexandria/worlds/timelines"
          if ([string]::IsNullOrWhiteSpace($changes)) {
            Write-Host "Nothing to commit."
          } else {
            git config user.email "actions@github.com"
            git config user.name  "GitHub Actions"
            git fetch origin ${{ github.ref_name }} --prune
            git pull --rebase origin ${{ github.ref_name }} || echo "Nothing to rebase"
            git commit -m "Alexandria: timeline"
          }

      - name: Push
        uses: ad-m/github-push-action@77c5b412c50b723d2a4fbc6d71fb5723bcd439aa
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          force_with_lease: true
