name: Overseers - Cleanup Duplicate Manifests Workflows
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remove duplicate manifest workflows
        run: node scripts/overseers/cleanup-dup-workflows.mjs
      - name: Commit cleanup
        run: |
          git config user.name "Overseers Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A || true
          git commit -m "Overseers: removed duplicate manifests workflows" || echo "Nothing to commit"
          git push || echo "Nothing to push"
