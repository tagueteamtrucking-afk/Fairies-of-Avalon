<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jem — Program Viewer (Week‑1)</title>
<link rel="stylesheet" href="/pages/apps/_shared/ui-lite.css">
</head><body><div class="wrap">
<div class="nav">
  <a class="btn" href="/pages/apps/_city/castle-town.html">🗺️ Castle‑Town</a>
  <a class="btn" href="/pages/apps/jem/evaluate.html">🧪 Evaluation</a>
</div>
<h1>📋 Jem — Week‑1 Plan</h1>
<div class="panel">
  <h3>Load your evaluation JSON</h3>
  <input type="file" id="file" accept="application/json">
</div>
<div class="panel" id="px"></div>
<div class="panel">
  <table id="plan"><thead><tr><th>Day</th><th>Warm‑up</th><th>Strength/Mobility</th><th>Cardio</th><th>Cool‑down</th><th>Log (what I did)</th></tr></thead><tbody></tbody></table>
</div>
<div class="panel">
  <button class="btn" id="export">⬇️ Export Progress JSON</button>
</div>
<script>
let intake=null, progress=[];
function read(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsText(f); })}
function level(sts, pu, plank){ let score=0; if(sts>=15)score++; if(pu.reps>=10)score++; if(plank>=30)score++; return score } // 0=novice,1=base,2=good
function prog(intake){
  const p=intake; const lvl=level(p.tests.sts30, p.tests.pushups, p.tests.plank_sec);
  const knee = (p.goals.pain||0)>=4;
  const equip = new Set(p.equipment||[]);
  const days=[];
  for(let d=1; d<=7; d++){
    const warm = "3–5 min easy march in place + shoulder rolls + ankle circles";
    const strength = [
      knee? "Sit-to-Stand (chair) 3×8 (hands free if possible)":"Sit-to-Stand 3×10",
      "Wall Push-ups 3×8 (or Knees 2×10)",
      "Bird-dog 3×6/side (slow)",
      "Glute bridge 3×10",
      "Standing calf stretch 2×30s/side",
      "Hamstring stretch 2×30s/side"
    ];
    if(p.tests.wallsit_sec<30) strength.push("Wall-sit holds 3×20–30s");
    if(p.tests.plank_sec<20) strength.push("Modified plank (knees) 3×15–20s");
    if(equip.has('bands')) strength.push("Terminal knee extension (band) 2×12");
    const cardio = "10–15 min low‑impact: brisk walk, step‑march or gentle shadow‑boxing (RPE 3–4). Monitor how you feel.";
    const cool = "2–3 min slow walk + breath work (4‑2‑6)";
    days.push({day:d,warm,strength,cardio,cool,log:{}});
  }
  return days;
}
function renderPlan(days){
  const tb=document.querySelector("#plan tbody"); tb.innerHTML=""; progress = days.map(d=>({day:d.day, did:{}}));
  days.forEach((d,i)=>{
    const tr=document.createElement('tr');
    const s = "<ul>"+d.strength.map(x=>"<li>"+x+"</li>").join("")+"</ul>";
    tr.innerHTML = `<td class='k'>Day ${d.day}</td><td>${d.warm}</td><td>${s}</td><td>${d.cardio}</td><td>${d.cool}</td>
      <td><textarea data-i="${i}" rows="3" placeholder="What I did, RPE, time..."></textarea></td>`;
    tb.appendChild(tr);
  });
  tb.querySelectorAll("textarea").forEach(t=>t.addEventListener('input',e=>{
    const i=+e.target.dataset.i; progress[i].did.notes = e.target.value;
  }));
}
document.getElementById('file').onchange = async (e)=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    intake = JSON.parse(await read(f));
    document.getElementById('px').innerHTML = `<b>Participant:</b> ${intake.person.name||'—'} • <b>Goal:</b> ${intake.goals.primary||'—'} • <b>BP:</b> ${intake.person.bp||'—'} • <span class="muted">RPE 3–4 for cardio; stop if symptomatic.</span>`;
    renderPlan(prog(intake));
  }catch(err){
    document.getElementById('px').textContent = "Could not parse JSON.";
  }
};
document.getElementById('export').onclick = ()=>{
  const out = { ts:new Date().toISOString(), person:intake?.person||{}, progress };
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'})); a.download="jem-week1-progress.json"; a.click();
};
</script>
</div></body></html>
