name: Repo - Workflows Standardize (rename + delete old)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Standardize workflows (rename + keep)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          keep_path = 'config/workflows-keep.json'
          map_path  = 'config/workflows-rename.json'
          wfdir = os.path.join('.github','workflows')
          os.makedirs(wfdir, exist_ok=True)
          # Rename old -> canonical
          if os.path.isfile(map_path):
              m = json.load(open(map_path,'r',encoding='utf-8'))
              for old,new in m.get('rename',[]):
                  oldp=os.path.join(wfdir,old); newp=os.path.join(wfdir,new)
                  if os.path.isfile(oldp):
                      os.makedirs(os.path.dirname(newp), exist_ok=True)
                      if os.path.isfile(newp):
                          os.remove(oldp)
                          print('Deleted duplicate', old)
                      else:
                          os.rename(oldp,newp)
                          print('Renamed', old, '->', new)
          # Delete anything not on keep list
          keep=set()
          if os.path.isfile(keep_path):
              keep = set(json.load(open(keep_path,'r',encoding='utf-8')).get('keep',[]))
          for fn in os.listdir(wfdir):
              if not (fn.endswith('.yml') or fn.endswith('.yaml')):
                  continue
              if fn not in keep:
                  os.remove(os.path.join(wfdir,fn))
                  print('Removed', fn)
          PY
      - name: Commit standardization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows || true
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(workflows): standardize (rename+delete)" && git push; fi
