name: Overseers — Repo Doctor (report-only)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Repo Doctor
        shell: pwsh
        run: ./scripts/Repo-Doctor.ps1
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: repo-doctor-report
          path: |
            memory-history/repo-usage-report.json
            memory-history/repo-inventory.json
            memory-history/repo-refs.json
            pages/apps/overseers/repo-doctor-report.json
