name: Overseers - Repo Doctor
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove '?v=' cache-busters from HTML
        run: |
          files=$(git ls-files '*.html' '*.htm' || true)
          for f in $files; do
            sed -i -E 's/\?v=[0-9]+//g' "$f" || true
          done
      - name: Ensure CNAME exists
        run: |
          if [ ! -f CNAME ]; then echo "fairiesofavalon.com" > CNAME; fi
      - name: Commit fixes
        run: |
          git config user.name "Overseers Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A || true
          git commit -m "Repo Doctor: normalize cache-busters + ensure CNAME" || echo "Nothing to commit"
          git push || echo "Nothing to push"
