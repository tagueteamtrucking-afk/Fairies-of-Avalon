<!doctype html>
<meta charset="utf-8">
<title>Charlotte — App Highlights</title>
<link rel="stylesheet" href="../_shared/ui-lite.css">
<style>
  body{background:#0b0b0f;color:#e8e8ee;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:24px;}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  h1{margin:0;font-size:24px;}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));}
  .card{border:1px solid #2a2a30;border-radius:14px;padding:14px;background:#101018;}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid #3a3a44;margin-right:6px;font-size:12px}
  a.btn{padding:6px 10px;border:1px solid #3a3a44;border-radius:10px;color:#e8e8ee;text-decoration:none;background:#12121a}
  .muted{opacity:.75}
  details{margin-top:8px}
  .good{border-color:#2a4; box-shadow:0 0 0 1px #2a4 inset;}
</style>
<header>
  <h1>Charlotte — App Highlights</h1>
  <nav>
    <a class="btn" href="../charlotte/index.html">Crawler</a>
    <a class="btn" href="../../overseers/overview.html">Overseers</a>
  </nav>
</header>

<p class="muted">Aggregated from Charlotte’s crawler. “Good-Fit” ranks ESM/no-build, CDNable, permissive-licensed tools for GitHub Pages.</p>

<section id="apps" class="grid"></section>

<script type="module">
const APPS = document.getElementById('apps');
async function getIndex(){
  try{
    const r = await fetch('../charlotte/crawler/index.json', {cache:'no-store'});
    if (!r.ok) return [];
    return await r.json();
  }catch(e){ return []; }
}
async function getJson(url){
  try{ const r = await fetch(url, {cache:'no-store'}); if (!r.ok) return null; return await r.json(); }
  catch(e){ return null; }
}
function goodFitScore(entry){
  const txt = JSON.stringify(entry).toLowerCase();
  let s = 0;
  if (/(esm|module|importmap|cdn|skypack|esm\.sh|unpkg|jspm)/.test(txt)) s += 2;
  if (/(web component|custom elements|vanilla js|no build|no bundler)/.test(txt)) s += 2;
  if (/(mit|isc|apache-2)/.test(txt)) s += 1;
  if (/typescript|d\.ts/.test(txt)) s += 1;
  return s; // 0..6
}
function summarize(entry){
  const url = entry.url || entry.link || entry.homepage || '';
  const domain = url ? new URL(url).hostname.replace(/^www\./,'') : (entry.domain||'unknown');
  const title = entry.title || entry.name || domain;
  const desc  = entry.description || entry.summary || entry.about || '';
  const tags  = entry.tags || entry.keywords || [];
  const score = goodFitScore(entry);
  const rec = score>=4 ? '✅ Good-Fit' : score>=2 ? '↔ Evaluate build needs' : '⚠ Likely build-required';
  return {domain, title, desc, tags, url, rec, score, raw:entry};
}
function card(app){
  const tags = (app.tags||[]).slice(0,6).map(t=>`<span class="pill">${t}</span>`).join(' ');
  const link = app.url ? `<a class="btn" href="${app.url}" target="_blank" rel="noopener">Open</a>` : '';
  return `
  <div class="card ${app.score>=4?'good':''}">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;">
      <div>
        <div style="font-weight:700">${app.title}</div>
        <div class="muted" style="font-size:12px">${app.domain}</div>
      </div>
      <div style="display:flex;gap:6px">${link}<a class="btn" href="../overseers/hub/index.html">Add to importmap</a></div>
    </div>
    <p style="margin:8px 0">${app.desc||''}</p>
    <div>${tags} <span class="pill">${app.rec}</span></div>
    <details><summary>Raw</summary>
      <pre style="white-space:pre-wrap; font-size:12px">${escapeHTML(JSON.stringify(app.raw,null,2))}</pre>
    </details>
  </div>`;
}
function escapeHTML(s){ return s.replace(/[&<>]/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

(async function(){
  const idx = await getIndex();
  if (!Array.isArray(idx) || !idx.length){
    APPS.innerHTML = '<div class="card">No crawler index. Open Crawler and generate results.</div>';
    return;
  }
  const files = idx.slice(-7);
  const all = [];
  for (const f of files){
    const url = `../charlotte/crawler/results/${f}`;
    const dataset = await getJson(url);
    const entries = Array.isArray(dataset) ? dataset
      : (dataset && Array.isArray(dataset.entries) ? dataset.entries : []);
    for (const e of entries) all.push(summarize(e));
  }
  if (!all.length){ APPS.innerHTML = '<div class="card">No entries found.</div>'; return; }
  // Sort Good-Fit first
  all.sort((a,b)=> b.score - a.score);
  APPS.innerHTML = all.map(card).join('\n');
})();
</script>
