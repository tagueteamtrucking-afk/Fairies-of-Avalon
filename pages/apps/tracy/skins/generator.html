<!doctype html><meta charset='utf-8'><title>Tracy Skin Generator</title><h2>Tracy — LLM Skin Generator</h2><textarea id='prompt' rows='6' cols='60' placeholder='Describe a bright Avalon skin...'></textarea><br><button id='go'>Generate</button><pre id='out'></pre><script type='module'>document.getElementById('go').onclick=async()=>{const p=document.getElementById('prompt').value;const r=await fetch('/api/skin-llm',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:p})});const css=await r.text();document.getElementById('out').textContent=css.slice(0,1000)+'\n...';};</script>
