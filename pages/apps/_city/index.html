<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Avalon · City</title>
  <style>
    html,body{margin:0;height:100%;background:#060607;color:#fff;font-family:ui-sans-serif,system-ui}
    header{padding:16px 20px;font-weight:600}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;max-width:1100px;margin:10px auto;padding:10px}
    .tile{position:relative;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 22px rgba(0,0,0,.3)}
    .tile img{display:block;width:100%;height:140px;object-fit:cover;filter:saturate(1.1)}
    .tile a{position:absolute;inset:auto 0 0 0;background:linear-gradient(180deg,transparent, rgba(0,0,0,.8));padding:10px 12px;text-decoration:none;color:#fff;font-weight:600}
  </style>
</head>
<body>
  <header>Avalon · City</header>
  <main class="grid">
    <figure class="tile">
      <img src="/asset/textures/buildings/phoenix-pagoda.jpg" alt="Carol · Bistro">
      <a href="/pages/rooms/carol.html">Carol · Bistro</a>
    </figure>
  </main>
</body>
</html>
