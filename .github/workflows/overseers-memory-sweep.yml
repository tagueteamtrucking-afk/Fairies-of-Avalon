name: Overseers - Memory Sweep
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: memory-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "Build in-repo memory index"
        shell: bash
        run: |
          set -euo pipefail
          node scripts/overseers/memory-index.mjs --root . --out pages/apps/overseers/memory-index.json

      - name: "Commit to PR branch"
        shell: bash
        run: |
          set -euo pipefail
          BR="autobot/memory-sweep-${GITHUB_RUN_ID}"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git checkout -b "$BR" || git checkout "$BR"
          git add pages/apps/overseers/memory-index.json
          git commit -m "chore(overseers): update Memory Index" || echo "Nothing to commit."
          git push origin "$BR" || echo "Branch exists or no changes."

      - name: "Open PR"
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const head  = `autobot/memory-sweep-${process.env.GITHUB_RUN_ID}`;
            try {
              const { data: pr } = await github.rest.pulls.create({
                owner, repo, head, base: 'main',
                title: 'Overseers: Memory Index',
                body: `Automated update from run ${context.runId}`
              });
              core.notice(`PR created: ${pr.html_url}`);
            } catch (e) {
              core.warning(`PR create skipped or exists: ${e.message}`);
            }
