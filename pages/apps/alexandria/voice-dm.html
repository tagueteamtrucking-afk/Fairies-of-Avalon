<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alexandria — Voice DM</title><style>body{background:#0b1220;color:#e6e9ff;font-family:system-ui,Segoe UI,Roboto;margin:0;padding:16px}a{color:#a5d6ff}textarea,input,button{font:inherit}</style></head>
<body><h1>Alexandria — Voice DM</h1>
<p>Paste your Worker URL once (saved locally): <input id="w" style="width:60%"><button onclick="save()">Save</button></p>
<p><textarea id="t" placeholder="Say something to the DM…" style="width:100%;min-height:120px"></textarea></p>
<p><button onclick="speak()">Speak</button> <audio id="a" controls style="width:100%"></audio></p>
<p><a href="/pages/apps/alexandria/index.html" style="color:#a5d6ff">← Back</a></p>
<script type="module">
import {{getWorker,setWorker}} from '/pages/apps/shared/worker.js';
const w=document.getElementById('w'); w.value=getWorker();
window.save=()=>setWorker(w.value.trim());
window.speak=async()=>{const url=(getWorker()||'').replace(/\/$/,'')+'/speak'; const text=document.getElementById('t').value||'Hello from Alexandria'; const r=await fetch(url,{method:'POST',headers:{{'content-type':'application/json'}},body:JSON.stringify({{voice:'dm',text}})}); const blob=await r.blob(); document.getElementById('a').src=URL.createObjectURL(blob);};
</script></body></html>
