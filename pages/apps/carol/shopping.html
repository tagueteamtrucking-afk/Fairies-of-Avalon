<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Carol • Shopping List</title>
  <link rel="stylesheet" href="./theme.css"/>
</head>
<body>
  <header class="app-hero">
    <div class="wrap">
      <h1>Shopping List</h1>
      <p class="kicker">Quantized for two people • US measures</p>
      <div class="toolbar">
        <a class="btn" href="./menu.html">← Back to Menu</a>
        <a class="btn" href="/pages/apps/_city/index.html">City</a>
      </div>
    </div>
  </header>
  <main class="wrap">
    <div class="card">
      <h2>Items</h2>
      <div id="list"></div>
      <p id="notice" class="notice"></p>
    </div>
    <div class="card">
      <h2>Notes</h2>
      <ul class="clean">
        <li>Prefer <b>sunflower seed butter</b> where spreads apply.</li>
        <li>Swap very hard/crunchy items for <b>butters/soft alternatives</b> as needed.</li>
      </ul>
    </div>
  </main>
<script>
async function loadJSON(path){
  const r = await fetch(path, {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status+' for '+path);
  return r.json();
}
function renderShopping(obj){
  // Expect either {items:[{name,qty,unit,...}]} or a plain array, or a dict
  let rows = [];
  if(Array.isArray(obj)) rows = obj;
  else if(obj && Array.isArray(obj.items)) rows = obj.items;
  else if(obj && typeof obj==='object'){
    rows = Object.keys(obj).map(k=>({name:k, ...(obj[k]||{})}));
  }
  if(!rows.length) return '<p class="notice">No shopping items were found.</p>';
  const html = '<ul class="clean">' + rows.map(it=>{
    const n = it.name || it.item || it.title || 'Item';
    const q = [it.qty||it.quantity, it.unit].filter(Boolean).join(' ');
    const note = it.note ? ' <span class="small">('+it.note+')</span>' : '';
    return '<li>' + (q?('<b>'+q+'</b> – '):'') + n + note + '</li>';
  }).join('') + '</ul>';
  return html;
}
(async () => {
  try{
    const pointer = await loadJSON('./index.json');
    const path = (pointer && pointer.shopping) ? ('/'+pointer.shopping.replace(/^\/?/,'').replace(/\/+/, '/')) : null;
    if(!path) throw new Error('Missing shopping path in index.json');
    const data = await loadJSON(path);
    document.getElementById('list').innerHTML = renderShopping(data);
  }catch(e){
    document.getElementById('notice').innerHTML = 'No shopping list found yet. Run the workflow <b>Carol — Refresh Menu & Shopping</b> with your plan path to generate <code>shopping-quantized.json</code>.';
  }
})();
</script>
</body>
</html>
