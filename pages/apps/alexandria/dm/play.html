<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alexandria DM — Table</title>
<link rel="stylesheet" href="dm.css">
</head><body>
<header><h1>Alexandria — DM Table</h1></header>
<main>
  <section class="controls">
    <button id="roll-d20">Roll d20</button>
    <button id="roll-d12">d12</button>
    <button id="roll-d10">d10</button>
    <button id="roll-d8">d8</button>
    <button id="roll-d6">d6</button>
    <button id="roll-d4">d4</button>
    <span id="roll-out"></span>
  </section>
  <section class="chat">
    <div id="log"></div>
    <div class="composer">
      <input id="msg" placeholder="Say something to the DM...">
      <button id="send">Send</button>
    </div>
    <div class="actions">
      <button id="export">Export Session JSON</button>
      <button id="clear">Clear</button>
    </div>
  </section>
</main>
<footer>
  <small>Offline DM mode. To enable LLM mode, configure a Cloudflare Worker and set window.ALEXANDRIA_API_URL in dm.js.</small>
</footer>
<script src="dm.js"></script>
</body></html>
