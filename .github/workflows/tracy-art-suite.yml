name: Tracy — Art Suite

on:
  workflow_dispatch:
    inputs:
      world:  { description: "World (auto-pick latest if empty)", required: false, type: string }
      boards: { description: "Number of art briefs",               required: false, default: 8, type: number }

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Build Artboards (safe wrapper)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = (Get-Location).Path

          $world = @"
${{ inputs.world }}
"@

          $bStr = "${{ inputs.boards }}"
          if ([string]::IsNullOrWhiteSpace($bStr)) { $bStr = '8' }
          [int]$boards = $bStr

          ./scripts/overseers/tracy-artboard.ps1 `
            -RepoRoot $repo `
            -World $world `
            -Boards $boards


      - name: Commit artifacts
        shell: bash
        run: |
          set -e
          git config user.name  "actions-bot"
          git config user.email "actions@github.com"
          git add -A pages/apps/alexandria/worlds/artboards || true
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Tracy Artboards"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

