<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carol — Shopping List (2 people, 14 days)</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif;margin:0;background:#0b0c10;color:#e8e8e8;padding:1rem}
    table{border-collapse:collapse;width:100%}
    th,td{border:1px solid #2b3a47;padding:.5rem;text-align:left}
    .sub{opacity:.8}
  </style>
  <script type="module">
    async function load(){
      const pointer = await fetch('./index.json',{cache:'no-store'}).then(r=>r.json());
      const data = await fetch(pointer.shopping,{cache:'no-store'}).then(r=>r.json());
      document.getElementById('meta').textContent = `For ${data.meta.people} people · ${data.meta.days} days`;
      const tbody = document.getElementById('tbody');
      data.items.forEach(it=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${it.item}</td><td>${it.qty}</td><td>${it.unit}</td>`;
        tbody.appendChild(tr);
      });
    }
    load();
  </script>
</head>
<body>
  <h1>Carol — Shopping List</h1>
  <p id="meta" class="sub">Loading…</p>
  <table>
    <thead><tr><th>Item</th><th>Qty</th><th>Unit</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</body>
</html>
