name: Clarice — Graphics Audit
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit graphics
        shell: pwsh
        run: pwsh -File scripts/Clarice-Graphics-Audit.ps1
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/clarice/reports/
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(clarice): graphics audit" && git push; fi
