name: Tracy — Skin From Wallpapers
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  skin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Avalon skin CSS
        shell: pwsh
        run: pwsh -File scripts/Tracy-Skin-From-Wallpapers.ps1
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/tracy/skins/avalon-skin.css
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "feat(tracy): skin from wallpapers" && git push; fi
