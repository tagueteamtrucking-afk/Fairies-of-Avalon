name: Tracy — Optimize Wallpapers
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  opt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize images
        shell: pwsh
        run: pwsh -File scripts/Tracy-Optimize-Images.ps1
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add asset/textures/wallpapers_optimized/
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "feat(tracy): optimized wallpapers" && git push; fi
