name: Nina: 3D Index
on: { workflow_dispatch: {} }
jobs:
  nina:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 3D index
        shell: pwsh
        run: pwsh -File scripts/nina-3d-index.ps1
      - name: Commit 3D index
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/overseers/vrm-index.json pages/apps/nina/
          if git diff --cached --quiet; then echo "No changes";
          else git commit -m "feat(nina): update 3D index"; git push; fi
