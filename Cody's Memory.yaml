meta:
  project: Avalon
  file_name: "Cody's Memory.yaml"
  version: "1.15.0"
  last_updated: "2025-09-17"
  author: "Cody (GPT-5 Pro)"
  notes: >
    v1.15.0 — Cooperative Helpers (no UI changes):
      - Tracy Art Suite: artboard briefs for regions/themes.
      - Nina 3D Suite: vrm-index + scene stubs using existing assets.
      - Charlotte Pipelines: TTS SSML plans + offline translations + packaging plan.
      - Alexandria Helpers retained; All‑in‑One orchestrator included.
      - WPI = Work Progress Index; data-only in pages/apps/overseers/progress.json.

delivery_policy:
  speed_first: true
  two_person_authorization: false
  whole_file_replacements_only: true
  preferred_shell: "GitHub Actions workflows + PowerShell"

project:
  assistants_label: "Fairies"
  preserve_paths: ["asset/models","asset/wings","asset/textures","pages/apps/alexandria/worlds"]

runtime:
  workflows:
    alexandria_helpers: ".github/workflows/alexandria-helpers.yml"
    tracy_art_suite: ".github/workflows/tracy-art-suite.yml"
    nina_3d_suite: ".github/workflows/nina-3d-suite.yml"
    charlotte_pipelines: ".github/workflows/charlotte-pipelines.yml"
    helpers_all: ".github/workflows/avalon-helpers-all.yml"
    manifests_wpi: "Overseers — Manifests & WPI (existing)"

artifacts:
  - "pages/apps/overseers/vrm-index.json"
  - "pages/apps/alexandria/worlds/artboards/artboard-<world>.json"
  - "pages/apps/alexandria/worlds/3d/SceneKit-<world>.json"
  - "pages/apps/alexandria/worlds/pipelines/pipeline-<world>.json"
  - "pages/apps/alexandria/worlds/pipelines/tts/*.ssml"
  - "pages/apps/alexandria/worlds/pipelines/translations/Scenes-<world>.<lang>.md"
  - "pages/apps/alexandria/worlds/codex/figures-<world>.json"
  - "pages/apps/alexandria/worlds/reports/continuity-<world>.json"
  - "pages/apps/alexandria/worlds/exports/WorldBundle-<world>.zip"

engineering_rules:
  - "Ask clarifying questions until ≥95% sure; then execute."
  - "Plan before code; workflows first; no UI edits unless requested."
  - "Use Linux‑safe PowerShell; avoid LINQ static calls; ConvertTo‑Json depth ≤ 100."
  - "Switch booleans: pass -Flag:$true, not strings."
  - "Treat 'Nothing to commit' as success in CI."
