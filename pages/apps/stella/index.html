<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stella — Components</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body data-repo-url="">
  <header class="topbar">
    <a class="back" href="../index.html" aria-label="Back to microapps">←</a>
    <h1>Stella</h1>
    <div class="spacer"></div>
    <a id="genWf" class="btn-map" href="#gen-components" title="Run Stella LLM Components"><span aria-hidden="true">🗺️</span><span class="label">Generate Components</span></a>
    <a class="muted" href="components/index.json" target="_blank" rel="noopener">JSON</a>
  </header>
  <main id="grid" class="grid" aria-live="polite"></main>
  <template id="component-card">
    <article class="card">
      <h3 class="title"></h3>
      <p class="summary"></p>
      <details class="details">
        <summary>Blueprint</summary>
        <pre class="code"></pre>
      </details>
    </article>
  </template>
  <script src="app.js"></script>
  <script>
    (function(){
      var repo = document.body.getAttribute('data-repo-url') || "";
      var gen = document.getElementById('genWf');
      if (repo && /^https?:\/\//.test(repo)) {
        var wf = repo.replace(/\/?$/, '') + "/actions/workflows/stella-llm.yml";
        if (gen) gen.href = wf;
      } else { if (gen) gen.setAttribute('title','Set data-repo-url on <body> to enable this link'); }
    }());
  </script>
</body>
</html>
