plans:
  overseers_activation:
    owner: rey_czar
    qa_owner: white_star
    status: "in-flight"
    tasks:
      - id: OZ1
        name: "Overseers Hub (aggregate all functions)"
        status: "queued"
        acceptance: >
          /pages/apps/overseers/hub/ exists; shows per-Fairy tiles, impersonation buttons, WPI badge,
          manifest presence, and permissions summary. Links open each microapp.
      - id: OZ2
        name: "Permissions Processor workflow"
        status: "queued"
        acceptance: >
          .github/workflows/overseers-permissions.yml runs on push to permissions/grants/**
          and updates pages/apps/overseers/permissions/state.json; approvals logged; no plaintext secrets.
      - id: OZ3
        name: "Manifests Builder + WPI emission"
        status: "queued"
        acceptance: >
          .github/workflows/overseers-manifests.yml builds asset/models/models.json and asset/wings/manifest.json,
          and writes wallpaper_power_index into progress.json; Console/Hub show nonzero WPI when wallpapers exist.
      - id: OZ4
        name: "Phase-1 Seeder"
        status: "queued"
        acceptance: >
          .github/workflows/queue-phase-1.yml enqueues A1–A3 requests for all Fairies; Runner processes them; Hub shows progress.

  assistants_phase_1:
    owner: rey_czar
    qa_owner: white_star
    status: "queued"
    tasks:
      - { id: A1, name: "Microapp per Fairy (skeleton + import map where needed)",   status: "queued" }
      - { id: A2, name: "Shared VRM viewer + Wings Lab hook",                         status: "queued" }
      - { id: A3, name: "VRM & Wings manifest builders (manual trigger)",             status: "queued" }
      - { id: A7, name: "Console/Hub: Per-Fairy status & links",                      status: "queued" }

  overseers_followups:
    owner: clarice
    qa_owner: white_star
    status: "queued"
    tasks:
      - { id: O1, name: "WPI telemetry wired into progress.json + Hub badge",         status: "queued" }
      - { id: O2, name: "Deploy auto-trigger verification",                           status: "queued" }

audit_log:
  - { ts: "2025-09-13T12:00:00Z", actor: "assistant", action: "mem.replace", target: "Cody's Memory.yaml", result: "ok",
      notes: "v1.8.0 — Overseers queue/runner + LLM Bridge (LIVE if secret)." }
  - { ts: "2025-09-13T14:00:00Z", actor: "actions", action: "runner.process", target: "overseers-queue", result: "ok",
      notes: "Live scaffold executed; 8 test runs visible; progress + processed updated." }
  - { ts: "2025-09-13T16:00:00Z", actor: "assistant", action: "mem.replace", target: "Cody's Memory.yaml", result: "ok",
      notes: "v2.0.0 — Overseers Omnicapability Activation; inheritance switch + next-step workflows planned." }

lessons_learned:
  - "Overseers must own an inheritance switch (all functions) and expose them via an aggregated Hub."
  - "Permissions need a first-class workflow; approvals must be logged in state.json."
  - "Telemetry (WPI, manifests present) should be emitted by CI and displayed live (network-first)."
  - "Avoid LINQ in PowerShell; keep scripts portable."
  - "Linux-safe quoting: inside single-quoted strings, double any single quotes."
  - "Import map is mandatory on module pages (three, three/addons, @pixiv/three-vrm)."
  - "Write CNAME during deploy so the custom domain sticks."
  - "No plaintext secrets; use repo Secrets or vault references only."
