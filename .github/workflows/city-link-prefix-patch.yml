name: City — Link Prefix Patch

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  patch:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite /apps → /pages/apps and /rooms → /pages/rooms
        run: |
          $files = git ls-files | Where-Object { $_ -match '^pages/.*\.(html|js|css)$' }
          foreach($f in $files){
            $t = Get-Content $f -Raw
            $t = $t -replace 'href="/apps/', 'href="/pages/apps/'
            $t = $t -replace 'src="/apps/', 'src="/pages/apps/'
            $t = $t -replace 'href="/rooms/', 'href="/pages/rooms/'
            $t = $t -replace 'src="/rooms/', 'src="/pages/rooms/'
            Set-Content -NoNewline -Path $f -Value $t
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b city/link-prefix-patch
          git add -A
          if(git diff --cached --quiet){ 
            Write-Host "No changes to commit."
          } else {
            git commit -m "City: patch link prefixes for GitHub Pages"
            git push --set-upstream origin city/link-prefix-patch
          }

      - name: Create PR (if changes)
        if: ${{ always() }}
        uses: peter-evans/create-pull-request@v6
        with:
          title: "City: link prefix patch"
          commit-message: "City: link prefix patch"
          branch: city/link-prefix-patch
          body: |
            Convert root-relative links to GitHub Pages paths:
            - `/apps/*` → `/pages/apps/*`
            - `/rooms/*` → `/pages/rooms/*`
