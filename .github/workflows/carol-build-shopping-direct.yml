
name: Carol — Refresh Shopping (direct commit)
on:
  workflow_dispatch:
    inputs:
      planfile:
        description: "Plan JSON (default is the 14-day unique plan)"
        required: false
        default: "pages/apps/carol/plans/twoperson-2wk-unique-20251015T022300Z.json"
permissions:
  contents: write
defaults:
  run:
    shell: pwsh
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve plan & copy to merged name
        run: |
          $ErrorActionPreference = 'Stop'
          $plan = "${ github.event.inputs.planfile }"
          if ([string]::IsNullOrWhiteSpace($plan)) { $plan = "pages/apps/carol/plans/twoperson-2wk-unique-20251015T022300Z.json" }
          if (!(Test-Path $plan)) { throw "Plan not found: $plan" }
          New-Item -ItemType Directory -Force -Path "pages/apps/carol/plans" | Out-Null
          Copy-Item $plan "pages/apps/carol/plans/twoperson-2wk-merged.json" -Force
          Write-Host "Merged plan created at pages/apps/carol/plans/twoperson-2wk-merged.json"
      - name: Run extractor (v3) to produce shopping-quantized.json
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Carol-Extract-Shopping-v3.ps1
      - name: Commit & push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pages/apps/carol/plans/shopping-quantized.json pages/apps/carol/plans/twoperson-2wk-merged.json || echo "Nothing to add"
          if ((git status --porcelain) -ne "") {
            git commit -m "Carol: refresh shopping from ${ github.event.inputs.planfile }"
            git push
          } else {
            Write-Host "No changes to commit"
          }
