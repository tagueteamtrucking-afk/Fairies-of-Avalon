meta:
  project: Avalon
  file_name: "Cody's Memory.yaml"
  version: "1.18.0"
  last_updated: "2025-09-18"
  author: "Cody (GPT-5 Pro)"
  notes: >
    v1.18.0 — Added 'Avalon — Run All (Mega)' workflow that runs all suites
    in-sequence inside a single job (no cross-workflow dispatch). Keeps UI frozen.
    Continues v1.17.0 fixes (splatting, safe [int], guarded git add, offline-first).

project:
  preserve_paths: ["asset/models", "asset/wings", "asset/textures", "pages/apps/alexandria/worlds", "pages/apps/carol/plans", "pages/apps/jem/programs"]

runtime:
  workflows:
    avalon_run_all: ".github/workflows/avalon-run-all.yml"
    alexandria_build_all: ".github/workflows/alexandria-build-all.yml"
    alexandria_helpers: ".github/workflows/alexandria-helpers.yml"
    tracy_art_suite: ".github/workflows/tracy-art-suite.yml"
    nina_3d_suite: ".github/workflows/nina-3d-suite.yml"
    charlotte_pipelines: ".github/workflows/charlotte-pipelines.yml"
    carol_meal_suite: ".github/workflows/carol-meal-suite.yml"
    jem_program_suite: ".github/workflows/jem-program-suite.yml"

engineering_rules:
  - "Use single-workflow orchestrator to avoid workflow-dispatch permission pitfalls."
  - "Booleans as switches; cast numbers; no backticks; JSON depth ≤ 100."
  - "Treat 'Nothing to commit' as success; rebase before push."

plans:
  now:
    - "Run 'Avalon — Run All (Mega)' to generate world + helpers + art + 3D + pipelines + Carol + Jem."
