name: Charlotte - Curated Crawl
on:
  workflow_dispatch:
jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run curated crawl
        run: node scripts/charlotte/curated-crawl.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Pull Request (curated finds)
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "feat(charlotte): update curated AI project finds"
          title: "feat(charlotte): update curated AI project finds"
          branch: autobot/charlotte-curated-${{ github.run_id }}
          add-paths: |
            pages/apps/charlotte/finds.json
