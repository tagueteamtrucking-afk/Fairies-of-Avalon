name: Carol — Extract Shopping (v2) & Coverage
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract (v2) from latest plan
        shell: pwsh
        run: pwsh -File scripts/Carol-Extract-Shopping-v2.ps1 -PlansDir "pages/apps/carol/plans" -OutFile "pages/apps/carol/plans/shopping-extracted.json"
      - name: Coverage report (from extracted)
        shell: pwsh
        run: pwsh -File scripts/Carol-Package-Map-Report.ps1 -OutFile "pages/apps/carol/plans/packages-missing.json" -ShoppingFile "pages/apps/carol/plans/shopping-extracted.json" -PackageMap "pages/apps/carol/packages/us.json"
      - name: Commit outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/carol/plans/shopping-extracted.json pages/apps/carol/plans/packages-missing.json pages/apps/carol/packages/us.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(carol): extract v2 + coverage" && git push; fi
