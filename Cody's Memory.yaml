engineering_rules:
  - "Ask clarifying questions until ≥95% sure about requirements."
  - "Plan each step before coding; anticipate prior obstacles and cross‑OS issues."
  - "Use tools & scripts to verify; avoid guesses; no hallucinations."
  - "Respect preserve_paths during cleanup."
  - "Linux-safe quoting; avoid LINQ; ConvertTo‑Json depth ≤ 100."
  - "Pass switches as booleans (-Flag:$true)."
  - "Treat 'Nothing to commit' as success in CI."
  - "Front‑end frozen unless explicitly approved."

