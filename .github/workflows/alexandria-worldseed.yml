name: "Alexandria — Generate World Seed"

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Optional title for the world"
        required: false
        default: ""
      prompt:
        description: "Optional seed idea / hook (Alexandria may refine it if OPENAI_API_KEY exists)"
        required: false
        default: ""
      mode:
        description: "Generation mode"
        required: true
        default: "auto"
        type: choice
        options: ["auto","fallback-only"]

permissions:
  contents: write

jobs:
  worldseed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Build Seed
        shell: pwsh
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          $ErrorActionPreference='Stop'
          $force = ("${{ github.event.inputs.mode }}" -eq "fallback-only")
          & "scripts/overseers/alexandria-worldseed.ps1" `
            -RepoRoot "${{ github.workspace }}" `
            -Title "${{ github.event.inputs.title }}" `
            -Prompt "${{ github.event.inputs.prompt }}" `
            -ForceFallback:$force

      - name: Commit (if changed)
        shell: pwsh
        run: |
          git add -A "pages/apps/alexandria/worlds"
          $changes = git status --porcelain -- "pages/apps/alexandria/worlds"
          if ([string]::IsNullOrWhiteSpace($changes)) {
            Write-Host "Nothing to commit."
          } else {
            git config user.email "actions@github.com"
            git config user.name  "GitHub Actions"
            git fetch origin ${{ github.ref_name }} --prune
            git pull --rebase origin ${{ github.ref_name }} || echo "Nothing to rebase"
            git commit -m "Alexandria: world seed"
          }

      - name: Push
        uses: ad-m/github-push-action@77c5b412c50b723d2a4fbc6d71fb5723bcd439aa
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          force_with_lease: true
