name: Repo — Usage Report & Archive Orphans
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build inventory, refs, usage
        shell: pwsh
        run: |
          pwsh -File scripts/Repo-Inventory.ps1
          pwsh -File scripts/Repo-Refs-Graph.ps1
          pwsh -File scripts/Repo-Usage-Report.ps1 -ArchiveOrphans
      - name: Commit usage and archived scripts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add memory-history/repo-*.json scripts/_archive || true
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(repo): usage + archived orphans" && git push; fi
