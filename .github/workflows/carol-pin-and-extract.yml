name: Carol — Pin & Extract (14‑day)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pin canonical plan to expected alias
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = "pages/apps/carol/plans/twoperson-2wk-unique-20251015T022300Z.json"
          $dst = "pages/apps/carol/plans/twoperson-2wk-merged.json"
          if (!(Test-Path $src)) { throw "Canonical plan not found: $src" }
          Copy-Item $src $dst -Force
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add $dst
          git commit -m "Carol: pin merged alias for extractor" || echo "No changes to commit"
      - name: Extract shopping (v3)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/Carol-Extract-Shopping-v3.ps1
          git add pages/apps/carol/plans/shopping-*.json
          git commit -m "Carol: shopping extracted" || echo "No changes to commit"
      - name: Push
        run: git push
