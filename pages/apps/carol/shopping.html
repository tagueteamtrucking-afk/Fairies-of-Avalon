<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Carol — Shopping List</title>
<link rel="stylesheet" href="/pages/apps/carol/carol.css"/>
</head>
<body>
  <header class="header-hero">
    <div class="title">
      <div style="font-size:1.35rem;">Bistro — Shopping List</div>
      <small>Two people · 14 days · US measures</small>
    </div>
  </header>

  <main class="wrapper">
    <section class="card">
      <div id="status" class="tag">Loading…</div>
      <a class="btn" href="/pages/apps/carol/menu.html">Back to Menu</a>
    </section>

    <section id="list" class="grid"></section>

    <div class="kicker"></div>

    <p class="footer-note">If no shopping file is present, run the “Carol — Refresh from Pointer” workflow.</p>
  </main>

<script>
async function loadPointer(){
  const url = '/pages/apps/carol/index.json';
  const res = await fetch(url, {cache:'no-store'});
  if(!res.ok){ throw new Error('Pointer missing at '+url); }
  return await res.json();
}
function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else e.setAttribute(k, v);
  }
  for(const c of children){ if(c) e.appendChild(c); }
  return e;
}

function renderGroup(title, items){
  const rows = items.map(it => {
    const name = it.name ?? it.item ?? it.ingredient ?? JSON.stringify(it);
    const qty = it.qty ?? it.quantity ?? it.amount ?? it.count ?? '';
    const unit = it.unit ?? '';
    const note = it.note ?? it.notes ?? '';
    return el('div', {class:'card'}, [
      el('h3', {html: name}),
      el('div', {html: [qty, unit].filter(Boolean).join(' ')}),
      note ? el('div', {html: note, class:'tag'}) : null
    ]);
  });
  return el('section', {}, [el('div', {class:'card'}, [el('h2', {html: title})]), ...rows]);
}

async function boot(){
  try{
    const pointer = await loadPointer();
    const shopUrl = pointer.shopping_latest;
    if(!shopUrl){ throw new Error('shopping_latest missing in pointer.'); }

    const res = await fetch(shopUrl, {cache:'no-store'});
    if(!res.ok){ throw new Error('Shopping file not found at ' + shopUrl); }
    const data = await res.json();

    // Accept either a flat list or grouped object
    let groups = data.groups || data;
    const listRoot = document.getElementById('list');
    listRoot.innerHTML = '';
    if (Array.isArray(groups)){
      listRoot.appendChild(renderGroup('All Items', groups));
    } else if (typeof groups === 'object'){
      for(const [group, items] of Object.entries(groups)){
        const arr = Array.isArray(items) ? items : [items];
        listRoot.appendChild(renderGroup(group, arr));
      }
    } else {
      throw new Error('Unrecognized shopping format.');
    }

    document.getElementById('status').textContent = 'Loaded ' + (Array.isArray(groups) ? groups.length : Object.values(groups).reduce((a,b)=>a+(Array.isArray(b)?b.length:1),0)) + ' items';
  }catch(err){
    const s = document.getElementById('status');
    s.textContent = 'Error: ' + err.message;
    s.className = 'tag';
    console.error(err);
  }
}

boot();
</script>
</body>
</html>
