<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alexandria — Voice DM</title><style>body{background:#0b1220;color:#e6e9eb;font-family:system-ui,Segoe UI,Roboto;margin:0;padding:16px}</style></head>
<body>
<h1>Alexandria — Voice DM</h1>
<p><label>Worker URL <input id="w" size="60" placeholder="https://your-worker.workers.dev"></label> <button onclick="save()">Save</button></p>
<p><button onclick="start()">🎤 Start</button> <button onclick="stop()">⏹️ Stop</button></p>
<pre id="log"></pre>
<script>
function save(){ localStorage.setItem('OPENAI_WORKER_URL', document.getElementById('w').value); alert('Saved'); }
let media,rec,chunks=[];
async function start(){ try{
  media=await navigator.mediaDevices.getUserMedia({audio:true}); rec=new MediaRecorder(media);
  rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
  rec.onstop=async()=>{ const blob=new Blob(chunks,{type:'audio/webm'}); chunks=[];
    const url=localStorage.getItem('OPENAI_WORKER_URL'); if(!url){ alert('Set Worker URL first'); return; }
    const fd=new FormData(); fd.append('audio',blob,'input.webm');
    const txt=await (await fetch(url+'/alexandria-dm',{method:'POST',body:fd})).text();
    const ttsBuf=await (await fetch(url+'/speak',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:txt})})).arrayBuffer();
    new Audio(URL.createObjectURL(new Blob([ttsBuf]))).play();
    document.getElementById('log').textContent=txt;
  }; rec.start(); document.getElementById('log').textContent='Recording…';
}catch(e){ document.getElementById('log').textContent='Error: '+e; }}
function stop(){ if(rec){ rec.stop(); if(media){ media.getTracks().forEach(t=>t.stop()); } } }
</script>
<p><a href="/pages/apps/alexandria/index.html" style="color:#a5d6ff">← Back</a></p>
</body></html>
