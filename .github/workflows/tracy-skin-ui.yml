name: Tracy Skin UI (page scaffold)
on: { workflow_dispatch: {} }
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure page
        run: |
          mkdir -p pages/apps/tracy/skins
          cat > pages/apps/tracy/skins/generator.html << 'HTML'
          <!doctype html><meta charset="utf-8"><title>Tracy Skin Generator</title>
          <h2>Tracy — LLM Skin Generator</h2>
          <textarea id="prompt" rows="6" cols="60" placeholder="Describe a bright Avalon skin..."></textarea><br>
          <button id="go">Generate</button>
          <pre id="out"></pre>
          <script type="module">
          document.getElementById('go').onclick = async () => {
            const prompt = document.getElementById('prompt').value;
            const res = await fetch('/api/skin-llm', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({prompt})});
            const css = await res.text();
            document.getElementById('out').textContent = css.slice(0, 1000) + '\n...';
          };
          </script>
          HTML
      - uses: actions/upload-artifact@v4
        with:
          name: tracy-skin-ui
          path: pages/apps/tracy/skins/generator.html
      - name: PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'tracy: add LLM skin generator page'
          title: 'tracy: add LLM skin generator page'
          branch: ci/tracy-skin-ui-${{ github.run_id }}
          base: ${{ github.ref_name }}
