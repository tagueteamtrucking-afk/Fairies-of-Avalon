name: Avalon: Fact-Check
on: { workflow_dispatch: {} }
jobs:
  factcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fact-check generated content
        env: { OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}, OPENAI_MODEL: ${{ vars.OPENAI_MODEL }} }
        shell: pwsh
        run: pwsh -File scripts/FactCheck-LLM.ps1
      - name: Commit diagnostics
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/diagnostics/factcheck/
          if git diff --cached --quiet; then echo "No changes";
          else git commit -m "chore(factcheck): update diagnostics"; git push; fi
