<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Carol — Shopping List</title>
  <link rel="stylesheet" href="/pages/apps/carol/theme.css"/>
  <style>.qty{opacity:.85} .group{margin:10px 0}</style>
</head>
<body>
  <header class="header-hero">
    <div>
      <div class="kicker">Carol • The Phoenix Pagoda</div>
      <h1>Shopping List</h1>
      <div class="subtitle">Quantized for two people • check items as you pack</div>
    </div>
  </header>

  <main class="page-wrap">
    <div class="toolbar">
      <button class="print-btn" onclick="window.print()">🖨️ Print</button>
      <a class="pill" href="/pages/apps/carol/menu.html">🍽️ Back to Menu</a>
    </div>

    <section id="list"></section>
    <template id="groupTmpl">
      <div class="card group">
        <div class="hd"><h3>Group</h3></div>
        <div class="bd"><div class="items"></div></div>
      </div>
    </template>
  </main>

  <footer class="footer">
    <div>Rendered from <code>pages/apps/carol/index.json</code> → <code>shopping_latest</code>. If missing, run the "Carol — Refresh Menu & Shopping" workflow.</div>
  </footer>

<script>
(async function(){
  const list = document.getElementById('list');
  const tmpl = document.getElementById('groupTmpl');

  try{
    const ptr = await (await fetch('/pages/apps/carol/index.json', {cache:'no-store'})).json();
    const url = ptr.shopping_latest || '/pages/apps/carol/plans/shopping-quantized.json';

    const res = await fetch(url, {cache:'no-store'});
    if(!res.ok){ throw new Error('Shopping file not found: ' + url); }
    const data = await res.json();

    // normalize to { group: [ {name, qty, unit}, ...] }
    function normalize(d){
      const out = {};
      function push(g, item){
        if(!out[g]) out[g] = [];
        out[g].push(item);
      }
      if(Array.isArray(d)){
        for(const it of d){
          const group = it.group || it.category || 'General';
          push(group, {name: it.name || it.item || it.title || 'Item', qty: it.qty || it.quantity || 1, unit: it.unit || ''});
        }
      } else if (typeof d === 'object'){
        for(const [g, arr] of Object.entries(d)){
          if(Array.isArray(arr)){
            for(const it of arr){
              push(g, {name: it.name || it.item || it.title || 'Item', qty: it.qty || it.quantity || 1, unit: it.unit || ''});
            }
          }
        }
      }
      return out;
    }

    const groups = normalize(data);
    const gNames = Object.keys(groups);
    if(gNames.length === 0){
      list.innerHTML = '<div class="card"><div class="bd"><p>No items present. Re-run the extraction workflow.</p></div></div>';
      return;
    }

    for(const g of gNames){
      const node = tmpl.content.cloneNode(true);
      node.querySelector('h3').textContent = g;
      const wrap = node.querySelector('.items');

      for(const it of groups[g]){
        const id = 'chk-' + Math.random().toString(36).slice(2);
        const row = document.createElement('label');
        row.style.display = 'flex'; row.style.alignItems='center'; row.style.gap='8px'; row.style.padding='6px 0';
        row.innerHTML = `<input id="${id}" type="checkbox"/> <span>${it.name}</span> <span class="qty">${it.qty||''} ${it.unit||''}</span>`;
        wrap.appendChild(row);
      }
      list.appendChild(node);
    }

  }catch(err){
    list.innerHTML = '<div class="card"><div class="bd"><div class="badge">Error</div><p>'+ (err && err.message ? err.message : String(err)) +'</p></div></div>';
  }
})();
</script>
</body>
</html>
