name: "Queue — Scaffold (LIVE)"

on:
  workflow_dispatch:
    inputs:
      avatars:
        description: "Comma-separated list (optional). Leave empty to use Memory avatars_present."
        required: false
      dry_run:
        description: "Set to false for LIVE call"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  enqueue-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PowerShell + YAML
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module powershell-yaml -Scope CurrentUser -Force -AllowClobber
          Import-Module powershell-yaml

      - name: Enqueue LIVE scaffold
        shell: pwsh
        run: |
          $repoRoot = "${{ github.workspace }}"
          $requests = Join-Path $repoRoot "requests"
          New-Item -ItemType Directory -Force -Path $requests | Out-Null

          $avatars = @()
          $inp = "${{ github.event.inputs.avatars }}".Trim()
          if ($inp) { $avatars = $inp.Split(",") | ForEach-Object { $_.Trim() } }

          if (-not $avatars -or $avatars.Count -eq 0) {
            $mem = (Get-Content -Raw -Path (Join-Path $repoRoot "Cody's Memory.yaml")) | ConvertFrom-Yaml
            $avatars = @($mem.avatars_present)
          }

          $req = @{
            id     = "R3"
            action = "scaffold_fairies_bundle"
            params = @{ avatars = $avatars }
            dry_run = [System.Boolean]::Parse("${{ github.event.inputs.dry_run || 'false' }}")
            actor  = "rey_czar"
            routing = "overseers"
          }

          $ts = Get-Date -AsUTC
          $yaml = ConvertTo-Yaml $req
          $fn = "{0}-scaffold-live.request.yml" -f $ts.ToString("yyyyMMddTHHmmssZ")
          Set-Content -Path (Join-Path $requests $fn) -Value $yaml -Encoding utf8NoBOM

          git add requests
          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"
          git fetch origin ${{ github.ref_name }} --depth=0
          git pull --rebase origin ${{ github.ref_name }} || echo "Nothing to rebase"
          git commit -m "Queue: LIVE scaffold request" || echo "Nothing to commit"

      - name: Push
        uses: ad-m/github-push-action@77c5b412c50b723d2a4fbc6d71fb5723bcd439aa
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          force_with_lease: true
