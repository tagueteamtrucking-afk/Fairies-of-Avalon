name: Repo Sweeper (propose deletions)

# This workflow examines the repository's file index and the cleanup rules
# defined in `memory/cleanup-rules.json` and generates a set of proposed
# deletions. It creates `memory/cleanup-proposals.json` listing files that
# match deletion globs but are not protected by preserve globs. A pull request
# is then opened with the proposed deletions for manual review. The workflow
# is triggered either manually via the Actions tab or on a daily schedule.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 4 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute cleanup proposal
        id: plan
        run: |
          node - <<'JS'
          const fs = require('fs');
          // Load micromatch if available; fallback to minimal glob matcher
          let micromatch;
          try {
            micromatch = require('micromatch');
          } catch (err) {
            micromatch = {
              isMatch: (p, patterns) => {
                if (!patterns || patterns.length === 0) return false;
                return patterns.some(g => {
                  // Escape regex special characters except wildcards
                  let r = g.replace(/[.+^${}()|[\]\\]/g, '\\$&');
                  r = r.replace(/\*\*/g, '.*').replace(/\*/g, '[^/]*').replace(/\?/g, '.');
                  return new RegExp('^' + r + '$').test(p);
                });
              }
            };
          }
          const idx = JSON.parse(fs.readFileSync('memory/file-index.json','utf8'));
          const rules = JSON.parse(fs.readFileSync('memory/cleanup-rules.json','utf8'));
          const deletes = [];
          idx.files.forEach(f => {
            // Skip preserved files
            if (micromatch.isMatch(f.path, rules.preserveGlobs || [])) return;
            (rules.deleteIf || []).forEach(r => {
              if (r.glob && micromatch.isMatch(f.path, [r.glob])) {
                deletes.push({ path: f.path, reason: 'pattern ' + r.glob });
              }
            });
          });
          fs.mkdirSync('memory', {recursive:true});
          fs.writeFileSync('memory/cleanup-proposals.json', JSON.stringify({ generated: new Date().toISOString(), deletes }, null, 2));
          console.log(`Will delete ${deletes.length} files`);
          JS
      - name: Create PR with deletions
        if: ${{ always() }}
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/repo-sweep
          title: 'chore: repo sweep (auto-proposed deletions)'
          commit-message: 'chore: remove redundant files'
          body: |
            This PR proposes deletions based on `memory/cleanup-rules.json`. Review and merge if acceptable.
          add-paths: |
            memory/cleanup-proposals.json
          delete-files: |
            $(node -p "require('fs').existsSync('memory/cleanup-proposals.json') ? JSON.parse(require('fs').readFileSync('memory/cleanup-proposals.json','utf8')).deletes.map(d => d.path).join('\\n') : ''")
          token: ${{ secrets.GITHUB_TOKEN }}