name: Carol - Lock Pointer to Restored Plan
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lock pointer to restored plan
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:GITHUB_WORKSPACE
          $pointerPath = Join-Path $root "pages/apps/carol/index.json"
          $target = "/pages/apps/carol/plans/mealplan-balanced-20251019T021457Z.json".Replace('\','/')
          if(-not (Test-Path -LiteralPath $pointerPath)){ New-Item -ItemType Directory -Force -Path (Split-Path -Parent $pointerPath) | Out-Null; }
          $ptr = @{
            updated=(Get-Date).ToUniversalTime().ToString("s")+'Z';
            plan=$target;
            shopping_quantized="/pages/apps/carol/plans/shopping-quantized.json";
            shopping_extracted="/pages/apps/carol/plans/shopping-extracted.json"
          }
          [IO.File]::WriteAllText($pointerPath, ($ptr | ConvertTo-Json -Depth 5), [Text.Encoding]::UTF8)
          Write-Host "Pointer set to $target"
      - name: Commit pointer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/carol/index.json pages/apps/carol/plans/mealplan-balanced-20251019T021457Z.json || true
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(carol): lock pointer to restored plan" && git push; fi
