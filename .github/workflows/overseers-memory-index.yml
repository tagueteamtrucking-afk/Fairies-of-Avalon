name: Overseers - Memory Index
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build memory index
        run: node scripts/overseers/memory-index.mjs
      - name: Commit memory index
        run: |
          git config user.name "Overseers Bot"
          git config user.email "actions@users.noreply.github.com"
          git add pages/apps/overseers/memory/index.json || true
          git commit -m "Overseers: refresh memory index" || echo "Nothing to commit"
          git push || echo "Nothing to push"
