<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carol — Shopping</title><style>body{background:#0b1220;color:#e5e7eb;font-family:system-ui,Segoe UI,Roboto;margin:0}main{max-width:980px;margin:0 auto;padding:14px}.item{background:#0f172a;border:1px solid #172033;border-radius:12px;padding:10px;margin:8px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}</style></head>
<body><main><h1>🛒 Shopping List</h1><div id="out"></div></main>
<script>
async function load(){ 
  const ptr = await fetch('/pages/apps/carol/index.json').then(r=>r.json()).catch(()=>null);
  if(!ptr){ document.getElementById('out').textContent='No pointer found. Run Carol — Refresh (2‑person).'; return; }
  const url = ptr.shopping_quantized || ptr.shopping_extracted;
  if(!url){ document.getElementById('out').textContent='No shopping JSON found. Run Carol — Refresh (2‑person).'; return; }
  const doc = await fetch(url).then(r=>r.json()).catch(()=>null);
  if(!doc){ document.getElementById('out').textContent='Could not read '+url; return; }
  const items = doc.items || doc.shopping || [];
  const out = document.getElementById('out');
  if(!items.length){ out.textContent='No items in shopping JSON.'; return; }
  items.forEach(it=>{
    const div=document.createElement('div'); div.className='item';
    const left = document.createElement('div'); left.textContent = it.name || it.item || 'unknown';
    const right = document.createElement('div');
    if(it.packages){ right.textContent = `${it.packages} × ${it.package} (cap ${it.capacity_per_package ?? ''} ${it.unit ?? ''})`; }
    else if(it.qty){ right.textContent = `${it.qty} ${it.unit||''}`; }
    div.appendChild(left); div.appendChild(right); out.appendChild(div);
  });
}
load();
</script></body></html>
