# Overseers - Memory Index (All File Memory)
name: Overseers - Memory Index

on:
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * 1'   # weekly (Mon 05:37 UTC)

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build All File Memory
        run: node scripts/overseers/memory-index.mjs

      - name: Commit memory artifacts
        shell: bash
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A || true
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore(memory): refresh All File Memory + candidates"
          git push
