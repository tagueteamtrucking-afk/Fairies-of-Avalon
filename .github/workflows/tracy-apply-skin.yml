name: Tracy — Apply Skin
on:
  workflow_dispatch:
    inputs:
      skin:
        description: "Skin key (castle-town, night)"
        required: false
        default: "castle-town"
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply skin
        shell: pwsh
        run: pwsh -File scripts/Tracy-Apply-Skin.ps1 -Skin '${{ github.event.inputs.skin }}'
      - name: Commit active skin
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/apps/tracy/skin/active.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore(tracy): set active skin" && git push; fi
