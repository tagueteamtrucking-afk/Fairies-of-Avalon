name: Charlotte — Curated Crawl
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "Run curated crawl"
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/charlotte/curated-crawl.mjs

      - name: "Commit results"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/apps/charlotte/finds.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Charlotte: curated crawl update"
            git push
          fi
